{i:"T2",c:"tender",r:"C",t:["We received an addendum (a change to the bidding documents)","Addendum එකක් (bidding documents වලට වෙනස්කමක්) ලැබුණා"],
m:["Before the deadline, the Employer may change the bidding documents by addendum. Each addendum becomes part of the bidding documents.","Deadline එකට කලින්, addendum මගින් bidding documents වෙනස් කරන්න Employer ට පුළුවන්. හැම addendum එකක්ම bidding documents වල කොටසක් වෙනවා."],
s:[[null,"do","Promptly acknowledge receipt of each addendum to the Employer by fax.","හැම addendum එකක්ම ලැබුණු බව fax මගින් ඉක්මනින් Employer ට දන්වන්න.",["ITB 11"]],
[null,"do","Price and prepare your bid to follow the addendum; it is part of the bidding documents.","Addendum එකට අනුව bid එක price කරලා සකස් කරන්න; එය bidding documents වල කොටසක්.",["ITB 11","ITB 9"]],
[null,"know","To give reasonable time to take an addendum into account, the Employer shall extend the deadline as necessary.","Addendum එකක් සලකා බලන්න සාධාරණ කාලයක් දෙන්න, අවශ්‍ය පරිදි Employer deadline එක දිගු කළ යුතුයි.",["ITB 11","ITB 22"]]],
k:["Register of addenda received and acknowledged","ලැබුණු සහ acknowledge කළ addenda register එක"]},

{i:"T3",c:"tender",r:"C",t:["The Employer asks us to keep our bid valid for longer","Bid එක තව කාලයක් valid ලෙස තියාගන්න Employer ඉල්ලනවා"],
m:["In exceptional circumstances, before the validity ends, the Employer may ask bidders to extend bid validity. You may refuse without losing your bid security.","සුවිශේෂී අවස්ථාවලදී, validity එක ඉවර වෙන්න කලින්, bid validity එක දිගු කරන්න Employer ට bidders ලාගෙන් ඉල්ලන්න පුළුවන්. Bid security එක අහිමි නොවී ඔබට ප්‍රතික්ෂේප කරන්න පුළුවන්."],
s:[[null,"know","The request and your reply must be in writing. You may refuse without forfeiting your bid security.","ඉල්ලීම සහ ඔබේ පිළිතුර ලිඛිතව විය යුතුයි. Bid security එක අහිමි නොවී ප්‍රතික්ෂේප කරන්න පුළුවන්.",["ITB 16","BD 16"]],
[null,"warn","If you agree, you may not change your bid, and you must extend the bid security to cover the extension (the Bidding Data requires it to stay valid at least 28 days beyond bid validity).","එකඟ වුණොත් bid එක වෙනස් කරන්න බැහැ, extension කාලයට bid security එකත් දිගු කළ යුතුයි (bid validity එකෙන් අවම දින 28ක් එහාට valid විය යුතු බව Bidding Data එකේ කියනවා).",["ITB 16","ITB 17","BD 17"]]],
k:["The request, your written reply and the extended security","ඉල්ලීම, ඔබේ ලිඛිත පිළිතුර සහ දිගු කළ security එක"]},

{i:"T4",c:"tender",r:"C",t:["We want to change or withdraw our bid after sending it","Bid එක යැව්වාට පස්සේ ඒක වෙනස් කරන්න හෝ ආපසු ගන්න ඕනේ"],
m:["You may modify or withdraw your bid only by a written notice that reaches the Employer before the deadline. After the deadline the bid cannot be modified, and withdrawing it during the validity period can cost you the bid security.","Deadline එකට කලින් Employer ට ලැබෙන ලිඛිත notice එකකින් පමණයි bid එක වෙනස් කරන්න හෝ ආපසු ගන්න පුළුවන්. Deadline එකෙන් පසු bid එක වෙනස් කරන්න බැහැ, validity කාලය තුළ ආපසු ගත්තොත් bid security එක අහිමි විය හැකියි."],
d:[["a","Bid submission deadline","Bid දිය යුතු අවසාන දිනය"]],
s:[["a:L","do","The written notice must be received by the Employer by the deadline. Prepare, seal and mark it like the bid, with the inner and outer envelopes also marked MODIFICATION or WITHDRAWAL.","ලිඛිත notice එක deadline එක වෙද්දී Employer ට ලැබිය යුතුයි. එය bid එක වගේම සකස් කරලා, seal කරලා, mark කරන්න; ඇතුළත සහ පිටත envelopes දෙකම MODIFICATION හෝ WITHDRAWAL ලෙසත් mark කරන්න.",["ITB 24","ITB 20","ITB 21"]],
[null,"warn","After the deadline no modification is allowed, except confirming the Employer's arithmetic corrections.","Deadline එකෙන් පසු, Employer කරන ගණිත නිවැරදි කිරීම් confirm කිරීම හැර, කිසිම වෙනසකට අවසර නැහැ.",["ITB 24","ITB 29"]],
[null,"warn","Withdrawing between the deadline and the end of bid validity may lead to forfeiture of the bid security.","Deadline එක සහ bid validity අවසානය අතර ආපසු ගත්තොත් bid security එක අහිමි විය හැකියි.",["ITB 24","ITB 17"]],
[null,"know","Discounts can be offered only in the original bid or through a proper modification. A bid received after the deadline is returned unopened.","Discounts දෙන්න පුළුවන් මුල් bid එකේ හෝ නිසි modification එකක් හරහා පමණයි. Deadline එකෙන් පසු ලැබෙන bid එකක් නොවිවෘතව ආපසු යවනවා.",["ITB 24","ITB 23"]]]},

{i:"T5",c:"tender",r:"C",t:["The Employer corrected arithmetic errors in our bid","Employer අපේ bid එකේ ගණිත දෝෂ නිවැරදි කළා"],
m:["Substantially responsive bids are checked for arithmetic errors and corrected by fixed rules. If you do not accept the corrected amount, your bid is rejected.","Substantially responsive bids ගණිත දෝෂ සඳහා check කරලා නියමිත නීති අනුව නිවැරදි කරනවා. නිවැරදි කළ මුදල ඔබ පිළිනොගත්තොත් bid එක reject වෙනවා."],
s:[[null,"know","Words govern figures. The unit rate governs the line total, unless the Employer considers the decimal point in the unit rate obviously and grossly misplaced; then the line total governs and the rate is corrected.","වචන වලින් ලියූ අගය ඉලක්කම් වලට වඩා ප්‍රමුඛයි. Line total එකට වඩා unit rate එක ප්‍රමුඛයි, unit rate එකේ දශම තිත පැහැදිලිවම සහ දැඩි ලෙස වැරදි තැනක යැයි Employer සලකන්නේ නම් හැර; එවිට line total එක ප්‍රමුඛ වෙලා rate එක නිවැරදි කරනවා.",["ITB 29"]],
[null,"know","Items with no rate or price are not paid for when executed; they are treated as covered by other rates.","Rate හෝ price එකක් නැති items execute කළාම ගෙවන්නේ නැහැ; ඒවා අනෙක් rates වලින් ආවරණය වී ඇති ලෙස සැලකෙනවා.",["ITB 14"]],
[null,"warn","The Form of Bid amount is adjusted with your concurrence and then binds you. If you do not accept the corrected amount, the bid is rejected and the bid security may be forfeited.","Form of Bid එකේ මුදල ඔබේ එකඟතාවෙන් adjust කරනවා, ඉන් පසු එය ඔබට බැඳෙනවා. නිවැරදි කළ මුදල ඔබ පිළිනොගත්තොත් bid එක reject වෙලා bid security එක අහිමි විය හැකියි.",["ITB 29","ITB 17"]]]},

{i:"T6",c:"tender",r:"B",t:["Our rates look too low, or the bid looks unbalanced or front-loaded","අපේ rates ඕනෑවට වඩා අඩුයි, නැත්නම් bid එක unbalanced හෝ front-loaded බව පේනවා"],
m:["If the lowest evaluated bid is seriously unbalanced or front-loaded compared with the Engineer's estimate, or rates are unreasonably low without rational justification, the Employer can ask for price analyses and a larger Performance Security.","අඩුම evaluate කළ bid එක Engineer ගේ ඇස්තමේන්තුවට සාපේක්ෂව දැඩි ලෙස unbalanced හෝ front-loaded නම්, නැත්නම් සාධාරණ හේතු නැතිව rates අසාධාරණ ලෙස අඩු නම්, price analyses සහ වැඩි Performance Security එකක් Employer ට ඉල්ලන්න පුළුවන්."],
s:[[null,"know","The Employer may ask for detailed price analyses of any BOQ items to show the prices are consistent with your methods and schedule. Clarification requests may include breakdowns of unit rates.","ඔබේ ක්‍රම සහ කාලසටහනට මිල ගැළපෙන බව පෙන්වන්න, ඕනෑම BOQ items වල සවිස්තර price analyses Employer ට ඉල්ලන්න පුළුවන්. Clarification ඉල්ලීම් වලට unit rates breakdowns ඇතුළත් විය හැකියි.",["ITB 30","ITB 27"]],
[null,"warn","The Employer may then require a higher Performance Security, at your expense, to protect against loss if you default.","ඉන් පසු, ඔබ පැහැර හැරියොත් පාඩුවෙන් ආරක්ෂා වෙන්න, ඔබේ වියදමින් වැඩි Performance Security එකක් Employer ට ඉල්ලන්න පුළුවන්.",["ITB 30","ITB 35"]],
[null,"warn","In clarifications, no change in price or substance may be sought, offered or allowed (except confirming arithmetic corrections).","Clarifications වලදී මිලේ හෝ සාරයේ කිසිම වෙනසක් ඉල්ලන්න, ඉදිරිපත් කරන්න හෝ අවසර දෙන්න බැහැ (ගණිත නිවැරදි කිරීම් confirm කිරීම හැර).",["ITB 27"]]]},

{i:"T7",c:"tender",r:"C",t:["We did not win the tender and want to appeal","Tender එක අපට ලැබුණේ නැහැ, appeal කරන්න ඕනේ"],
m:["After evaluation, the Employer tells all bidders in writing who was selected and that it intends to award the contract. An unsuccessful bidder may make a representation within one week of that notice. This is the procedure in the 2007 Bidding Data; check the Bidding Data of your tender and the current procurement guidelines.","Evaluation එකෙන් පසු, තෝරාගත් bidder සහ contract එක award කිරීමේ අදහස Employer සියලු bidders ලාට ලිඛිතව දන්වනවා. අසාර්ථක bidder කෙනෙකුට ඒ notice එකෙන් සතියක් ඇතුළත representation එකක් කරන්න පුළුවන්. මෙය 2007 Bidding Data එකේ ක්‍රියාවලිය; ඔබේ tender එකේ Bidding Data එක සහ දැනට ඇති procurement guidelines බලන්න."],
d:[["a","Date we received the notice of intention to award","Award කිරීමේ අදහස පිළිබඳ notice එක ලැබුණු දිනය"]],
s:[["a+7:L","do","Make your representation within one week. CAPC-level procurement: to the Secretary, Appeal Board, Presidential Secretariat, Colombo, with a cash deposit of Rs. 50,000. MPC-level procurement: to the Secretary to the Line Ministry, with the cash deposit stated in the Bidding Data.","සතියක් ඇතුළත representation එක කරන්න. CAPC මට්ටමේ procurement: Secretary, Appeal Board, Presidential Secretariat, Colombo වෙත, Rs. 50,000 cash deposit එකක් සමඟ. MPC මට්ටමේ procurement: Line Ministry එකේ Secretary වෙත, Bidding Data එකේ සඳහන් cash deposit එක සමඟ.",["BD 32"]],
[null,"warn","The representation must be self-contained. You may be asked for more evidence. The deposit is forfeited unless the award decision is changed in your favour.","Representation එක තනියම සම්පූර්ණ විය යුතුයි. තවත් සාක්ෂි ඉල්ලන්න පුළුවන්. Award තීරණය ඔබට පක්ෂව වෙනස් නොවුණොත් deposit එක අහිමි වෙනවා.",["BD 32"]],
[null,"know","The Employer may reject any or all bids, or annul the process, before award without liability and without giving reasons.","Award කිරීමට කලින් ඕනෑම bid එකක් හෝ සියල්ල reject කරන්න, හෝ ක්‍රියාවලිය අවලංගු කරන්න Employer ට වගකීමකින් තොරව, හේතු නොදී පුළුවන්.",["ITB 33"]]],
k:["The notice, your representation, the deposit receipt","Notice එක, ඔබේ representation එක, deposit receipt එක"]},

{i:"T8",c:"tender",r:"C",t:["Our bid security has not been returned","අපේ bid security එක ආපසු ලැබුණේ නැහැ"],
m:["Unsuccessful bidders' securities must be returned as promptly as possible, and not later than 28 days after the bid validity (as extended) ends.","අසාර්ථක bidders ලාගේ securities හැකි ඉක්මනින්, bid validity (දිගු කළ එක) අවසන් වී දින 28කට පසු නොවී ආපසු දිය යුතුයි."],
d:[["a","Date the bid validity period (as extended) ended","Bid validity කාලය (දිගු කළ එක) අවසන් වූ දිනය"]],
s:[["a+28:L","know","Last day for the Employer to return an unsuccessful bidder's security.","අසාර්ථක bidder කෙනෙකුගේ security එක Employer ආපසු දිය යුතු අවසාන දිනය.",["ITB 17"]],
[null,"know","After the winning bidder furnishes the Performance Security, the Employer notifies the other bidders and discharges their securities. The winner's security is returned after it signs the Agreement and furnishes the Performance Security.","ජයග්‍රාහී bidder Performance Security එක දුන්නාම Employer අනෙක් bidders ලාට දන්වලා ඔවුන්ගේ securities නිදහස් කරනවා. ජයග්‍රාහියාගේ security එක Agreement එක sign කරලා Performance Security එක දුන්නාම ආපසු දෙනවා.",["ITB 34","ITB 17"]]]},

{i:"T9",c:"tender",r:"C",t:["We want to bid as a Joint Venture (JV)","Joint Venture (JV) එකක් විදිහට bid කරන්න ඕනේ"],
m:["A Joint Venture is two or more firms bidding together. Their qualifications are added together, but each partner must meet minimum shares, and all partners are jointly and severally liable.","Joint Venture එකක් කියන්නේ firms දෙකක් හෝ වැඩි ගණනක් එකට bid කිරීම. ඔවුන්ගේ qualifications එකතු කරනවා, හැබැයි හැම partner කෙනෙක්ම අවම කොටස් සපුරන්න ඕනේ, සියලු partners එකට සහ තනි තනිව වගකියනවා."],
s:[[null,"do","Include the ITB 4.1 information for every partner. The bid security, the bid and (if successful) the Agreement must be signed so as to bind all partners. The bid security must commit all partners.","හැම partner කෙනෙකුටම ITB 4.1 තොරතුරු ඇතුළත් කරන්න. Bid security එක, bid එක සහ (සාර්ථක නම්) Agreement එක සියලු partners බැඳෙන විදිහට sign කළ යුතුයි. Bid security එක සියලු partners බැඳෙන විදිහට විය යුතුයි.",["ITB 5","ITB 17"]],
[null,"do","Nominate a partner in charge by a power of attorney signed by all partners. That partner incurs liabilities and receives instructions for all, and all contract execution, including payment, is done only with that partner.","සියලු partners sign කළ power of attorney එකකින් partner in charge කෙනෙක් නම් කරන්න. ඒ partner සියල්ලන් වෙනුවෙන් වගකීම් භාර ගන්නවා, instructions ලබාගන්නවා; ගෙවීම් ඇතුළු සියලු contract කටයුතු ඒ partner සමඟ පමණයි.",["ITB 5"]],
[null,"warn","Each partner must meet at least 25% of criteria 4.2(a), (b) and (e), and the partner in charge at least 40%; otherwise the bid is rejected. Subcontractors' experience and resources are not counted.","හැම partner කෙනෙක්ම 4.2(a), (b), (e) නිර්ණායක වලින් අවම 25%ක්, partner in charge අවම 40%ක් සපුරන්න ඕනේ; නැත්නම් bid එක reject වෙනවා. Subcontractors ගේ පළපුරුද්ද සහ සම්පත් ගණන් ගන්නේ නැහැ.",["ITB 5","ITB 4"]],
[null,"know","All partners are jointly and severally liable; state this in the authorization, the bid and the Agreement. Attach the JV agreement, or an MOU to form one with the proposed agreement. A firm may take part in only one bid.","සියලු partners එකට සහ තනි තනිව වගකියනවා; මෙය authorization එකේ, bid එකේ සහ Agreement එකේ සඳහන් කරන්න. JV agreement එක, හෝ යෝජිත agreement එක සමඟ JV එකක් පිහිටුවීමේ MOU එකක් අමුණන්න. Firm එකකට සහභාගී වෙන්න පුළුවන් එක bid එකකට පමණයි.",["ITB 5","1.14","ITB 6"]]]},

{i:"T10",c:"tender",r:"C",t:["What do we need to qualify for this tender?","මේ tender එකට qualify වෙන්න මොනවද ඕනේ?"],
m:["The contract is awarded only to a bidder that is eligible and qualified, with the lowest evaluated substantially responsive bid. Check the minimum qualifying criteria in ITB 4.2 and the Bidding Data before you spend money on a bid.","Contract එක award කරන්නේ eligible සහ qualified, අඩුම evaluate කළ substantially responsive bid එක දුන් bidder ට පමණයි. Bid එකකට මුදල් වියදම් කරන්න කලින් ITB 4.2 සහ Bidding Data එකේ අවම qualifying criteria බලන්න."],
s:[[null,"warn","Minimum criteria: (a) valid ICTAD (now CIDA) registration in the grade and specialty in the Bidding Data; (b) average annual volume of construction work in the last 5 years not below the Bidding Data amount; (c) as prime contractor, at least one similar work in the last 10 years (at least 70% complete); (d) proposals to obtain the essential equipment; (e) a Contract Manager with the qualifications in the Bidding Data; (f) liquid assets or credit, net of other commitments, not below the Bidding Data amount; (g) not blacklisted at bidding or at award.","අවම නිර්ණායක: (a) Bidding Data එකේ grade සහ specialty එකේ valid ICTAD (දැන් CIDA) registration; (b) පසුගිය වසර 5 සාමාන්‍ය වාර්ෂික ඉදිකිරීම් වැඩ පරිමාව Bidding Data මුදලට නොඅඩු; (c) prime contractor ලෙස, පසුගිය වසර 10 තුළ අවම එක සමාන වැඩක් (අවම 70% complete); (d) අත්‍යවශ්‍ය equipment ලබාගැනීමේ යෝජනා; (e) Bidding Data සුදුසුකම් ඇති Contract Manager කෙනෙක්; (f) අනෙක් බැඳීම් අඩු කළ පසු, Bidding Data මුදලට නොඅඩු liquid assets හෝ credit; (g) bidding සහ award වෙලාවේ blacklist වී නොසිටීම.",["ITB 4","BD 4"]],
[null,"do","All bidders include documents on their constitution and legal status and a power of attorney for the signatory. Without pre-qualification, also include: financial reports for the past 3 years, evidence of working capital, value of work for each of the last 5 years, similar experience and current commitments, major equipment, key personnel, subcontracting proposals over 10% of the Contract Amount, and a statement that you did not help prepare the bidding documents.","සියලු bidders ලා තමන්ගේ ව්‍යවස්ථාව සහ නීතිමය තත්ත්වය පිළිබඳ documents සහ signatory ට power of attorney එකක් ඇතුළත් කරනවා. Pre-qualification නැත්නම් මේවාත්: පසුගිය වසර 3 financial reports, working capital සාක්ෂි, පසුගිය වසර 5 හැම වසරකම වැඩ වටිනාකම, සමාන පළපුරුද්ද සහ දැනට ඇති බැඳීම්, ප්‍රධාන equipment, ප්‍රධාන personnel, Contract Amount එකෙන් 10%ට වැඩි subcontracting යෝජනා, සහ bidding documents සකස් කිරීමට ඔබ සම්බන්ධ නොවූ බවට ප්‍රකාශයක්.",["ITB 4"]],
[null,"warn","Even if you meet the criteria, you may be disqualified for misleading or false information, or a record of poor performance (for example abandoning works, or delays that led to maximum liquidated damages).","නිර්ණායක සපුරා තිබුණත්, නොමඟ යවන හෝ අසත්‍ය තොරතුරු, හෝ දුර්වල කාර්ය සාධන වාර්තාවක් (උදා: works අත්හැරීම, උපරිම liquidated damages වලට හේතු වූ ප්‍රමාද) නිසා disqualify විය හැකියි.",["ITB 32"]],
[null,"know","You bear all costs of preparing your bid. You are advised to visit the Site at your own cost and risk.","Bid එක සකස් කිරීමේ සියලු වියදම් ඔබ දරනවා. ඔබේම වියදමට සහ අවදානමට Site එකට ගිහින් බලන්න කියලා උපදෙස් දෙනවා.",["ITB 7","ITB 8"]],
[null,"know","The Employer, the Works, the Time for Completion and the source of funds are stated in the Bidding Data.","Employer, Works, Time for Completion සහ අරමුදල් ලැබෙන මූලාශ්‍රය Bidding Data එකේ සඳහන් වෙනවා.",["ITB 1","ITB 2","BD 1","BD 2"]]]},

{i:"T11",c:"tender",r:"C",t:["Preparing and submitting the bid (checklist)","Bid එක සකස් කිරීම සහ ඉදිරිපත් කිරීම (checklist)"],
m:["A bid can be rejected for simple mistakes in format, signing, sealing or timing. This checklist follows ITB 12 to 23.","Format, sign කිරීම, seal කිරීම හෝ කාලය වැනි සරල වැරදි නිසා bid එකක් reject විය හැකියි. මේ checklist එක ITB 12 සිට 23 දක්වා අනුගමනය කරනවා."],
d:[["a","Bid submission deadline","Bid දිය යුතු අවසාන දිනය"]],
s:[[null,"do","ORIGINAL envelope: signed Form of Bid, bid security, power of attorney, Bidding Data, Contract Data, Specifications, priced BOQ, completed Schedules, and anything else the Bidding Data asks for. COPY envelope: Form of Bid, priced BOQ, Schedules and other required information.","ORIGINAL envelope: sign කළ Form of Bid, bid security, power of attorney, Bidding Data, Contract Data, Specifications, price කළ BOQ, පුරවපු Schedules, සහ Bidding Data ඉල්ලන වෙනත් දේ. COPY envelope: Form of Bid, price කළ BOQ, Schedules සහ අවශ්‍ය අනෙක් තොරතුරු.",["ITB 13","BD 13"]],
[null,"do","Fill in rates and prices for all BOQ items (unpriced items are treated as covered by other rates). Include taxes and duties as at 28 days before the deadline, with VAT shown separately. Quote in Sri Lanka Rupees unless the Bidding Data allows otherwise. Write the bid in English. The Bidding Data states whether the contract is subject to price adjustment.","සියලු BOQ items වලට rates සහ prices පුරවන්න (price නොකළ items අනෙක් rates වලින් ආවරණය වූ ලෙස සැලකෙනවා). Deadline එකට දින 28කට කලින් taxes සහ duties ඇතුළත් කරන්න, VAT වෙනම පෙන්වන්න. Bidding Data වෙනත් දෙයකට අවසර නොදෙන්නේ නම් ශ්‍රී ලංකා රුපියල් වලින් quote කරන්න. Bid එක English වලින් ලියන්න. Contract එක price adjustment වලට යටත්ද කියලා Bidding Data එකේ කියනවා.",["ITB 14","ITB 15","ITB 12","BD 15","BD 14"]],
[null,"if","If you offer a technical alternative, first price the Employer's design and give full details. Only the lowest evaluated bidder's conforming alternatives are considered.","Technical alternative එකක් දෙනවා නම්, මුලින් Employer ගේ design එක price කරලා සම්පූර්ණ විස්තර දෙන්න. සලකා බලන්නේ අඩුම evaluate කළ bidder ගේ අනුකූල alternatives පමණයි.",["ITB 18"]],
[null,"do","Prepare one ORIGINAL and one COPY (the original prevails). The Form of Bid is typed or in indelible ink and signed by an authorized person, who initials every page with entries or amendments and every correction.","ORIGINAL එකක් සහ COPY එකක් සකස් කරන්න (original එක ප්‍රමුඛයි). Form of Bid එක type කළ හෝ මැකිය නොහැකි තීන්තෙන් ලියූ එකක් විය යුතුයි, බලයලත් පුද්ගලයෙක් sign කරලා, entries හෝ සංශෝධන ඇති හැම පිටුවක්ම සහ හැම නිවැරදි කිරීමක්ම initial කළ යුතුයි.",["ITB 20"]],
[null,"do","Seal the ORIGINAL and COPY in separate marked envelopes inside an outer envelope. Address them to the Employer's address in the Bidding Data, show the contract name and number and 'do not open before' the opening time, and put your name and address on the inner envelopes.","ORIGINAL සහ COPY වෙන වෙනම mark කළ envelopes වල seal කරලා පිටත envelope එකක් ඇතුළේ දාන්න. Bidding Data එකේ Employer address එකට යොමු කරලා, contract නම සහ අංකය, සහ විවෘත කරන වේලාවට කලින් 'විවෘත නොකරන්න' සඳහන් කරන්න; ඇතුළත envelopes වල ඔබේ නම සහ address දාන්න.",["ITB 21","BD 21"]],
["a:L","warn","The bid must be received at the Employer's address by the deadline in the Bidding Data. Late bids are returned unopened. A bid without an acceptable bid security is rejected.","Bidding Data එකේ deadline එක වෙද්දී bid එක Employer address එකට ලැබිය යුතුයි. ප්‍රමාද bids නොවිවෘතව ආපසු යවනවා. පිළිගත හැකි bid security එකක් නැති bid එකක් reject වෙනවා.",["ITB 22","ITB 23","ITB 17","BD 22"]]]},

{i:"T12",c:"tender",r:"C",t:["How are bids opened and evaluated?","Bids විවෘත කරලා evaluate කරන්නේ කොහොමද?"],
m:["Knowing how bids are opened and evaluated helps you avoid rejection and understand the result. The contract goes to the eligible, qualified bidder with the lowest evaluated, substantially responsive bid.","Bids විවෘත කරන සහ evaluate කරන ආකාරය දැනගැනීම reject වීම වළක්වා ගන්නත් ප්‍රතිඵලය තේරුම් ගන්නත් උදව් වෙනවා. Contract එක යන්නේ අඩුම evaluate කළ, substantially responsive bid එක දුන් eligible සහ qualified bidder ට."],
s:[[null,"know","Bids are opened in public at the time and place in the Bidding Data. Withdrawals are opened first, then modifications, then the ORIGINALs. Prices, discounts and bid securities are read out. No bid is rejected at opening except late bids; a bid not opened and read out is not considered.","Bidding Data එකේ කාලයට සහ තැනට bids ප්‍රසිද්ධියේ විවෘත කරනවා. මුලින් withdrawals, පසුව modifications, ඉන් පසු ORIGINALs විවෘත කරනවා. මිල, discounts සහ bid securities කියවනවා. ප්‍රමාද bids හැර opening එකේදී කිසිම bid එකක් reject කරන්නේ නැහැ; විවෘත කර කියවූයේ නැති bid එකක් සලකා බලන්නේ නැහැ.",["ITB 25","BD 25"]],
[null,"warn","Evaluation is confidential until award. Any attempt to influence the Employer may lead to rejection. After opening, contact the Employer only in writing.","Award කරනකම් evaluation රහසිගතයි. Employer ට බලපෑම් කිරීමට ගන්නා ඕනෑම උත්සාහයක් reject වීමට හේතු විය හැකියි. Opening එකෙන් පසු Employer සමඟ සම්බන්ධ වෙන්නේ ලිඛිතව පමණයි.",["ITB 26","ITB 27"]],
[null,"know","A bid must be eligible, properly signed, with the required securities, and substantially responsive: no material deviation or reservation affecting scope, quality or performance, the Employer's rights, or fair competition. A non-responsive bid cannot be made responsive later.","Bid එකක් eligible, නිසි ලෙස sign කළ, අවශ්‍ය securities සහිත, substantially responsive විය යුතුයි: scope, quality හෝ performance, Employer ගේ අයිතිවාසිකම් හෝ සාධාරණ තරගයට බලපාන material deviation හෝ reservation නොතිබිය යුතුයි. Non-responsive bid එකක් පසුව responsive කරන්න බැහැ.",["ITB 28"]],
[null,"know","The evaluated price: the bid price after arithmetic corrections, excluding provisional sums and contingencies (but including competitively priced dayworks), converted to Rupees if needed, and adjusted for acceptable deviations. The likely effect of price adjustment is ignored. Domestic preference applies only if the Bidding Data says so.","Evaluate කළ මිල: ගණිත නිවැරදි කිරීම් වලින් පසු bid මිල, provisional sums සහ contingencies නැතිව (තරගකාරීව price කළ dayworks ඇතුළුව), අවශ්‍ය නම් රුපියල් වලට හරවලා, පිළිගත හැකි deviations සඳහා adjust කරලා. Price adjustment එකේ බලපෑම සලකන්නේ නැහැ. Domestic preference අදාළ වන්නේ Bidding Data එකේ කියනවා නම් පමණයි.",["ITB 30","ITB 31","BD 31"]],
[null,"know","Before the bid validity ends, the Employer sends the winner the Letter of Acceptance, which states the Initial Contract Price. The notification of award forms the contract.","Bid validity එක ඉවර වෙන්න කලින්, Initial Contract Price එක සඳහන් Letter of Acceptance එක Employer ජයග්‍රාහියාට යවනවා. Award notification එකෙන් contract එක ඇති වෙනවා.",["ITB 34","ITB 32"]]]},

{i:"S1",c:"start",r:"C",t:["We received the Letter of Acceptance (LOA). What next?","Letter of Acceptance (LOA) එක ලැබුණා. ඊළඟට මොනවද?"],
m:["The notification of award forms the contract. Several deadlines run from the day you receive the LOA, and missing the Performance Security can cost you the contract.","Award notification එකෙන් contract එක ඇති වෙනවා. LOA එක ලැබුණු දවසේ සිට deadlines කිහිපයක් ගණන් වෙනවා, Performance Security එක මඟ හැරුණොත් contract එකම අහිමි විය හැකියි."],
d:[["a","Date we received the LOA","LOA එක ලැබුණු දිනය"]],
s:[["a+14:L","do","Deliver the Performance Security to the Employer, in the amount stated in the Contract Data (generally 5% of the Initial Contract Price) and in the acceptable form. The Bidding Data suggests it be valid until 28 days after the expected end of the defects period.","Contract Data එකේ සඳහන් මුදලට (සාමාන්‍යයෙන් Initial Contract Price එකෙන් 5%), පිළිගත හැකි ආකාරයෙන් Performance Security එක Employer ට දෙන්න. එය අපේක්ෂිත defects period අවසානයෙන් දින 28ක් දක්වා valid විය යුතු බව Bidding Data එකේ යෝජනා කරනවා.",["4.2","ITB 35","BD 35"]],
["a+14:L","do","Take out insurances: the Works for not less than 115% of the Initial Contract Price and your Equipment for replacement value (18.1), and third-party liability with at least the per-occurrence limit in the Contract Data (18.2), both in the joint names of the Parties; and insurance for your personnel, under which the Employer and Engineer are also indemnified (18.3).","Insurances ගන්න: Works, Initial Contract Price එකෙන් 115%කට නොඅඩුව සහ ඔබේ Equipment replacement value එකට (18.1), සහ Contract Data එකේ occurrence එකකට සීමාවට නොඅඩු third-party liability (18.2), දෙකම Parties ගේ joint names වලින්; සහ ඔබේ personnel සඳහා insurance, Employer සහ Engineer ටත් එය යටතේ indemnity ලැබෙන විදිහට (18.3).",["18.1","18.2","18.3","CD 18.2"]],
["a+14:O","know","The Employer should give you access to and possession of the Site by this date, unless the Contract Data says otherwise. It may hold this back until it receives the Performance Security.","Contract Data එකේ වෙනත් දෙයක් නැත්නම්, Employer මේ දිනය වෙද්දී Site එකට ප්‍රවේශය සහ possession දිය යුතුයි. Performance Security එක ලැබෙනකම් එය රඳවාගන්න Employer ට පුළුවන්.",["2.1","CD 2.1"]],
["a+14:O","know","Unless the Contract Data says otherwise, the Commencement Date is within 14 days after you receive the LOA. The Engineer must give you at least 7 days' notice of it.","Contract Data එකේ වෙනත් දෙයක් නැත්නම්, Commencement Date එක LOA එක ලැබී දින 14ක් ඇතුළත. Engineer ඒ ගැන අවම දින 7ක notice එකක් දිය යුතුයි.",["8.1"]],
["a+28:L","do","Sign the Contract Agreement (prepared by the Employer) within 28 days after receiving the LOA, unless otherwise agreed. You pay any stamp duty.","වෙනත් එකඟතාවක් නැත්නම්, LOA එක ලැබී දින 28ක් ඇතුළත (Employer සකස් කරන) Contract Agreement එක sign කරන්න. Stamp duty ඔබ ගෙවනවා.",["1.6","ITB 34"]],
[null,"do","Before the Commencement Date, unless your representative is named in the Contract, send the Engineer the name and details of your proposed Contractor's Representative for consent.","Commencement Date එකට කලින්, ඔබේ නියෝජිතයා Contract එකේ නම් කර නැත්නම්, යෝජිත Contractor's Representative ගේ නම සහ විස්තර Engineer ගේ අනුමැතියට යවන්න.",["4.3"]],

["b+28:L","do","Agree the Adjudicator with the Employer. On contracts with a DAB (about LKR 500 million and above), each Party appoints one member and both agree the chairman within this time.","Employer සමඟ Adjudicator කෙනෙක් ගැන එකඟ වෙන්න. DAB එකක් ඇති contracts වල (ආසන්න වශයෙන් LKR මිලියන 500 සහ ඊට වැඩි), මේ කාලය තුළ හැම Party එකක්ම member කෙනෙක් පත් කරලා, chairman ගැන දෙදෙනාම එකඟ වෙනවා.",["ITB 37","CD 19.2"]],
[null,"do","Progress reports: the first covers the period to the end of the first calendar month after the Commencement Date; then one each month, each within 7 days after the end of the period.","Progress reports: පළමු එක Commencement Date එකෙන් පසු පළමු calendar මාසය අවසානය දක්වා; ඉන් පසු හැම මාසෙම එකක්, කාලය අවසන් වී දින 7ක් ඇතුළත.",["4.14"]],
[null,"do","Give the Engineer at least 28 days' notice before each subcontractor starts work on Site.","හැම subcontractor කෙනෙක්ම Site එකේ වැඩ පටන් ගන්න අවම දින 28කට කලින් Engineer ට notice දෙන්න.",["4.4"]]]},

{i:"S3",c:"start",r:"C",t:["The Employer is late in giving access to or possession of the Site","Employer Site එකට ප්‍රවේශය හෝ possession දීම ප්‍රමාද කරනවා"],
m:["The Employer must give access to and possession of the Site within 14 days from the LOA (unless the Contract Data says otherwise). If it is late and you suffer delay or Cost, you can claim time, Cost and reasonable profit.","Contract Data එකේ වෙනත් දෙයක් නැත්නම්, LOA එකෙන් දින 14ක් ඇතුළත Employer Site එකට ප්‍රවේශය සහ possession දිය යුතුයි. ප්‍රමාද වෙලා ඔබට ප්‍රමාදයක් හෝ Cost එකක් ආවොත්, කාලය, Cost සහ සාධාරණ profit claim කරන්න පුළුවන්."],
d:[["a","Date the Site should have been given","Site එක ලැබිය යුතුව තිබූ දිනය"],["b","Date we became aware of the delay or Cost","ප්‍රමාදය හෝ Cost එක ගැන දැනගත් දිනය"]],
q:[["Has the Employer received the Performance Security?","Employer ට Performance Security එක ලැබිලාද?","","","The Employer may withhold access and possession until it receives the Performance Security.","Performance Security එක ලැබෙනකම් ප්‍රවේශය සහ possession රඳවාගන්න Employer ට පුළුවන්."],["Was the Employer's failure caused by your own error or delay (including your Contractor's Documents)?","Employer ගේ අසමත්කමට ඔබේම වරදක් හෝ ප්‍රමාදයක් (ඔබේ Contractor's Documents ඇතුළුව) හේතු වුණාද?","To that extent you get no time, Cost or profit.","ඒ ප්‍රමාණයට කාලය, Cost හෝ profit ලැබෙන්නේ නැහැ.","",""]],
s:[["b:O","do","Give notice to the Engineer that you are suffering delay and/or incurring Cost because the Site was not given in time.","Site එක කාලයට නොදුන් නිසා ප්‍රමාදයක් සහ/හෝ Cost එකක් ඇති වන බව Engineer ට notice කරන්න.",["2.1"]],

{i:"S4",c:"start",r:"B",t:["The Performance Security could not be given on time","Performance Security එක නියමිත කාලයට දෙන්න බැරි වුණා"],
m:["The Performance Security must be given within 14 days after receiving the LOA. Failing to do so is a breach of contract and can cost the bidder the contract and its bid security.","LOA එක ලැබී දින 14ක් ඇතුළත Performance Security එක දිය යුතුයි. එසේ නොකිරීම contract උල්ලංඝනයක්, bidder ට contract එකත් bid security එකත් අහිමි විය හැකියි."],
d:[["a","Date the LOA was received","LOA එක ලැබුණු දිනය"]],
s:[["a+14:L","warn","Last day to deliver the Performance Security.","Performance Security එක දිය යුතු අවසාන දිනය.",["4.2","ITB 35"]],
[null,"warn","Failure is a breach of contract and a cause for annulment of the award and forfeiture of the bid security. The Employer may award the contract to the next ranked bidder.","අසමත් වීම contract උල්ලංඝනයක්, award එක අවලංගු කිරීමට සහ bid security එක අහිමි කිරීමට හේතුවක්. ඊළඟ ස්ථානයේ bidder ට contract එක award කරන්න Employer ට පුළුවන්.",["ITB 35","ITB 17"]],
[null,"warn","Once the contract is running, failure to comply with 4.2 is also a ground for termination by the Employer with 14 days' notice.","Contract එක ක්‍රියාත්මක වන විට, 4.2 පිළිනොපැදීම දින 14ක notice එකකින් Employer ට terminate කිරීමටත් හේතුවක්.",["15.2"]]]},

{i:"S5",c:"start",r:"C",t:["The advance payment has not been paid","Advance payment එක ගෙව්වේ නැහැ"],
m:["The advance payment is an interest-free loan for mobilization. The Employer must pay the first instalment within 14 days after issuing the LOA and after receiving the Performance Security and your advance payment guarantee. If it pays late, financing charges apply, and you may give notice and then suspend or slow down work.","Advance payment එක mobilization සඳහා දෙන පොලී රහිත ණයක්. LOA එක නිකුත් කළාට පස්සේ, Performance Security එක සහ ඔබේ advance payment guarantee එක ලැබී දින 14ක් ඇතුළත Employer පළමු කොටස ගෙවිය යුතුයි. ප්‍රමාද වී ගෙව්වොත් financing charges අදාළයි, notice දීලා වැඩ suspend හෝ අඩු කරන්නත් පුළුවන්."],
d:[["a","Later of: LOA date, or date the Employer received the Performance Security and the advance payment guarantee","පසුව එන දිනය: LOA දිනය, හෝ Employer ට Performance Security එක සහ advance payment guarantee එක ලැබුණු දිනය"]],
s:[["a+14:L","know","Last day for the Employer to pay the first instalment. (The Engineer issues an IPC for it after receiving your Statement and after the Employer has the two securities.)","පළමු කොටස Employer ගෙවිය යුතු අවසාන දිනය. (ඔබේ Statement එක ලැබිලා, Employer ට securities දෙක ලැබුණාට පස්සේ ඒ සඳහා Engineer IPC එකක් නිකුත් කරනවා.)",["14.6(a)","14.2","ITB 36"]],
["a+14:F","know","If not paid, financing charges run from this date until it is paid.","නොගෙව්වොත්, මේ දිනයේ සිට ගෙවන දිනය දක්වා financing charges ගණන් වෙනවා.",["14.7"]],
["a+15:F","do","From this date you may give the Employer a notice of not less than 56 days that you will suspend (or slow down) work unless and until you are paid. Send a copy to the Engineer.","මේ දිනයේ සිට, ගෙවීම ලැබෙනකම් වැඩ suspend (හෝ අඩු) කරනවා කියලා දින 56කට නොඅඩු notice එකක් Employer ට දෙන්න පුළුවන්. Engineer ට copy එකක් යවන්න.",["16.1","1.3"]],
["a+71:F","if","If you gave that notice on the first possible day and are still not paid, this is the earliest day you may suspend or slow down work.","ඒ notice එක පුළුවන් පළමු දවසේම දීලා තවමත් ගෙවීම ලැබී නැත්නම්, වැඩ suspend හෝ අඩු කරන්න පුළුවන් මුල්ම දිනය මෙයයි.",["16.1"]],
[null,"if","Because the first instalment is certified in an IPC, the termination right in 16.2(b) can also apply if the amount is still not received 56 days after the payment period ends (see P1 for the dates).","පළමු කොටස IPC එකක certify කරන නිසා, ගෙවීමේ කාලය ඉවර වී දින 56කට පසුත් මුදල නොලැබුණොත් 16.2(b) termination අයිතියත් අදාළ විය හැකියි (දිනයන් සඳහා P1 බලන්න).",["16.2(b)","14.2"]]],
en:{E:["C",C16[0],C16[1]],C:["C",C16[0],C16[1]],P:["C",C16[0],C16[1]],x:[["Financing charges on the late payment (14.7)","ප්‍රමාද ගෙවීමට financing charges (14.7)"]],v:1},
calc:"fin",
n:{f:"C",to:"E",cl:["14.6(a)","14.7","16.1"],sub:"Notice under Sub-Clause 16.1 – non-payment of the first instalment of the advance payment",b:["The first instalment of the advance payment has not been paid within 14 days after the Letter of Acceptance and after your receipt of the Performance Security and the advance payment guarantee (on __), as required by Sub-Clause 14.6(a).","We are entitled to financing charges under Sub-Clause 14.7.","We give notice under Sub-Clause 16.1 that, unless and until we receive this payment, we will suspend work (or reduce the rate of work) after the expiry of not less than 56 days from the date of this notice."],from:"a+15"}},

{i:"S6",c:"start",r:"B",t:["We cannot agree on the Adjudicator or DAB members","Adjudicator හෝ DAB members ගැන එකඟ වෙන්න බැහැ"],
m:["The Parties should agree the Adjudicator (or, for DAB contracts, appoint the DAB) within 28 days from the Commencement Date. If they do not, ICTAD (now CIDA) appoints on request.","Commencement Date එකේ සිට දින 28ක් ඇතුළත Parties Adjudicator ගැන එකඟ විය යුතුයි (හෝ DAB contracts වල DAB එක පත් කළ යුතුයි). එසේ නොවුණොත් ඉල්ලීම මත ICTAD (දැන් CIDA) පත් කරනවා."],
d:[["a","Commencement Date","Commencement Date"]],
s:[["a+28:L","do","Last day to agree the Adjudicator mutually. The Adjudicator must not be connected with the project and must be able to show impartiality and independence.","Adjudicator ගැන එකඟ වෙන්න අවසාන දිනය. Adjudicator project එකට සම්බන්ධ නොවූ, අපක්ෂපාතීත්වය සහ ස්වාධීනත්වය පෙන්විය හැකි කෙනෙක් විය යුතුයි.",["ITB 37"]],
["a+29:F","if","If there is no agreement, from this date either Party may ask ICTAD to appoint the Adjudicator.","එකඟතාවක් නැත්නම්, මේ දිනයේ සිට Adjudicator පත් කරන්න කියලා ඕනෑම Party එකකට ICTAD ගෙන් ඉල්ලන්න පුළුවන්.",["ITB 37","19.3"]],
[null,"if","DAB contracts: each Party appoints one member and both agree the third (chairman) within 28 days from the Commencement Date. If a Party does not nominate, or they cannot agree the chairman or a replacement (within 42 days), ICTAD appoints on request; each Party pays half of ICTAD's expenses and half of the members' remuneration.","DAB contracts: Commencement Date එකේ සිට දින 28ක් ඇතුළත හැම Party එකක්ම member කෙනෙක් පත් කරලා, තුන්වන (chairman) ගැන දෙදෙනාම එකඟ වෙනවා. Party එකක් නම් නොකළොත්, හෝ chairman හෝ ආදේශකයෙක් (දින 42ක් ඇතුළත) ගැන එකඟ වෙන්න බැරි නම්, ඉල්ලීම මත ICTAD පත් කරනවා; ICTAD වියදම් වලින් සහ members ගේ ගාස්තු වලින් භාගය බැගින් හැම Party එකක්ම ගෙවනවා.",["CD 19.2","CD 19.3","BD 37"]],
[null,"know","The Adjudicator's fees and reimbursable expenses are agreed case by case and shared equally.","Adjudicator ගේ ගාස්තු සහ ආපසු ගෙවිය හැකි වියදම් අවස්ථාව අනුව එකඟ වෙලා සමානව බෙදාගන්නවා.",["BD 37","19.3"]]]},

{i:"S7",c:"start",r:"C",x:1,t:["The Employer will not sign the Contract Agreement","Employer Contract Agreement එක sign කරන්නේ නැහැ"],
m:["The Parties must enter into the Contract Agreement within 28 days after the Contractor receives the LOA, unless otherwise agreed. If the Employer fails to do so, the Contractor may end the contract.","වෙනත් එකඟතාවක් නැත්නම්, Contractor ට LOA එක ලැබී දින 28ක් ඇතුළත Parties Contract Agreement එකට ඇතුළත් විය යුතුයි. Employer එසේ නොකළොත් Contractor ට contract එක අවසන් කරන්න පුළුවන්."],
d:[["a","Date we received the LOA","LOA එක ලැබුණු දිනය"]],
s:[["a+28:L","know","Last day to enter into the Contract Agreement (unless otherwise agreed). The Employer prepares it.","Contract Agreement එකට ඇතුළත් විය යුතු අවසාන දිනය (වෙනත් එකඟතාවක් නැත්නම්). එය සකස් කරන්නේ Employer.",["1.6"]],
["a+29:F","if","If the Employer has not complied with 1.6, from this date you may give 14 days' notice to terminate the contract.","Employer 1.6 පිළිපදින්නේ නැත්නම්, මේ දිනයේ සිට contract එක terminate කරන්න දින 14ක notice එකක් දෙන්න පුළුවන්.",["16.2(d)","16.2"]]]}
];

{i:"V1",c:"var",r:"C",t:["The Engineer gave an instruction by word of mouth (verbal instruction)","Engineer වචනයෙන් (verbal) instruction එකක් දුන්නා"],
m:["Under SBD/02, the Engineer's instructions must be given in writing. Unlike some FIDIC editions, SBD/02 has no procedure that turns an oral instruction into a written one if you confirm it. So get the instruction in writing before you do extra or changed work, or you may not be paid for it.","SBD/02 යටතේ Engineer ගේ instructions ලිඛිතව දිය යුතුයි. සමහර FIDIC සංස්කරණ වගේ නොව, ඔබ confirm කළොත් වාචික instruction එකක් ලිඛිත එකක් බවට පත් වන ක්‍රියාවලියක් SBD/02 හි නැහැ. ඒ නිසා අමතර හෝ වෙනස් කළ වැඩ කරන්න කලින් instruction එක ලිඛිතව ගන්න, නැත්නම් ඒකට ගෙවීම නොලැබෙන්න පුළුවන්."],
s:[[null,"do","Ask for the instruction in writing before you act on it. Instructions from the Engineer or a delegated assistant must be in writing.","ක්‍රියා කරන්න කලින් instruction එක ලිඛිතව ඉල්ලන්න. Engineer ගෙන් හෝ බලය පැවරූ assistant කෙනෙකුගෙන් එන instructions ලිඛිතව විය යුතුයි.",["3.3"]],
[null,"warn","Do not alter or modify the Permanent Works unless the Engineer instructs or approves a Variation.","Engineer Variation එකක් instruct හෝ approve කරනකම් Permanent Works වෙනස් කරන්න එපා.",["13.1"]],
[null,"do","Take instructions only from the Engineer, or from an assistant to whom that authority has been delegated in writing (a delegation takes effect only when both Parties have received copies). If you question an assistant's instruction, refer it to the Engineer.","Instructions ගන්න Engineer ගෙන්, හෝ ලිඛිතව ඒ බලය පවරා ඇති assistant කෙනෙකුගෙන් පමණයි (පාර්ශව දෙකටම copies ලැබුණාම පමණයි delegation එක බලපැවැත්වෙන්නේ). Assistant කෙනෙකුගේ instruction එකක් ගැන ප්‍රශ්නයක් තියෙනවා නම් Engineer ට යොමු කරන්න.",["3.3","3.2"]],
[null,"know","The Engineer cannot amend the Contract. If the Contract Data says the Employer must approve certain actions, an instruction the Engineer gives under that authority is treated as approved by the Employer.","Engineer ට Contract එක සංශෝධනය කරන්න බැහැ. යම් ක්‍රියා වලට Employer ගේ අනුමැතිය අවශ්‍ය බව Contract Data එකේ කියනවා නම්, Engineer ඒ බලය යටතේ දෙන instruction එකක් Employer අනුමත කළා ලෙස සැලකෙනවා.",["3.1","CD 3.1"]]],
k:["Instruction register, site diary notes of the oral instruction, your written request","Instruction register, වාචික instruction එක ගැන site diary සටහන්, ඔබේ ලිඛිත ඉල්ලීම"],
n:{f:"C",to:"EN",cl:["3.3","13.1"],sub:"Request for written instruction",b:["On __ at site, __ gave an oral instruction regarding __.","Under Sub-Clause 3.3 instructions are to be given in writing, and under Sub-Clause 13.1 we may not alter the Permanent Works unless a Variation is instructed or approved. Please issue this instruction in writing before we proceed."]}},

{i:"V2",c:"var",r:"C",t:["We received a Variation instruction","Variation instruction එකක් ලැබුණා"],
m:["A Variation is a change to the Works instructed or approved under Clause 13, before the Taking-Over Certificate for the Works. You must carry it out unless you cannot readily obtain the Goods needed. It is valued under Clause 12 and may give extra time.","Variation එකක් කියන්නේ Works වල Taking-Over Certificate එකට කලින්, Clause 13 යටතේ instruct හෝ approve කරන Works වලට කරන වෙනස්කමක්. අවශ්‍ය Goods පහසුවෙන් ලබාගන්න බැරි නම් හැර, ඔබ එය කළ යුතුයි. එය Clause 12 යටතේ value කරනවා, අමතර කාලයත් ලැබිය හැකියි."],
d:[["a","Date we received the instruction","Instruction එක ලැබුණු දිනය"]],
s:[["a:O","do","Acknowledge receipt of the instruction. If it includes requirements for recording Costs, keep those records.","Instruction එක ලැබුණු බව acknowledge කරන්න. Costs record කිරීමේ අවශ්‍යතා එහි තියෙනවා නම් ඒ records තියාගන්න.",["13.3"]],
[null,"if","If you cannot readily obtain the Goods required, promptly give notice to the Engineer with supporting particulars. The Engineer will cancel, confirm or vary the instruction.","අවශ්‍ය Goods පහසුවෙන් ලබාගන්න බැරි නම්, සහාය විස්තර සමඟ ඉක්මනින් Engineer ට notice දෙන්න. Engineer instruction එක cancel, confirm හෝ වෙනස් කරනවා.",["13.1"]],
[null,"know","A Variation may change quantities, quality, levels, positions or dimensions, omit work (unless it is to be done by others), add work, plant, materials, services or tests, or change the sequence or timing of the Works. A change in quantity alone is not necessarily a Variation.","Variation එකකින් quantities, quality, levels, positions හෝ dimensions වෙනස් කරන්න, වැඩ omit කරන්න (වෙන අය ලවා කරවන්න නම් හැර), වැඩ, plant, materials, services හෝ tests එකතු කරන්න, හෝ Works වල අනුපිළිවෙල හෝ කාලය වෙනස් කරන්න පුළුවන්. Quantity වෙනසක් පමණක් අනිවාර්යයෙන්ම Variation එකක් නොවේ.",["13.1"]],
[null,"know","The Variation is valued under Clause 12, unless the Engineer instructs or approves otherwise. If no time adjustment was agreed, you may claim an extension under 8.4(a).","Engineer වෙනත් ලෙස instruct හෝ approve නොකරන්නේ නම් Variation එක Clause 12 යටතේ value කරනවා. කාල adjustment එකක් එකඟ වී නැත්නම් 8.4(a) යටතේ extension එකක් claim කරන්න පුළුවන්.",["13.3","12.3","8.4(a)","19.1"]],
[null,"know","If variations and other additions raise the Contract Price by more than 25%, the Engineer may ask you in writing to increase the Performance Security.","Variations සහ අනෙක් එකතු කිරීම් නිසා Contract Price එක 25%කට වඩා වැඩි වුණොත්, Performance Security එක වැඩි කරන්න Engineer ට ලිඛිතව ඉල්ලන්න පුළුවන්.",["4.2"]]],
en:{E:["C","Unless a time adjustment was already agreed under 13.3, and only if completion is delayed.","13.3 යටතේ කාල adjustment එකක් දැනටමත් එකඟ වී නැත්නම් සහ completion ප්‍රමාද වෙනවා නම් පමණයි."],C:["N"],P:["N"],x:[V123],v:1},
k:["Variation register, records of resources used","Variation register, භාවිත කළ සම්පත් records"]},

{i:"V3",c:"var",r:"C",t:["The Engineer asked us for a proposal before ordering a change","වෙනස්කමක් order කරන්න කලින් Engineer අපෙන් proposal එකක් ඉල්ලුවා"],
m:["The Engineer can start a Variation by asking you for a proposal first. You reply in writing as soon as practicable.","මුලින් proposal එකක් ඉල්ලීමෙන් Engineer ට Variation එකක් පටන් ගන්න පුළුවන්. ඔබ සාධාරණව හැකි ඉක්මනින් ලිඛිතව පිළිතුරු දෙනවා."],
s:[[null,"do","Reply in writing as soon as practicable: either give reasons why you cannot comply, or submit (a) a description of the proposed work and a programme for it; (b) your proposed changes to the programme and to the Time for Completion; (c) your proposal for evaluating the Variation.","සාධාරණව හැකි ඉක්මනින් ලිඛිතව පිළිතුරු දෙන්න: කරන්න බැරි නම් හේතු දෙන්න, නැත්නම් මේවා ඉදිරිපත් කරන්න: (a) යෝජිත වැඩ විස්තරය සහ ඒ සඳහා programme එකක්; (b) programme එකට සහ Time for Completion එකට ඔබ යෝජනා කරන වෙනස්කම්; (c) Variation එක evaluate කිරීමට ඔබේ යෝජනාව.",["13.3","13.1"]],
[null,"know","The Engineer must respond as soon as practicable with approval, disapproval or comments. Do not delay any work while waiting.","Engineer සාධාරණව හැකි ඉක්මනින් approval, disapproval හෝ comments දිය යුතුයි. පිළිතුර එනකම් කිසිම වැඩක් ප්‍රමාද කරන්න එපා.",["13.3"]]]},

{i:"V4",c:"var",r:"B",t:["How is the rate for changed or new work decided?","වෙනස් කළ හෝ අලුත් වැඩකට rate එක තීරණය කරන්නේ කොහොමද?"],
m:["The Engineer values each item by applying the agreed measurement and the appropriate rate, agreeing or determining it under 3.4. A new rate is used only in the two situations set out in 12.3.","එකඟ වූ measurement එක සහ සුදුසු rate එක යොදලා, 3.4 යටතේ එකඟ කරලා හෝ තීරණය කරලා Engineer හැම item එකක්ම value කරනවා. අලුත් rate එකක් භාවිත කරන්නේ 12.3 හි සඳහන් අවස්ථා දෙකේදී පමණයි."],
s:[[null,"know","The appropriate rate is the rate for that item in the Contract; if there is none, the rate for similar work.","සුදුසු rate එක කියන්නේ Contract එකේ ඒ item එකේ rate එක; එවැන්නක් නැත්නම් සමාන වැඩක rate එක.",["12.3"]],
[null,"know","A new rate is appropriate only if: (a) the measured quantity changes by more than 25% from the BOQ quantity AND that change × the rate exceeds 1% of the Initial Contract Price (see V5); or (b) the work is instructed under Clause 13, there is no rate for it, and no rate is appropriate because the work is not of similar character or not done under similar conditions.","අලුත් rate එකක් සුදුසු වන්නේ මේ අවස්ථාවල පමණයි: (a) measure කළ quantity එක BOQ quantity එකෙන් 25%කට වඩා වෙනස් වීම සහ ඒ වෙනස × rate එක Initial Contract Price එකෙන් 1% ඉක්මවීම (V5 බලන්න); හෝ (b) වැඩ Clause 13 යටතේ instruct කර, ඒකට rate එකක් නැති, සමාන ස්වභාවයක් හෝ සමාන තත්ත්ව යටතේ නොකරන නිසා කිසිම rate එකක් සුදුසු නොවීම.",["12.3"]],
[null,"know","A new rate is derived from relevant contract rates with reasonable adjustments. If none are relevant, it is based on the reasonable Cost of the work plus reasonable profit.","අලුත් rate එක අදාළ contract rates වලින්, සාධාරණ adjustments සමඟ ගන්නවා. කිසිවක් අදාළ නැත්නම්, වැඩේ සාධාරණ Cost එක + සාධාරණ profit මත පදනම් වෙනවා.",["12.3"]],
[null,"know","Until the rate is agreed or determined, the Engineer sets a provisional rate for the interim payment certificates.","Rate එක එකඟ වෙනකම් හෝ තීරණය වෙනකම්, interim payment certificates සඳහා Engineer provisional rate එකක් නියම කරනවා.",["12.3","3.4"]]]},

{i:"V5",c:"var",r:"B",t:["A BOQ quantity changed by more than 25%. Do we get a new rate?","BOQ quantity එකක් 25%කට වඩා වෙනස් වුණා. අලුත් rate එකක් ලැබෙනවද?"],
m:["BOQ quantities are estimates. A new rate is appropriate under 12.3(a) only if both tests below are met. Use the calculator.","BOQ quantities ඇස්තමේන්තු පමණයි. පහත test දෙකම සපිරුණොත් පමණයි 12.3(a) යටතේ අලුත් rate එකක් සුදුසු වන්නේ. Calculator එක භාවිත කරන්න."],
s:[[null,"know","Both must be true: (i) the measured quantity differs from the BOQ quantity by more than 25%; and (ii) that change × the BOQ rate exceeds 1% of the Initial Contract Price.","දෙකම සත්‍ය විය යුතුයි: (i) measure කළ quantity එක BOQ quantity එකෙන් 25%කට වඩා වෙනස්; සහ (ii) ඒ වෙනස × BOQ rate එක Initial Contract Price එකෙන් 1% ඉක්මවනවා.",["12.3(a)"]],
[null,"know","BOQ quantities are estimated quantities, not the actual quantities you will be paid for.","BOQ quantities ඇස්තමේන්තු quantities මිසක්, ඔබට ගෙවන සැබෑ quantities නොවේ.",["14.1(c)"]],
[null,"if","A change in quantity is not necessarily a Variation, but a substantial change in quantity can still give an extension of time under 8.4(a).","Quantity වෙනසක් අනිවාර්යයෙන්ම Variation එකක් නොවේ, හැබැයි quantity එකේ සැලකිය යුතු වෙනසකට 8.4(a) යටතේ extension of time එකක් ලැබිය හැකියි.",["13.1(a)","8.4(a)"]]],
calc:"q25"},

{i:"V6",c:"var",r:"C",t:["Part of our work was omitted","අපේ වැඩ කොටසක් omit කළා"],
m:["Work can be omitted by Variation, but not so that someone else can do it. If the omission leaves you with costs that were covered by the omitted work's value in your price (for example site overheads), you can recover them under 12.4.","Variation එකකින් වැඩ omit කරන්න පුළුවන්, හැබැයි වෙන කෙනෙකුට කරවන්න නොවේ. Omit කළ වැඩේ වටිනාකමෙන් ඔබේ මිලේ ආවරණය වී තිබූ වියදම් (උදා: site overheads) ඔබට ඉතිරි වුණොත්, 12.4 යටතේ ඒවා ලබාගන්න පුළුවන්."],
s:[[null,"warn","A Variation may omit work only if it is not to be carried out by others.","වෙන අය ලවා කරවන්න නොවේ නම් පමණයි Variation එකකින් වැඩ omit කරන්න පුළුවන්.",["13.1(d)"]],
[null,"do","If the value of the omission has not been agreed, give notice to the Engineer with supporting particulars when: (a) you will incur (or have incurred) cost that would have been covered by a sum in the Initial Contract Price; (b) the omission removes that sum from the Contract Price; and (c) the cost is not included in the valuation of any substituted work.","Omission එකේ වටිනාකම එකඟ වී නැත්නම්, මේ අවස්ථාවල සහාය විස්තර සමඟ Engineer ට notice දෙන්න: (a) Initial Contract Price එකේ මුදලකින් ආවරණය වෙන්න තිබූ වියදමක් ඔබට ඇති වෙනවා (හෝ ඇති වුණා); (b) omission එක නිසා ඒ මුදල Contract Price එකෙන් ඉවත් වෙනවා; සහ (c) ඒ වියදම ආදේශක වැඩක valuation එකට ඇතුළත් නැහැ.",["12.4"]],
[null,"know","The Engineer then agrees or determines this cost under 3.4 and it is included in the Contract Price.","ඉන් පසු Engineer 3.4 යටතේ මේ වියදම එකඟ කරනවා හෝ තීරණය කරනවා, එය Contract Price එකට ඇතුළත් කරනවා.",["12.4","3.4"]]],
en:{E:["N"],C:["C","Only the cost covered by the omitted sum, if conditions (a) to (c) of 12.4 are met.","12.4 හි (a) සිට (c) දක්වා කොන්දේසි සපිරුණොත්, omit කළ මුදලෙන් ආවරණය වූ වියදම පමණයි."],P:["N"]},
n:{f:"C",to:"EN",cl:["12.4"],sub:"Notice under Sub-Clause 12.4 – Omissions",b:["The omission of __ instructed on __ will result in Cost which would have been covered by a sum in the Initial Contract Price, and which is not included in the evaluation of any substituted work.","Supporting particulars are attached. Please agree or determine this Cost under Sub-Clauses 12.4 and 3.4."]}},

{i:"V7",c:"var",r:"C",t:["We have an idea to save cost or time (value engineering)","වියදම හෝ කාලය ඉතිරි කරන්න අදහසක් තියෙනවා (value engineering)"],
m:["You may at any time propose changes that speed up completion, reduce the Employer's cost of building, maintaining or operating the Works, improve efficiency or value, or otherwise benefit the Employer. If an approved proposal changes the design and reduces the contract value, you get a fee of half the net saving.","Completion වේගවත් කරන, Works ඉදිකිරීමේ/නඩත්තුවේ/ක්‍රියාත්මක කිරීමේ Employer ගේ වියදම අඩු කරන, කාර්යක්ෂමතාව හෝ වටිනාකම වැඩි කරන, හෝ වෙනත් ලෙස Employer ට වාසිදායක වෙනස්කම් ඕනෑම වෙලාවක යෝජනා කරන්න පුළුවන්. අනුමත කළ proposal එකකින් design එක වෙනස් වෙලා contract value එක අඩු වුණොත්, ශුද්ධ ඉතිරියෙන් භාගයක fee එකක් ලැබෙනවා."],
s:[[null,"do","Submit a written proposal, prepared at your own cost, including the items listed in 13.3 (description and programme, programme and time changes, evaluation).","13.3 හි ලැයිස්තුගත දේ (විස්තරය සහ programme, programme සහ කාල වෙනස්කම්, evaluation) ඇතුළත්, ඔබේම වියදමින් සකස් කළ ලිඛිත proposal එකක් ඉදිරිපත් කරන්න.",["13.2","13.3"]],
[null,"know","If the approved proposal changes the design of part of the Permanent Works, then unless both Parties agree otherwise, you design that part and 4.1(a) to (d) apply.","අනුමත proposal එක Permanent Works කොටසක design එක වෙනස් කරනවා නම්, පාර්ශව දෙක වෙනත් දෙයකට එකඟ නොවුණොත්, ඒ කොටස ඔබ design කරනවා, 4.1(a) සිට (d) අදාළ වෙනවා.",["13.2","4.1"]],
[null,"know","Fee = 50% of [(i) the reduction in contract value, excluding 13.6 and 13.7 adjustments, minus (ii) any reduction in value to the Employer from lower quality, life or operating efficiency]. If (i) is less than (ii), there is no fee. The Engineer agrees or determines it under 3.4.","Fee = [(i) 13.6 සහ 13.7 adjustments නැතිව contract value එකේ අඩු වීම, අඩු කළ (ii) අඩු quality, ආයු කාලය හෝ ක්‍රියාකාරී කාර්යක්ෂමතාව නිසා Employer ට වටිනාකමේ අඩු වීම] × 50%. (i) එක (ii) ට වඩා අඩු නම් fee එකක් නැහැ. Engineer 3.4 යටතේ එය එකඟ කරනවා හෝ තීරණය කරනවා.",["13.2","3.4"]]],
en:{E:["N"],C:["N"],P:["N"],x:[["Value engineering fee of 50% of the net saving, if the approved design change reduces the contract value (13.2)","අනුමත design වෙනස contract value එක අඩු කරනවා නම්, ශුද්ධ ඉතිරියෙන් 50%ක value engineering fee එක (13.2)"]]}},

{i:"V8",c:"var",r:"B",t:["Using a Provisional Sum","Provisional Sum එකක් භාවිත කිරීම"],
m:["A Provisional Sum is used only as the Engineer instructs, and only the instructed amounts are paid. The Contract Price is adjusted accordingly.","Provisional Sum එකක් භාවිත කරන්නේ Engineer instruct කරන පරිදි පමණයි, instruct කළ මුදල් පමණයි ගෙවන්නේ. Contract Price එක ඒ අනුව adjust කරනවා."],
s:[[null,"know","Each Provisional Sum is used, in whole or in part, only as the Engineer instructs, and you are paid only the amounts the Engineer instructed.","හැම Provisional Sum එකක්ම සම්පූර්ණයෙන් හෝ කොටසක් ලෙස Engineer instruct කරන පරිදි පමණයි භාවිත කරන්නේ, Engineer instruct කළ මුදල් පමණයි ඔබට ගෙවන්නේ.",["13.4"]],
[null,"know","The Engineer may instruct: (a) work by you, valued under the Variation procedure; and/or (b) Plant, Materials or services bought by you (from a nominated subcontractor or otherwise), paid at the actual amount plus an overhead and profit percentage from the relevant Schedule, or if none, from the Contract Data (usually 10%).","Engineer ට instruct කරන්න පුළුවන්: (a) Variation ක්‍රියාවලිය යටතේ value කරන, ඔබ කරන වැඩ; සහ/හෝ (b) ඔබ (nominated subcontractor ගෙන් හෝ වෙනත් ලෙස) මිලදී ගන්න Plant, Materials හෝ services; ඒවාට සැබෑ මුදල + අදාළ Schedule එකේ, නැත්නම් Contract Data එකේ (සාමාන්‍යයෙන් 10%) overhead සහ profit ප්‍රතිශතයක් ගෙවනවා.",["13.4","CD 13.4","5.1"]],
[null,"do","When the Engineer asks, produce quotations, invoices, vouchers and accounts or receipts as proof.","Engineer ඉල්ලුවාම, සාක්ෂි ලෙස quotations, invoices, vouchers සහ accounts හෝ receipts ඉදිරිපත් කරන්න.",["13.4"]]]},

{i:"V9",c:"var",r:"C",t:["We were told to do work on a dayworks basis","Dayworks ක්‍රමයට වැඩක් කරන්න instruct කළා"],
m:["For minor or incidental work, the Engineer may instruct a Variation to be done on dayworks, paid by the resources actually used at the rates in the Dayworks Schedule. This applies only if the Contract includes a Dayworks Schedule.","කුඩා හෝ අමතර වැඩ සඳහා, Dayworks Schedule එකේ rates වලින්, සැබෑවටම භාවිත කළ සම්පත් අනුව ගෙවන dayworks ක්‍රමයට Variation එකක් කරන්න Engineer ට instruct කරන්න පුළුවන්. මෙය අදාළ වන්නේ Contract එකේ Dayworks Schedule එකක් තියෙනවා නම් පමණයි."],
s:[[null,"know","This applies only if the Contract includes a Dayworks Schedule.","Contract එකේ Dayworks Schedule එකක් තියෙනවා නම් පමණයි මෙය අදාළ වන්නේ.",["13.5"]],
[null,"do","Before ordering Goods for the work, submit quotations to the Engineer. When applying for payment, submit invoices, vouchers and accounts or receipts for the Goods.","වැඩ සඳහා Goods order කරන්න කලින් quotations Engineer ට දෙන්න. ගෙවීමට ඉල්ලුම් කරද්දී Goods සඳහා invoices, vouchers සහ accounts හෝ receipts දෙන්න.",["13.5"]],
[null,"do","Each day, give the Engineer accurate statements in duplicate of the resources used on the previous day's work: (a) names, occupations and time of personnel; (b) identification, type and time of equipment and Temporary Works; (c) quantities and types of Plant and Materials used (except items the Schedule says are not payable).","හැම දවසකම, පෙර දවසේ වැඩට භාවිත කළ සම්පත් ගැන නිවැරදි statements දෙකක් Engineer ට දෙන්න: (a) personnel ගේ නම්, රැකියා සහ කාලය; (b) equipment සහ Temporary Works වල හඳුනාගැනීම, වර්ගය සහ කාලය; (c) භාවිත කළ Plant සහ Materials වල ප්‍රමාණ සහ වර්ග (Schedule එකේ ගෙවීම් නැති බව කියන items හැර).",["13.5"]],
[null,"know","The Engineer signs and returns one copy if it is correct or agreed. Then submit priced statements before including them in your next Statement. Dayworks are not subject to price adjustment.","නිවැරදි හෝ එකඟ වූ විට Engineer එක් copy එකක් sign කරලා ආපසු දෙනවා. ඉන් පසු ඊළඟ Statement එකට ඇතුළත් කරන්න කලින් priced statements දෙන්න. Dayworks price adjustment වලට යටත් නැහැ.",["13.5","14.3","13.7"]]],
k:["Signed daily dayworks sheets, quotations, invoices","Sign කළ දිනපතා dayworks sheets, quotations, invoices"]},

{i:"V10",c:"var",r:"C",t:["Joint measurement and measurement records","Joint measurement සහ measurement records"],
m:["The Works are measured and valued under Clause 12. If you do not attend a measurement, or do not object to the records in time, the Engineer's figures are accepted as accurate.","Works measure කරලා value කරන්නේ Clause 12 යටතේ. Measurement එකකට නොගියොත්, හෝ නියමිත කාලයට records වලට විරුද්ධ නොවුණොත්, Engineer ගේ ගණන් නිවැරදි ලෙස පිළිගන්නවා."],
d:[["a","Date we were asked to examine the records","Records පරීක්ෂා කරන්න අපෙන් ඉල්ලපු දිනය"]],
s:[[null,"do","When given reasonable notice of a measurement, your representative must promptly attend (or send another qualified representative) and give any particulars requested. If no one attends, the Engineer's measurement is accepted as accurate.","Measurement එකක් ගැන සාධාරණ notice එකක් ලැබුණාම, ඔබේ නියෝජිතයා ඉක්මනින් පැමිණිය යුතුයි (හෝ වෙනත් සුදුසුකම් ඇති නියෝජිතයෙක් යැවිය යුතුයි), ඉල්ලන විස්තර දිය යුතුයි. කවුරුත් නොපැමිණියොත් Engineer ගේ measurement එක නිවැරදි ලෙස පිළිගන්නවා.",["12.1"]],
[null,"do","When Permanent Works are measured from records, the Engineer prepares them. When asked, attend to examine and agree them, and sign when agreed. If you do not attend, they are accepted as accurate.","Permanent Works records වලින් measure කරනවා නම් Engineer ඒවා සකස් කරනවා. ඉල්ලුවාම ඒවා පරීක්ෂා කරලා එකඟ වෙන්න පැමිණෙන්න, එකඟ වුණාම sign කරන්න. නොපැමිණියොත් ඒවා නිවැරදි ලෙස පිළිගන්නවා.",["12.1"]],
["a+14:L","warn","If you disagree with the records, give the Engineer notice of where they are inaccurate by this date. Otherwise they are accepted as accurate. The Engineer then reviews and confirms or varies them.","Records වලට එකඟ නැත්නම්, ඒවා වැරදි තැන් ගැන මේ දිනය වෙද්දී Engineer ට notice දෙන්න. නැත්නම් ඒවා නිවැරදි ලෙස පිළිගන්නවා. ඉන් පසු Engineer ඒවා සමාලෝචනය කරලා confirm හෝ වෙනස් කරනවා.",["12.1"]],
[null,"know","Unless the Contract says otherwise, measure the net actual quantity of each item of Permanent Works, using the Standard Method of Measurement stated in the Contract Data (the one the BOQ was prepared under).","Contract එකේ වෙනත් දෙයක් නැත්නම්, Contract Data එකේ සඳහන් (BOQ එක සකස් කළ) Standard Method of Measurement එක භාවිත කරලා, Permanent Works වල හැම item එකකම net actual quantity එක measure කරන්න.",["12.2","CD 12.2"]]],
k:["Measurement notices, signed measurement sheets, your disagreement notices","Measurement notices, sign කළ measurement sheets, ඔබේ විරෝධතා notices"]},

{i:"V11",c:"var",r:"B",t:["Documents do not match (drawing vs specification vs BOQ)","Documents එකිනෙකට නොගැළපෙනවා (drawing vs specification vs BOQ)"],
m:["The contract documents are to be read as explaining each other. Where they conflict, 1.5 gives an order of priority, and the Engineer must issue any necessary clarification or instruction.","Contract documents එකිනෙක පැහැදිලි කරන ලෙස කියවිය යුතුයි. ඒවා ගැටෙන විට 1.5 ප්‍රමුඛතා අනුපිළිවෙලක් දෙනවා, අවශ්‍ය clarification එක හෝ instruction එක Engineer දිය යුතුයි."],
s:[[null,"know","Priority: (a) Contract Agreement; (b) Letter of Acceptance; (c) Memorandum of Understanding; (d) Form of Bid; (e) Contract Data; (f) Conditions of Contract; (g) Specifications; (h) Drawings; (i) Bills of Quantities and other schedules.","ප්‍රමුඛතාව: (a) Contract Agreement; (b) Letter of Acceptance; (c) Memorandum of Understanding; (d) Form of Bid; (e) Contract Data; (f) Conditions of Contract; (g) Specifications; (h) Drawings; (i) Bills of Quantities සහ අනෙක් schedules.",["1.5"]],

en:{E:["C",EOTC[0],EOTC[1]],C:["Y","For the extent the error could not reasonably have been discovered by an experienced contractor.","පළපුරුදු contractor කෙනෙකුට වැරැද්ද සාධාරණ ලෙස හොයාගත නොහැකි වූ ප්‍රමාණයට."],P:["Y"],v:1}},

{i:"F3",c:"site",r:"C",x:1,t:["We found fossils, coins, antiquities or other items of value","Fossils, කාසි, පුරාවස්තු හෝ වෙනත් වටිනා දේවල් හම්බ වුණා"],
m:["Fossils, coins, articles of value or antiquity, and structures or remains of geological or archaeological interest found on Site are placed under the Employer's care and authority. Report them promptly and follow the Engineer's instructions. You can claim time and Cost (not profit).","Site එකේ හම්බ වන fossils, කාසි, වටිනා හෝ පුරාණ වස්තු, සහ භූ විද්‍යාත්මක හෝ පුරාවිද්‍යාත්මක වටිනාකමක් ඇති ඉදිකිරීම් හෝ නටබුන් Employer ගේ රැකවරණයට සහ අධිකාරියට යටත් වෙනවා. ඉක්මනින් වාර්තා කරලා Engineer ගේ instructions පිළිපදින්න. කාලය සහ Cost (profit නොවේ) claim කරන්න පුළුවන්."],
d:[["a","Date we discovered the finding","හම්බ වූ දිනය"],["b","Date we became aware of delay or Cost from complying with the instructions","Instructions පිළිපැදීම නිසා ප්‍රමාදයක් හෝ Cost එකක් ගැන දැනගත් දිනය"]],
s:[["a:O","do","Promptly give notice to the Engineer, and take reasonable precautions to stop anyone removing or damaging the finding.","ඉක්මනින් Engineer ට notice දෙන්න, කිසිවෙකුට ඒක ඉවත් කරන්න හෝ හානි කරන්න නොදෙන්න සාධාරණ පූර්වාරක්ෂාවන් ගන්න.",["4.16"]],
[null,"do","Follow the Engineer's instructions for dealing with it.","ඒක හසුරුවන්න Engineer දෙන instructions පිළිපදින්න.",["4.16"]],
["b:O","do","If complying with the instructions causes you delay or Cost, give a further notice to the Engineer.","Instructions පිළිපැදීම නිසා ප්‍රමාදයක් හෝ Cost එකක් ආවොත්, Engineer ට further notice එකක් දෙන්න.",["4.16"]],
