m:["An IPC (Interim Payment Certificate) is the Engineer's certificate of the amount due on your monthly Statement. The Employer must pay within 14 days after it receives the IPC. If it pays late, financing charges (interest) are added. If it still does not pay, you can give notice and then slow down or stop work, and after a longer delay you can end the contract.","IPC (Interim Payment Certificate) කියන්නේ ඔබේ මාසික Statement එකට ගෙවිය යුතු මුදල Engineer certify කරන certificate එක. IPC එක ලැබී දින 14ක් ඇතුළත Employer ගෙවිය යුතුයි. ප්‍රමාද වී ගෙව්වොත් financing charges (පොලී) එකතු වෙනවා. තවමත් නොගෙව්වොත්, notice දීලා වැඩ අඩු කරන්න හෝ නතර කරන්න පුළුවන්, තවත් ප්‍රමාද වුණොත් contract එක අවසන් කරන්නත් පුළුවන්."],
d:[["a","Date the Employer received the IPC from the Engineer","Engineer ගෙන් Employer ට IPC එක ලැබුණු දිනය"]],
s:[["a+14:L","know","Last day for the Employer to pay the amount certified in the IPC.","IPC එකේ certify කළ මුදල Employer ගෙවිය යුතු අවසාන දිනය.",["14.6(b)"]],
["a+14:F","know","If not paid by the last day, financing charges run on the unpaid amount from this date until the day it is paid. They are compounded monthly at 1% over the lending rate of the Central Bank to commercial banks. Use the calculator below.","අවසාන දිනය වෙද්දී නොගෙව්වොත්, මේ දිනයේ සිට ගෙවන දිනය දක්වා නොගෙවූ මුදලට financing charges ගණන් වෙනවා. Central Bank එක commercial banks වලට දෙන lending rate එකට 1%ක් එකතු කළ අනුපාතයට, මාසිකව compound වෙනවා. පහළ calculator එක භාවිත කරන්න.",["14.7"]],
["a+15:F","do","From this date you may give the Employer a notice of not less than 56 days, saying that you will suspend work (or reduce the rate of work) unless and until you are paid. Say in the notice what payment you are waiting for. Send a copy to the Engineer.","මේ දිනයේ සිට, ගෙවීම ලැබෙනකම් වැඩ suspend කරනවා (හෝ වැඩ වේගය අඩු කරනවා) කියලා දින 56කට නොඅඩු notice එකක් Employer ට දෙන්න පුළුවන්. බලාපොරොත්තු වන ගෙවීම මොකක්ද කියලා notice එකේ කියන්න. Engineer ට copy එකක් යවන්න.",["16.1","1.3"]],
["a+71:F","if","If you gave that notice on the first possible day and are still not paid, this is the earliest day you may suspend or slow down work.","ඒ notice එක පුළුවන් පළමු දවසේම දීලා තවමත් ගෙවීම ලැබී නැත්නම්, වැඩ suspend කරන්න හෝ අඩු කරන්න පුළුවන් මුල්ම දිනය මෙයයි.",["16.1"]],
["a+71:F","if","If the amount is still not received (apart from deductions made under 2.4), from this date you also have the right to end the contract. The right arises because the money was not received within 56 days after the payment period ended.","මුදල තවමත් ලැබී නැත්නම් (2.4 යටතේ කළ අඩු කිරීම් හැර), මේ දිනයේ සිට contract එක අවසන් කිරීමේ අයිතියත් ඔබට ලැබෙනවා. ගෙවීමේ කාලය ඉවර වී දින 56ක් ඇතුළත මුදල නොලැබුණු නිසා මේ අයිතිය ඇති වෙනවා.",["16.2(b)","2.4"]],
["a+85:F","if","If you give the 14-day termination notice on the first possible day, this is the earliest day the termination takes effect.","දින 14ක termination notice එක පුළුවන් පළමු දවසේම දුන්නොත්, termination එක බලපැවැත්වෙන මුල්ම දිනය මෙයයි.",["16.2"]],
[null,"warn","Suspending does not take away your right to financing charges or to terminate. If you are paid before you give a termination notice, you must return to normal working as soon as reasonably practicable. If suspending causes you delay or Cost, give notice to the Engineer and claim under 19.1.","වැඩ suspend කිරීමෙන් financing charges හෝ terminate කිරීමේ අයිතිය නැති වෙන්නේ නැහැ. Termination notice එක දෙන්න කලින් ගෙවීම ලැබුණොත්, සාධාරණව හැකි ඉක්මනින් සාමාන්‍ය වැඩ නැවත පටන් ගන්න ඕනේ. Suspend කිරීම නිසා ප්‍රමාදයක් හෝ Cost එකක් ආවොත් Engineer ට notice දීලා 19.1 යටතේ claim කරන්න.",["16.1","19.1"]]],
en:{E:["C",C16[0],C16[1]],C:["C",C16[0],C16[1]],P:["C",C16[0],C16[1]],x:[["Financing charges on the late payment (14.7)","ප්‍රමාද ගෙවීමට financing charges (14.7)"]],v:1},
calc:"fin",k:["Proof of the date the Employer received the IPC, reminder letters, bank statements","Employer ට IPC එක ලැබුණු දිනයේ සාක්ෂි, reminder letters, bank statements"],
n:{f:"C",to:"E",cl:["14.6(b)","14.7","16.1"],sub:"Notice under Sub-Clause 16.1 – non-payment of Interim Payment Certificate No. __",b:["The amount certified in Interim Payment Certificate No. __ (Rs. __), which you received on __, has not been paid within the period stated in Sub-Clause 14.6(b).","We are entitled to financing charges on the unpaid amount under Sub-Clause 14.7.","We give notice under Sub-Clause 16.1 that, unless and until we receive payment of this amount, we will suspend work (or reduce the rate of work) after the expiry of not less than 56 days from the date of this notice."],from:"a+15"}},

{i:"P2",c:"pay",r:"C",t:["The Engineer has not issued the payment certificate (IPC)","Engineer payment certificate (IPC) එක නිකුත් කරලා නැහැ"],
m:["After receiving your Statement and supporting documents, the Engineer has 21 days to issue the IPC to the Employer. If the Engineer is late, the payment is still treated as due from the normal date, and you get similar rights to those for late payment.","ඔබේ Statement එක සහ supporting documents ලැබුණාම, IPC එක Employer ට නිකුත් කරන්න Engineer ට දින 21ක් තියෙනවා. Engineer ප්‍රමාද වුණත්, ගෙවීම සාමාන්‍ය දිනයේ සිටම ගෙවිය යුතු ලෙස සැලකෙනවා, ප්‍රමාද ගෙවීමකට වගේම අයිතිවාසිකම් ඔබට ලැබෙනවා."],
d:[["a","Date the Engineer received our Statement and supporting documents","අපේ Statement එක සහ supporting documents Engineer ට ලැබුණු දිනය"]],
q:[["Has the Employer received and approved the Performance Security?","Employer ට Performance Security එක ලැබිලා approve කරලද?","","","Nothing is certified or paid until the Employer has received and approved the Performance Security.","Employer ට Performance Security එක ලැබිලා approve කරනකම් කිසිම මුදලක් certify කරන්නේ හෝ ගෙවන්නේ නැහැ."]],
s:[["a+21:L","know","Last day for the Engineer to issue the IPC to the Employer.","Engineer IPC එක Employer ට නිකුත් කළ යුතු අවසාන දිනය.",["14.5"]],
["a+22:F","do","From this date you may give the Employer a notice of not less than 56 days that you will suspend work (or reduce the rate of work) unless and until the Payment Certificate is issued. Send a copy to the Engineer.","මේ දිනයේ සිට, Payment Certificate එක නිකුත් කරනකම් වැඩ suspend කරනවා (හෝ අඩු කරනවා) කියලා දින 56කට නොඅඩු notice එකක් Employer ට දෙන්න පුළුවන්. Engineer ට copy එකක් යවන්න.",["16.1","1.3"]],
["a+35:F","know","Financing charges run from the date for payment under 14.6, even if the IPC is issued late. This date assumes the IPC should have reached the Employer on day 21 and been paid 14 days later. This is our reading of 14.7; the Engineer may see it differently.","IPC එක ප්‍රමාද වී නිකුත් කළත්, financing charges ගණන් වෙන්නේ 14.6 යටතේ ගෙවිය යුතු දිනයේ සිට. මේ දිනය ගණනය කළේ IPC එක 21 වන දිනයේදී Employer ට ලැබිය යුතුව තිබී, දින 14කින් ගෙවිය යුතු යැයි උපකල්පනය කරලා. මෙය 14.7 පිළිබඳ අපේ අර්ථ නිරූපණයයි; Engineer වෙනස් අදහසක් ගන්න පුළුවන්.",["14.7","14.6(b)"]],
["a+57:F","if","If the Engineer has still not issued the IPC, from this date you have the right to end the contract (the Engineer failed within 56 days after receiving your Statement). Termination needs 14 days' notice to the Employer.","Engineer තවමත් IPC එක නිකුත් කර නැත්නම්, මේ දිනයේ සිට contract එක අවසන් කිරීමේ අයිතිය ලැබෙනවා (Statement එක ලැබී දින 56ක් ඇතුළත Engineer එය නොකළ නිසා). Termination එකට Employer ට දින 14ක notice එකක් ඕනේ.",["16.2(a)","16.2"]],
[null,"know","If the amount due is below the minimum IPC amount in the Contract Data, the Engineer does not have to issue an IPC before handover, but must give you notice.","ගෙවිය යුතු මුදල Contract Data එකේ minimum IPC amount එකට වඩා අඩු නම්, handover එකට කලින් Engineer ට IPC එකක් නිකුත් කරන්න අවශ්‍ය නැහැ, හැබැයි ඔබට notice දෙන්න ඕනේ.",["14.5"]]],
en:{E:["C",C16[0],C16[1]],C:["C",C16[0],C16[1]],P:["C",C16[0],C16[1]],x:[["Financing charges from the date payment should have been made (14.7)","ගෙවිය යුතුව තිබූ දිනයේ සිට financing charges (14.7)"]],v:1},
n:{f:"C",to:"EN",cl:["14.5"],sub:"Failure to issue Interim Payment Certificate – Statement No. __",b:["Our Statement No. __ with supporting documents was received by you on __.","Under Sub-Clause 14.5 the Interim Payment Certificate should have been issued within 21 days after receiving it. It has not been issued. Please issue it without further delay."],from:"a+22"}},

{i:"P3",c:"pay",r:"C",t:["How do we prepare the monthly bill (Statement)?","මාසික bill එක (Statement) හදන්නේ කොහොමද?"],
m:["Each month you send the Engineer a Statement showing what you consider is due. The Engineer checks it and issues the IPC within 21 days. The items must be listed in a fixed order.","හැම මාසෙම, ඔබට ලැබිය යුතු යැයි සලකන මුදල පෙන්වන Statement එකක් Engineer ට යවනවා. Engineer ඒක check කරලා දින 21ක් ඇතුළත IPC එක නිකුත් කරනවා. Items නියමිත අනුපිළිවෙලකට දාන්න ඕනේ."],
s:[[null,"do","After the end of each month, send 3 copies of the Statement to the Engineer, in the form the Engineer approved, with supporting documents including the monthly progress report.","හැම මාසයක්ම අවසන් වුණාට පස්සේ, Engineer approve කළ form එකෙන් Statement copies 3ක්, මාසික progress report එක ඇතුළු supporting documents එක්ක Engineer ට යවන්න.",["14.3","4.14"]],
[null,"do","List the items in this order: (a) estimated value of work done and Contractor's Documents produced to the end of the month, including Variations; (b) additions or deductions for changes in legislation (13.6) and in cost (13.7); (c) retention: the percentage in the Contract Data applied to (a)+(b), until the limit in the Contract Data is reached; (d) advance payment and its repayment; (e) Plant and Materials on Site; (f) other amounts due, including claims under Clause 19; (g) minus all amounts certified in earlier Payment Certificates.","Items මේ අනුපිළිවෙලට දාන්න: (a) මාසය අවසානය දක්වා කළ වැඩ සහ හදපු Contractor's Documents වල ඇස්තමේන්තු වටිනාකම, Variations එක්ක; (b) නීති වෙනස්වීම් (13.6) සහ cost වෙනස්වීම් (13.7) සඳහා එකතු කිරීම් හෝ අඩු කිරීම්; (c) retention: Contract Data එකේ ප්‍රතිශතය (a)+(b) එකට යොදලා, Contract Data එකේ සීමාවට එනකම්; (d) advance payment සහ එහි ආපසු ගෙවීම; (e) Site එකේ Plant සහ Materials; (f) Clause 19 claims ඇතුළු අනෙක් මුදල්; (g) පෙර Payment Certificates වල certify කළ සියලු මුදල් අඩු කිරීම.",["14.3"]],
[null,"know","Plant and Materials delivered to Site for the Permanent Works are included at 80% of their invoiced value.","Permanent Works සඳහා Site එකට ගෙනා Plant සහ Materials, ඒවායේ invoice value එකෙන් 80%කට ඇතුළත් කරනවා.",["14.4"]],
[null,"know","The first advance payment instalment is also certified through a Statement, once the Employer has the Performance Security and the advance payment guarantee.","Employer ට Performance Security එක සහ advance payment guarantee එක ලැබුණාම, advance payment එකේ පළමු කොටසත් Statement එකක් හරහා certify කරනවා.",["14.2"]]]},

{i:"P4",c:"pay",r:"C",t:["Money was cut or held back from our payment certificate","අපේ payment certificate එකෙන් මුදලක් කපලා හෝ රඳවාගෙන"],
m:["An IPC can be reduced only for a few reasons stated in the contract. The Employer's own claims can be deducted only after the notice process in 2.4. Anything else can be challenged.","IPC එකක් අඩු කරන්න පුළුවන් contract එකේ සඳහන් හේතු කිහිපයකට පමණයි. Employer ගේ claims අඩු කරන්න පුළුවන් 2.4 හි notice ක්‍රියාවලියෙන් පසු පමණයි. අනෙක් ඕනෑම දෙයකට විරුද්ධ වෙන්න පුළුවන්."],
s:[[null,"know","An IPC cannot be withheld except: (a) if something supplied or work done does not meet the contract, the cost of fixing or replacing it may be held back until it is fixed; (b) if you are failing to do work or an obligation and the Engineer told you so, its value may be held back until it is done.","මේවා හැර IPC එකක් රඳවාගන්න බැහැ: (a) සපයපු දෙයක් හෝ කළ වැඩක් contract එකට අනුකූල නැත්නම්, එය හදන හෝ මාරු කරන වියදම හදනකම් රඳවාගන්න පුළුවන්; (b) ඔබ වැඩක් හෝ වගකීමක් නොකරන බව Engineer දැනුම් දීලා නම්, එය කරනකම් එහි වටිනාකම රඳවාගන්න පුළුවන්.",["14.5"]],
[null,"know","Before handover, the Engineer need not issue an IPC below the minimum amount in the Contract Data, but must give you notice.","Handover එකට කලින්, Contract Data එකේ minimum amount එකට අඩු IPC එකක් නිකුත් කරන්න Engineer ට අවශ්‍ය නැහැ, හැබැයි ඔබට notice දෙන්න ඕනේ.",["14.5"]],
[null,"know","The Employer may deduct its own claims only after giving notice and particulars under 2.4 and after the Engineer agrees or determines the amount under 3.4.","2.4 යටතේ notice සහ විස්තර දීලා, 3.4 යටතේ Engineer මුදල එකඟ කරලා හෝ තීරණය කරලා පමණයි Employer ට තමන්ගේ claims අඩු කරන්න පුළුවන්.",["2.4","3.4"]],
[null,"do","Ask the Engineer in writing for the reason and supporting particulars for each cut. If you still disagree, ask for a determination under 3.4, and then use the dispute process.","හැම අඩු කිරීමකටම හේතුව සහ විස්තර Engineer ගෙන් ලිඛිතව ඉල්ලන්න. තවමත් එකඟ නැත්නම් 3.4 යටතේ determination එකක් ඉල්ලලා, පසුව dispute ක්‍රියාවලිය භාවිත කරන්න.",["3.4","19.2"]],
[null,"know","The Engineer may correct earlier certificates in a later one. A Payment Certificate does not mean the Engineer has accepted the work.","Engineer ට පෙර certificates ඊළඟ එකකදී නිවැරදි කරන්න පුළුවන්. Payment Certificate එකක් කියන්නේ Engineer වැඩ පිළිගත්තා කියන එක නොවේ.",["14.5"]]],
k:["Measurement records, Engineer's notices, letters","Measurement records, Engineer ගේ notices, letters"]},

{i:"P5",c:"pay",r:"C",t:["We brought materials to site. Do we get paid before they are used?","Site එකට materials ගෙනාවා. භාවිත කරන්න කලින් ගෙවීමක් ලැබෙනවද?"],
m:["Yes. Plant and Materials delivered to Site for the Permanent Works are partly paid in the monthly certificate. This helps your cash flow.","ඔව්. Permanent Works සඳහා Site එකට ගෙනා Plant සහ Materials වලට මාසික certificate එකේ කොටසක් ගෙවනවා. මේක ඔබේ cash flow එකට උදව් වෙනවා."],
s:[[null,"know","The IPC includes 80% of the invoiced value of Plant and Materials delivered to the Site for incorporation in the Permanent Works.","Permanent Works වලට ඇතුළත් කරන්න Site එකට ගෙනා Plant සහ Materials වල invoice value එකෙන් 80%ක් IPC එකට ඇතුළත් කරනවා.",["14.4","14.3"]],
[null,"warn","They become the Employer's property when delivered to the Site (or earlier, if you become entitled to their value during a suspension under 8.10).","Site එකට ගෙනාවාම (හෝ 8.10 යටතේ suspension එකකදී ඒවායේ වටිනාකමට ඔබට අයිතියක් ලැබුණොත් ඊට කලින්) ඒවා Employer ගේ දේපළ වෙනවා.",["7.6","8.10"]],
[null,"know","For price adjustment, the current valuation also includes 80% of the cost of materials delivered to site but not yet used.","Price adjustment සඳහා current valuation එකටත් site එකට ගෙනා, තවම භාවිත නොකළ materials වල වියදමෙන් 80%ක් ඇතුළත්.",["13.7"]]]},

{i:"P6",c:"pay",r:"C",t:["Retention money is not being released","Retention money නිදහස් කරන්නේ නැහැ"],
m:["Retention is money kept back from each interim payment. Half is paid back when the Taking-Over Certificate is issued for the Works, and the other half after the Defects Notification Period, once the Engineer certifies that the notified defects are fixed.","Retention කියන්නේ හැම interim ගෙවීමකින්ම රඳවාගන්නා මුදල. Works වලට Taking-Over Certificate එක නිකුත් කළාම භාගයක් ආපසු ගෙවනවා, ඉතිරි භාගය Defects Notification Period එකෙන් පසු, දන්වපු defects හැදූ බව Engineer certify කළාම."],
d:[["a","Date of the Taking-Over Certificate for the Works","Works වල Taking-Over Certificate දිනය"],["b","Date the Defects Notification Period ends","Defects Notification Period එක අවසන් වන දිනය"]],
s:[["a:O","know","From the Taking-Over Certificate for the Works, one half of the total retention should be certified for repayment.","Works වල Taking-Over Certificate එකෙන් පසු, මුළු retention එකෙන් භාගයක් ආපසු ගෙවීමට certify කළ යුතුයි.",["14.8"]],
["b:O","know","The second half is due when the Defects Notification Period has passed and the Engineer has certified that all defects notified before its end have been corrected.","Defects Notification Period එක ඉවර වෙලා, ඊට කලින් දන්වපු සියලු defects නිවැරදි කළ බව Engineer certify කළාම දෙවන භාගය ගෙවිය යුතුයි.",["14.8"]],
[null,"know","If defect work is still outstanding, the Engineer may hold back the estimated cost of that work until it is done. Adjustments under 13.6 and 13.7 are not counted when working out the halves.","Defect වැඩ තවම ඉතිරි නම්, එය කරනකම් ඒ වැඩේ ඇස්තමේන්තු වියදම Engineer ට රඳවාගන්න පුළුවන්. භාග ගණනය කිරීමේදී 13.6 සහ 13.7 adjustments ගණන් ගන්නේ නැහැ.",["14.8"]],
[null,"if","If the Contract Data includes the alternative method: once retention reaches its limit, you may give an unconditional guarantee for the full retention, valid until 28 days after the end of the Defects Notification Period, and receive the full retention money.","Contract Data එකේ විකල්ප ක්‍රමය තියෙනවා නම්: retention එක සීමාවට ආවාම, Defects Notification Period එක ඉවර වී දින 28ක් දක්වා valid, සම්පූර්ණ retention එකට unconditional guarantee එකක් දීලා සම්පූර්ණ retention මුදල ගන්න පුළුවන්.",["CD 14.8"]]],
n:{f:"C",to:"EN",cl:["14.8"],sub:"Release of Retention Money",b:["The Taking-Over Certificate for the Works was issued on __.","We request certification of one half of the Retention Money in accordance with Sub-Clause 14.8."]}},

{i:"P7",c:"pay",r:"B",t:["How is the advance payment repaid?","Advance payment එක ආපසු ගෙවන්නේ කොහොමද?"],
m:["The advance payment is an interest-free loan for mobilization (excluding provisional sums and contingencies). It is repaid through percentage deductions from the interim certificates.","Advance payment එක කියන්නේ mobilization සඳහා දෙන පොලී රහිත ණයක් (provisional sums සහ contingencies නැතිව). එය interim certificates වලින් ප්‍රතිශත අඩු කිරීම් හරහා ආපසු ගෙවනවා."],
s:[[null,"know","Deductions start from the IPC issued after the advance was paid, in proportionate amounts.","Advance එක ගෙවුවාට පස්සේ නිකුත් කරන IPC එකේ සිට, අනුපාතික මුදල් වශයෙන් අඩු කිරීම් පටන් ගන්නවා.",["14.2"]],
[null,"know","It must be fully repaid when the total certified value of the Works reaches 90% of the Initial Contract Price less provisional sums.","Works වල මුළු certify කළ වටිනාකම, provisional sums අඩු කළ Initial Contract Price එකෙන් 90%ට එද්දී සම්පූර්ණයෙන් ආපසු ගෙවී තිබිය යුතුයි.",["14.2"]],
[null,"warn","Keep the advance payment guarantee valid until the advance is repaid (its amount may reduce as you repay). If it is not repaid by 28 days before the guarantee's expiry date, extend the guarantee.","Advance එක ගෙවී ඉවර වෙනකම් advance payment guarantee එක valid කරලා තියාගන්න (ආපසු ගෙවන විට එහි මුදල අඩු වෙන්න පුළුවන්). Guarantee එකේ expiry දිනයට දින 28කට කලින් ගෙවී ඉවර නැත්නම් guarantee එක extend කරන්න.",["14.2"]],
[null,"warn","If any balance is unpaid before the Taking-Over Certificate, or before termination under Clause 15, 16 or 20, the whole balance becomes due immediately.","Taking-Over Certificate එකට කලින්, හෝ Clause 15, 16 හෝ 20 යටතේ termination එකකට කලින් ඉතිරියක් තියෙනවා නම්, මුළු ඉතිරියම වහාම ගෙවිය යුතු වෙනවා.",["14.2"]]]},

{i:"P8",c:"pay",r:"C",t:["After handover: the Statement at Completion","Handover එකෙන් පස්සේ: Statement at Completion"],
m:["After receiving the Taking-Over Certificate you must send a statement of everything you consider due. A claim left out of this statement and the Final Statement may be lost, so be complete.","Taking-Over Certificate එක ලැබුණාම, ඔබට ලැබිය යුතු යැයි සලකන සියල්ල ඇතුළත් statement එකක් යවන්න ඕනේ. මේ statement එකෙන් සහ Final Statement එකෙන් අතහැරුණු claim එකක් අහිමි විය හැකියි, ඒ නිසා සම්පූර්ණ කරන්න."],
d:[["a","Date we received the Taking-Over Certificate for the Works","Works වල Taking-Over Certificate එක ලැබුණු දිනය"]],
s:[["a+84:L","do","Send the Engineer 3 copies of the Statement at Completion with supporting documents, showing: (a) the value of all work done up to the date in the Taking-Over Certificate; (b) any further sums you consider due; (c) estimates of other amounts you consider will become due, shown separately.","Supporting documents සමඟ Statement at Completion copies 3ක් Engineer ට යවන්න; එහි පෙන්වන්න: (a) Taking-Over Certificate එකේ දිනය දක්වා කළ සියලු වැඩ වල වටිනාකම; (b) ඔබට ලැබිය යුතු යැයි සලකන අමතර මුදල්; (c) ඉදිරියට ලැබිය යුතු යැයි සලකන අනෙක් මුදල් වල ඇස්තමේන්තු, වෙනම.",["14.9"]],
[null,"know","The Engineer then certifies it in the same way as an IPC.","ඉන් පසු Engineer එය IPC එකක් වගේම certify කරනවා.",["14.9","14.5"]],
[null,"warn","Very important: for matters that arose before the Taking-Over Certificate, the Employer is not liable unless you included an amount for them expressly in this Statement at Completion and also in the Final Statement.","ඉතා වැදගත්: Taking-Over Certificate එකට කලින් ඇති වූ කරුණු වලට, ඒවා සඳහා මුදලක් මේ Statement at Completion එකේත් Final Statement එකේත් පැහැදිලිව ඇතුළත් කළේ නැත්නම් Employer වගකියන්නේ නැහැ.",["14.13"]]],
k:["List of pending claims and variations","Pending claims සහ variations ලැයිස්තුව"]},

{i:"P9",c:"pay",r:"C",t:["Final account and Final Payment Certificate","Final account සහ Final Payment Certificate"],
m:["After the Performance Certificate, you send a draft final statement, agree the Final Statement with the Engineer and give a written discharge. The Engineer then issues the Final Payment Certificate and the Employer makes the last payment.","Performance Certificate එකෙන් පසු, draft final statement එකක් යවලා, Engineer එක්ක Final Statement එක එකඟ කරලා, ලිඛිත discharge එකක් දෙනවා. ඉන් පසු Engineer Final Payment Certificate එක නිකුත් කරනවා, Employer අවසාන ගෙවීම කරනවා."],
d:[["a","Date we received the Performance Certificate","Performance Certificate එක ලැබුණු දිනය"]],
s:[["a+56:L","do","Send the Engineer 6 copies of a draft final statement with supporting documents, in the form the Engineer approved, showing the value of all work done and any further sums you consider due.","Engineer approve කළ form එකෙන්, supporting documents සමඟ draft final statement එකේ copies 6ක් Engineer ට යවන්න; කළ සියලු වැඩ වල වටිනාකම සහ ලැබිය යුතු යැයි සලකන අමතර මුදල් පෙන්වන්න.",["14.10"]],
[null,"do","Give any further information the Engineer reasonably asks for, agree the changes, then send the agreed Final Statement with a written discharge. The discharge may say it takes effect when you have received the Performance Security and the balance due.","Engineer සාධාරණව ඉල්ලන අමතර තොරතුරු දීලා, වෙනස්කම් එකඟ කරලා, එකඟ වූ Final Statement එක ලිඛිත discharge එකක් සමඟ යවන්න. Performance Security එක සහ ඉතිරි මුදල ලැබුණාම බලපැවැත්වෙන බව discharge එකේ කියන්න පුළුවන්.",["14.10","14.11"]],
[null,"know","The Engineer issues the Final Payment Certificate within 28 days after receiving the Final Statement and discharge. The Employer must pay within 56 days after receiving it.","Final Statement එක සහ discharge එක ලැබී දින 28ක් ඇතුළත Engineer Final Payment Certificate එක නිකුත් කරනවා. එය ලැබී දින 56ක් ඇතුළත Employer ගෙවිය යුතුයි.",["14.12","14.6(c)"]],
[null,"if","If a dispute remains, the Engineer issues an IPC for the agreed parts. After the dispute is resolved, you send the Final Statement to the Employer, with a copy to the Engineer.","Dispute එකක් ඉතිරි නම්, එකඟ වූ කොටස් වලට Engineer IPC එකක් නිකුත් කරනවා. Dispute එක විසඳුණාම Final Statement එක Employer ට, Engineer ට copy එකක් සමඟ යවනවා.",["14.10","19.2"]],
[null,"warn","If you do not apply, the Engineer will ask you to. If you still do not apply within 28 days, the Engineer issues the Final Payment Certificate for the amount the Engineer determines.","ඔබ apply නොකළොත් Engineer ඉල්ලනවා. තවමත් දින 28ක් ඇතුළත apply නොකළොත්, Engineer තමන් තීරණය කරන මුදලට Final Payment Certificate එක නිකුත් කරනවා.",["14.12"]]]},

{i:"P10",c:"pay",r:"B",t:["Price changes (price fluctuation / price adjustment formula)","මිල වෙනස්වීම් (price fluctuation / price adjustment formula)"],
m:["If the Contract Data says the contract is subject to price adjustment, a formula adjusts each payment for rises or falls in the cost of labour, materials, plant and other inputs, using the monthly indices published by ICTAD (now CIDA). No other adjustment for price fluctuation is made.","Contract Data එකේ price adjustment අදාළ බව කියලා තියෙනවා නම්, labour, materials, plant සහ අනෙක් inputs වල මිල ඉහළ හෝ පහළ යාමට, ICTAD (දැන් CIDA) ප්‍රකාශයට පත් කරන මාසික indices භාවිත කරලා formula එකකින් හැම ගෙවීමක්ම adjust කරනවා. මිල වෙනස්වීම් සඳහා වෙනත් adjustment එකක් කරන්නේ නැහැ."],
s:[[null,"do","Check the Contract Data first: the formula applies only if the contract is stated to be subject to price adjustment.","මුලින්ම Contract Data එක check කරන්න: price adjustment අදාළ බව කියලා තියෙනවා නම් පමණයි formula එක අදාළ වෙන්නේ.",["13.7","ITB 14"]],
[null,"know","Formula: F = 0.966 × (V − Vna) ÷ 100 × Σ Px × (current index − base index) ÷ base index. Px are the input percentages in the Contract Data; they total 90.","Formula: F = 0.966 × (V − Vna) ÷ 100 × Σ Px × (current index − base index) ÷ base index. Px කියන්නේ Contract Data එකේ input percentages; ඒවායේ එකතුව 90යි.",["13.7","CD 13.7"]],
[null,"know","Base indices: those prevailing one month before the latest date for submission of bids. Current indices: for the first interim bill, the first month after commencement; for later bills and the final bill, the calendar month one month after the previous valuation.","Base indices: bids දිය යුතු අවසාන දිනයට මාසයකට කලින් තිබූ indices. Current indices: පළමු interim bill එකට commencement එකෙන් පසු පළමු මාසය; පසු bills සහ final bill එකට, පෙර valuation එකෙන් මාසයකට පසු calendar මාසය.",["13.7"]],
[null,"know","V (current valuation) is the gross value of work done in the period, plus 80% of the cost of materials delivered to site but not used. Vna (not adjusted): BOQ items listed in the Contract Data, extra work valued at prices at the time of execution, and dayworks.","V (current valuation) කියන්නේ කාලය තුළ කළ වැඩ වල gross වටිනාකම, site එකට ගෙනා භාවිත නොකළ materials වල වියදමෙන් 80%ත් එක්ක. Vna (adjust නොකරන): Contract Data එකේ ලැයිස්තුගත BOQ items, execute කරන වෙලාවේ මිල වලින් value කළ අමතර වැඩ, සහ dayworks.",["13.7"]],
[null,"warn","For work done after the completion date, the current indices at the due completion date are used. The Engineer may adjust the weightings if they become unreasonable because of varied or additional work.","Completion date එකෙන් පස්සේ කරන වැඩ වලට, completion date එකේ තිබූ current indices භාවිත කරනවා. Variation හෝ අමතර වැඩ නිසා weightings අසාධාරණ වුණොත් Engineer ට ඒවා adjust කරන්න පුළුවන්.",["13.7"]]],
calc:"pf"},

{i:"P11",c:"pay",r:"C",t:["A tax or law changed (VAT, SSCL, import duty, rationing)","Tax එකක් හෝ නීතියක් වෙනස් වුණා (VAT, SSCL, import duty, rationing)"],
m:["Your price is based on the laws 28 days before the bid closing date. If a later change in Sri Lankan law about taxes, duties, import or export levies, or rationing, beyond your control, materially affects your work, the Contract Price is adjusted up or down, and you may get extra time.","ඔබේ මිල පදනම් වෙන්නේ bid closing දිනයට දින 28කට කලින් තිබූ නීති මත. පසුව ඔබේ පාලනයෙන් පිටත, taxes, duties, import/export levies හෝ rationing ගැන ලංකාවේ නීතියක වෙනසක් ඔබේ වැඩට සැලකිය යුතු ලෙස බලපෑවොත්, Contract Price එක ඉහළට හෝ පහළට adjust වෙනවා, අමතර කාලයත් ලැබිය හැකියි."],
d:[["a","Date we became aware of the change","වෙනස්කම ගැන දැනගත් දිනය"]],
s:[[null,"know","Only changes between 28 days before the bid closing date and the Certificate of Completion (or termination under Clause 15 or 16) count. The change must relate to taxation, rationing, duties or import/export levies, be beyond your control, and materially affect your work.","ගණන් ගන්නේ bid closing දිනයට දින 28කට කලින් සිට Certificate of Completion (හෝ Clause 15 හෝ 16 යටතේ termination) දක්වා වෙනස්කම් පමණයි. වෙනස්කම taxation, rationing, duties හෝ import/export levies වලට අදාළ විය යුතුයි, ඔබේ පාලනයෙන් පිටත විය යුතුයි, ඔබේ වැඩට සැලකිය යුතු ලෙස බලපාන්න ඕනේ.",["13.6"]],
["a+28:L","warn",N19[0],N19[1],["13.6","19.1"]],
["a+84:L","do",N19D[0],N19D[1],["19.1"]],
[null,"know","Cost already covered by the price adjustment formula (13.7) is not paid again. A decrease in cost is deducted in the same way.","Price adjustment formula (13.7) එකෙන් දැනටමත් ආවරණය වූ Cost නැවත ගෙවන්නේ නැහැ. වියදම අඩු වුණොත් එයත් එසේම අඩු කරනවා.",["13.6","13.7"]],
[null,"know","Taxes and duties at the base date are treated as included in your rates; the Contract Price is not adjusted for them except under 13.6.","Base date එකේ taxes සහ duties ඔබේ rates වලට ඇතුළත් යැයි සැලකෙනවා; 13.6 යටතේ හැර ඒවා සඳහා Contract Price එක adjust කරන්නේ නැහැ.",["14.1(b)","ITB 14"]]],
en:{E:["C","Only if the change delays completion.","වෙනස්කම completion ප්‍රමාද කරනවා නම් පමණයි."],C:["Y"],P:["N"],v:1},
k:["Gazette notifications, invoices before and after the change","Gazette notifications, වෙනස්කමට කලින් සහ පසු invoices"]},

{i:"P12",c:"pay",r:"E",t:["The Employer wants money from the Contractor, or wants to extend the defects period","Employer Contractor ගෙන් මුදලක් ඉල්ලන්න, නැත්නම් defects period එක දිගු කරන්න ඕනේ"],
m:["The Employer cannot simply cut money from payments. The Employer or Engineer must first give notice and particulars, and the Engineer must agree or determine the amount under 3.4.","Employer ට ගෙවීම් වලින් හිතුමතේ මුදල් කපන්න බැහැ. මුලින් Employer හෝ Engineer notice සහ විස්තර දිය යුතුයි, 3.4 යටතේ Engineer මුදල එකඟ කළ යුතුයි හෝ තීරණය කළ යුතුයි."],
s:[[null,"do","Give the Contractor notice as soon as practicable after becoming aware. For an extension of the Defects Notification Period, give notice before the period ends.","දැනගත් පසු සාධාරණව හැකි ඉක්මනින් Contractor ට notice දෙන්න. Defects Notification Period එක දිගු කරන්න නම්, එය ඉවර වෙන්න කලින් notice දෙන්න.",["2.4"]],
[null,"do","Give particulars: the clause or other basis of the claim, and substantiation of the amount or extension.","විස්තර දෙන්න: claim එකේ clause එක හෝ වෙනත් පදනම, සහ මුදලට හෝ extension එකට සාක්ෂි.",["2.4"]],
[null,"know","The Engineer then agrees or determines the amount (or extension) under 3.4. Only then may it be deducted in a Payment Certificate. The Employer cannot set off or deduct in any other way.","ඉන් පසු Engineer 3.4 යටතේ මුදල (හෝ extension එක) එකඟ කරනවා හෝ තීරණය කරනවා. ඊට පසු පමණයි Payment Certificate එකක අඩු කරන්න පුළුවන්. වෙනත් කිසිම ආකාරයකට Employer ට set off හෝ අඩු කරන්න බැහැ.",["2.4","3.4"]]]},

{i:"P13",c:"pay",r:"B",t:["Increasing, extending or getting back the Performance Security","Performance Security එක වැඩි කිරීම, දිගු කිරීම හෝ ආපසු ගැනීම"],
m:["The Performance Security must stay valid until the Works are completed and defects remedied. If the Contract Price grows by more than 25%, the Engineer can ask you to increase it.","Works ඉවර කරලා defects හදනකම් Performance Security එක valid විය යුතුයි. Contract Price එක 25%කට වඩා වැඩි වුණොත්, ඒක වැඩි කරන්න Engineer ට ඉල්ලන්න පුළුවන්."],
d:[["a","Expiry date written in the Performance Security","Performance Security එකේ ලියලා තියෙන expiry දිනය"]],
s:[[null,"know","When the Engineer determines additions to the Contract Price from changes in cost, changes in law or variations amounting to more than 25% of the Initial Contract Price, you must, at the Engineer's written request, promptly increase the security by an equal percentage, and again at every further 15%.","Cost වෙනස්වීම්, නීති වෙනස්වීම් හෝ variations නිසා Initial Contract Price එකෙන් 25%කට වඩා එකතු කිරීම් Engineer තීරණය කළ විට, Engineer ලිඛිතව ඉල්ලුවොත් security එක එම ප්‍රතිශතයෙන් ඉක්මනින් වැඩි කළ යුතුයි, පසුව තවත් හැම 15%කටම නැවතත්.",["4.2"]],
["a-28:L","warn","If by this date you are not yet entitled to the Performance Certificate, extend the security's validity until the Works are completed and defects remedied.","මේ දිනය වෙද්දී Performance Certificate එකට තවම හිමි නැත්නම්, Works ඉවර කරලා defects හදනකම් security එකේ validity එක දිගු කරන්න.",["4.2"]],
[null,"know","The Employer must return it within 21 days after receiving a copy of the Performance Certificate.","Performance Certificate එකේ copy එකක් ලැබී දින 21ක් ඇතුළත Employer එය ආපසු දිය යුතුයි.",["4.2"]]]},

{i:"U1",c:"susp",r:"C",t:["The Engineer suspended (stopped) the work","Engineer වැඩ suspend කළා (නතර කළා)"],
m:["The Engineer may instruct you to suspend part or all of the Works. If the cause is not your responsibility, you can claim extra time and Cost. If the suspension lasts too long, you can treat the affected part as omitted, or end the contract if the whole Works are affected.","Works වල කොටසක් හෝ සියල්ල suspend කරන්න Engineer ට instruct කරන්න පුළුවන්. හේතුව ඔබේ වගකීමක් නොවේ නම් අමතර කාලය සහ Cost claim කරන්න පුළුවන්. Suspension එක ඕනෑවට වඩා දිගු නම්, බලපෑමට ලක් වූ කොටස omit කළා ලෙස සලකන්න, සම්පූර්ණ Works වලටම බලපානවා නම් contract එක අවසන් කරන්නත් පුළුවන්."],
d:[["a","First day of the suspension","Suspension එකේ පළමු දිනය"]],
q:[["Did the Engineer notify that the cause of the suspension is your responsibility?","Suspension එකට හේතුව ඔබේ වගකීමක් බව Engineer දැනුම් දුන්නාද?","Then 8.9, 8.10 and 8.11 do not apply to that extent: no time, Cost, plant payment or prolonged-suspension rights.","එසේ නම් ඒ ප්‍රමාණයට 8.9, 8.10 සහ 8.11 අදාළ නැහැ: කාලය, Cost, plant ගෙවීම හෝ දිගු suspension අයිතිවාසිකම් නැහැ.","",""]],
s:[["a:O","do","Protect, store and secure the suspended work against deterioration, loss or damage.","Suspend කළ වැඩ දිරාපත් වීම, නැති වීම හෝ හානි වීමෙන් ආරක්ෂා කරලා, ගබඩා කරලා, secure කරන්න.",["8.8"]],
["a+28:L","warn",N19[0]+" (Counted here from the first day of the suspension; if you became aware of the delay or Cost later, count from that date.)",N19[1]+" (මෙහි ගණන් කළේ suspension එකේ පළමු දිනයේ සිට; ප්‍රමාදය හෝ Cost එක ගැන පසුව දැනගත්තා නම් ඒ දිනයේ සිට ගණන් කරන්න.)",["8.9","19.1"]],
["a+28:F","if","If work on Plant or delivery of Plant or Materials has been suspended for more than 28 days, and you have marked them as the Employer's property as the Engineer instructed, you are entitled to their value (as at the suspension date) even though they are not delivered to Site.","Plant වල වැඩ හෝ Plant/Materials delivery දින 28කට වඩා suspend වෙලා, Engineer instruct කළ පරිදි ඒවා Employer ගේ දේපළ ලෙස mark කළා නම්, Site එකට ගෙනැවිත් නැතත් ඒවායේ වටිනාකමට (suspension දිනයේ) ඔබට හිමිකමක් තියෙනවා.",["8.10","7.6"]],
["a+84:F","if","If the suspension has continued for more than 84 days, you may ask the Engineer for permission to proceed.","Suspension එක දින 84කට වඩා දිගටම පවතිනවා නම්, වැඩ කරගෙන යන්න අවසර ඉල්ලලා Engineer ට ඉල්ලීමක් කරන්න පුළුවන්.",["8.11"]],
["a+113:F","if","If you asked on the first possible day and the Engineer has not given permission within 28 days, from this date you may give notice to the Engineer treating the suspended part as an omission. If the whole Works are suspended, you may instead give notice of termination (it can take effect immediately).","පුළුවන් පළමු දවසේම ඉල්ලලා දින 28ක් ඇතුළත Engineer අවසර නොදුන්නා නම්, මේ දිනයේ සිට suspend කළ කොටස omission එකක් ලෙස සලකන බවට Engineer ට notice දෙන්න පුළුවන්. සම්පූර්ණ Works ම suspend නම්, ඒ වෙනුවට termination notice එකක් දෙන්න පුළුවන් (එය වහාම බලපැවැත්විය හැකියි).",["8.11","16.2(e)"]],
[null,"do","When permission or an instruction to proceed is given, inspect the Works, Plant and Materials jointly with the Engineer, and make good any deterioration, defect or loss that occurred during the suspension.","අවසරය හෝ ඉදිරියට යන්න instruction එක ලැබුණාම, Works, Plant සහ Materials Engineer එක්ක එකට පරීක්ෂා කරලා, suspension කාලයේ වූ දිරාපත් වීම්, defects හෝ නැති වීම් හදන්න.",["8.12"]],
[null,"know","No extra time or Cost for making good the results of your own faulty design, workmanship or materials, or of your failure to protect, store or secure the work.","ඔබේම වැරදි design, workmanship හෝ materials, හෝ වැඩ ආරක්ෂා/ගබඩා/secure කිරීමට අසමත් වීමේ ප්‍රතිඵල හදන්න අමතර කාලය හෝ Cost ලැබෙන්නේ නැහැ.",["8.9"]]],
en:{E:["C","Only if completion is or will be delayed.","Completion ප්‍රමාද වෙනවා නම් හෝ වෙයි නම් පමණයි."],C:["Y","For complying with the suspension and for resuming the work.","Suspension එක පිළිපැදීමට සහ වැඩ නැවත පටන් ගැනීමට."],P:["N"],x:[["Value of Plant and Materials not yet delivered, if suspended for more than 28 days and marked as the Employer's property (8.10)","දින 28කට වඩා suspend වෙලා Employer ගේ දේපළ ලෙස mark කළා නම්, තවම නොගෙනා Plant සහ Materials වල වටිනාකම (8.10)"]],v:1},
k:["Suspension instruction, records of protection work, idle resources, photos","Suspension instruction, ආරක්ෂා කිරීමේ වැඩ records, වැඩ නැති සම්පත්, photos"],
n:{f:"C",to:"EN",cl:["8.9","19.1"],sub:"Notice under Sub-Clauses 8.9 and 19.1 – suspension of work",b:["Following your instruction dated __ to suspend __, we are suffering delay and/or incurring Cost from complying with the instruction.","We give notice under Sub-Clauses 8.9 and 19.1 of our claim for an extension of the Time for Completion and payment of this Cost. We are keeping contemporary records and will send full particulars."],by:"a+28"}},

{i:"U2",c:"susp",r:"C",t:["We want to stop work because we are not being paid or certified","ගෙවීම් හෝ certificates නැති නිසා අපිට වැඩ නතර කරන්න ඕනේ"],
m:["You may suspend or slow down work if the Engineer fails to certify under 14.5, or the Employer fails to pay under 14.6 (an IPC, the advance payment or the Final Payment Certificate), but only after a notice of not less than 56 days to the Employer.","Engineer 14.5 යටතේ certify නොකළොත්, හෝ Employer 14.6 යටතේ (IPC, advance payment හෝ Final Payment Certificate) නොගෙව්වොත් වැඩ suspend හෝ අඩු කරන්න පුළුවන්, හැබැයි Employer ට දින 56කට නොඅඩු notice එකකින් පසු පමණයි."],
s:[[null,"do","For the full steps and dates, see P1 (IPC not paid) or P2 (IPC not issued). For an unpaid advance payment, see S5.","සම්පූර්ණ පියවර සහ දිනයන් සඳහා P1 (IPC නොගෙවීම) හෝ P2 (IPC නිකුත් නොකිරීම) බලන්න. Advance payment එක නොගෙවීම නම් S5 බලන්න.",["16.1","14.5","14.6"]]],

d:[["a","Date by which the drawing or instruction was needed (as stated in your notice)","Drawing/instruction එක අවශ්‍ය වූ දිනය (ඔබේ notice එකේ කියූ පරිදි)"],["b","Date we became aware we were being delayed or incurring Cost","ප්‍රමාද වෙන බව හෝ Cost වියදම් වෙන බව දැනගත් දිනය"]],
q:[["Was the delay caused by your own error or delay, for example late or wrong Contractor's Documents?","ප්‍රමාදයට ඔබේම වරදක් හෝ ප්‍රමාදයක්, උදා: ප්‍රමාද හෝ වැරදි Contractor's Documents, හේතු වුණාද?","To that extent you get no extra time, Cost or profit.","ඒ ප්‍රමාණයට අමතර කාලය, Cost හෝ profit ලැබෙන්නේ නැහැ.","",""]],

m:["Delay or disruption by a legally constituted public authority gives an extension of time, but only if all three conditions in 8.5 are met.","නීත්‍යානුකූලව පිහිටුවූ රජයේ ආයතනයක ප්‍රමාදයකට හෝ බාධාවකට අමතර කාලය ලැබෙනවා, හැබැයි 8.5 හි කොන්දේසි තුනම සපුරා ඇත්නම් පමණයි."],
d:[["a","Date we became aware the authority was delaying completion","ආයතනය completion ප්‍රමාද කරන බව දැනගත් දිනය"]],
q:[["Did you diligently follow the authority's procedures?","ඔබ ආයතනයේ ක්‍රියා පටිපාටි උනන්දුවෙන් අනුගමනය කළාද?","","","Condition (a) of 8.5 is not met, so there is no extension under 8.5.","8.5 හි (a) කොන්දේසිය සපිරෙන්නේ නැහැ, ඒ නිසා 8.5 යටතේ extension එකක් නැහැ."],["Was the delay or disruption Unforeseeable?","ප්‍රමාදය හෝ බාධාව අනපේක්ෂිතද?","","","Condition (c) of 8.5 is not met, so there is no extension under 8.5.","8.5 හි (c) කොන්දේසිය සපිරෙන්නේ නැහැ, ඒ නිසා 8.5 යටතේ extension එකක් නැහැ."]],
s:[[null,"know","The three conditions: (a) you diligently followed the procedures of the relevant public authority; (b) the authority delays or disrupts your work; (c) the delay or disruption was Unforeseeable.","කොන්දේසි තුන: (a) අදාළ රජයේ ආයතනයේ ක්‍රියා පටිපාටි ඔබ උනන්දුවෙන් අනුගමනය කළා; (b) ආයතනය ඔබේ වැඩ ප්‍රමාද හෝ බාධා කරනවා; (c) ප්‍රමාදය හෝ බාධාව අනපේක්ෂිතයි.",["8.5"]],
[null,"do","Getting permits is your duty, but you may ask the Employer for reasonable help; it must help where it is in a position to do so.","Permits ගැනීම ඔබේ වගකීම, හැබැයි Employer ගෙන් සාධාරණ උදව් ඉල්ලන්න පුළුවන්; එයට හැකි තැන්වල එය උදව් කළ යුතුයි.",["1.13","2.2"]],
["a+28:L","warn",N19[0],N19[1],["19.1"]],
["a+84:L","do",N19D[0],N19D[1],["19.1"]],
[null,"know","This is treated as a cause of delay under 8.4(b) and gives extra time only.","මෙය 8.4(b) යටතේ ප්‍රමාද හේතුවක් ලෙස සැලකෙනවා, ලැබෙන්නේ අමතර කාලය පමණයි.",["8.5","8.4(b)"]]],
en:{E:["C",EOTC[0]+" All three conditions of 8.5 must be met.",EOTC[1]+" 8.5 හි කොන්දේසි තුනම සපිරිය යුතුයි."],C:["N"],P:["N"],v:1},
k:["Applications with dates, follow-up letters, all letters with the authority","දින සහිත applications, follow-up letters, ආයතනය සමඟ සියලු ලිපි"]},

{i:"D5",c:"time",r:"C",t:["The Employer, its staff or its other contractors are delaying our work","Employer, එහි staff හෝ එහි අනෙක් contractors අපේ වැඩ ප්‍රමාද කරනවා"],
m:["Any delay, impediment or prevention caused by the Employer, the Employer's Personnel or the Employer's other contractors on the Site gives an extension of time (8.4(e)). Many specific Employer failures have their own clause that also gives Cost; check those first.","Employer, Employer's Personnel හෝ Site එකේ Employer ගේ අනෙක් contractors නිසා වන ඕනෑම ප්‍රමාදයකට, බාධාවකට හෝ වැළැක්වීමකට අමතර කාලය ලැබෙනවා (8.4(e)). Employer ගේ බොහෝ නිශ්චිත අසමත්කම් වලට Cost ත් දෙන වෙනම clauses තියෙනවා; මුලින් ඒවා බලන්න."],
d:[["a","Date we became aware of the delay","ප්‍රමාදය ගැන දැනගත් දිනය"]],
s:[[null,"do","First check whether a specific clause covers it, because those also give Cost (and often profit): late site possession (S3, 2.1), late drawings or instructions (D1, 1.9), Employer's test instructions or delays (Q5, 7.3), blocked Tests on Completion (Q8, 10.3), suspension (U1, 8.9).","මුලින්ම නිශ්චිත clause එකක් අදාළද බලන්න, මොකද ඒවා Cost (බොහෝ විට profit ත්) දෙනවා: site එක ප්‍රමාදයෙන් දීම (S3, 2.1), drawings/instructions ප්‍රමාද (D1, 1.9), Employer ගේ test instructions හෝ ප්‍රමාද (Q5, 7.3), Tests on Completion වලට බාධා (Q8, 10.3), suspension (U1, 8.9).",["2.1","1.9","7.3","10.3","8.9"]],
["a+28:L","warn",N19[0],N19[1],["8.4(e)","19.1"]],
["a+84:L","do",N19D[0],N19D[1],["19.1"]],
[null,"know","8.4(e) itself gives extra time only. You may also claim additional payment 'otherwise in connection with the Contract' under 19.1, but no clause expressly gives Cost for this general cause; the Engineer decides under 3.4.","8.4(e) මගින් පමණක් ලැබෙන්නේ අමතර කාලයයි. 19.1 යටතේ 'otherwise in connection with the Contract' ලෙස අමතර ගෙවීමක් claim කරන්නත් පුළුවන්, හැබැයි මේ පොදු හේතුවට Cost දෙන බව පැහැදිලිව කියන clause එකක් නැහැ; Engineer 3.4 යටතේ තීරණය කරනවා.",["8.4(e)","19.1","3.4"]],
[null,"know","The Employer must make sure its personnel and other contractors on Site cooperate with you. If you are told to give them facilities that cost you something Unforeseeable, that instruction is a Variation (F7).","එහි personnel සහ Site එකේ අනෙක් contractors ඔබ සමඟ සහයෝගයෙන් වැඩ කරන බව Employer සහතික කළ යුතුයි. ඔවුන්ට facilities දෙන්න කියලා, ඒකට අනපේක්ෂිත වියදමක් වුණොත්, ඒ instruction එක Variation එකක් (F7).",["2.3","4.6"]]],
en:{E:["C",EOTC[0],EOTC[1]],C:["C","Only if a specific clause gives it (see step 1), or if the Engineer agrees a claim made 'otherwise in connection with the Contract' under 19.1.","නිශ්චිත clause එකක් එය දෙනවා නම් (පියවර 1 බලන්න), හෝ 19.1 යටතේ 'otherwise in connection with the Contract' ලෙස කළ claim එකකට Engineer එකඟ වුණොත් පමණයි."],P:["C","Only where a specific clause gives profit (for example 1.9, 2.1, 7.3, 10.3).","නිශ්චිත clause එකක් profit දෙන තැන්වල පමණයි (උදා: 1.9, 2.1, 7.3, 10.3)."],v:1},
k:["Site diary, meeting minutes, letters, photos","Site diary, meeting minutes, letters, photos"]},

{i:"D6",c:"time",r:"B",t:["The Engineer changes the order or timing of the work (resequencing or acceleration)","Engineer වැඩ කරන අනුපිළිවෙල හෝ කාලය වෙනස් කරනවා (resequencing හෝ acceleration)"],
m:["A change to the sequence or timing of the Works is one of the listed kinds of Variation. It must be instructed (in writing), it is valued like any Variation, and it can give extra time unless a time adjustment was already agreed.","Works වල අනුපිළිවෙල හෝ කාලය වෙනස් කිරීම ලැයිස්තුගත Variation වර්ගයක්. එය (ලිඛිතව) instruct කළ යුතුයි, වෙනත් ඕනෑම Variation එකක් වගේ value කරනවා, කාල adjustment එකක් දැනටමත් එකඟ වී නැත්නම් අමතර කාලයත් ලැබිය හැකියි."],
s:[[null,"do","Get the instruction in writing. Changes to the sequence or timing of execution are a Variation.","Instruction එක ලිඛිතව ගන්න. Execution අනුපිළිවෙල හෝ කාලය වෙනස් කිරීම Variation එකක්.",["13.1(f)","3.3"]],
[null,"do","If the Engineer asks for a proposal first, include your programme changes, the effect on the Time for Completion, and your valuation. Do not delay any work while waiting for the reply.","Engineer මුලින් proposal එකක් ඉල්ලුවොත්, programme වෙනස්කම්, Time for Completion එකට බලපෑම සහ ඔබේ valuation එක ඇතුළත් කරන්න. පිළිතුර එනකම් කිසිම වැඩක් ප්‍රමාද කරන්න එපා.",["13.3"]],
[null,"know","If no adjustment to the Time for Completion was agreed under 13.3, you may claim an extension under 8.4(a) through the 19.1 procedure.","13.3 යටතේ Time for Completion adjustment එකක් එකඟ වී නැත්නම්, 19.1 ක්‍රියාවලිය හරහා 8.4(a) යටතේ extension එකක් claim කරන්න පුළුවන්.",["8.4(a)","19.1"]],
[null,"know","The Variation is valued under 12.3: contract rates where suitable, otherwise new rates derived from them, or reasonable Cost plus reasonable profit.","Variation එක 12.3 යටතේ value කරනවා: සුදුසු තැන්වල contract rates, නැත්නම් ඒවායින් හදන අලුත් rates, නැත්නම් සාධාරණ Cost + සාධාරණ profit.",["12.3","13.3"]]],
en:{E:["C","Unless an adjustment to the Time for Completion was already agreed under 13.3, and only if completion is delayed.","13.3 යටතේ Time for Completion adjustment එකක් දැනටමත් එකඟ වී නැත්නම් සහ completion ප්‍රමාද වෙනවා නම් පමණයි."],C:["N"],P:["N"],x:[["Payment through the valuation of the Variation under 12.3, not as a separate Cost claim","වෙනම Cost claim එකක් ලෙස නොව, 12.3 යටතේ Variation එක value කිරීම හරහා ගෙවීම"]],v:1}},

{i:"D7",c:"time",r:"B",t:["The Contractor is behind programme for its own reasons","Contractor තමන්ගේම හේතු නිසා programme එකට වඩා පසුපසින්"],
m:["If progress is too slow, or behind the programme, for a reason that is not one of the 8.4 causes, the Engineer can make you speed up at your own risk and cost. The Employer can also recover its extra costs, charge delay damages and, if you still do not proceed properly, end the contract.","ප්‍රගතිය ඕනෑවට වඩා මන්දගාමී නම්, හෝ 8.4 හේතුවක් නොවන හේතුවක් නිසා programme එකට වඩා පසුපසින් නම්, ඔබේම අවදානමට සහ වියදමට වේගවත් කරන්න Engineer ට කියන්න පුළුවන්. Employer ට තම අමතර වියදම් අයකරගන්න, delay damages අය කරන්න, ඔබ තවමත් නිසි ලෙස ඉදිරියට නොගියොත් contract එක අවසන් කරන්නත් පුළුවන්."],
s:[[null,"know","The Engineer may instruct you to submit a revised programme and report describing how you will speed up to finish within the Time for Completion. Unless the Engineer says otherwise, you must use these methods (more hours, workers or equipment) at your own risk and cost.","Time for Completion ඇතුළත ඉවර කරන්න කොහොමද වේගවත් කරන්නේ කියලා revised programme එකක් සහ report එකක් දෙන්න Engineer ට instruct කරන්න පුළුවන්. Engineer වෙනත් දෙයක් නොකියන්නේ නම්, මේ ක්‍රම (වැඩි පැය, workers හෝ equipment) ඔබේම අවදානමට සහ වියදමට භාවිත කළ යුතුයි.",["8.6","8.3"]],
[null,"warn","If this causes the Employer additional costs, it can recover them through 2.4, in addition to any delay damages (LD).","මේ නිසා Employer ට අමතර වියදම් ආවොත්, delay damages (LD) වලට අමතරව 2.4 හරහා ඒවා අයකරගන්න පුළුවන්.",["8.6","2.4","8.7"]],
[null,"warn","If you fail to carry out an obligation, the Engineer can give a Notice to Correct. Failing, without reasonable excuse, to proceed with the Works in accordance with Clause 8 is a ground for termination by the Employer.","ඔබ වගකීමක් ඉටු නොකළොත් Engineer ට Notice to Correct එකක් දෙන්න පුළුවන්. සාධාරණ හේතුවක් නැතිව Clause 8 අනුව Works ඉදිරියට නොගෙන යාම Employer ට terminate කිරීමට හේතුවක්.",["15.1","15.2(c)"]]]},

{i:"D8",c:"time",r:"B",t:["The job will finish after the Time for Completion (delay damages / LD)","Time for Completion එකෙන් පස්සේ job එක ඉවර වෙයි (delay damages / LD)"],
m:["Liquidated Damages (LD) are the amount per day in the Contract Data that the Contractor pays for every day between the end of the Time for Completion and the date stated in the Taking-Over Certificate, up to the maximum in the Contract Data. The Employer must claim them through 2.4.","Liquidated Damages (LD) කියන්නේ Time for Completion අවසානය සහ Taking-Over Certificate එකේ සඳහන් දිනය අතර හැම දවසකටම, Contract Data එකේ උපරිමය දක්වා, Contractor ගෙවන Contract Data එකේ දවසක මුදල. Employer ඒවා 2.4 හරහා claim කළ යුතුයි."],
d:[["a","Last day of the Time for Completion (with any extensions)","Time for Completion එකේ අවසාන දිනය (extensions සමඟ)"],["b","Date stated (or expected) in the Taking-Over Certificate","Taking-Over Certificate එකේ සඳහන් (හෝ අපේක්ෂිත) දිනය"]],
s:[["a+1:F","know","LD runs for every day from this day up to the date stated in the Taking-Over Certificate, at the daily amount in the Contract Data, up to the maximum in the Contract Data.","මේ දවසේ සිට Taking-Over Certificate එකේ සඳහන් දිනය දක්වා හැම දවසකටම, Contract Data එකේ දවසක මුදලට, Contract Data එකේ උපරිමය දක්වා LD ගණන් වෙනවා.",["8.7","8.2"]],
[null,"know","The Time for Completion includes passing the Tests on Completion and finishing all work needed for taking-over.","Time for Completion එකට Tests on Completion සමත් වීම සහ taking-over සඳහා අවශ්‍ය සියලු වැඩ ඉවර කිරීම ඇතුළත්.",["8.2"]],
[null,"know","The Employer must claim LD under 2.4. LD are the only damages for this delay, except if the contract is terminated under 15.2 before completion. Paying LD does not release you from finishing the Works.","Employer LD claim කළ යුත්තේ 2.4 යටතේ. Completion එකට කලින් 15.2 යටතේ contract එක terminate කළොත් හැර, මේ ප්‍රමාදයට ඇති එකම damages LD. LD ගෙවීමෙන් Works ඉවර කිරීමේ වගකීමෙන් නිදහස් වෙන්නේ නැහැ.",["8.7","2.4"]],
[null,"know","If part of the Works is taken over early, the LD for the rest is reduced in proportion to the value of that part.","Works කොටසක් කලින් භාර ගත්තොත්, ඉතිරිය සඳහා LD ඒ කොටසේ වටිනාකමට අනුපාතිකව අඩු වෙනවා.",["10.2"]],
[null,"know","For work done after the due completion date, price adjustment uses the indices at the due completion date.","Due completion date එකෙන් පසු කරන වැඩ වලට price adjustment භාවිත කරන්නේ due completion date එකේ indices.",["13.7"]],
[null,"do","If you are entitled to an extension of time that is not yet granted, claim it now under 8.4 and 19.1. An extension moves the Time for Completion and reduces LD. The Engineer may increase, but never decrease, the total extension already given.","ඔබට හිමි, තවම නොදුන් extension of time එකක් තියෙනවා නම්, 8.4 සහ 19.1 යටතේ දැන්ම claim කරන්න. Extension එකකින් Time for Completion එක පසුවට යනවා, LD අඩු වෙනවා. දැනටමත් දුන් මුළු extension එක Engineer ට වැඩි කරන්න පුළුවන්, කවදාවත් අඩු කරන්න බැහැ.",["8.4","19.1"]]],
calc:"ld"},

{i:"D9",c:"time",r:"B",t:["The Engineer rejected our programme or asked us to revise it","Engineer අපේ programme එක reject කළා හෝ revise කරන්න කිව්වා"],
m:["The programme is your detailed work plan. The Engineer has 14 days to say where it does not comply. You must send a revised programme whenever it no longer matches actual progress or your obligations.","Programme එක කියන්නේ ඔබේ සවිස්තර වැඩ සැලැස්ම. එය අනුකූල නොවන තැන් කියන්න Engineer ට දින 14ක් තියෙනවා. සැබෑ progress එකට හෝ ඔබේ වගකීම් වලට තවදුරටත් නොගැළපෙන හැම විටම revised programme එකක් යවන්න ඕනේ."],
d:[["a","Date the Engineer received our programme","අපේ programme එක Engineer ට ලැබුණු දිනය"]],
s:[["a+14:L","know","The Engineer has until this date to give notice of where the programme does not comply with the contract. If there is no such notice, you proceed in accordance with the programme, and the Employer's Personnel may rely on it.","Programme එක contract එකට අනුකූල නොවන තැන් ගැන notice දෙන්න Engineer ට මේ දිනය දක්වා කාලය තියෙනවා. එවැනි notice එකක් නැත්නම් ඔබ programme එක අනුව ඉදිරියට යනවා, Employer's Personnel ට එය මත විශ්වාසය තබන්න පුළුවන්.",["8.3"]],
[null,"do","Each programme must show: (a) the order of work and timing of each stage (design, Contractor's Documents, procurement, manufacture, delivery, construction, testing); (b) the stages for each nominated subcontractor; (c) the sequence and timing of inspections and tests; (d) a supporting report with your methods, major stages, and estimates of personnel and equipment for each stage.","හැම programme එකකම පෙන්විය යුතුයි: (a) වැඩ අනුපිළිවෙල සහ හැම අදියරකම කාලය (design, Contractor's Documents, procurement, නිෂ්පාදනය, delivery, ඉදිකිරීම, testing); (b) හැම nominated subcontractor කෙනෙකුගේම අදියර; (c) inspections සහ tests වල අනුපිළිවෙල සහ කාලය; (d) ඔබේ ක්‍රම, ප්‍රධාන අදියර, හැම අදියරකටම personnel සහ equipment ඇස්තමේන්තු සහිත supporting report එකක්.",["8.3"]],
[null,"do","Send a revised programme whenever the Engineer gives notice that it does not comply, or whenever it is inconsistent with actual progress or your obligations.","Programme එක අනුකූල නැති බව Engineer notice කළ විට, හෝ එය සැබෑ progress එකට හෝ ඔබේ වගකීම් වලට නොගැළපෙන හැම විටම revised programme එකක් යවන්න.",["8.3"]]]},

{i:"D10",c:"time",r:"C",t:["We can see a problem coming that may cause delay or extra cost (early warning)","ප්‍රමාදයක් හෝ අමතර වියදමක් ඇති කරන්න පුළුවන් ප්‍රශ්නයක් එන බව පේනවා (early warning)"],
m:["You must promptly warn the Engineer of specific probable future events that may harm the work, increase the Contract Price or delay the Works. Early warning helps both sides deal with the problem early.","වැඩට හානි කරන්න, Contract Price එක වැඩි කරන්න හෝ Works ප්‍රමාද කරන්න පුළුවන් නිශ්චිත, බොහෝ දුරට සිදු විය හැකි අනාගත සිදුවීම් ගැන Engineer ට ඉක්මනින් අනතුරු අඟවන්න ඕනේ. කලින් අනතුරු ඇඟවීම ප්‍රශ්නයට කලින්ම මුහුණ දෙන්න පාර්ශව දෙකටම උදව් වෙනවා."],
s:[[null,"do","Give notice to the Engineer promptly, describing the specific probable future event or circumstance.","නිශ්චිත, බොහෝ දුරට සිදු විය හැකි අනාගත සිදුවීම හෝ තත්ත්වය විස්තර කරමින් Engineer ට ඉක්මනින් notice දෙන්න.",["8.3"]],
[null,"know","The Engineer may ask you for an estimate of its effect and/or a proposal under the Variation procedure.","එහි බලපෑමේ ඇස්තමේන්තුවක් සහ/හෝ Variation ක්‍රියාවලිය යටතේ proposal එකක් Engineer ට ඉල්ලන්න පුළුවන්.",["8.3","13.3"]],
[null,"if","If the event happens and gives you a right to time or money, start the claim procedure (D11 or M4).","සිදුවීම ඇත්තටම වෙලා ඔබට කාලයට හෝ මුදලට අයිතියක් ලැබෙනවා නම්, claim ක්‍රියාවලිය පටන් ගන්න (D11 හෝ M4).",["19.1"]]]},

{i:"D11",c:"time",r:"C",t:["How do we ask for more time (EOT)? (general guide)","වැඩි කාලයක් (EOT) ඉල්ලන්නේ කොහොමද? (පොදු මාර්ගෝපදේශය)"],

s:[[null,"know","The 8.4 causes: (a) a Variation (unless a time adjustment was agreed under 13.3) or another substantial change in quantity; (b) a cause giving extra time under another Sub-Clause; (c) exceptionally adverse climatic conditions; (d) Unforeseeable shortages of personnel or Goods caused by epidemic or government action; (e) delay, impediment or prevention caused by the Employer, its personnel or its other contractors on the Site.","8.4 හේතු: (a) Variation එකක් (13.3 යටතේ කාල adjustment එකක් එකඟ වී නැත්නම්) හෝ quantity එකේ වෙනත් සැලකිය යුතු වෙනසක්; (b) වෙනත් Sub-Clause එකක් යටතේ අමතර කාලය දෙන හේතුවක්; (c) අසාමාන්‍ය තරම් දරුණු කාලගුණය; (d) epidemic හෝ government ක්‍රියාමාර්ග නිසා අනපේක්ෂිත personnel හෝ Goods හිඟය; (e) Employer, එහි personnel හෝ Site එකේ එහි අනෙක් contractors නිසා වන ප්‍රමාදය, බාධාව හෝ වැළැක්වීම.",["8.4"]],

{i:"M1",c:"disp",r:"B",t:["We disagree with the Engineer's decision (Adjudicator route)","Engineer ගේ තීරණයට අපි එකඟ නැහැ (Adjudicator මාර්ගය)"],
m:["Under SBD/02, any dispute must first be tried through adjudication (19.2, 19.3). You keep following the Engineer's decision and keep working meanwhile. If either Party is not satisfied with the Adjudicator's decision, it can refer the dispute to arbitration within 28 days; if not, the decision becomes final and binding. (For contracts of about LKR 500 million and above, the Contract Data replaces this with a DAB: see M2.)","SBD/02 යටතේ ඕනෑම dispute එකක් මුලින්ම adjudication හරහා විසඳීමට උත්සාහ කළ යුතුයි (19.2, 19.3). ඒ අතරතුර Engineer ගේ තීරණය අනුගමනය කරමින් වැඩ දිගටම කරන්න. Adjudicator ගේ තීරණයට එක් Party එකක් සෑහීමකට පත් නැත්නම් දින 28ක් ඇතුළත arbitration වෙත යොමු කරන්න පුළුවන්; එසේ නොකළොත් තීරණය අවසාන සහ බැඳෙන එකක් වෙනවා. (ආසන්න වශයෙන් LKR මිලියන 500 සහ ඊට වැඩි contracts වල Contract Data මගින් මේ වෙනුවට DAB එකක් යොදනවා: M2 බලන්න.)"],
d:[["a","Date we gave the 7-day adjudication notice to the other Party","අනෙක් Party ට දින 7ක adjudication notice එක දුන් දිනය"],["b","Date we received the Adjudicator's determination","Adjudicator ගේ determination එක ලැබුණු දිනය"]],
s:[[null,"warn","Meanwhile, each Party must give effect to the Engineer's agreement or determination unless and until it is revised under Clause 19. Keep working.","ඒ අතරතුර, Clause 19 යටතේ වෙනස් කරනකම් Engineer ගේ agreement එක හෝ determination එක හැම Party එකක්ම ක්‍රියාත්මක කළ යුතුයි. වැඩ දිගටම කරන්න.",["3.4","19.2"]],
[null,"do","Start the adjudication by giving the other Party 7 days' notice of the dispute. If an Adjudicator was already appointed at the start of the contract (ITB 37), the dispute goes to that person.","Dispute එක ගැන අනෙක් Party ට දින 7ක notice එකක් දීලා adjudication පටන් ගන්න. Contract එකේ ආරම්භයේදීම Adjudicator කෙනෙක් පත් කරලා තිබුණා නම් (ITB 37), dispute එක ඒ පුද්ගලයාට යනවා.",["19.3","ITB 37"]],
["a+7:F","know","The reference to adjudication is made once the 7-day notice has run.","දින 7ක notice කාලය ගෙවුණාම adjudication reference එක සිදු වෙනවා.",["19.3"]],
["a+14:F","if","If no Adjudicator is in place and the Parties cannot agree on one within 14 days from the request, either Party may apply to ICTAD (now CIDA) to appoint one. The Adjudicator must be an experienced professional with no interest in the Employer, Contractor, Engineer or the Contract.","Adjudicator කෙනෙක් නැත්නම් සහ ඉල්ලීමේ සිට දින 14ක් ඇතුළත එක්කෙනෙක් ගැන එකඟ වෙන්න බැරි නම්, පත් කරන්න කියලා ඕනෑම Party එකකට ICTAD (දැන් CIDA) ට ඉල්ලුම් කරන්න පුළුවන්. Adjudicator, Employer, Contractor, Engineer හෝ Contract එකේ කිසිම උනන්දුවක් නැති, පළපුරුදු professional කෙනෙක් විය යුතුයි.",["19.3"]],
[null,"know","The Adjudicator gives a written determination within 28 days of receiving notice of the dispute (or another period), after giving each Party a fair chance to make its case. Each Party supplies the information asked for, free of charge, and keeps it confidential. The Adjudicator's fees, and any advisers used with both Parties' agreement, are shared equally. The Adjudicator does not act as arbitrator.","Dispute notice එක ලැබී දින 28ක් ඇතුළත (හෝ වෙනත් කාලයක්), හැම Party එකකටම තම කරුණු ඉදිරිපත් කරන්න සාධාරණ අවස්ථාවක් දීලා, Adjudicator ලිඛිත determination එකක් දෙනවා. ඉල්ලන තොරතුරු හැම Party එකක්ම නොමිලේ දිය යුතුයි, රහසිගතව තියාගත යුතුයි. Adjudicator ගේ ගාස්තු සහ පාර්ශව දෙකේ එකඟතාවෙන් යොදාගන්නා උපදේශකයින්ගේ වියදම් සමානව බෙදාගන්නවා. Adjudicator arbitrator ලෙස ක්‍රියා කරන්නේ නැහැ.",["19.3"]],
[null,"if","If the Adjudicator resigns, dies or is removed by agreement, the Parties may jointly appoint another within 14 days; otherwise ICTAD appoints one within 14 days of a request.","Adjudicator ඉල්ලා අස් වුණොත්, මිය ගියොත් හෝ එකඟතාවෙන් ඉවත් කළොත්, දින 14ක් ඇතුළත පාර්ශව දෙකට එකට අලුත් කෙනෙක් පත් කරන්න පුළුවන්; නැත්නම් ඉල්ලීමකින් දින 14ක් ඇතුළත ICTAD පත් කරනවා.",["19.4"]],
["b+28:L","warn","Last day for either Party to refer the dispute to arbitration. If neither does, the Adjudicator's decision becomes final and binding.","ඕනෑම Party එකකට dispute එක arbitration වෙත යොමු කරන්න අවසාන දිනය. කවුරුත් නොකළොත් Adjudicator ගේ තීරණය අවසාන සහ බැඳෙන එකක් වෙනවා.",["19.3","19.5"]]],

{i:"M2",c:"disp",r:"B",t:["A dispute goes to the DAB (contracts of about LKR 500 million and above)","Dispute එකක් DAB එකට යනවා (ආසන්න වශයෙන් LKR මිලියන 500 සහ ඊට වැඩි contracts)"],
m:["For large contracts, the Contract Data replaces the Adjudicator with a three-member Dispute Adjudication Board (DAB). Its decision is binding at once. If you are not satisfied, you must give a notice of dissatisfaction within 28 days, or the decision becomes final. (The SBD footnotes describe the threshold both as 'more than' and 'equal or exceeding' LKR 500 million; check your Contract Data.)","විශාල contracts වල Contract Data මගින් Adjudicator වෙනුවට සාමාජිකයන් තිදෙනෙකුගේ Dispute Adjudication Board (DAB) එකක් යොදනවා. එහි තීරණය වහාම බැඳෙනවා. ඔබ සෑහීමකට පත් නැත්නම් දින 28ක් ඇතුළත notice of dissatisfaction එකක් දිය යුතුයි, නැත්නම් තීරණය අවසාන වෙනවා. (SBD footnotes වල threshold එක LKR මිලියන 500 'more than' සහ 'equal or exceeding' ලෙස දෙයාකාරයට කියනවා; ඔබේ Contract Data එක බලන්න.)"],
d:[["a","Date the DAB chairman received the reference","DAB chairman ට reference එක ලැබුණු දිනය"],["b","Date we received the DAB's decision","DAB තීරණය ලැබුණු දිනය"]],
s:[[null,"do","Refer the dispute to the DAB in writing, with copies to the other Party and the Engineer, stating that it is given under Sub-Clause 19.4 of the Contract Data. Any dispute, including one about an Engineer's certificate, determination, instruction, opinion or valuation, can be referred.","Dispute එක ලිඛිතව DAB එකට යොමු කරන්න, copies අනෙක් Party ට සහ Engineer ට, එය Contract Data Sub-Clause 19.4 යටතේ දෙන බව සඳහන් කරලා. Engineer ගේ certificate, determination, instruction, opinion හෝ valuation එකක් ගැන dispute ඇතුළු ඕනෑම dispute එකක් යොමු කරන්න පුළුවන්.",["CD 19.4","CD 19.2"]],
[null,"do","Promptly give the DAB any information, access to the Site and facilities it asks for.","DAB ඉල්ලන තොරතුරු, Site එකට ප්‍රවේශය සහ පහසුකම් ඉක්මනින් දෙන්න.",["CD 19.4"]],
["a+84:L","know","The DAB must give a reasoned decision within 84 days (or another period it proposes and both Parties approve). The decision binds both Parties at once; give effect to it, and keep working, unless and until it is revised by amicable settlement or an arbitral award.","DAB දින 84ක් ඇතුළත (හෝ එය යෝජනා කර පාර්ශව දෙකම අනුමත කරන වෙනත් කාලයක්) හේතු සහිත තීරණයක් දිය යුතුයි. තීරණය වහාම පාර්ශව දෙකටම බැඳෙනවා; සාමකාමී settlement එකකින් හෝ arbitral award එකකින් වෙනස් කරනකම් එය ක්‍රියාත්මක කරලා වැඩ දිගටම කරන්න.",["CD 19.4"]],
["a+112:L","if","If the DAB gives no decision within the 84 days, this is the last day to give notice of dissatisfaction (28 days after that period ends).","DAB දින 84 ඇතුළත තීරණයක් නොදුන්නොත්, notice of dissatisfaction දෙන්න අවසාන දිනය මෙයයි (ඒ කාලය ඉවර වී දින 28කට පසු).",["CD 19.4"]],
["b+28:L","warn","Last day to give notice of dissatisfaction and intention to start arbitration. It must say it is given under this Sub-Clause and set out the matter in dispute and your reasons. Without it you cannot go to arbitration, and the decision becomes final and binding.","Dissatisfaction සහ arbitration පටන් ගැනීමේ අදහස ගැන notice දෙන්න අවසාන දිනය. එය මේ Sub-Clause යටතේ දෙන බව කියලා, dispute එකේ කරුණ සහ ඔබේ හේතු දැක්විය යුතුයි. එය නැතිව arbitration වෙත යන්න බැහැ, තීරණය අවසාන සහ බැඳෙන එකක් වෙනවා.",["CD 19.4"]],
[null,"if","If a Party does not comply with a final and binding DAB decision, the other Party may refer that failure straight to arbitration. If there is no DAB in place (for example its appointment has expired after the discharge under 14.11), a dispute can go directly to arbitration.","අවසාන සහ බැඳෙන DAB තීරණයකට Party එකක් අනුකූල නොවුණොත්, අනෙක් Party ට ඒ අසමත්කම කෙලින්ම arbitration වෙත යොමු කරන්න පුළුවන්. DAB එකක් නැත්නම් (උදා: 14.11 discharge එකෙන් පසු එහි පත්වීම ඉවර වෙලා), dispute එකක් කෙලින්ම arbitration වෙත යන්න පුළුවන්.",["CD 19.5","CD 19.6","CD 19.3"]]],
k:["Reference to the DAB, all submissions, the decision, your notice of dissatisfaction","DAB reference එක, සියලු ඉදිරිපත් කිරීම්, තීරණය, ඔබේ notice of dissatisfaction එක"],
n:{f:"C",to:"E",cl:["CD 19.4"],sub:"Notice of dissatisfaction with the DAB's decision",b:["This notice is given under Sub-Clause 19.4 of the Contract Data.","We are dissatisfied with the DAB's decision dated __ (received on __) concerning __, and we intend to commence arbitration.","The matter in dispute is __. Our reasons for dissatisfaction are: __."],by:"b+28"}},

{i:"M3",c:"disp",r:"B",t:["Arbitration","Arbitration"],
m:["Arbitration is the final way to settle a dispute. It is held under the Arbitration Act No. 11 of 1995, before one arbitrator, in Sri Lanka and in English (unless the Parties agree otherwise). Before arbitration: on the Adjudicator route, refer within 28 days of the Adjudicator's decision (M1); on the DAB route, first give a notice of dissatisfaction (M2).","Arbitration කියන්නේ dispute එකක් විසඳන අවසාන ක්‍රමය. එය Arbitration Act No. 11 of 1995 යටතේ, එක් arbitrator කෙනෙකු ඉදිරියේ, ලංකාවේ, English භාෂාවෙන් (පාර්ශව වෙනත් දෙයකට එකඟ නොවුණොත්) පැවැත්වෙනවා. Arbitration වලට කලින්: Adjudicator මාර්ගයේ නම්, Adjudicator ගේ තීරණයෙන් දින 28ක් ඇතුළත යොමු කරන්න (M1); DAB මාර්ගයේ නම්, මුලින් notice of dissatisfaction එකක් දෙන්න (M2)."],
d:[["a","Date the other Party received our nomination of three arbitrators","අපේ arbitrators තිදෙනාගේ නාමයෝජනාව අනෙක් Party ට ලැබුණු දිනය"]],
s:[[null,"do","The Party wanting arbitration nominates three arbitrators.","Arbitration අවශ්‍ය Party එක arbitrators තිදෙනෙක් නම් කරනවා.",["19.5","CD 19.7"]],
["a+21:L","know","The other Party must select one of the three within 21 days of receiving the nomination. If it does not, the sole arbitrator is appointed under the Arbitration Act No. 11 of 1995.","නාමයෝජනාව ලැබී දින 21ක් ඇතුළත අනෙක් Party ට තිදෙනාගෙන් එක්කෙනෙක් තෝරන්න ඕනේ. එසේ නොකළොත් Arbitration Act No. 11 of 1995 යටතේ sole arbitrator පත් කරනවා.",["19.5","CD 19.7"]],
[null,"warn","Until the award, the contract stays in force and both Parties must keep performing their obligations. Termination of the contract does not end a pending arbitration.","Award එක ලැබෙනකම් contract එක බලාත්මකව තියෙනවා, පාර්ශව දෙකම තම වගකීම් දිගටම ඉටු කළ යුතුයි. Contract එක terminate වීමෙන් පවතින arbitration එකක් අවසන් වෙන්නේ නැහැ.",["19.5"]],
[null,"know","The award decides who bears the costs. Arbitration centre charges and the arbitrator's fees are first shared equally.","වියදම් දරන්නේ කවුද කියලා award එක තීරණය කරනවා. Arbitration centre ගාස්තු සහ arbitrator ගේ ගාස්තු මුලින් සමානව බෙදාගන්නවා.",["19.5"]]]},

{i:"M4",c:"disp",r:"C",t:["How do we make any claim? (general guide)","ඕනෑම claim එකක් කරන්නේ කොහොමද? (පොදු මාර්ගෝපදේශය)"],
m:["A claim is the Contractor's formal request for an extension of time and/or additional payment, under any clause or otherwise in connection with the Contract. Sub-Clause 19.1 sets the steps: a notice within 28 days, contemporary records, and a fully detailed claim within 84 days.","Claim එකක් කියන්නේ ඕනෑම clause එකක් යටතේ, හෝ Contract එකට සම්බන්ධව වෙනත් ආකාරයකින්, extension of time සහ/හෝ අමතර ගෙවීමක් සඳහා Contractor කරන formal ඉල්ලීම. Sub-Clause 19.1 පියවර නියම කරනවා: දින 28ක් ඇතුළත notice එකක්, ඒ කාලයේම records, සහ දින 84ක් ඇතුළත සම්පූර්ණ සවිස්තර claim එකක්."],
d:[["a","Date we became aware (or should have become aware) of the event","සිදුවීම ගැන දැනගත් (හෝ දැනගත යුතුව තිබූ) දිනය"]],
s:[["a+28:L","warn",N19[0]+" The notice must describe the event or circumstance.",N19[1]+" Notice එකේ සිදුවීම හෝ තත්ත්වය විස්තර කළ යුතුයි.",["19.1"]],
[null,"do","Also send any other notices the contract requires for that event (for example under 1.9, 4.11 or 17.4), with supporting particulars.","ඒ සිදුවීමට contract එකෙන් අවශ්‍ය අනෙක් notices (උදා: 1.9, 4.11 හෝ 17.4 යටතේ) සහාය විස්තර සමඟ යවන්න.",["19.1"]],
[null,"do","Keep contemporary records, on Site or elsewhere acceptable to the Engineer. The Engineer may monitor them or tell you to keep more; let the Engineer inspect them and give copies if asked.","Site එකේ හෝ Engineer පිළිගන්නා වෙනත් තැනක ඒ කාලයේම records තියාගන්න. Engineer ට ඒවා නිරීක්ෂණය කරන්න හෝ තවත් records තියාගන්න කියන්න පුළුවන්; Engineer ට inspect කරන්න දීලා, ඉල්ලුවොත් copies දෙන්න.",["19.1"]],
["a+84:L","do",N19D[0],N19D[1],["19.1"]],
[null,"know","The Engineer must respond within 42 days after receiving the claim (or further particulars) with approval, or disapproval and detailed comments, and then agree or determine the claim under 3.4. Each Payment Certificate includes the parts you have reasonably substantiated.","Claim එක (හෝ අමතර විස්තර) ලැබී දින 42ක් ඇතුළත Engineer approval එකක්, හෝ සවිස්තර comments සහිත disapproval එකක් දිය යුතුයි, පසුව 3.4 යටතේ claim එක එකඟ කරනවා හෝ තීරණය කරනවා. සාධාරණව ඔප්පු කළ කොටස් හැම Payment Certificate එකකටම ඇතුළත් කරනවා.",["19.1","3.4"]],
[null,"know","If you do not follow 19.1, any extension or payment takes account of how far that failure prevented or prejudiced proper investigation of the claim. (19.1 mentions a claim 'excluded under the second paragraph', but that paragraph contains no exclusion, unlike FIDIC 1999. Treat the 28-day notice as essential anyway.)","ඔබ 19.1 අනුගමනය නොකළොත්, ඒ අසමත්කම claim එක නිසි ලෙස පරීක්ෂා කිරීම කොතරම් වැළැක්වූවාද/බාධා කළාද යන්න සලකා extension හෝ ගෙවීම තීරණය කරනවා. (19.1 හි 'second paragraph යටතේ excluded' claim එකක් ගැන සඳහන් වෙනවා, හැබැයි FIDIC 1999 මෙන් නොව ඒ paragraph එකේ බැහැර කිරීමක් නැහැ. ඒ වුණත් දින 28ක notice එක අත්‍යවශ්‍ය ලෙසම සලකන්න.)",["19.1"]],

{i:"M5",c:"disp",r:"C",t:["The Engineer is not replying to our claim","Engineer අපේ claim එකට පිළිතුරු දෙන්නේ නැහැ"],
m:["The Engineer has 42 days to respond to a claim. Even if more particulars are needed, the Engineer must still respond on the principles of the claim within that time. Approvals, certificates and determinations must not be unreasonably withheld or delayed.","Claim එකකට පිළිතුරු දෙන්න Engineer ට දින 42ක් තියෙනවා. තවත් විස්තර අවශ්‍ය වුණත්, ඒ කාලය ඇතුළත claim එකේ මූලධර්ම ගැන Engineer පිළිතුරු දිය යුතුයි. Approvals, certificates සහ determinations අසාධාරණ ලෙස රඳවාගැනීම හෝ ප්‍රමාද කිරීම කරන්න බැහැ."],
d:[["a","Date the Engineer received the claim (or further particulars)","Claim එක (හෝ අමතර විස්තර) Engineer ට ලැබුණු දිනය"]],
s:[["a+42:L","know","Last day for the Engineer to respond with approval, or disapproval and detailed comments (unless another period was agreed).","Approval එකක්, හෝ සවිස්තර comments සහිත disapproval එකක් Engineer දිය යුතු අවසාන දිනය (වෙනත් කාලයක් එකඟ වී නැත්නම්).",["19.1"]],
["a+43:F","do","If there is no response, write to the Engineer asking for a response and for an agreement or determination under 3.4.","පිළිතුරක් නැත්නම්, පිළිතුරක් සහ 3.4 යටතේ agreement එකක් හෝ determination එකක් ඉල්ලලා Engineer ට ලියන්න.",["19.1","3.4","1.3"]],
[null,"if","If there is still no answer, or you disagree with the determination, treat it as a dispute and start adjudication (M1) or, on the DAB route, a DAB reference (M2).","තවමත් පිළිතුරක් නැත්නම්, හෝ determination එකට එකඟ නැත්නම්, එය dispute එකක් ලෙස සලකලා adjudication (M1), හෝ DAB මාර්ගයේ නම් DAB reference එකක් (M2) පටන් ගන්න.",["19.2","19.3"]]],
n:{f:"C",to:"EN",cl:["19.1","3.4"],sub:"Request for response to claim",b:["Our claim concerning __ was received by you on __.","Under Sub-Clause 19.1 a response with approval, or disapproval and detailed comments, was due within 42 days. We have not received it.","Please respond and proceed to agree or determine the claim under Sub-Clause 3.4."],from:"a+43"}},

{i:"M6",c:"disp",r:"C",t:["The Engineer seems unfair, or we disagree with an assistant's decision","Engineer අසාධාරණ බව පේනවා, නැත්නම් assistant කෙනෙකුගේ තීරණයකට විරුද්ධයි"],
m:["The Engineer must use discretion impartially, within the terms of the Contract and having regard to all the circumstances. Any such decision can later be opened up, reviewed or revised under Clause 19.","Engineer තම අභිමතය, Contract එකේ කොන්දේසි ඇතුළත, සියලු තත්ත්ව සලකා, අපක්ෂපාතීව භාවිත කළ යුතුයි. එවැනි ඕනෑම තීරණයක් පසුව Clause 19 යටතේ නැවත විවෘත කරන්න, සමාලෝචනය කරන්න හෝ වෙනස් කරන්න පුළුවන්."],
s:[[null,"know","When the Engineer decides, gives an opinion or consent, approves, values or takes other action affecting the Parties' rights, it must be done impartially, within the terms of the Contract and considering all the circumstances.","Engineer තීරණයක්, මතයක් හෝ අනුමැතියක් දෙන විට, approve කරන විට, value කරන විට හෝ පාර්ශව වල අයිතිවාසිකම් වලට බලපාන වෙනත් ක්‍රියාවක් කරන විට, එය අපක්ෂපාතීව, Contract එකේ කොන්දේසි ඇතුළත, සියලු තත්ත්ව සලකා කළ යුතුයි.",["3.5"]],
[null,"do","If you question an assistant's instruction or determination, refer it to the Engineer, who must promptly confirm, reverse or vary it. Unless both Parties agree, the Engineer may not delegate the power to determine matters under 3.4.","Assistant කෙනෙකුගේ instruction එකක් හෝ determination එකක් ගැන ප්‍රශ්නයක් තියෙනවා නම් Engineer ට යොමු කරන්න; Engineer එය ඉක්මනින් confirm, reverse හෝ වෙනස් කළ යුතුයි. පාර්ශව දෙකම එකඟ නොවුණොත්, 3.4 යටතේ කරුණු තීරණය කිරීමේ බලය Engineer ට delegate කරන්න බැහැ.",["3.2"]],
[null,"know","Before determining a matter under 3.4, the Engineer must consult each Party to try to reach agreement, then make a fair determination and give notice of it with supporting particulars.","3.4 යටතේ කරුණක් තීරණය කරන්න කලින්, එකඟතාවකට එන්න Engineer හැම Party එකක් සමඟම සාකච්ඡා කළ යුතුයි, පසුව සාධාරණ determination එකක් කරලා සහාය විස්තර සමඟ notice කළ යුතුයි.",["3.4"]],
[null,"know","The Engineer cannot amend the Contract, and cannot relieve either Party of its obligations unless the Conditions say so.","Engineer ට Contract එක සංශෝධනය කරන්න බැහැ, Conditions වල කියලා නැත්නම් කිසිම Party එකක් තම වගකීම් වලින් නිදහස් කරන්නත් බැහැ.",["3.1"]],
[null,"if","If you still disagree, use the dispute process (M1 or M2).","තවමත් එකඟ නැත්නම් dispute ක්‍රියාවලිය (M1 හෝ M2) භාවිත කරන්න.",["19.2"]]]}

{i:"T1",c:"tender",r:"C",t:["Something in the bidding documents is unclear, or a specification unfairly restricts bidders","Bidding documents වල පැහැදිලි නැති දෙයක් තියෙනවා, නැත්නම් specification එකක් bidders ලා අසාධාරණ ලෙස සීමා කරනවා"],
m:["Before pricing, you can ask the Employer to clarify the documents, or object to a restrictive specification. The Employer only has to answer requests it receives earlier than 14 days before the bid deadline, so ask early.","Price කරන්න කලින්, documents පැහැදිලි කරන්න කියලා Employer ගෙන් අහන්න, නැත්නම් සීමා කරන specification එකකට විරුද්ධ වෙන්න පුළුවන්. Bid deadline එකට දින 14කට වඩා කලින් ලැබෙන ඉල්ලීම් වලට පමණයි Employer පිළිතුරු දිය යුත්තේ, ඒ නිසා කලින්ම අහන්න."],
d:[["a","Bid submission deadline","Bid දිය යුතු අවසාන දිනය"]],
s:[["a-15:L","do","Your written request (letter or fax) must reach the Employer's address in the Bidding Data by this date (earlier than 14 days before the deadline). The Employer's answer, with a description of the question but not your name, is sent to everyone who bought the documents.","ඔබේ ලිඛිත ඉල්ලීම (letter හෝ fax) මේ දිනය වෙද්දී (deadline එකට දින 14කට වඩා කලින්) Bidding Data එකේ Employer address එකට ලැබිය යුතුයි. Employer ගේ පිළිතුර, ප්‍රශ්නයේ විස්තරය සමඟ නමුත් ඔබේ නම නැතිව, documents මිලදී ගත් හැමෝටම යවනවා.",["ITB 10.1","BD 10"]],
[null,"do","If a pre-bid meeting is held, send your questions in writing so they reach the Employer not later than one week before the meeting. Late questions may not be answered at the meeting. Attending the meeting is not compulsory.","Pre-bid meeting එකක් පවත්වනවා නම්, meeting එකට අවම වශයෙන් සතියකට කලින් Employer ට ලැබෙන විදිහට ප්‍රශ්න ලිඛිතව යවන්න. ප්‍රමාද ප්‍රශ්න වලට meeting එකේදී පිළිතුරු නොලැබෙන්න පුළුවන්. Meeting එකට සහභාගී වීම අනිවාර්ය නැහැ.",["ITB 19","BD 19"]],
