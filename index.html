<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Achintha Thennakoon">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBD/02 Site Action Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+Sinhala:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#E9ECEC;--card:#FFFFFF;--ink:#16232E;--mute:#56636E;--line:#CDD3D6;--blue:#1F4E79;--bluebg:#E3ECF5;--amber:#9A6700;--amberbg:#FFF3D1;--red:#B3261E;--redbg:#FBE7E5;--green:#2E6B47;--greenbg:#E2F1E8;--off:#EEF1F2;--hdr:#16232E;--hdrt:#FFFFFF;
--f:"Noto Sans Sinhala","Segoe UI",system-ui,sans-serif;--h:"Barlow Condensed","Noto Sans Sinhala",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F161C;--card:#18222B;--ink:#E6ECF0;--mute:#A3B0BA;--line:#2C3943;--blue:#8DB8E2;--bluebg:#1C2C3C;--amber:#F2C14E;--amberbg:#3A2F12;--red:#F08A80;--redbg:#3B1D1A;--green:#8CCBA4;--greenbg:#16301F;--off:#1F2A33;--hdr:#070C10;--hdrt:#E6ECF0}}
:root[data-theme="dark"]{--bg:#0F161C;--card:#18222B;--ink:#E6ECF0;--mute:#A3B0BA;--line:#2C3943;--blue:#8DB8E2;--bluebg:#1C2C3C;--amber:#F2C14E;--amberbg:#3A2F12;--red:#F08A80;--redbg:#3B1D1A;--green:#8CCBA4;--greenbg:#16301F;--off:#1F2A33;--hdr:#070C10;--hdrt:#E6ECF0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdrt)}
header .in{max-width:720px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:8px}
.logo{font-family:var(--h);font-weight:600;font-size:21px;letter-spacing:.3px;line-height:1.05;min-width:0}
.logo small{display:block;font-family:var(--f);font-weight:400;font-size:11px;opacity:.75;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:7px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--hdrt);padding:4px 9px;font-size:13px}
.lang button.on{background:var(--hdrt);color:var(--hdr);font-weight:600}
.hb{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--hdrt);border-radius:7px;padding:4px 9px;font-size:15px;line-height:1}
h1,h2,h3{font-weight:600;line-height:1.25;margin:0}
h1{font-family:var(--h);font-size:30px}
.si h1{font-family:var(--f);font-size:24px}
h2{font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.cat i{font-size:22px;color:var(--blue)}
.cat b{font-weight:500;font-size:14px;line-height:1.35}
.cat span{font-size:12px;color:var(--mute)}
.ev{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:0;padding:11px 12px;margin:0 0 8px;line-height:1.5}
.ev small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.ev.rare{border-left-color:var(--amber)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--card)}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.chip{display:inline-block;border:0;background:var(--bluebg);color:var(--blue);font-family:var(--h);font-weight:600;font-size:15px;padding:1px 9px;border-radius:5px;margin:2px 4px 2px 0;letter-spacing:.2px}
.what{background:var(--bluebg);border-radius:10px;padding:12px 14px;margin-top:12px}
.what b{display:block;font-size:13px;color:var(--blue);font-weight:600;margin-bottom:2px}
.ent{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.ent div{text-align:center;padding:7px 4px;font-family:var(--h);font-weight:600;font-size:18px;letter-spacing:.5px;color:var(--mute);background:var(--off);border-right:2px solid var(--ink)}
.ent div:last-child{border-right:0}
.ent div.y{background:var(--greenbg);color:var(--green)}
.ent div.c{background:var(--amberbg);color:var(--amber)}
.enl{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.enl li{padding:4px 0;border-top:1px solid var(--line)}
.enl b{font-weight:600}
.ent div small{display:block;font-family:var(--f);font-weight:500;font-size:11px;letter-spacing:0}
.st{position:relative;padding:0 0 18px 34px;border-left:2px solid var(--line);margin-left:12px}
.st:last-child{border-left-color:transparent;padding-bottom:4px}
.num{position:absolute;left:-13px;top:0;width:24px;height:24px;border-radius:50%;background:var(--card);border:2px solid var(--blue);color:var(--blue);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-family:var(--f)}
.st.kL .num{background:var(--amber);border-color:var(--amber);color:var(--card)}
.st.kLx .num{background:var(--red);border-color:var(--red);color:var(--card)}
.st.kF .num{background:var(--green);border-color:var(--green);color:var(--card)}
.st.kO .num{background:var(--blue);border-color:var(--blue);color:var(--card)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:1.3}
.ty{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}
.ty.do{background:var(--bluebg);color:var(--blue)}.ty.know{background:var(--off);color:var(--mute)}.ty.if{background:var(--amberbg);color:var(--amber)}.ty.warn{background:var(--redbg);color:var(--red)}
.dt{font-family:var(--h);font-weight:600;font-size:18px}
.dl{font-size:12px;padding:1px 7px;border-radius:4px;font-weight:500}
.dl.f{background:var(--amberbg);color:var(--amber)}.dl.p{background:var(--redbg);color:var(--red)}.dl.t{background:var(--greenbg);color:var(--green)}.dl.n{background:var(--off);color:var(--mute)}
.dk{font-size:13px;font-weight:600;color:var(--mute);margin-right:2px}
.note{font-size:13px;color:var(--mute)}
.warn{background:var(--amberbg);border-radius:8px;padding:9px 11px;font-size:14px;margin-top:6px}
.bad{background:var(--redbg)}.good{background:var(--greenbg)}
.sec{margin:20px 0 8px;font-size:14px;color:var(--mute);font-weight:600}
.inp label{display:block;font-size:14px;color:var(--mute);margin-bottom:3px}
.inp input,.inp select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.btn{border:1px solid var(--ink);background:var(--card);border-radius:8px;padding:9px 14px;font-size:14px}
.btn.pri{background:var(--ink);color:var(--card)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:8px 2px 6px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-size:21px}
nav button.on{color:var(--blue);font-weight:600}
textarea{width:100%;min-height:240px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);font-size:13px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.cl{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 2px;line-height:1.45}
.cl b{font-family:var(--h);font-weight:600;font-size:16px;margin-right:8px;color:var(--blue)}
.cl .n{float:right;font-size:12px;color:var(--mute)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600;font-size:14px}
.gw{padding:8px 0;border-bottom:1px solid var(--line)}
.gw:last-child{border-bottom:0}
.gw b{font-weight:600}
@media (max-width:420px){.logo{font-size:18px}.logo small{font-size:10px}}
.credit{text-align:center;font-size:12px;color:var(--mute);margin:26px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.foot{font-size:12px;color:var(--mute);margin-top:28px;line-height:1.6}

/* ===== v4.2 UI layer: presentation only (no data or logic changes) ===== */
:root{--bg:#F6F7F9;--card:#FFFFFF;--ink:#0F172A;--mute:#5B6678;--line:#E3E8EF;--hair:rgba(15,23,42,.07);
--blue:#1D4ED8;--bluebg:#EEF3FF;--amber:#A15C07;--amberbg:#FEF3DC;--red:#B42318;--redbg:#FEECEB;--green:#067647;--greenbg:#E7F6EE;--off:#F1F4F8;
--hdr:rgba(255,255,255,.74);--hdrt:#0F172A;--navbg:rgba(255,255,255,.80);
--sh:0 1px 2px rgba(15,23,42,.04),0 4px 20px -2px rgba(15,23,42,.06);--sh2:0 2px 6px rgba(15,23,42,.06),0 14px 32px -8px rgba(15,23,42,.16);
--ring:0 0 0 4px rgba(29,78,216,.14);--ease:cubic-bezier(.4,0,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#111B2E;--ink:#E6EBF3;--mute:#9AA6BA;--line:#22304A;--hair:rgba(148,163,184,.10);
--blue:#8AB0FF;--bluebg:#172746;--amber:#F5C35B;--amberbg:#2B2312;--red:#F79A91;--redbg:#2E1719;--green:#5FD4A2;--greenbg:#0F2A21;--off:#16223A;
--hdr:rgba(11,18,32,.72);--hdrt:#E6EBF3;--navbg:rgba(13,21,37,.80);
--sh:0 1px 2px rgba(0,0,0,.30),0 4px 20px -2px rgba(0,0,0,.35);--sh2:0 2px 6px rgba(0,0,0,.35),0 16px 36px -8px rgba(0,0,0,.55);--ring:0 0 0 4px rgba(138,176,255,.20)}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#111B2E;--ink:#E6EBF3;--mute:#9AA6BA;--line:#22304A;--hair:rgba(148,163,184,.10);
--blue:#8AB0FF;--bluebg:#172746;--amber:#F5C35B;--amberbg:#2B2312;--red:#F79A91;--redbg:#2E1719;--green:#5FD4A2;--greenbg:#0F2A21;--off:#16223A;
--hdr:rgba(11,18,32,.72);--hdrt:#E6EBF3;--navbg:rgba(13,21,37,.80);
--sh:0 1px 2px rgba(0,0,0,.30),0 4px 20px -2px rgba(0,0,0,.35);--sh2:0 2px 6px rgba(0,0,0,.35),0 16px 36px -8px rgba(0,0,0,.55);--ring:0 0 0 4px rgba(138,176,255,.20)}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:.005em}
h1{letter-spacing:-.01em}h2{letter-spacing:-.005em;font-weight:600}
/* frosted header */
header{background:var(--hdr);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--hair);box-shadow:0 1px 0 rgba(15,23,42,.02)}
.logo{letter-spacing:.2px}
.logo small{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;opacity:.72;margin-top:2px;line-height:1.35}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px}
.lang button{color:var(--mute);border-radius:999px;transition:all .2s var(--ease)}
.lang button.on{background:var(--ink);color:var(--card)}
.hb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:34px;height:34px;padding:0;transition:all .2s var(--ease)}
/* cards and lists */
.card,.cat,.ev,details{border:1px solid var(--hair);box-shadow:var(--sh)}
.card,details{border-radius:14px}
.cat{border-radius:14px;padding:14px}
.cat i{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--bluebg);font-size:19px}
.cat b{font-weight:600;letter-spacing:-.003em}
.ev{border-radius:12px;border-left:3px solid var(--blue);padding:12px 14px;font-weight:500;letter-spacing:-.003em}
.ev.rare{border-left-color:var(--amber)}
.ev small{font-weight:400}
.cat,.ev,.btn,.chip,.seg button,.cl,nav button,.hb,details,summary{transition:all .2s cubic-bezier(.4,0,.2,1)}
@media (hover:hover){.cat:hover,.ev:hover{transform:translateY(-2px);box-shadow:var(--sh2)}.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}.chip:hover{filter:brightness(.97)}.cl:hover{background:var(--off)}.hb:hover,.lang button:hover{color:var(--ink)}}
.cat:active,.ev:active,.btn:active{transform:translateY(0) scale(.99);box-shadow:var(--sh)}
.btn{border-radius:10px;border:1px solid var(--line);font-weight:500}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -6px rgba(29,78,216,.45)}
:root[data-theme="dark"] .btn.pri{color:#0B1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0B1220}}
.seg{border-radius:10px;border:1px solid var(--hair);box-shadow:var(--sh);padding:2px;gap:2px}
.seg button{border-radius:8px}
/* search and inputs */
.search{border-radius:12px;border:1px solid var(--line);box-shadow:var(--sh);padding:12px 14px}
.search:focus,.inp input:focus,.inp select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:var(--ring)}
.inp input,.inp select,textarea{border-radius:10px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
/* callouts */
.what{border-radius:12px;border:1px solid var(--hair)}
.warn{border-radius:10px}
/* pills */
.chip{border-radius:999px;padding:2px 10px;font-size:14px;letter-spacing:.3px;border:1px solid transparent}
.dl{border-radius:999px;padding:2px 9px}
.ty{border-radius:999px;padding:2px 9px;letter-spacing:.2px}
/* entitlement status pills */
.ent{border:0;border-radius:0;overflow:visible;gap:8px}
.ent div{border:1px solid var(--hair);border-right:1px solid var(--hair);border-radius:12px;background:var(--off);font-size:16px;letter-spacing:.8px;padding:9px 4px}
.ent div:last-child{border-right:1px solid var(--hair)}
.ent div.y{background:var(--greenbg);color:var(--green);border-color:rgba(6,118,71,.18)}
.ent div.c{background:var(--amberbg);color:var(--amber);border-color:rgba(161,92,7,.18)}
.ent div small{font-weight:600;opacity:.9;margin-top:1px}
/* timeline */
.st{border-left:2px solid var(--line)}
.num{box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--bluebg);font-weight:700}
.st.kL .num{box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--amberbg),0 0 14px rgba(245,158,11,.35)}
.st.kLx .num{box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--redbg),0 0 14px rgba(220,38,38,.35)}
.st.kF .num{box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--greenbg),0 0 14px rgba(16,185,129,.30)}
.st.kO .num{box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--bluebg),0 0 14px rgba(59,130,246,.28)}
/* frosted bottom nav */
nav{background:var(--navbg);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-top:1px solid var(--hair)}
nav button{position:relative;font-weight:500}
nav button i{padding:3px 16px;border-radius:999px;transition:all .2s var(--ease)}
nav button.on i{background:var(--bluebg);box-shadow:0 0 16px -2px rgba(59,130,246,.35);transform:translateY(-1px)}
nav button.on{color:var(--blue);font-weight:600}
/* credit and about */
.credit a{color:var(--blue);font-weight:600;text-decoration:none;transition:all .2s var(--ease);border-radius:6px;padding:1px 3px}
.credit a:hover,.credit a:focus-visible{background:var(--bluebg);text-shadow:0 0 12px rgba(59,130,246,.35)}
.about{margin-top:16px;position:relative;overflow:hidden}
.about::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--blue),#7C3AED)}
.about h2{font-size:18px;margin:4px 0 6px}
.about p{margin:0 0 12px;color:var(--mute);font-size:14px;line-height:1.65}
.abadge{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--bluebg);color:var(--blue);font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--hair);transition:all .2s var(--ease)}
.abadge .dot{width:22px;height:22px;border-radius:6px;background:var(--blue);color:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--f)}
@media (hover:hover){.abadge:hover{transform:translateY(-2px);box-shadow:var(--sh2)}}
.noicons .cat i,.noicons nav button i,.noicons .ev i{display:none}
.noicons nav button{padding:14px 2px 12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.cat:hover,.ev:hover,.btn:hover,.abadge:hover{transform:none}}
</style>
</head>
<body>
<header><div class="in"><div class="logo">SBD/02 Site Action Guide<small>ICTAD/SBD/02 · Major Contracts · Developed by Achintha Thennakoon</small></div>
<div class="tg"><div class="lang" role="group" aria-label="Language"><button data-a="lang" data-l="en" id="l_en">EN</button><button data-a="lang" data-l="si" id="l_si">සිං</button></div><button class="hb" data-a="theme" aria-label="Light or dark mode">◐</button></div></div></header>
<main class="wrap" id="app"></main>
<nav><div class="in">
<button data-a="go" data-v="home"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span data-t="nProb"></span></button>
<button data-a="go" data-v="clauses"><i class="ti ti-book" aria-hidden="true"></i><span data-t="nCl"></span></button>
<button data-a="go" data-v="dates"><i class="ti ti-calendar" aria-hidden="true"></i><span data-t="nDl"></span></button>
<button data-a="go" data-v="proj"><i class="ti ti-settings" aria-hidden="true"></i><span data-t="nPr"></span></button>
</div></nav>
<script>
const CATS=[
["tender",["Tender / bidding","Tender / Bid"],"ti-file-description"],
["start",["Starting the contract","Contract ආරම්භය"],"ti-flag"],
["time",["Time, delays and EOT","කාලය, ප්‍රමාද සහ EOT"],"ti-clock"],
["pay",["Payments","ගෙවීම්"],"ti-cash"],
["var",["Changes (variations) and measurement","වෙනස්කම් (variations) සහ measurement"],"ti-ruler-measure"],
["site",["Site conditions and safety","Site තත්ත්ව සහ ආරක්ෂාව"],"ti-building-factory-2"],
["qual",["Quality, tests and defects","Quality, tests සහ defects"],"ti-checklist"],
["sub",["Subcontractors and staff","Subcontractors සහ staff"],"ti-users"],
["susp",["Stopping work (suspension)","වැඩ නැවැත්වීම (suspension)"],"ti-player-pause"],
["risk",["Risk, insurance and Force Majeure","අවදානම්, insurance සහ Force Majeure"],"ti-umbrella"],
["comp",["Finishing and handover","ඉවර කිරීම සහ handover"],"ti-key"],
["term",["Ending the contract (termination)","Contract එක අවසන් කිරීම (termination)"],"ti-ban"],
["disp",["Claims and disputes","Claims සහ disputes"],"ti-scale"],

EV.push(
{i:"T1",c:"tender",r:"C",t:["Something in the tender documents is not clear, or a specification unfairly limits bidders","Tender documents වල පැහැදිලි නැති දෙයක් තියෙනවා, නැත්නම් specification එකක් bidders ලා අසාධාරණ ලෙස සීමා කරනවා"],
m:["Before you price the job, you can ask the Employer (the client) to explain anything unclear. You can also object if a specification is written so only one supplier can meet it. There is a time limit, so ask early.","Job එක price කරන්න කලින්, පැහැදිලි නැති ඕනෑම දෙයක් පැහැදිලි කරන්න කියලා Employer (client) ගෙන් අහන්න පුළුවන්. එක supplier කෙනෙකුට විතරක් ගැළපෙන විදිහට specification එකක් ලියලා තිබුණොත් විරුද්ධත්වය පළ කරන්නත් පුළුවන්. කාල සීමාවක් තියෙන නිසා කලින්ම අහන්න."],
d:[["a","Bid submission deadline","Bid එක දිය යුතු අවසාන දිනය"]],
s:[["a-15","do","Send your question in writing (letter or fax) to the Employer's address given in the Bidding Data. The Employer only has to answer questions it receives more than 14 days before the deadline. The answer goes to all bidders, without your name.","ඔබේ ප්‍රශ්නය ලිඛිතව (letter හෝ fax) Bidding Data එකේ තියෙන Employer ගේ address එකට යවන්න. Deadline එකට දින 14කට වඩා කලින් ලැබෙන ප්‍රශ්න වලට පමණයි Employer පිළිතුරු දීමට බැඳී සිටින්නේ. පිළිතුර ඔබේ නම නැතිව සියලු bidders ලාට යවනවා.",["ITB 10.1"]],
[null,"do","If there is a pre-bid meeting, send your questions in writing at least one week before the meeting. Late questions may not be answered at the meeting.","Pre-bid meeting එකක් තියෙනවා නම්, ප්‍රශ්න meeting එකට අවම වශයෙන් සතියකට කලින් ලිඛිතව යවන්න. ප්‍රමාද වී ලැබෙන ප්‍රශ්න වලට meeting එකේදී පිළිතුරු නොලැබෙන්න පුළුවන්.",["ITB 19.3"]],
[null,"warn","The documents only change through a written addendum. What people say at the meeting, or in the minutes, does not change the documents.","Documents වෙනස් වෙන්නේ ලිඛිත addendum එකකින් පමණයි. Meeting එකේ කියන දේ හෝ minutes වල තියෙන දේ documents වෙනස් කරන්නේ නැහැ.",["ITB 19.4","ITB 11.1"]]],
k:["Copy of your question and the Employer's reply","ඔබ යැවූ ප්‍රශ්නයේ copy එක සහ Employer ගේ පිළිතුර"]},

{i:"T2",c:"tender",r:"C",t:["We received an addendum (a change to the tender documents)","Addendum එකක් (tender documents වලට වෙනස්කමක්) ලැබුණා"],
m:["An addendum is an official change to the tender documents. It becomes part of the documents, so your price must follow it.","Addendum එකක් කියන්නේ tender documents වලට කරන නිල වෙනස්කමක්. ඒක documents වල කොටසක් වෙන නිසා ඔබේ price එක ඒ අනුව හදන්න ඕනේ."],
s:[[null,"do","Tell the Employer quickly (by fax or letter) that you received the addendum.","Addendum එක ලැබුණු බව ඉක්මනින් (fax හෝ letter එකකින්) Employer ට දන්වන්න.",["ITB 11.2"]],
[null,"do","Update your rates and bid to follow the addendum. It is now part of the tender documents.","Addendum එකට අනුව rates සහ bid එක update කරන්න. දැන් එය tender documents වල කොටසක්.",["ITB 9.1"]],
[null,"know","If there is not enough time to include the change, the Employer can move the deadline later.","වෙනස්කම ඇතුළත් කරන්න කාලය මදි නම්, Employer ට deadline එක කල් දාන්න පුළුවන්.",["ITB 11.3","ITB 22.2"]]],
k:["A list of all addenda received","ලැබුණු සියලු addenda ලැයිස්තුවක්"]},

{i:"T3",c:"tender",r:"C",t:["The Employer asks us to keep our bid valid for longer","Bid එක තව කාලයක් valid ලෙස තියාගන්න Employer ඉල්ලනවා"],
m:["Every bid is valid only for a fixed time. If the Employer needs more time to decide, it can ask you to extend. You are free to say no.","හැම bid එකක්ම valid වෙන්නේ නියමිත කාලයකට පමණයි. තීරණය කරන්න Employer ට තව කාලයක් ඕනේ නම්, ඒ කාලය දිගු කරන්න ඉල්ලන්න පුළුවන්. ඔබට ප්‍රතික්ෂේප කරන්නත් පුළුවන්."],
s:[[null,"know","You can say no. You will not lose your bid security for saying no.","ඔබට බැහැ කියන්න පුළුවන්. එසේ කිව්වට bid security එක අහිමි වෙන්නේ නැහැ.",["ITB 16.2"]],
[null,"warn","If you say yes, you cannot change your price. You must also extend your bid security so it stays valid 28 days after the new validity date.","ඔව් කිව්වොත් price එක වෙනස් කරන්න බැහැ. ඒ වගේම bid security එකත් නව validity දිනයෙන් දින 28ක් යනතුරු valid වෙන විදිහට දිගු කරන්න ඕනේ.",["ITB 16.2","ITB 17","BD 17.2"]],
[null,"do","Give your answer in writing.","ඔබේ පිළිතුර ලිඛිතව දෙන්න.",["ITB 16.2"]]],
k:["The extension request, your reply and the extended security","Extension ඉල්ලීම, ඔබේ පිළිතුර සහ දිගු කළ security එක"]},

{i:"T4",c:"tender",r:"C",t:["We want to change or withdraw our bid after sending it","Bid එක යැව්වාට පස්සේ ඒක වෙනස් කරන්න හෝ ආපසු ගන්න ඕනේ"],
m:["You can still change or withdraw your bid, but only before the deadline. After the deadline your bid is locked.","ඔබට bid එක වෙනස් කරන්න හෝ ආපසු ගන්න පුළුවන්, හැබැයි deadline එකට කලින් පමණයි. Deadline එකෙන් පස්සේ bid එක lock වෙනවා."],
d:[["a","Bid submission deadline","Bid එක දිය යුතු අවසාන දිනය"]],
s:[["a","do","Send a written notice that reaches the Employer before the deadline. Seal it in envelopes marked MODIFICATION or WITHDRAWAL.","Deadline එකට කලින් Employer ට ලැබෙන විදිහට ලිඛිත notice එකක් යවන්න. ඒක MODIFICATION හෝ WITHDRAWAL ලෙස mark කළ envelopes වල seal කරන්න.",["ITB 24.1","ITB 24.2"]],
[null,"warn","After the deadline you cannot change your bid (only the Employer's correction of maths errors is allowed).","Deadline එකෙන් පස්සේ bid එක වෙනස් කරන්න බැහැ (Employer කරන ගණිත දෝෂ නිවැරදි කිරීම විතරයි අවසර).",["ITB 24.3"]],
[null,"warn","If you withdraw after the deadline but while the bid is still valid, you can lose your bid security.","Deadline එකෙන් පස්සේ, bid එක තවම valid කාලයේ ආපසු ගත්තොත් bid security එක අහිමි වෙන්න පුළුවන්.",["ITB 24.4","ITB 17.6"]],
[null,"know","A discount can only be offered inside the original bid or through a proper modification.","Discount එකක් දෙන්න පුළුවන් මුල් bid එකේ හෝ නිසි modification එකක් හරහා පමණයි.",["ITB 24.5"]]]},

{i:"T5",c:"tender",r:"C",t:["The Employer corrected maths errors in our bid","Employer අපේ bid එකේ ගණිත දෝෂ (arithmetic errors) නිවැරදි කළා"],
m:["When the Employer checks bids, it fixes calculation mistakes using fixed rules. You must accept the corrected total, or your bid is rejected.","Employer bids check කරද්දී, නියමිත නීති අනුව ගණන් කිරීමේ වැරදි නිවැරදි කරනවා. නිවැරදි කළ මුළු මුදල ඔබ පිළිගන්න ඕනේ, නැත්නම් bid එක reject වෙනවා."],
s:[[null,"know","If the amount in words and the amount in figures are different, the amount in words is used.","වචන වලින් ලියූ මුදල සහ ඉලක්කම් වලින් ලියූ මුදල වෙනස් නම්, වචන වලින් ලියූ මුදල ගන්නවා.",["ITB 29.1"]],
[null,"know","If rate × quantity does not match the line total, the rate is used. But if the decimal point in the rate is clearly in the wrong place, the line total is used and the rate is fixed.","Rate × quantity එක line total එකට නොගැළපේ නම්, rate එක ගන්නවා. හැබැයි rate එකේ දශම තිත පැහැදිලිවම වැරදි තැනක නම්, line total එක අරගෙන rate එක නිවැරදි කරනවා.",["ITB 29.1"]],
[null,"warn","If you agree, the corrected price binds you. If you do not agree, your bid is rejected and you may lose your bid security.","ඔබ එකඟ වුණොත් නිවැරදි කළ මිල ඔබට බැඳෙනවා. එකඟ නොවුණොත් bid එක reject වෙලා bid security එක අහිමි වෙන්න පුළුවන්.",["ITB 29.2","ITB 29.3","ITB 17.6"]]]},

{i:"T6",c:"tender",r:"B",t:["Our rates look too low, or the bid looks unbalanced (front-loaded)","අපේ rates ඕනෑවට වඩා අඩුයි, නැත්නම් bid එක unbalanced (front-loaded) කියලා පේනවා"],
m:["If some rates look unrealistic, the Employer worries the contractor may fail later. It can ask for proof of the rates and ask for a bigger security.","සමහර rates යථාර්ථවාදී නැති බව පෙනුණොත්, contractor පස්සේ අසාර්ථක වෙයි කියලා Employer ට බයක් ඇති වෙනවා. ඒ නිසා rates වලට සාක්ෂි ඉල්ලන්නත්, වැඩි security එකක් ඉල්ලන්නත් පුළුවන්."],
s:[[null,"know","The Employer can ask you for a detailed price breakdown (rate analysis) for any BOQ item.","ඕනෑම BOQ item එකකට සවිස්තර price breakdown එකක් (rate analysis) Employer ට ඉල්ලන්න පුළුවන්.",["ITB 30.5","ITB 27.1"]],
[null,"know","The Employer can ask for a larger Performance Security to protect itself.","තමන්ව ආරක්ෂා කරගන්න Employer ට වැඩි Performance Security එකක් ඉල්ලන්න පුළුවන්.",["ITB 30.5","ITB 35.3"]],
[null,"warn","When you answer these questions, you cannot change your price or the main content of your bid.","මේ ප්‍රශ්න වලට පිළිතුරු දෙද්දී ඔබේ price එක හෝ bid එකේ ප්‍රධාන අන්තර්ගතය වෙනස් කරන්න බැහැ.",["ITB 27.1"]]]},

{i:"T7",c:"tender",r:"C",t:["We did not win the tender and want to appeal","Tender එක අපට ලැබුණේ නැහැ, appeal කරන්න ඕනේ"],
m:["Before the contract is signed, the Employer tells all bidders who it plans to choose. If you think the decision is wrong, you have only one week to complain to the right office.","Contract එක sign කරන්න කලින්, තෝරන්න හිතාගෙන ඉන්න bidder කවුද කියලා Employer සියලු bidders ලාට දන්වනවා. තීරණය වැරදියි කියලා හිතෙනවා නම්, අදාළ ආයතනයට පැමිණිලි කරන්න ඔබට තියෙන්නේ සතියයි."],
d:[["a","Date we received the award notice","Award notice එක ලැබුණු දිනය"]],
s:[["a+7","do","Send your complaint within one week. For CAPC-level tenders: send it to the Procurement Appeal Board (Presidential Secretariat) with a Rs. 50,000 cash deposit. For MPC-level tenders: send it to the Secretary of the Line Ministry.","සතියක් ඇතුළත පැමිණිල්ල යවන්න. CAPC මට්ටමේ tenders: Procurement Appeal Board (Presidential Secretariat) එකට, Rs. 50,000 cash deposit එකක් සමඟ. MPC මට්ටමේ tenders: Line Ministry එකේ Secretary ට.",["BD 32"]],
[null,"warn","Your complaint must explain everything on its own. If the decision is not changed in your favour, you lose the deposit.","ඔබේ පැමිණිල්ල තනියම සියල්ල පැහැදිලි කරන විදිහට ලියන්න ඕනේ. තීරණය ඔබට පක්ෂව වෙනස් නොවුණොත් deposit එක අහිමි වෙනවා.",["BD 32"]]],
k:["The notice, your evaluation points and the deposit receipt","Notice එක, ඔබේ කරුණු සහ deposit receipt එක"]},

{i:"T8",c:"tender",r:"C",t:["Our bid security has not been returned","අපේ bid security එක ආපසු ලැබුණේ නැහැ"],
m:["A bid security is a bank guarantee you give with your bid. If you did not win, the Employer must return it within a set time.","Bid security එක කියන්නේ bid එක එක්ක දෙන bank guarantee එකක්. Tender එක නොලැබුණොත් නියමිත කාලයක් ඇතුළත Employer එය ආපසු දිය යුතුයි."],
d:[["a","Date the bid validity ended","Bid validity එක අවසන් වූ දිනය"]],
s:[["a+28","know","If you did not win, the Employer must return it no later than 28 days after the bid validity ends.","Tender එක නොලැබුණා නම්, bid validity එක අවසන් වී දින 28කට පස්සේ නොවී Employer එය ආපසු දිය යුතුයි.",["ITB 17.4"]],
[null,"know","If you won, it is returned after you sign the Agreement and give the Performance Security.","ඔබ දිනුවා නම්, Agreement එක sign කරලා Performance Security එක දුන්නාට පස්සේ ආපසු දෙනවා.",["ITB 17.5","ITB 34.3"]]]},

{i:"T9",c:"tender",r:"C",t:["We want to bid as a Joint Venture (JV)","Joint Venture (JV) එකක් විදිහට bid කරන්න ඕනේ"],
m:["A Joint Venture is two or more companies bidding together. The rules make sure each partner is strong enough and that all partners are responsible for the whole job.","Joint Venture එකක් කියන්නේ companies දෙකක් හෝ වැඩි ගණනක් එකතු වෙලා bid කරන එක. හැම partner කෙනෙක්ම ප්‍රමාණවත් තරම් ශක්තිමත් බවත්, සියලු partners මුළු job එකටම වගකියන බවත් නීති වලින් සහතික කරනවා."],
s:[[null,"do","Give the qualification information for every partner. Name one lead partner, with a power of attorney signed by all partners.","හැම partner කෙනෙකුගේම qualification තොරතුරු දෙන්න. එක lead partner කෙනෙක් නම් කරලා, සියලු partners sign කළ power of attorney එකක් දෙන්න.",["ITB 5.1"]],
[null,"warn","Each partner must meet at least 25% of the key requirements (registration, turnover, Contract Manager). The lead partner must meet at least 40%.","හැම partner කෙනෙක්ම ප්‍රධාන අවශ්‍යතා (registration, turnover, Contract Manager) වලින් අවම 25%ක් සපුරන්න ඕනේ. Lead partner අවම 40%ක් සපුරන්න ඕනේ.",["ITB 5.2"]],
[null,"know","All partners are responsible together and each one alone for the whole contract. Attach the JV agreement (or an MOU) to the bid.","සියලු partners එකට සහ තනි තනිවත් මුළු contract එකටම වගකියනවා. JV agreement එක (හෝ MOU එකක්) bid එකට අමුණන්න.",["ITB 5.1","1.14"]]]},

{i:"T10",c:"tender",r:"C",t:["What do we need to qualify for this tender?","මේ tender එකට සුදුසුකම් ලබන්න මොනවද ඕනේ?"],
m:["Before bidding, check that your company meets the minimum requirements. If you do not meet them, your bid will not win even if it is the cheapest.","Bid කරන්න කලින් ඔබේ company එක අවම අවශ්‍යතා සපුරනවද බලන්න. ඒවා නැත්නම් අඩුම මිල වුණත් bid එක දිනන්නේ නැහැ."],
s:[[null,"do","Read the scope, time for completion and source of funds in the Bidding Data.","Bidding Data එකේ තියෙන scope, time for completion සහ funds ලැබෙන තැන කියවන්න.",["ITB 1.1","ITB 2.1"]],
[null,"warn","Typical minimums: valid ICTAD (now CIDA) registration in the right grade, average yearly turnover for the last 5 years, at least one similar job in the last 10 years (at least 70% complete), key equipment, a qualified Contract Manager, enough cash or credit, and not blacklisted.","සාමාන්‍ය අවම අවශ්‍යතා: නිවැරදි grade එකේ valid ICTAD (දැන් CIDA) registration, පසුගිය වසර 5 සාමාන්‍ය වාර්ෂික turnover, පසුගිය වසර 10 තුළ සමාන job එකක් (අවම 70% complete), ප්‍රධාන equipment, සුදුසුකම් ඇති Contract Manager කෙනෙක්, ප්‍රමාණවත් මුදල් හෝ credit, සහ blacklist වී නොසිටීම.",["ITB 4.2","BD 4.2"]],
[null,"do","If there was no pre-qualification, also attach 3 years of financial reports, current work commitments, and plans to subcontract any part over 10%.","Pre-qualification එකක් නොතිබුණා නම්, වසර 3ක financial reports, දැනට කරන වැඩ, සහ 10%ට වඩා subcontract කරන කොටස් ගැන විස්තරත් අමුණන්න.",["ITB 4.1"]]]},

{i:"S1",c:"start",r:"C",t:["We received the Letter of Acceptance (LOA). What next?","Letter of Acceptance (LOA) එක ලැබුණා. ඊළඟට මොනවද කරන්න ඕනේ?"],
m:["The LOA means you won the job and the contract now exists. Many deadlines start from the day you receive it, so act fast.","LOA එකෙන් අදහස් වෙන්නේ ඔබ job එක දිනුවා, contract එක දැන් ආරම්භ වුණා කියන එකයි. ගොඩක් deadlines පටන් ගන්නේ ඒක ලැබුණු දවසේ ඉඳන්, ඒ නිසා ඉක්මනින් වැඩ කරන්න."],
d:[["a","Date we received the LOA","LOA එක ලැබුණු දිනය"]],
s:[["a+14","do","Give the Performance Security (a bank guarantee, usually 5% of the contract price, as stated in the Contract Data) to the Employer.","Performance Security එක (bank guarantee එකක්, සාමාන්‍යයෙන් contract price එකෙන් 5%, Contract Data එකේ තියෙන විදිහට) Employer ට දෙන්න.",["4.2","ITB 35.1"]],
["a+14","do","Take out the insurances in the joint names of the Employer and you: the Works (at least 115% of the contract price), your equipment (full replacement value), third-party damage (limit in the Contract Data), and your workers.","Employer ගේ සහ ඔබේ joint names වලින් insurances ගන්න: Works (contract price එකෙන් අවම 115%), ඔබේ equipment (සම්පූර්ණ replacement value), third-party damage (Contract Data එකේ සීමාව), සහ ඔබේ workers.",["18.1","18.2","18.3"]],
["a+14","know","The Employer should hand over the site by this date (unless the Contract Data gives another date).","Employer මේ දිනය වෙද්දී site එක භාර දිය යුතුයි (Contract Data එකේ වෙනත් දිනයක් නැත්නම්).",["2.1"]],
["a+14","know","The start date (Commencement Date) is normally within 14 days. The Engineer must tell you at least 7 days before.","වැඩ පටන් ගන්න දිනය (Commencement Date) සාමාන්‍යයෙන් දින 14ක් ඇතුළත. Engineer ඒ ගැන අවම වශයෙන් දින 7කට කලින් ඔබට දන්වන්න ඕනේ.",["8.1"]],
["a+28","do","Sign the Contract Agreement. You pay the stamp duty.","Contract Agreement එක sign කරන්න. Stamp duty ඔබ ගෙවන්න ඕනේ.",["1.6","ITB 34.6"]],
[null,"do","Before the start date, send the name and details of your site head (Contractor's Representative) to the Engineer for approval.","Start date එකට කලින්, ඔබේ site head (Contractor's Representative) ගේ නම සහ විස්තර Engineer ගේ අනුමැතියට යවන්න.",["4.3"]],
[null,"do","If you want the advance payment (up to 20% of the price), give an advance payment guarantee. The Employer pays the first part within 14 days after it has the Performance Security and this guarantee.","Advance payment එක (price එකෙන් 20% දක්වා) ඕනේ නම්, advance payment guarantee එකක් දෙන්න. Performance Security එක සහ මේ guarantee එක ලැබී දින 14ක් ඇතුළත Employer පළමු කොටස ගෙවනවා.",["14.2","14.6","ITB 36"]]],
k:["LOA, copies of securities and insurance policies, delivery receipts","LOA, securities සහ insurance policies වල copies, භාරදුන් receipts"]},

{i:"S2",c:"start",r:"C",t:["We received the notice to start work (Commencement)","වැඩ පටන් ගන්න notice එක (Commencement) ලැබුණා"],
m:["From the Commencement Date, the contract time starts running. Several documents are due in the first weeks.","Commencement Date එකේ ඉඳන් contract කාලය ගණන් වෙන්න පටන් ගන්නවා. මුල් සති කිහිපය තුළ documents කිහිපයක් දිය යුතුයි."],
d:[["a","Date we received the notice","Notice එක ලැබුණු දිනය"],["b","Commencement Date","Commencement Date"]],
s:[["b","do","Start work as soon as you reasonably can, and keep going without delay.","හැකි ඉක්මනින් වැඩ පටන් අරගෙන ප්‍රමාදයකින් තොරව කරගෙන යන්න.",["8.1"]],
["a+14","do","Give the Engineer a detailed work programme. Include the order of work, methods, and how many workers and machines you will use at each stage.","Engineer ට සවිස්තර work programme එකක් දෙන්න. වැඩ කරන අනුපිළිවෙල, ක්‍රම, සහ හැම අදියරකටම workers සහ machines කීයක් යොදවනවද කියලා ඇතුළත් කරන්න.",["8.3"]],
["b+28","do","Give a breakdown of every lump-sum item in the BOQ.","BOQ එකේ තියෙන හැම lump-sum item එකකම breakdown එකක් දෙන්න.",["14.1(d)"]],
["b+28","do","Agree with the Employer on an Adjudicator (a neutral person who decides disputes). For contracts of LKR 500 million or more, set up a 3-member Dispute Adjudication Board (DAB) instead.","Disputes තීරණය කරන අපක්ෂපාතී කෙනෙක් වන Adjudicator කෙනෙක් ගැන Employer එක්ක එකඟ වෙන්න. LKR මිලියන 500 හෝ ඊට වැඩි contracts වලට ඒ වෙනුවට සාමාජිකයන් 3ක Dispute Adjudication Board (DAB) එකක් පත් කරන්න.",["ITB 37","CD 19.2"]],
[null,"do","Send a progress report every month, within 7 days after the month ends.","හැම මාසෙම, මාසය අවසන් වී දින 7ක් ඇතුළත progress report එකක් යවන්න.",["4.14"]],
[null,"do","Tell the Engineer at least 28 days before any subcontractor starts work.","ඕනෑම subcontractor කෙනෙක් වැඩ පටන් ගන්න අවම වශයෙන් දින 28කට කලින් Engineer ට දන්වන්න.",["4.4"]]]},

{i:"S3",c:"start",r:"C",t:["The Employer is late in handing over the site","Employer site එක භාර දෙන්න ප්‍රමාද කරනවා"],
m:["You cannot start if you do not have the site. If this is the Employer's fault, you can ask for more time and for the extra money it costs you, plus profit.","Site එක නැතිව වැඩ පටන් ගන්න බැහැ. මේක Employer ගේ වරදක් නම්, ඔබට තව කාලයක් සහ ඒ නිසා ආපු අමතර වියදම, profit එකත් එක්ක ඉල්ලන්න පුළුවන්."],
d:[["a","Date we should have got the site","Site එක ලැබිය යුතුව තිබූ දිනය"],["b","Date we knew about the delay","ප්‍රමාදය ගැන දැනගත් දිනය"]],
q:[["Have you given the Performance Security?","Performance Security එක දීලා තියෙනවද?","","","The Employer may hold back the site until it gets the Performance Security. Then your claim is weak.","Performance Security එක ලැබෙනතුරු Employer ට site එක නොදී ඉන්න පුළුවන්. එතකොට ඔබේ claim එක දුර්වලයි."],["Did any of your own mistakes or delays cause this?","මේකට ඔබේම වරදක් හෝ ප්‍රමාදයක් හේතු වුණාද?","You will not get time or money for the part you caused.","ඔබ නිසා වුණු කොටසට කාලය හෝ මුදල් ලැබෙන්නේ නැහැ.","",""]],
s:[["b","do","Write to the Engineer to say the site has not been handed over and you are being delayed.","Site එක භාර දී නැති බවත් ඒ නිසා ඔබ ප්‍රමාද වෙන බවත් Engineer ට ලිඛිතව දන්වන්න.",["2.1"]],
["b+28","warn","Last day to send your formal claim notice. Do not miss it.","ඔබේ formal claim notice එක යවන්න අවසාන දිනය. මඟ හරින්න එපා.",["19.1"]],
["b+84","do","Send the full claim with details: extra time (EOT), extra cost, and reasonable profit.","සම්පූර්ණ claim එක විස්තර සහිතව යවන්න: අමතර කාලය (EOT), අමතර වියදම, සහ සාධාරණ profit.",["19.1","8.4"]]],
e:"ECP",k:["Site handover letters, records of idle workers and machines, photos","Site භාරදීමේ letters, වැඩ නැතිව සිටි workers සහ machines records, photos"],
n:["Engineer","Delay in giving possession of the Site","The Employer has not given us access to and possession of the Site within the time stated in the Contract. We are suffering delay and incurring Cost as a result."]},

{i:"S4",c:"start",r:"B",t:["The Performance Security could not be given on time","Performance Security එක නියමිත කාලයට දෙන්න බැරි වුණා"],
m:["The Performance Security protects the Employer if the contractor fails. Missing the deadline is serious: you can lose the job.","Contractor අසාර්ථක වුණොත් Employer ආරක්ෂා කරන්නේ Performance Security එකෙන්. Deadline එක මඟ හැරීම බරපතළයි: job එකම අහිමි වෙන්න පුළුවන්."],
d:[["a","Date we received the LOA","LOA එක ලැබුණු දිනය"]],
s:[["a+14","warn","Deadline to give the Performance Security.","Performance Security එක දිය යුතු අවසාන දිනය.",["4.2","ITB 35.1"]],
[null,"warn","If you miss it, the Employer can cancel the award, keep your bid security, and give the job to the next bidder.","මඟ හැරුණොත් Employer ට award එක cancel කරලා, bid security එක තියාගෙන, job එක ඊළඟ bidder ට දෙන්න පුළුවන්.",["ITB 35.2"]],
[null,"warn","If the contract has already started, the Employer can end the contract with 14 days' notice.","Contract එක දැනටමත් පටන් අරගෙන නම්, දින 14ක notice එකකින් Employer ට contract එක අවසන් කරන්න පුළුවන්.",["15.2"]]]},

{i:"S5",c:"start",r:"C",t:["The advance payment has not been paid","Advance payment එක ගෙව්වේ නැහැ"],
m:["The advance payment is an interest-free loan to help you start. If the Employer pays late, you can charge interest and, in the end, slow down or stop work.","Advance payment එක කියන්නේ වැඩ පටන් ගන්න උදව් වෙන පොලී රහිත ණයක්. Employer ප්‍රමාද වී ගෙව්වොත්, ඔබට පොලී ඉල්ලන්නත්, අවසානයේ වැඩ අඩු කරන්න හෝ නතර කරන්නත් පුළුවන්."],
d:[["a","Date the Employer got our Performance Security and advance guarantee","Employer ට Performance Security සහ advance guarantee ලැබුණු දිනය"]],
s:[["a+14","know","The Employer should pay the first part by this date.","Employer මේ දිනය වෙද්දී පළමු කොටස ගෙවිය යුතුයි.",["14.6(a)"]],
["a+15","know","From this date you can charge financing charges (interest) on the unpaid amount.","මේ දිනයේ සිට නොගෙවූ මුදලට financing charges (පොලී) ඉල්ලන්න පුළුවන්.",["14.7"]],
["a+15","do","You may give the Employer a notice of at least 56 days, saying you will stop or slow down work if you are not paid.","ගෙවීම නොලැබුණොත් වැඩ නතර කරනවා හෝ අඩු කරනවා කියලා අවම දින 56ක notice එකක් Employer ට දෙන්න පුළුවන්.",["16.1"]]],
e:"ECP",calc:"fin",
n:["Employer","Non-payment of Advance Payment","The first instalment of the Advance Payment has not been paid within the period stated in the Contract. Financing charges are accruing and we reserve our rights under the Contract."]},

{i:"S6",c:"start",r:"B",t:["We cannot agree on who the Adjudicator or DAB will be","Adjudicator හෝ DAB කවුද කියලා එකඟ වෙන්න බැහැ"],
m:["The Adjudicator (or DAB for big contracts) is a neutral person or board who decides disputes quickly. If the two sides cannot agree who it will be, a third body appoints one.","Adjudicator (විශාල contracts වලට DAB) කියන්නේ disputes ඉක්මනින් තීරණය කරන අපක්ෂපාතී පුද්ගලයෙක් හෝ board එකක්. පාර්ශව දෙක කවුද කියලා එකඟ නොවුණොත් තුන්වන ආයතනයක් පත් කරනවා."],
d:[["a","Commencement Date","Commencement Date"]],
s:[["a+28","do","Agree on an Adjudicator by this date. After this, either side can ask ICTAD (now CIDA) to appoint one.","මේ දිනය වෙද්දී Adjudicator කෙනෙක් ගැන එකඟ වෙන්න. ඉන් පසු ඕනෑම පාර්ශවයකට ICTAD (දැන් CIDA) ගෙන් පත් කරන්න ඉල්ලන්න පුළුවන්.",["ITB 37","19.3"]],
["a+28","do","For contracts of LKR 500 million or more: each side names one DAB member, and both agree on a third member as chairman. If this fails, ICTAD appoints, and each side pays half the cost.","LKR මිලියන 500 හෝ වැඩි contracts: හැම පාර්ශවයක්ම DAB member කෙනෙක් නම් කරලා, chairman ලෙස තුන්වන කෙනෙක් ගැන දෙදෙනාම එකඟ වෙන්න. අසාර්ථක වුණොත් ICTAD පත් කරනවා, වියදම භාගය බැගින් ගෙවනවා.",["CD 19.2","CD 19.3"]],
[null,"know","Both sides share the Adjudicator's fees equally.","Adjudicator ගේ ගාස්තු පාර්ශව දෙකම සමානව බෙදාගන්නවා.",["BD 37"]]]},

{i:"S7",c:"start",r:"C",x:1,t:["The Employer will not sign the Contract Agreement","Employer Contract Agreement එක sign කරන්නේ නැහැ"],
m:["The formal agreement should be signed within 28 days of the LOA. If the Employer refuses, this is a breach and gives you the right to end the contract.","LOA එකෙන් දින 28ක් ඇතුළත formal agreement එක sign කළ යුතුයි. Employer ප්‍රතික්ෂේප කළොත් එය contract උල්ලංඝනයක්, ඔබට contract එක අවසන් කිරීමේ අයිතිය ලැබෙනවා."],
d:[["a","Date we received the LOA","LOA එක ලැබුණු දිනය"]],
s:[["a+28","know","The Agreement should be signed by this date.","මේ දිනය වෙද්දී Agreement එක sign කළ යුතුයි.",["1.6"]],
[null,"if","If the Employer still refuses, you may end the contract by giving 14 days' notice.","Employer තවමත් ප්‍රතික්ෂේප කරනවා නම්, දින 14ක notice එකක් දීලා ඔබට contract එක අවසන් කරන්න පුළුවන්.",["16.2(d)"]]]}
);
EV.push(
{i:"D1",c:"time",r:"C",t:["Drawings or instructions from the Engineer are late","Engineer ගෙන් drawings හෝ instructions ප්‍රමාදයි"],
m:["You cannot build without drawings or answers to your questions. If they come late and this delays you, you can claim extra time, extra cost and profit. The key is to warn the Engineer early, in writing.","Drawings හෝ ඔබේ ප්‍රශ්න වලට පිළිතුරු නැතිව build කරන්න බැහැ. ඒවා ප්‍රමාද වෙලා ඔබ ප්‍රමාද වුණොත්, අමතර කාලය, අමතර වියදම සහ profit claim කරන්න පුළුවන්. වැදගත්ම දේ Engineer ට කලින්ම, ලිඛිතව අනතුරු ඇඟවීමයි."],
d:[["a","Date we needed the drawing or instruction","Drawing/instruction එක ඕනේ වුණු දිනය"],["b","Date we knew we were being delayed","ප්‍රමාද වෙන බව දැනගත් දිනය"]],
q:[["Was the delay caused by your own late or wrong documents (for example shop drawings)?","ප්‍රමාදයට ඔබේම ප්‍රමාද හෝ වැරදි documents (උදා: shop drawings) හේතු වුණාද?","You will not get time or money for the part you caused.","ඔබ නිසා වුණු කොටසට කාලය හෝ මුදල් ලැබෙන්නේ නැහැ.","",""]],
s:[[null,"do","Warn the Engineer early in writing: which drawing or instruction you need, why, by what date, and how much delay it will cause if late.","Engineer ට කලින්ම ලිඛිතව දන්වන්න: ඕනේ drawing/instruction එක කුමක්ද, ඇයි, කවදා වෙද්දී ඕනෙද, ප්‍රමාද වුණොත් කොච්චර ප්‍රමාදයක් වෙනවද.",["1.9"]],
["b","do","When the delay actually happens, send a second notice to the Engineer.","ප්‍රමාදය ඇත්තටම සිදු වුණාම Engineer ට දෙවන notice එකක් යවන්න.",["1.9"]],
["b+28","warn","Last day to send your formal claim notice.","Formal claim notice එක යවන්න අවසාන දිනය.",["19.1"]],
["b+84","do","Send the full claim with details and proof: extra time (EOT), cost and profit.","විස්තර සහ සාක්ෂි සහිතව සම්පූර්ණ claim එක යවන්න: අමතර කාලය (EOT), වියදම සහ profit.",["19.1","8.4"]]],

n:["Engineer","Delayed Drawings / Instructions","The drawings/instructions listed below have not been issued within a reasonable time. The date by which each was needed and the likely delay are set out below."]},

{i:"D2",c:"time",r:"C",t:["Extremely bad weather (very heavy rain, floods) is stopping work","අධික වැසි, ගංවතුර වගේ ඉතා දරුණු කාලගුණය නිසා වැඩ නතර වෙනවා"],
m:["Normal rain is your risk, because you should have planned for it. Only weather that is far worse than normal for that place gives you extra time. You do not get extra money for weather.","සාමාන්‍ය වැස්ස ඔබේ අවදානමක්, මොකද ඒක සැලසුම් කරන්න තිබුණා. ඒ ප්‍රදේශයට සාමාන්‍යයට වඩා බොහෝ දරුණු කාලගුණයකට පමණයි අමතර කාලය ලැබෙන්නේ. කාලගුණයට අමතර මුදල් ලැබෙන්නේ නැහැ."],
d:[["a","Date we knew the weather was affecting work","කාලගුණය වැඩට බලපාන බව දැනගත් දිනය"]],
q:[["Is this weather much worse than the usual monsoon for this area?","මේ කාලගුණය මේ ප්‍රදේශයේ සාමාන්‍ය monsoon එකට වඩා බොහෝ දරුණුද?","","","Normal weather does not give extra time. You are expected to have allowed for it in your price and programme.","සාමාන්‍ය කාලගුණයට අමතර කාලය ලැබෙන්නේ නැහැ. ඔබේ price එකේ සහ programme එකේ ඒක සලකලා ඇති යැයි සැලකෙනවා."]],
s:[["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["19.1"]],
["a+84","do","Send the full claim. You can get extra time (EOT) only, not money.","සම්පූර්ණ claim එක යවන්න. ඔබට ලැබෙන්නේ අමතර කාලය (EOT) පමණයි, මුදල් නොවේ.",["8.4(c)","19.1"]],
[null,"know","The rule for unforeseeable ground conditions does not cover weather. If the weather damaged the works, check Employer's risks and Force Majeure.","අනපේක්ෂිත ground conditions නීතිය කාලගුණයට අදාළ නැහැ. කාලගුණය works වලට හානි කළා නම් Employer's risks සහ Force Majeure බලන්න.",["4.11","17.3","20.1"]]],
e:"E",k:["Rainfall data from the Meteorology Department, site diary, record of lost days","Meteorology Department rainfall data, site diary, වැඩ නැති වූ දවස් record"]},

{i:"D3",c:"time",r:"C",t:["Workers or materials are hard to get because of an epidemic or a government action (lockdown, import ban, fuel limits)","Epidemic එකක් හෝ government තීරණයක් (lockdown, import තහනම, fuel සීමා) නිසා workers හෝ materials ගන්න අමාරුයි"],
m:["If an epidemic or government action causes shortages that nobody could have expected at tender time, you can get extra time.","Tender වෙලාවේ කාටවත් අපේක්ෂා කරන්න බැරි වූ epidemic එකක් හෝ government තීරණයක් නිසා හිඟයක් ආවොත්, ඔබට අමතර කාලය ලැබෙනවා."],

q:[["Could an experienced contractor have expected this at tender time?","පළපුරුදු contractor කෙනෙකුට tender වෙලාවේ මේක අපේක්ෂා කරන්න තිබුණද?","If it was expected, you do not get extra time.","අපේක්ෂා කළ හැකි නම් අමතර කාලය ලැබෙන්නේ නැහැ.","",""]],
s:[["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["19.1"]],

[null,"if","If a new law or tax made things cost more, see the change in law rule. If you cannot work at all, see Force Majeure.","අලුත් නීතියක් හෝ tax එකක් නිසා වියදම වැඩි වුණා නම් change in law නීතිය බලන්න. වැඩ කරන්නම බැරි නම් Force Majeure බලන්න.",["13.6","20.1"]]],

{i:"D4",c:"time",r:"C",t:["A government authority (CEB, Water Board, local council, UDA, RDA) is delaying us","Government ආයතනයක් (CEB, Water Board, local council, UDA, RDA) අපව ප්‍රමාද කරනවා"],
m:["Delays by public authorities give extra time, but only if you followed all their procedures properly and the delay could not be expected.","රජයේ ආයතන නිසා වෙන ප්‍රමාද වලට අමතර කාලය ලැබෙනවා, හැබැයි ඔබ ඔවුන්ගේ සියලු ක්‍රියා පටිපාටි නිසියාකාරව අනුගමනය කරලා, ප්‍රමාදය අපේක්ෂා කළ නොහැකි නම් පමණයි."],
d:[["a","Date we knew about the delay","ප්‍රමාදය ගැන දැනගත් දිනය"]],
q:[["Did you follow the authority's procedures carefully and on time?","ඔබ ඒ ආයතනයේ ක්‍රියා පටිපාටි හරියට සහ නියමිත වෙලාවට අනුගමනය කළාද?","","","This is required. Without it you do not get extra time.","මෙය අනිවාර්යයි. නැත්නම් අමතර කාලය ලැබෙන්නේ නැහැ."],["Was the delay unexpected?","ප්‍රමාදය අනපේක්ෂිතද?","","","If it could be expected, you do not get extra time.","අපේක්ෂා කළ හැකි නම් අමතර කාලය ලැබෙන්නේ නැහැ."]],
s:[[null,"do","Ask the Employer in writing to help you get the permits (it must help where it can).","Permits ගන්න උදව් කරන්න කියලා Employer ගෙන් ලිඛිතව ඉල්ලන්න (පුළුවන් තැන්වල එය උදව් කළ යුතුයි).",["2.2","1.13"]],
["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["19.1"]],

{i:"D5",c:"time",r:"C",t:["The Employer, its staff or its other contractors are delaying our work","Employer, එහි staff හෝ එහි අනෙක් contractors අපේ වැඩ ප්‍රමාද කරනවා"],
m:["If the client's side gets in your way, you should not suffer for it. You can get extra time, and you can also try to claim the extra cost.","Client ගේ පැත්තෙන් ඔබේ වැඩට බාධා වුණොත්, ඒකෙන් ඔබ දුක් විඳින්න ඕනේ නැහැ. අමතර කාලය ලැබෙනවා, අමතර වියදමත් claim කරන්න උත්සාහ කරන්න පුළුවන්."],
