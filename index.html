e:"E",k:["Site diary, meeting minutes, letters","Site diary, meeting minutes, letters"]},

{i:"D6",c:"time",r:"B",t:["The Engineer changes the order or timing of the work (resequencing or speeding up)","Engineer වැඩ කරන අනුපිළිවෙල හෝ කාලය වෙනස් කරනවා (resequencing හෝ වේගවත් කිරීම)"],
m:["Changing the order or timing of work is a Variation (an official change). It must be instructed in writing, and you can be paid for it and get extra time.","වැඩ කරන අනුපිළිවෙල හෝ කාලය වෙනස් කිරීම Variation එකක් (නිල වෙනස්කමක්). එය ලිඛිතව instruct කළ යුතුයි, ඒ සඳහා ඔබට ගෙවීම් සහ අමතර කාලය ලැබිය හැකියි."],
s:[[null,"do","Get the instruction in writing. Changing the sequence or timing of work counts as a Variation.","Instruction එක ලිඛිතව ගන්න. වැඩ අනුපිළිවෙල හෝ කාලය වෙනස් කිරීම Variation එකක් ලෙස සැලකෙනවා.",["13.1(f)","3.3"]],
[null,"do","In your variation proposal, include the changes to the programme and to the completion date.","ඔබේ variation proposal එකේ programme එකේ සහ completion date එකේ වෙනස්කම් ඇතුළත් කරන්න.",["13.3"]],
[null,"if","If no time change was agreed, claim extra time (EOT).","කාල වෙනසක් එකඟ වී නැත්නම්, අමතර කාලය (EOT) claim කරන්න.",["8.4(a)","19.1"]]],
e:"EC"},

{i:"D7",c:"time",r:"B",t:["The contractor is behind schedule because of its own problems","Contractor තමන්ගේම ප්‍රශ්න නිසා schedule එකට වඩා පසුපසින් ඉන්නවා"],
m:["If you are late because of your own problems, you must catch up at your own cost. The Employer can also charge delay damages and, in bad cases, end the contract.","ඔබේම ප්‍රශ්න නිසා ප්‍රමාද නම්, ඔබේම වියදමින් ඉදිරියට එන්න ඕනේ. Employer ට delay damages අය කරන්නත්, බරපතළ අවස්ථාවලදී contract එක අවසන් කරන්නත් පුළුවන්."],
s:[[null,"know","The Engineer can ask for a new programme showing how you will catch up. Extra working hours, workers or machines are at your own risk and cost.","ඔබ කොහොමද ඉදිරියට එන්නේ කියලා පෙන්වන අලුත් programme එකක් Engineer ට ඉල්ලන්න පුළුවන්. අමතර වැඩ පැය, workers හෝ machines ඔබේම අවදානමට සහ වියදමට.",["8.6"]],
[null,"warn","If this costs the Employer extra, it can charge you for it, on top of delay damages (LD).","මේ නිසා Employer ට අමතර වියදමක් ආවොත් ඒකත් ඔබෙන් අය කරන්න පුළුවන්, delay damages (LD) වලට අමතරව.",["8.6","2.4","8.7"]],
[null,"warn","If it continues, the Engineer can send a Notice to Correct, and this can lead to termination.","දිගටම මෙහෙම වුණොත් Engineer ට Notice to Correct එකක් යවන්න පුළුවන්, එය termination දක්වා යන්න පුළුවන්.",["15.1","15.2"]]]},

{i:"D8",c:"time",r:"B",t:["The job will finish after the completion date (delay damages / LD)","Completion date එකෙන් පස්සේ job එක ඉවර වෙයි (delay damages / LD)"],
m:["Liquidated Damages (LD) are a fixed amount per day that the contractor pays for finishing late. The daily rate and the maximum are written in the Contract Data.","Liquidated Damages (LD) කියන්නේ ප්‍රමාද වී ඉවර කරන හැම දවසකටම contractor ගෙවන ස්ථාවර මුදලක්. දවසක rate එක සහ උපරිමය Contract Data එකේ ලියලා තියෙනවා."],
d:[["a","Completion date (including any extensions)","Completion date එක (දුන් extensions එක්ක)"],["b","Expected or actual finish date","අපේක්ෂිත හෝ සැබෑ ඉවර වන දිනය"]],
s:[["a","know","For each day after this date, LD is charged at the rate in the Contract Data, up to the maximum in the Contract Data.","මේ දිනයෙන් පස්සේ හැම දවසකටම Contract Data එකේ rate එකට LD අය වෙනවා, Contract Data එකේ උපරිමය දක්වා.",["8.7","8.2"]],
[null,"know","The Employer must claim LD properly. LD is the only damages for lateness (unless the contract is terminated).","Employer LD නිසි විදිහට claim කළ යුතුයි. ප්‍රමාදයට ඇති එකම damages LD (contract එක terminate කළොත් හැර).",["8.7","2.4"]],
[null,"know","If part of the works is handed over early, the daily LD rate goes down in proportion.","Works වල කොටසක් කලින් භාර දුන්නොත් දවසක LD rate එක අනුපාතිකව අඩු වෙනවා.",["10.2"]],
[null,"know","For work done after the due date, price adjustment uses the indices of the due date.","Due date එකෙන් පස්සේ කරන වැඩ වලට price adjustment ගණනය කරන්නේ due date එකේ indices වලින්.",["13.7"]],
[null,"do","If you have a right to extra time that is not yet granted, claim it now. The Engineer can never reduce extra time already given.","ඔබට හිමි, තවම නොලැබුණු අමතර කාලයක් තියෙනවා නම් දැන්ම claim කරන්න. දැනටමත් දුන් අමතර කාලය Engineer ට කවදාවත් අඩු කරන්න බැහැ.",["8.4","19.1"]]],
calc:"ld"},

{i:"D9",c:"time",r:"B",t:["The Engineer rejected our programme or asked us to revise it","Engineer අපේ programme එක reject කළා හෝ revise කරන්න කිව්වා"],
m:["The programme is your work plan. The Engineer can object within 14 days. You must keep the programme up to date with real progress.","Programme එක කියන්නේ ඔබේ වැඩ සැලැස්ම. Engineer ට දින 14ක් ඇතුළත විරුද්ධත්වය පළ කරන්න පුළුවන්. සැබෑ progress එකට ගැළපෙන විදිහට programme එක update කරලා තියාගන්න ඕනේ."],
d:[["a","Date we sent the programme","Programme එක යැවූ දිනය"]],
s:[["a+14","know","The Engineer has until this date to say what is wrong. If there is no reply, you work to your programme.","වැරැද්ද කියන්න Engineer ට මේ දිනය දක්වා කාලය තියෙනවා. පිළිතුරක් නැත්නම් ඔබ ඔබේ programme එක අනුව වැඩ කරනවා.",["8.3"]],
[null,"do","Send a revised programme whenever the old one no longer matches real progress.","පරණ programme එක සැබෑ progress එකට නොගැළපෙන හැම විටම revised programme එකක් යවන්න.",["8.3"]]]},

{i:"D10",c:"time",r:"C",t:["We can see a problem coming that may cause delay or extra cost (early warning)","ප්‍රමාදයක් හෝ අමතර වියදමක් ඇති කරන්න පුළුවන් ප්‍රශ්නයක් එන බව පේනවා (early warning)"],
m:["Telling the Engineer early helps everyone deal with the problem before it grows. It also protects your right to claim later.","Engineer ට කලින්ම කීම, ප්‍රශ්නය ලොකු වෙන්න කලින් ඒකට මුහුණ දෙන්න හැමෝටම උදව් වෙනවා. පසුව claim කිරීමේ ඔබේ අයිතියත් ආරක්ෂා වෙනවා."],
s:[[null,"do","Tell the Engineer straight away about any likely future event that may harm the work, raise the price or cause delay.","වැඩට හානි කරන්න, මිල වැඩි කරන්න හෝ ප්‍රමාද කරන්න පුළුවන් ඕනෑම අනාගත සිදුවීමක් ගැන වහාම Engineer ට කියන්න.",["8.3"]],
[null,"know","The Engineer can ask you for an estimate of the effect, or a variation proposal.","බලපෑමේ ඇස්තමේන්තුවක් හෝ variation proposal එකක් Engineer ට ඉල්ලන්න පුළුවන්.",["8.3","13.3"]],
[null,"if","If the event really happens, start the claim process.","සිදුවීම ඇත්තටම වුණොත් claim ක්‍රියාවලිය පටන් ගන්න.",["19.1"]]]},

{i:"D11",c:"time",r:"C",t:["How do we ask for more time (EOT)? (general guide)","වැඩි කාලයක් (EOT) ඉල්ලන්නේ කොහොමද? (පොදු මාර්ගෝපදේශය)"],
m:["An Extension of Time (EOT) moves your completion date later, so you do not pay delay damages for delays that were not your fault. You must follow the notice rules.","Extension of Time (EOT) එකෙන් completion date එක පසුවට යනවා, ඒ නිසා ඔබේ වරදක් නොවන ප්‍රමාද වලට delay damages ගෙවන්න ඕනේ නැහැ. Notice නීති අනුගමනය කරන්න ඕනේ."],
d:[["a","Date we knew about the event","සිදුවීම ගැන දැනගත් දිනය"]],
s:[[null,"know","Reasons that give an EOT: a Variation or big change in quantity, another clause that gives time, extremely bad weather, shortages from epidemic or government action, or delay caused by the Employer.","EOT ලැබෙන හේතු: Variation එකක් හෝ quantity එකේ ලොකු වෙනසක්, කාලය දෙන වෙනත් clause එකක්, ඉතා දරුණු කාලගුණය, epidemic හෝ government තීරණ නිසා හිඟයක්, හෝ Employer නිසා වූ ප්‍රමාදයක්.",["8.4"]],
["a+28","warn","Last day to send your notice to the Engineer.","Engineer ට notice එක යවන්න අවසාන දිනය.",["19.1"]],
["a+84","do","Send the full claim. If the delay keeps going, send an update every month, and a final claim within 28 days after the effect ends.","සම්පූර්ණ claim එක යවන්න. ප්‍රමාදය දිගටම යනවා නම් හැම මාසෙම update එකක්, බලපෑම ඉවර වී දින 28ක් ඇතුළත final claim එක යවන්න.",["19.1"]],
[null,"know","The Engineer must reply within 42 days of your claim, then decide fairly. Extra time already given can be increased but never reduced.","ඔබේ claim එක ලැබී දින 42ක් ඇතුළත Engineer පිළිතුරු දිය යුතුයි, පසුව සාධාරණව තීරණය කරනවා. දැනටමත් දුන් අමතර කාලය වැඩි කරන්න පුළුවන්, අඩු කරන්න බැහැ.",["19.1","3.4","8.4"]]],
e:"E",k:["Updated programme, delay analysis, site diary","Update කළ programme, delay analysis, site diary"]},

{i:"P1",c:"pay",r:"C",t:["The payment certificate (IPC) was issued, but the Employer has not paid","Payment certificate (IPC) එක නිකුත් කළා, නමුත් Employer ගෙව්වේ නැහැ"],
m:["An IPC (Interim Payment Certificate) is the Engineer's approval of your monthly bill. Once the Employer gets it, it has 14 days to pay. If it pays late you earn interest, and if it keeps not paying you can slow down, stop, and finally end the contract.","IPC (Interim Payment Certificate) කියන්නේ ඔබේ මාසික bill එකට Engineer දෙන අනුමැතිය. ඒක ලැබුණාම ගෙවන්න Employer ට දින 14ක් තියෙනවා. ප්‍රමාද වී ගෙව්වොත් ඔබට පොලී ලැබෙනවා, දිගටම නොගෙව්වොත් වැඩ අඩු කරන්න, නතර කරන්න, අවසානයේ contract එක අවසන් කරන්නත් පුළුවන්."],
d:[["a","Date the Employer received the IPC","Employer ට IPC එක ලැබුණු දිනය"]],
s:[["a+14","know","Last day for the Employer to pay.","Employer ගෙවිය යුතු අවසාන දිනය.",["14.6(b)"]],
["a+14","know","From this date, interest (financing charges) runs on the unpaid amount. It is compounded monthly at the Central Bank lending rate plus 1%.","මේ දිනයේ සිට නොගෙවූ මුදලට පොලී (financing charges) ගණන් වෙනවා. එය Central Bank lending rate එකට 1%ක් එකතු කළ අනුපාතයට, මාසිකව compound වෙනවා.",["14.7"]],
["a+15","do","You can now send the Employer a notice of at least 56 days, saying you will stop or slow down work if not paid.","දැන් ඔබට, ගෙවීම නොලැබුණොත් වැඩ නතර කරනවා හෝ අඩු කරනවා කියලා අවම දින 56ක notice එකක් Employer ට යවන්න පුළුවන්.",["16.1"]],
["a+71","if","If you sent that notice on the first possible day, this is the earliest day you can stop or slow down work.","ඒ notice එක පුළුවන් පළමු දවසේම යැව්වා නම්, වැඩ නතර කරන්න හෝ අඩු කරන්න පුළුවන් මුල්ම දිනය මෙයයි.",["16.1"]],
["a+70","if","If the IPC money is still not received, from this date you have the right to end the contract.","IPC මුදල තවමත් ලැබී නැත්නම්, මේ දිනයේ සිට contract එක අවසන් කිරීමේ අයිතිය ඔබට ලැබෙනවා.",["16.2(b)"]],
["a+84","if","With 14 days' notice, this is the earliest day the termination can take effect.","දින 14ක notice එකක් එක්ක termination එක බලපැවැත්වෙන මුල්ම දිනය මෙයයි.",["16.2"]],
[null,"warn","If you get paid before you send a termination notice, you must restart normal work. If stopping work caused you delay or cost, notify the Engineer within 28 days and send the full claim within 84 days.","Termination notice එක යවන්න කලින් ගෙවීම ලැබුණොත් සාමාන්‍ය වැඩ නැවත පටන් ගන්න ඕනේ. වැඩ නතර කිරීම නිසා ප්‍රමාදයක් හෝ වියදමක් ආවා නම්, දින 28ක් ඇතුළත Engineer ට දන්වලා, දින 84ක් ඇතුළත සම්පූර්ණ claim එක යවන්න.",["16.1","19.1"]]],
e:"ECP",calc:"fin",k:["Proof of IPC delivery, reminder letters, bank statements","IPC භාරදුන් සාක්ෂි, reminder letters, bank statements"],
n:["Employer","Notice of intention to suspend work – non-payment of Interim Payment Certificate","The amount certified in Interim Payment Certificate No. __ has not been paid within the period stated in Sub-Clause 14.6. We claim financing charges under Sub-Clause 14.7 and give notice that, unless payment is received, we intend to suspend work (or reduce the rate of work) after 56 days from this notice."]},

{i:"P2",c:"pay",r:"C",t:["The Engineer has not issued the payment certificate (IPC)","Engineer payment certificate (IPC) එක නිකුත් කරලා නැහැ"],
m:["After you send your monthly bill (Statement), the Engineer has 21 days to issue the IPC. If the Engineer does not, the payment is still treated as due on time, and you get the same rights as for late payment.","ඔබ මාසික bill එක (Statement) යැව්වාම IPC එක නිකුත් කරන්න Engineer ට දින 21ක් තියෙනවා. එසේ නොකළත් ගෙවීම නියමිත දිනට ගෙවිය යුතු ලෙසම සැලකෙනවා, ප්‍රමාද ගෙවීම් වලට ඇති අයිතිවාසිකම්ම ඔබට ලැබෙනවා."],
d:[["a","Date we sent our Statement to the Engineer","Statement එක Engineer ට යැවූ දිනය"]],
q:[["Has the Employer received and approved the Performance Security?","Employer ට Performance Security එක ලැබිලා approve කරලද?","","","Nothing will be certified until the Performance Security is approved.","Performance Security එක approve කරනතුරු කිසිම මුදලක් certify කරන්නේ නැහැ."]],
s:[["a+21","know","Last day for the Engineer to issue the IPC.","Engineer IPC එක නිකුත් කළ යුතු අවසාන දිනය.",["14.5"]],
["a+35","know","The payment is due by this date even if the IPC is late. Interest runs from here.","IPC ප්‍රමාද වුණත් ගෙවීම මේ දිනයට ගෙවිය යුතුයි. පොලී මෙතැන් සිට ගණන් වෙනවා.",["14.6","14.7"]],
["a+22","do","You can send a notice of at least 56 days that you will stop or slow down work.","වැඩ නතර කරනවා හෝ අඩු කරනවා කියලා අවම දින 56ක notice එකක් යවන්න පුළුවන්.",["16.1"]],
["a+56","if","If there is still no IPC, you have the right to end the contract (with 14 days' notice).","තවමත් IPC එකක් නැත්නම් contract එක අවසන් කිරීමේ අයිතිය ලැබෙනවා (දින 14ක notice එකක් එක්ක).",["16.2(a)"]],
[null,"know","If the amount due is less than the minimum IPC amount in the Contract Data, the Engineer can hold it over to the next month, but must tell you.","ගෙවිය යුතු මුදල Contract Data එකේ minimum IPC amount එකට අඩු නම් Engineer ට ඊළඟ මාසයට තියාගන්න පුළුවන්, හැබැයි ඔබට දන්වන්න ඕනේ.",["14.5"]]],
e:"ECP",n:["Engineer","Failure to issue Interim Payment Certificate","Our Statement No. __ with supporting documents was submitted on __. The Interim Payment Certificate has not been issued within 21 days as required by Sub-Clause 14.5."]},

{i:"P3",c:"pay",r:"C",t:["How do we prepare the monthly bill (Statement / interim bill)?","මාසික bill එක (Statement / interim bill) හදන්නේ කොහොමද?"],
m:["Each month you send the Engineer a bill showing the value of work done so far, minus what was already paid and other deductions. The Engineer checks it and issues the IPC.","හැම මාසෙම, මේ වෙනකම් කළ වැඩ වල වටිනාකම, දැනටමත් ගෙවූ මුදල් සහ අනෙක් අඩු කිරීම් අඩු කරලා පෙන්වන bill එකක් Engineer ට යවනවා. Engineer ඒක check කරලා IPC එක නිකුත් කරනවා."],
s:[[null,"do","After the end of each month, send 3 copies of the Statement in the format approved by the Engineer, with the monthly progress report.","හැම මාසයක්ම අවසන් වුණාට පස්සේ, Engineer approve කළ format එකෙන් Statement copies 3ක්, මාසික progress report එකත් එක්ක යවන්න.",["14.3","4.14"]],
[null,"do","List the items in this order: (a) value of work done including variations, (b) price adjustments and law-change adjustments, (c) retention deducted (percentage in the Contract Data, usually 10%, up to the limit), (d) advance payment and its recovery, (e) materials on site, (f) other amounts such as claims, (g) minus all earlier certificates.","Items මේ අනුපිළිවෙලට දාන්න: (a) variations සමඟ කළ වැඩ වල වටිනාකම, (b) price adjustments සහ law-change adjustments, (c) retention අඩු කිරීම (Contract Data %, සාමාන්‍යයෙන් 10%, සීමාව දක්වා), (d) advance payment සහ එහි recovery, (e) site එකේ materials, (f) claims වැනි අනෙක් මුදල්, (g) පෙර certificates සියල්ල අඩු කිරීම.",["14.3"]],
[null,"know","Materials delivered to site for the permanent works are paid at 80% of their invoice value.","Permanent works සඳහා site එකට ගෙනා materials වලට invoice value එකෙන් 80%ක් ගෙවනවා.",["14.4"]],
[null,"do","Send priced dayworks sheets before the next Statement.","Dayworks වල priced statements ඊළඟ Statement එකට කලින් යවන්න.",["13.5"]]]},

{i:"P4",c:"pay",r:"C",t:["Money was cut or held back from our payment certificate","අපේ payment certificate එකෙන් මුදලක් කපලා හෝ රඳවාගෙන"],
m:["The Engineer can hold back money only for a few clear reasons. The Employer can deduct its own claims only after following the proper notice process. Anything else can be challenged.","Engineer ට මුදල් රඳවාගන්න පුළුවන් පැහැදිලි හේතු කිහිපයකට පමණයි. Employer ට තමන්ගේ claims අඩු කරන්න පුළුවන් නිසි notice ක්‍රියාවලිය අනුගමනය කළාට පස්සේ පමණයි. අනෙක් ඕනෑම දෙයකට විරුද්ධ වෙන්න පුළුවන්."],
s:[[null,"know","Money can be held back only for: (a) the cost of fixing work that does not meet the contract, or (b) the value of an obligation you have not done and were told about. No other reason is allowed.","මුදල් රඳවාගන්න පුළුවන් මේවාට පමණයි: (a) contract එකට අනුකූල නොවන වැඩ හදන වියදම, හෝ (b) ඔබට දන්වපු, තවම නොකළ obligation එකක වටිනාකම. වෙනත් හේතුවකට අවසර නැහැ.",["14.5"]],
[null,"know","The Employer can deduct its own claims only after giving notice and details under the Employer's claims rule.","Employer ගේ claims අඩු කරන්න පුළුවන් Employer's claims නීතිය යටතේ notice සහ විස්තර දුන්නාට පස්සේ පමණයි.",["2.4"]],
[null,"do","Ask in writing for the reason for each cut. If you still disagree, ask the Engineer for a formal decision, and if needed take it to dispute.","හැම අඩු කිරීමකටම හේතුව ලිඛිතව ඉල්ලන්න. තවමත් එකඟ නැත්නම් Engineer ගෙන් formal තීරණයක් ඉල්ලන්න, අවශ්‍ය නම් dispute එකක් ලෙස ඉදිරියට යන්න.",["3.4","19.2"]],
[null,"know","The Engineer can correct mistakes in earlier certificates in a later certificate.","පෙර certificates වල වැරදි ඊළඟ certificate එකකදී Engineer ට නිවැරදි කරන්න පුළුවන්.",["14.5"]]],
k:["Measurement records, letters","Measurement records, letters"]},

{i:"P5",c:"pay",r:"C",t:["We brought materials to site. Do we get paid for them before use?","Site එකට materials ගෙනාවා. භාවිත කරන්න කලින් ඒවාට ගෙවීමක් ලැබෙනවද?"],
m:["Yes. Materials delivered to site for the permanent works are partly paid in the monthly certificate, which helps your cash flow.","ඔව්. Permanent works සඳහා site එකට ගෙනා materials වලට මාසික certificate එකේ කොටසක් ගෙවනවා. ඒක ඔබේ cash flow එකට උදව් වෙනවා."],
s:[[null,"know","80% of the invoice value of materials delivered to site for the permanent works is added to the IPC.","Permanent works සඳහා site එකට ගෙනා materials වල invoice value එකෙන් 80%ක් IPC එකට එකතු කරනවා.",["14.4"]],
[null,"warn","Once delivered to site, the materials become the Employer's property.","Site එකට ගෙනාවාම ඒ materials Employer ගේ දේපළ වෙනවා.",["7.6"]],
[null,"know","For price adjustment, the current value also includes 80% of materials on site not yet used.","Price adjustment වලටත් current value එකට තවම භාවිත නොකළ site materials වලින් 80%ක් ඇතුළත් වෙනවා.",["13.7"]]]},

{i:"P6",c:"pay",r:"C",t:["Retention money is not being released","Retention money නිදහස් කරන්නේ නැහැ"],
m:["Retention is a small percentage kept from every payment as a guarantee that you will fix defects. Half is paid back at handover, and the other half after the defects period ends.","Retention කියන්නේ ඔබ defects හදන බවට සහතිකයක් ලෙස හැම ගෙවීමකින්ම රඳවාගන්නා කුඩා ප්‍රතිශතයක්. භාගයක් handover එකේදී ආපසු ගෙවනවා, ඉතිරි භාගය defects period එක ඉවර වුණාට පස්සේ."],
d:[["a","Taking-Over Certificate date","Taking-Over Certificate දිනය"],["b","Date the defects period ends","Defects period එක අවසන් වන දිනය"]],
s:[["a","know","Half of the retention should be paid back now.","Retention එකෙන් භාගයක් දැන් ආපසු ගෙවිය යුතුයි.",["14.8"]],
["b","know","The other half is paid when the defects period is over and the Engineer certifies that all notified defects are fixed.","ඉතිරි භාගය ගෙවන්නේ defects period එක ඉවර වෙලා, දන්වපු සියලු defects හැදූ බව Engineer certify කළාට පස්සේ.",["14.8"]],
[null,"know","If some defect work is still left, only the estimated cost of that work can be held back.","Defect වැඩ කොටසක් තවම ඉතිරි නම්, රඳවාගන්න පුළුවන් ඒ වැඩේ ඇස්තමේන්තු වියදම පමණයි.",["14.8"]],
[null,"if","Option (if in the Contract Data): once retention reaches its limit, you can give a bank guarantee instead and get the full retention money back.","විකල්පය (Contract Data එකේ තියෙනවා නම්): retention එක සීමාවට ආවාම, ඒ වෙනුවට bank guarantee එකක් දීලා සම්පූර්ණ retention මුදල ආපසු ගන්න පුළුවන්.",["CD 14.8"]]],
n:["Engineer","Release of Retention Money","The Taking-Over Certificate was issued on __. We request certification of the first half of the Retention Money in accordance with Sub-Clause 14.8."]},

{i:"P7",c:"pay",r:"B",t:["How is the advance payment paid back?","Advance payment එක ආපසු ගෙවන්නේ කොහොමද?"],
m:["The advance is repaid little by little, by cutting a share from each monthly certificate, until it is fully repaid.","Advance එක ටිකෙන් ටික ආපසු ගෙවනවා, හැම මාසික certificate එකෙන්ම කොටසක් කපලා, සම්පූර්ණයෙන් ගෙවී ඉවර වෙනකම්."],
s:[[null,"know","Deductions start from the first certificate after the advance was paid, in proportion to the work done.","Advance එක ගෙවුවාට පස්සේ පළමු certificate එකේ ඉඳන්, කළ වැඩ වලට අනුපාතිකව කපන්න පටන් ගන්නවා.",["14.2"]],
[null,"know","It must be fully repaid when certified work reaches 90% of the contract price (without provisional sums).","Certify කළ වැඩ contract price එකෙන් (provisional sums නැතිව) 90%ට එද්දී සම්පූර්ණයෙන් ගෙවී ඉවර විය යුතුයි.",["14.2"]],
[null,"warn","Keep the advance guarantee valid until the advance is repaid. If it will expire 28 days before full repayment, extend it.","Advance එක ගෙවී ඉවර වෙනකම් advance guarantee එක valid කරලා තියාගන්න. සම්පූර්ණයෙන් ගෙවීමට දින 28කට කලින් expire වෙනවා නම් extend කරන්න.",["14.2"]],
[null,"warn","If anything is still unpaid at handover or termination, the whole balance becomes due at once.","Handover හෝ termination වෙද්දී තවම ඉතිරි නම්, මුළු ඉතිරි මුදලම එකවර ගෙවිය යුතුයි.",["14.2"]]]},

{i:"P8",c:"pay",r:"C",t:["After handover: the Statement at Completion","Handover එකෙන් පස්සේ: Statement at Completion"],
m:["After handover you must send a statement listing everything you think you are owed. Any claim you leave out may be lost for ever, so be complete.","Handover එකෙන් පස්සේ, ඔබට ලැබිය යුතු යැයි හිතන සියල්ල ලැයිස්තුගත කළ statement එකක් යවන්න ඕනේ. ඇතුළත් නොකළ claim එකක් සදහටම අහිමි වෙන්න පුළුවන්, ඒ නිසා සම්පූර්ණ කරන්න."],
d:[["a","Date we received the Taking-Over Certificate","Taking-Over Certificate එක ලැබුණු දිනය"]],
s:[["a+84","do","Send 3 copies of the Statement at Completion: the value of work up to handover, any other money you think is due, and estimates of future amounts (shown separately).","Statement at Completion copies 3ක් යවන්න: handover දක්වා කළ වැඩ වල වටිනාකම, ලැබිය යුතු යැයි හිතන අනෙක් මුදල්, සහ ඉදිරියට ලැබිය යුතු මුදල් වල ඇස්තමේන්තු (වෙනම පෙන්වලා).",["14.9"]],
[null,"warn","Very important: if a claim about something before handover is not included both here and in the Final Statement, the Employer is no longer liable to pay it.","ඉතා වැදගත්: handover එකට කලින් සිදු වූ දෙයක් ගැන claim එකක් මෙතැනත් Final Statement එකෙත් ඇතුළත් නොකළොත්, ඒක ගෙවීමේ වගකීම Employer ට තවදුරටත් නැහැ.",["14.13"]]],
k:["List of pending claims, variation register","Pending claims list එක, variation register එක"]},

{i:"P9",c:"pay",r:"C",t:["Final account and Final Payment Certificate","Final account සහ Final Payment Certificate"],
m:["After the defects period ends and you get the Performance Certificate, you settle the final account. The Engineer then issues the Final Payment Certificate and the Employer makes the last payment.","Defects period එක ඉවර වෙලා Performance Certificate එක ලැබුණාම final account එක settle කරනවා. ඊට පස්සේ Engineer Final Payment Certificate එක නිකුත් කරනවා, Employer අවසාන ගෙවීම කරනවා."],
d:[["a","Date we received the Performance Certificate","Performance Certificate එක ලැබුණු දිනය"]],
s:[["a+56","do","Send 6 copies of your draft final statement to the Engineer.","ඔබේ draft final statement එකේ copies 6ක් Engineer ට යවන්න.",["14.10"]],
[null,"do","With the agreed Final Statement, give a written discharge confirming it is the full and final settlement.","එකඟ වූ Final Statement එකත් එක්ක, එය සම්පූර්ණ සහ අවසාන settlement එක බව තහවුරු කරන ලිඛිත discharge එකක් දෙන්න.",["14.11"]],
[null,"know","The Engineer issues the Final Payment Certificate within 28 days. The Employer must pay within 56 days after receiving it.","Engineer දින 28ක් ඇතුළත Final Payment Certificate එක නිකුත් කරනවා. ඒක ලැබී දින 56ක් ඇතුළත Employer ගෙවිය යුතුයි.",["14.12","14.6(c)"]],
[null,"if","If there is a dispute, you get a certificate for the agreed parts, and the rest goes through the dispute process.","Dispute එකක් තියෙනවා නම්, එකඟ වූ කොටස් වලට certificate එකක් ලැබෙනවා, ඉතිරිය dispute ක්‍රියාවලියෙන්.",["14.10","19.2"]],
[null,"warn","If you do not apply, the Engineer will ask you. If you still do not apply within 28 days, the Engineer issues the certificate for the amount the Engineer thinks is due.","ඔබ apply නොකළොත් Engineer ඉල්ලනවා. තවමත් දින 28ක් ඇතුළත apply නොකළොත්, Engineer තමන් හිතන මුදලට certificate එක නිකුත් කරනවා.",["14.12"]]]},

{i:"P10",c:"pay",r:"B",t:["Price changes (price fluctuation / price adjustment formula)","මිල වෙනස්වීම් (price fluctuation / price adjustment formula)"],
m:["When material and labour prices go up or down during the job, a formula adjusts the payment using official monthly indices (published by ICTAD, now CIDA). This applies only if the Contract Data says so.","Job එක අතරතුර materials සහ labour මිල ඉහළ හෝ පහළ ගියාම, නිල මාසික indices (ICTAD, දැන් CIDA ප්‍රකාශයට පත් කරන) භාවිත කරලා formula එකකින් ගෙවීම adjust කරනවා. මෙය අදාළ වන්නේ Contract Data එකේ එසේ කියලා තියෙනවා නම් පමණයි."],
s:[[null,"do","Check the Contract Data: price adjustment applies only if it says so.","Contract Data එක check කරන්න: price adjustment අදාළ වන්නේ එහි එසේ සඳහන් නම් පමණයි.",["13.7","ITB 14.4"]],
[null,"know","Formula: F = 0.966 × (V − Vna) ÷ 100 × Σ [Px × (current index − base index) ÷ base index]. The Px weightings add up to 90 (see Schedule 9).","Formula: F = 0.966 × (V − Vna) ÷ 100 × Σ [Px × (current index − base index) ÷ base index]. Px weightings එකතුව 90යි (Schedule 9 බලන්න).",["13.7"]],
[null,"know","Base indices are those of one month before the bid deadline. For the first bill, current indices are those of the first month after commencement. For later bills, use the month that is one month after the previous valuation.","Base indices කියන්නේ bid deadline එකට මාසයකට කලින් indices. පළමු bill එකට current indices කියන්නේ commencement එකෙන් පස්සේ පළමු මාසයේ indices. පසුව bills වලට පෙර valuation එකෙන් මාසයකට පස්සේ මාසයේ indices.",["13.7"]],
[null,"know","Not adjusted (Vna): BOQ items listed in the Contract Data, variations priced at current rates, and dayworks. V includes 80% of materials on site not yet used.","Adjust නොකරන (Vna): Contract Data එකේ ලැයිස්තුගත BOQ items, current rates වලින් price කළ variations, සහ dayworks. V එකට තවම භාවිත නොකළ site materials වලින් 80%ක් ඇතුළත්.",["13.7"]],
[null,"warn","For work done after the completion date, the indices of the completion date are used. The Engineer can change the weightings if they become unfair.","Completion date එකෙන් පස්සේ කරන වැඩ වලට completion date එකේ indices භාවිත කරනවා. Weightings අසාධාරණ වුණොත් Engineer ට ඒවා වෙනස් කරන්න පුළුවන්.",["13.7"]]],
calc:"pf"},

{i:"P11",c:"pay",r:"C",t:["A tax or law changed (VAT, SSCL, import duty)","Tax එකක් හෝ නීතියක් වෙනස් වුණා (VAT, SSCL, import duty)"],
m:["Your price was based on the laws and taxes 28 days before the bid deadline. If a new law or tax changes your cost after that, the contract price is adjusted up or down.","ඔබේ price එක පදනම් වුණේ bid deadline එකට දින 28කට කලින් තිබූ නීති සහ taxes මත. ඊට පස්සේ අලුත් නීතියක් හෝ tax එකක් ඔබේ වියදම වෙනස් කළොත්, contract price එක ඉහළට හෝ පහළට adjust වෙනවා."],
d:[["a","Date we knew about the change","වෙනස්කම ගැන දැනගත් දිනය"]],
s:[[null,"know","Only changes between 28 days before the bid deadline and the completion certificate count.","ගණන් ගන්නේ bid deadline එකට දින 28කට කලින් සිට completion certificate එක දක්වා කාලයේ වෙනස්කම් පමණයි.",["13.6"]],
["a+28","warn","Last day to send your notice to the Engineer.","Engineer ට notice එක යවන්න අවසාන දිනය.",["13.6","19.1"]],
["a+84","do","Send the full claim: extra time and cost. If the price adjustment formula already covered it, it is not paid twice.","සම්පූර්ණ claim එක යවන්න: අමතර කාලය සහ වියදම. Price adjustment formula එකෙන් දැනටමත් ආවරණය වුණා නම් දෙවරක් ගෙවන්නේ නැහැ.",["13.6","19.1"]],
[null,"know","VAT is shown separately in the BOQ. Taxes at the base date are treated as included in your rates.","VAT එක BOQ එකේ වෙනම පෙන්වනවා. Base date එකේ taxes ඔබේ rates වලට ඇතුළත් යැයි සැලකෙනවා.",["ITB 14.3","14.1(b)"]]],
e:"EC",k:["Gazette notices, invoices before and after the change","Gazette notices, වෙනස්කමට කලින් සහ පසු invoices"]},

{i:"P12",c:"pay",r:"E",t:["The Employer wants money from the contractor, or wants to extend the defects period","Employer contractor ගෙන් මුදලක් ඉල්ලන්න, නැත්නම් defects period එක දිගු කරන්න ඕනේ"],
m:["The Employer cannot simply cut money from payments. It must give notice and details first, and the Engineer must decide the amount.","Employer ට ගෙවීම් වලින් හිතුමතේ මුදල් කපන්න බැහැ. මුලින් notice සහ විස්තර දෙන්න ඕනේ, Engineer මුදල තීරණය කරන්න ඕනේ."],
s:[[null,"do","As soon as possible, give the contractor notice with details (which clause, and how the amount is worked out). For extending the defects period, give notice before it ends.","හැකි ඉක්මනින්, විස්තර (කුමන clause එකද, මුදල ගණනය කළේ කොහොමද) සහිතව contractor ට notice දෙන්න. Defects period එක දිගු කරන්න නම් එය අවසන් වෙන්න කලින් notice දෙන්න.",["2.4"]],
[null,"know","Only after the Engineer agrees or decides the amount can it be deducted from a certificate.","Engineer මුදල එකඟ කළාට හෝ තීරණය කළාට පස්සේ පමණයි certificate එකකින් අඩු කරන්න පුළුවන්.",["2.4","3.4"]]]},

{i:"P13",c:"pay",r:"B",t:["Increasing, extending or getting back the Performance Security","Performance Security එක වැඩි කිරීම, දිගු කිරීම හෝ ආපසු ගැනීම"],
m:["The Performance Security must stay valid until all work and defects are finished. If the contract value grows a lot, the Engineer can ask you to increase it.","සියලු වැඩ සහ defects ඉවර වෙනකම් Performance Security එක valid වෙන්න ඕනේ. Contract value එක ගොඩක් වැඩි වුණොත් ඒක වැඩි කරන්න Engineer ට ඉල්ලන්න පුළුවන්."],
d:[["a","Performance Security expiry date","Performance Security expiry දිනය"]],
s:[[null,"know","If additions from variations, price changes or law changes go over 25% of the contract price, the Engineer can ask you in writing to increase the security by the same percentage, and then again at every further 15%.","Variations, මිල වෙනස්වීම් හෝ නීති වෙනස්වීම් වලින් එකතු වීම් contract price එකෙන් 25% ඉක්මවූ විට, security එක එම ප්‍රතිශතයෙන් වැඩි කරන්න Engineer ට ලිඛිතව ඉල්ලන්න පුළුවන්, පසුව තවත් හැම 15%කටම නැවතත්.",["4.2"]],
["a-28","warn","If you will not have the Performance Certificate by this date, extend the security before it expires.","මේ දිනය වෙද්දී Performance Certificate එක ලැබී නැත්නම්, security එක expire වෙන්න කලින් extend කරන්න.",["4.2"]],
[null,"know","The Employer must return it within 21 days after receiving a copy of the Performance Certificate.","Performance Certificate එකේ copy එකක් ලැබී දින 21ක් ඇතුළත Employer එය ආපසු දිය යුතුයි.",["4.2"]]]}
);
EV.push(
{i:"V1",c:"var",r:"C",t:["The Engineer gave an instruction by word of mouth (verbal instruction)","Engineer වචනයෙන් (verbal) instruction එකක් දුන්නා"],
m:["Under this contract, instructions must be in writing. If you do extra work on a spoken instruction only, you may not get paid. Always get it in writing first.","මේ contract එක යටතේ instructions ලිඛිතව දිය යුතුයි. වචනයෙන් පමණක් කියපු instruction එකකට අමතර වැඩ කළොත් ගෙවීම නොලැබෙන්න පුළුවන්. හැමවිටම මුලින් ලිඛිතව ගන්න."],
s:[[null,"do","Ask for the instruction in writing before you start the work.","වැඩ පටන් ගන්න කලින් instruction එක ලිඛිතව ඉල්ලන්න.",["3.3"]],
[null,"warn","Do not change the permanent works unless the Engineer has instructed or approved a Variation.","Engineer Variation එකක් instruct හෝ approve නොකර permanent works වෙනස් කරන්න එපා.",["13.1"]],
[null,"do","If the instruction came from the Engineer's assistant, check their delegation letter to see if they have that power. If in doubt, refer it to the Engineer.","Instruction එක ආවේ Engineer ගේ assistant කෙනෙකුගෙන් නම්, ඔවුන්ට ඒ බලය තියෙනවද කියලා delegation letter එක බලන්න. සැකයක් තිබුණොත් Engineer ට යොමු කරන්න.",["3.2"]],
[null,"know","The Engineer cannot change the contract itself. If the Contract Data says the Employer must approve price-raising variations, the Engineer's instruction is still treated as approved.","Engineer ට contract එකම වෙනස් කරන්න බැහැ. මිල වැඩි කරන variations වලට Employer approval ඕනේ කියලා Contract Data එකේ තිබුණත්, Engineer ගේ instruction එක approve වූ ලෙසම සැලකෙනවා.",["3.1","CD 3.1"]]],
k:["Instruction register, site diary","Instruction register, site diary"],
n:["Engineer","Request for written instruction","On __ at site, an oral instruction was given regarding __. Please confirm this instruction in writing in accordance with Sub-Clause 3.3 before we proceed."]},

{i:"V2",c:"var",r:"C",t:["We received a Variation instruction (a change to the work)","Variation instruction එකක් (වැඩට වෙනස්කමක්) ලැබුණා"],
m:["A Variation is an official change to the work, such as more work, less work, or a different design. You must carry it out, and it is valued and paid, with extra time if needed.","Variation එකක් කියන්නේ වැඩට කරන නිල වෙනස්කමක්: වැඩි වැඩ, අඩු වැඩ, හෝ වෙනස් design එකක් වගේ. ඔබ එය කළ යුතුයි, ඒකට value කරලා ගෙවනවා, අවශ්‍ය නම් අමතර කාලයත් ලැබෙනවා."],
d:[["a","Date we received the instruction","Instruction එක ලැබුණු දිනය"]],
s:[["a","do","Confirm in writing that you received the instruction. If it asks you to keep cost records, keep them.","Instruction එක ලැබුණු බව ලිඛිතව තහවුරු කරන්න. Cost records තියාගන්න කියලා තියෙනවා නම් ඒවා තියාගන්න.",["13.3"]],
[null,"if","If you cannot get the materials or goods needed, tell the Engineer straight away with details. The Engineer will cancel, confirm or change the instruction.","අවශ්‍ය materials හෝ goods ගන්න බැරි නම්, විස්තර සහිතව වහාම Engineer ට කියන්න. Engineer instruction එක cancel, confirm හෝ වෙනස් කරනවා.",["13.1"]],
[null,"know","The change is valued using the contract rates rules. If it delays completion, you can get extra time (EOT).","වෙනස්කම value කරන්නේ contract rates නීති අනුව. එය completion ප්‍රමාද කරනවා නම් අමතර කාලය (EOT) ලැබිය හැකියි.",["13.3","12.3","8.4(a)"]],
[null,"know","If variations push the price up by more than 25%, the Engineer can ask you to increase the Performance Security.","Variations නිසා මිල 25%කට වඩා වැඩි වුණොත්, Performance Security එක වැඩි කරන්න Engineer ට ඉල්ලන්න පුළුවන්.",["4.2"]]],
e:"EC",k:["Variation register, records of workers, machines and materials used","Variation register, භාවිත කළ workers, machines සහ materials records"]},

{i:"V3",c:"var",r:"C",t:["The Engineer asked us for a proposal before ordering a change","වෙනස්කමක් order කරන්න කලින් Engineer අපෙන් proposal එකක් ඉල්ලුවා"],
m:["Sometimes the Engineer wants to know the cost and time impact before deciding on a change. You reply with a short proposal.","සමහර වෙලාවට වෙනස්කමක් ගැන තීරණය කරන්න කලින් එහි වියදම සහ කාල බලපෑම දැනගන්න Engineer ට ඕනේ. ඔබ කෙටි proposal එකකින් පිළිතුරු දෙනවා."],
s:[[null,"do","Reply in writing as soon as you can. Either explain why you cannot do it, or send: (a) what work you will do and a programme, (b) any change to the programme and completion date, and (c) your price for it.","හැකි ඉක්මනින් ලිඛිතව පිළිතුරු දෙන්න. කරන්න බැරි නම් හේතු කියන්න, නැත්නම් යවන්න: (a) කරන වැඩ සහ programme එකක්, (b) programme එකේ සහ completion date එකේ වෙනස්කම්, (c) ඒකට ඔබේ මිල.",["13.3"]],
[null,"warn","Do not slow down other work while you wait for the Engineer's answer.","Engineer ගේ පිළිතුර එනකම් අනෙක් වැඩ ප්‍රමාද කරන්න එපා.",["13.3"]]]},

{i:"V4",c:"var",r:"B",t:["How is the rate for changed or new work decided?","වෙනස් කළ හෝ අලුත් වැඩකට rate එක තීරණය කරන්නේ කොහොමද?"],
m:["There is a clear order for choosing the rate. Existing contract rates come first, and a new rate is used only when the old ones do not fit.","Rate එක තෝරන්න පැහැදිලි අනුපිළිවෙලක් තියෙනවා. මුලින්ම තියෙන contract rates, පරණ ඒවා නොගැළපේ නම් පමණයි අලුත් rate එකක් භාවිත කරන්නේ."],
s:[[null,"know","The order is: 1) the rate for that item in the contract; 2) the rate for similar work; 3) a new rate built from related contract rates; 4) if nothing fits, the reasonable cost plus reasonable profit.","අනුපිළිවෙල: 1) contract එකේ ඒ item එකේ rate එක; 2) සමාන වැඩක rate එක; 3) අදාළ contract rates වලින් හදන අලුත් rate එකක්; 4) කිසිවක් නොගැළපේ නම් සාධාරණ වියදම සහ සාධාරණ profit.",["12.3"]],
[null,"know","A new rate is needed when the quantity changes by more than 25% (with the 1% test), or when the varied work is not similar to any contract item.","අලුත් rate එකක් අවශ්‍ය වන්නේ quantity එක 25%කට වඩා වෙනස් වූ විට (1% test එකත් එක්ක), හෝ variation වැඩ කිසිම contract item එකකට සමාන නැති විට.",["12.3"]],
[null,"know","Until the rate is agreed, the Engineer sets a temporary rate so you still get paid in the monthly certificates.","Rate එක එකඟ වෙනකම් Engineer තාවකාලික rate එකක් දෙනවා, ඒ නිසා මාසික certificates වල ගෙවීම ලැබෙනවා.",["12.3"]]]},

{i:"V5",c:"var",r:"B",t:["A BOQ quantity changed by more than 25%. Do we get a new rate?","BOQ quantity එකක් 25%කට වඩා වෙනස් වුණා. අලුත් rate එකක් ලැබෙනවද?"],
m:["BOQ quantities are only estimates. A new rate is allowed only when the change is big: both tests below must pass. Use the calculator to check.","BOQ quantities ඇස්තමේන්තු පමණයි. අලුත් rate එකකට අවසර තියෙන්නේ වෙනස ලොකු වූ විට පමණයි: පහත test දෙකම සමත් විය යුතුයි. Calculator එකෙන් check කරන්න."],
s:[[null,"know","Both must be true: (i) the measured quantity differs from the BOQ quantity by more than 25%, and (ii) that difference × the rate is more than 1% of the contract price.","දෙකම සත්‍ය විය යුතුයි: (i) measure කළ quantity එක BOQ quantity එකෙන් 25%කට වඩා වෙනස්, සහ (ii) ඒ වෙනස × rate එක contract price එකෙන් 1%කට වඩා වැඩි.",["12.3(a)"]],
[null,"know","BOQ quantities are estimates, not the real quantities you will be paid for.","BOQ quantities ඇස්තමේන්තු මිසක්, ඔබට ගෙවන සැබෑ quantities නොවේ.",["14.1(c)"]],
[null,"if","Even if it is not a Variation, a big quantity change can still give extra time.","Variation එකක් නොවුණත්, ලොකු quantity වෙනසකට අමතර කාලය ලැබිය හැකියි.",["13.1(a)","8.4(a)"]]],
calc:"q25"},

{i:"V6",c:"var",r:"C",t:["Part of our work was removed (omitted), maybe to give to someone else","අපේ වැඩ කොටසක් අයින් කළා (omit), සමහරවිට වෙන කෙනෙකුට දෙන්න"],
m:["The Employer can remove work, but not to give it to another contractor. If removing work leaves you with costs you expected to recover through that work (like overheads), you can claim them.","Employer ට වැඩ අයින් කරන්න පුළුවන්, හැබැයි වෙනත් contractor කෙනෙකුට දෙන්න බැහැ. වැඩ අයින් කිරීම නිසා ඒ වැඩෙන් recover කරන්න හිතපු වියදම් (overheads වගේ) ඔබට ඉතිරි වුණොත් ඒවා claim කරන්න පුළුවන්."],
s:[[null,"warn","Work cannot be omitted just to give it to someone else.","වෙන කෙනෙකුට දෙන්න විතරක් වැඩ omit කරන්න බැහැ.",["13.1(d)"]],
[null,"do","Send the Engineer a notice with details of costs (such as site overheads and preliminaries) that you would have recovered through the omitted work.","Omit කළ වැඩ හරහා recover කරන්න තිබුණු වියදම් (site overheads, preliminaries වගේ) විස්තර සහිතව Engineer ට notice එකක් යවන්න.",["12.4"]],
[null,"know","The Engineer will agree or decide this cost and add it to the contract price.","Engineer මේ වියදම එකඟ කරලා හෝ තීරණය කරලා contract price එකට එකතු කරනවා.",["12.4","3.4"]]],
n:["Engineer","Notice under Sub-Clause 12.4 – Omissions","The omission of __ will result in Cost which would have been covered by sums in the Initial Contract Price no longer being recovered. Supporting details are attached."]},

{i:"V7",c:"var",r:"C",t:["We have an idea to save cost or time (value engineering)","වියදම හෝ කාලය ඉතිරි කරන්න අදහසක් තියෙනවා (value engineering)"],
m:["If you suggest a better way that saves the Employer money, and it is accepted, you share half of the saving.","Employer ගේ මුදල් ඉතිරි කරන හොඳ ක්‍රමයක් ඔබ යෝජනා කරලා එය පිළිගත්තොත්, ඉතිරිය භාගයක් ඔබට ලැබෙනවා."],
s:[[null,"do","Send a written proposal at your own cost. It should speed up the job, cut the Employer's cost, or make the works better. Include the details a variation proposal needs.","ඔබේම වියදමින් ලිඛිත proposal එකක් යවන්න. එය job එක වේගවත් කරන්න, Employer ගේ වියදම අඩු කරන්න, හෝ works හොඳ කරන්න ඕනේ. Variation proposal එකකට ඕනේ විස්තර ඇතුළත් කරන්න.",["13.2"]],
[null,"know","If it changes the design, you do the design for that part and are responsible for it.","Design එක වෙනස් වෙනවා නම්, ඒ කොටසේ design එක ඔබ කරනවා, ඒකට ඔබ වගකියනවා.",["13.2","4.1"]],
[null,"know","Your fee is 50% of (the cut in contract value minus any loss in value to the Employer). If the loss is bigger than the cut, there is no fee.","ඔබේ fee එක = (contract value එකේ අඩු වීම − Employer ට වටිනාකමේ අඩු වීම) × 50%. අඩු වීමට වඩා අලාභය වැඩි නම් fee එකක් නැහැ.",["13.2"]]]},

{i:"V8",c:"var",r:"B",t:["Using a Provisional Sum","Provisional Sum එකක් භාවිත කිරීම"],
m:["A Provisional Sum is money set aside in the BOQ for work not fully known at tender time. It is spent only when the Engineer instructs.","Provisional Sum එකක් කියන්නේ tender වෙලාවේ සම්පූර්ණයෙන් නොදන්නා වැඩ සඳහා BOQ එකේ වෙන් කරපු මුදලක්. එය වියදම් කරන්නේ Engineer instruct කළොත් පමණයි."],
s:[[null,"know","It is used only on the Engineer's instruction. You are paid only for what is instructed.","එය භාවිත කරන්නේ Engineer ගේ instruction එකෙන් පමණයි. ඔබට ගෙවන්නේ instruct කළ දේට පමණයි.",["13.4"]],
[null,"know","Work you do yourself is valued like a Variation. Things you buy (for example from a nominated subcontractor) are paid at the real amount plus your overhead and profit percentage (from the schedule, or the Contract Data, usually 10%).","ඔබම කරන වැඩ Variation එකක් වගේ value කරනවා. ඔබ මිලදී ගන්න දේවල් (උදා: nominated subcontractor ගෙන්) සැබෑ මුදලට සහ ඔබේ overhead සහ profit ප්‍රතිශතයට (schedule එකෙන්, නැත්නම් Contract Data එකෙන්, සාමාන්‍යයෙන් 10%) ගෙවනවා.",["13.4","CD 13.4(b)"]],
[null,"do","Keep quotations, invoices and receipts, and show them when asked.","Quotations, invoices සහ receipts තියාගෙන, ඉල්ලුවාම පෙන්වන්න.",["13.4"]]]},

{i:"V9",c:"var",r:"C",t:["We were told to do work on a dayworks basis","Dayworks ක්‍රමයට වැඩක් කරන්න කිව්වා"],
m:["Dayworks means you are paid for the actual labour, machines and materials used, at the dayworks rates in the contract. It is for small or odd jobs. The daily records are very important.","Dayworks කියන්නේ භාවිත කළ සැබෑ labour, machines සහ materials වලට, contract එකේ dayworks rates අනුව ගෙවීම. එය කුඩා හෝ අමුතු වැඩ වලට. දිනපතා records ඉතා වැදගත්."],
s:[[null,"know","This applies only if the contract has a Dayworks Schedule.","මෙය අදාළ වන්නේ contract එකේ Dayworks Schedule එකක් තියෙනවා නම් පමණයි.",["13.5"]],
[null,"do","Before ordering materials, send quotations to the Engineer.","Materials order කරන්න කලින් quotations Engineer ට යවන්න.",["13.5"]],
[null,"do","Every day, give the Engineer two copies of a record of the previous day: workers (names, jobs, hours), machines (type, hours) and materials used. When the Engineer signs one copy, send the priced version before the next bill.","හැම දවසකම, පෙර දවසේ record එකක copies දෙකක් Engineer ට දෙන්න: workers (නම්, රැකියා, පැය), machines (වර්ගය, පැය) සහ භාවිත කළ materials. Engineer එක copy එකක් sign කළාම, ඊළඟ bill එකට කලින් priced version එක යවන්න.",["13.5"]],
[null,"know","Dayworks are not included in price adjustment.","Dayworks price adjustment වලට ඇතුළත් වෙන්නේ නැහැ.",["13.7"]]]},

{i:"V10",c:"var",r:"C",t:["Joint measurement and measurement records","Joint measurement සහ measurement records"],
m:["Payment is based on measured quantities. If you do not attend measurement, or do not object to the records in time, the Engineer's numbers are accepted as correct.","ගෙවීම පදනම් වෙන්නේ measure කළ quantities මත. Measurement එකට නොගියොත්, නැත්නම් records වලට නියමිත කාලයට විරුද්ධ නොවුණොත්, Engineer ගේ ගණන් නිවැරදි ලෙස පිළිගන්නවා."],
d:[["a","Date we were asked to check the records","Records check කරන්න ඉල්ලපු දිනය"]],
s:[[null,"do","When given notice, attend the measurement (or send a qualified person). If no one attends, the Engineer's measurement is accepted as correct.","Notice ලැබුණාම measurement එකට යන්න (හෝ සුදුසුකම් ඇති කෙනෙක් යවන්න). කවුරුත් නොගියොත් Engineer ගේ measurement එක නිවැරදි ලෙස පිළිගන්නවා.",["12.1"]],
["a+14","warn","If you disagree with the records, send a notice showing what is wrong by this date. If not, the records are accepted as correct.","Records වලට එකඟ නැත්නම්, වැරදි මොනවද කියලා පෙන්වන notice එකක් මේ දිනය වෙද්දී යවන්න. නැත්නම් records නිවැරදි ලෙස පිළිගන්නවා.",["12.1"]],
[null,"know","Measure the net actual quantity, using the measurement method named in the Contract Data (for example SLS 573 for buildings, CESMM for civil works).","Contract Data එකේ නම් කර ඇති measurement method එක (උදා: buildings සඳහා SLS 573, civil works සඳහා CESMM) භාවිත කරලා net actual quantity එක measure කරන්න.",["12.2"]]],
k:["Signed measurement sheets","Sign කළ measurement sheets"]},

{i:"V11",c:"var",r:"B",t:["Documents do not match (drawing vs specification vs BOQ)","Documents එකිනෙකට නොගැළපෙනවා (drawing vs specification vs BOQ)"],
m:["When documents say different things, the contract gives an order of priority. The Engineer must then clarify in writing.","Documents වෙනස් දේවල් කියද්දී, contract එක ප්‍රමුඛතා අනුපිළිවෙලක් දෙනවා. ඊට පස්සේ Engineer ලිඛිතව පැහැදිලි කළ යුතුයි."],
s:[[null,"know","Priority order: Contract Agreement, Letter of Acceptance, MOU, Form of Bid, Contract Data, Conditions of Contract, Specifications, Drawings, then BOQ.","ප්‍රමුඛතා අනුපිළිවෙල: Contract Agreement, Letter of Acceptance, MOU, Form of Bid, Contract Data, Conditions of Contract, Specifications, Drawings, පසුව BOQ.",["1.5"]],
[null,"do","Ask the Engineer for a written clarification or instruction. If that instruction changes the work, it is a Variation.","Engineer ගෙන් ලිඛිත clarification එකක් හෝ instruction එකක් ඉල්ලන්න. ඒ instruction එක වැඩ වෙනස් කරනවා නම් එය Variation එකක්.",["1.5","3.3","13.1"]]]},

{i:"V12",c:"var",r:"B",t:["We found a mistake in a drawing or technical document","Drawing එකක හෝ technical document එකක වැරැද්දක් හම්බ වුණා"],
m:["Whoever finds a technical mistake must tell the other side quickly, so it can be fixed before it causes damage.","Technical වැරැද්දක් හොයාගන්න ඕනෑම කෙනෙක්, හානියක් වෙන්න කලින් හදන්න පුළුවන් වෙන්න අනෙක් පාර්ශවයට ඉක්මනින් කියන්න ඕනේ."],
s:[[null,"do","Tell the other side quickly in writing.","අනෙක් පාර්ශවයට ඉක්මනින් ලිඛිතව කියන්න.",["1.8"]],
[null,"if","If the mistake is in the Employer's setting-out points or levels, see the setting-out situation.","වැරැද්ද Employer දුන් setting-out points හෝ levels වල නම්, setting-out අවස්ථාව බලන්න.",["4.7"]],
[null,"do","If fixing it changes the work, get a written instruction.","ඒක හදන එකෙන් වැඩ වෙනස් වෙනවා නම් ලිඛිත instruction එකක් ගන්න.",["3.3","13.1"]]]},

{i:"F1",c:"site",r:"C",t:["Unexpected ground conditions (rock, soft soil, water, buried pipes or cables, pollution)","අනපේක්ෂිත ground conditions (rock, soft soil, ජලය, වළලපු pipes/cables, pollution)"],
m:["If the ground turns out different from what an experienced contractor could have expected at tender time, you can get extra time and extra cost (but not profit). You must tell the Engineer quickly so they can see it.","Tender වෙලාවේ පළපුරුදු contractor කෙනෙකුට අපේක්ෂා කළ හැකි දෙයට වඩා බිම වෙනස් නම්, අමතර කාලය සහ අමතර වියදම ලැබෙනවා (profit නැහැ). Engineer ට ඇවිත් බලන්න පුළුවන් වෙන්න ඉක්මනින් කියන්න ඕනේ."],
d:[["a","Date we found the condition","තත්ත්වය හම්බ වුණු දිනය"]],
q:[["Could an experienced contractor have expected this from the site data and site visit at tender time?","Tender වෙලාවේ site data සහ site visit එකෙන් පළපුරුදු contractor කෙනෙකුට මේක අපේක්ෂා කරන්න තිබුණද?","If it could be expected, you do not get time or money.","අපේක්ෂා කළ හැකි නම් කාලය හෝ මුදල් ලැබෙන්නේ නැහැ.","",""],["Is this caused by the weather?","මේකට හේතුව කාලගුණයද?","Weather is not covered by this rule. See the bad weather situation.","කාලගුණය මේ නීතියට ඇතුළත් නැහැ. දරුණු කාලගුණ අවස්ථාව බලන්න.","",""]],
s:[["a","do","Tell the Engineer straight away. Describe the condition so it can be inspected, and explain why it could not be expected.","වහාම Engineer ට කියන්න. Inspect කරන්න පුළුවන් විදිහට තත්ත්වය විස්තර කරලා, ඒක අපේක්ෂා කරන්න බැරි වුණේ ඇයි කියලා පැහැදිලි කරන්න.",["4.11"]],
[null,"do","Keep working using proper methods, and follow the Engineer's instructions (if they change the work, they are Variations).","සුදුසු ක්‍රමවලින් වැඩ දිගටම කරන්න, Engineer ගේ instructions පිළිපදින්න (ඒවා වැඩ වෙනස් කරනවා නම් Variations).",["4.11"]],
["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["19.1"]],
["a+84","do","Send the full claim: extra time and cost (no profit). The Engineer may reduce it if other parts of the ground were better than expected.","සම්පූර්ණ claim එක යවන්න: අමතර කාලය සහ වියදම (profit නැහැ). බිමේ අනෙක් කොටස් අපේක්ෂාවට වඩා හොඳ නම් Engineer ට එය අඩු කරන්න පුළුවන්.",["4.11","19.1"]]],
e:"EC",k:["Photos, levels, comparison with borehole logs, site diary","Photos, levels, borehole logs සමඟ සංසන්දනය, site diary"],
n:["Engineer","Unforeseeable physical conditions","On __ we found the following adverse physical conditions at __. We consider them Unforeseeable because __. The conditions are available for your inspection."]},

{i:"F2",c:"site",r:"C",t:["The setting-out points or levels given by the Employer are wrong","Employer දුන් setting-out points හෝ levels වැරදියි"],
m:["The Employer is responsible for the reference points it gives. If they are wrong and you could not reasonably have noticed, you get time, cost and profit for the extra work.","Employer දෙන reference points වලට Employer වගකියනවා. ඒවා වැරදි නම් සහ ඔබට සාධාරණ ලෙස එය හඳුනාගන්න බැරි වුණා නම්, අමතර වැඩ වලට කාලය, වියදම සහ profit ලැබෙනවා."],
d:[["a","Date we found the error","වැරැද්ද හම්බ වුණු දිනය"]],
q:[["Did you make reasonable checks on the points before using them?","භාවිත කරන්න කලින් points සාධාරණ ලෙස check කළාද?","","","If you did not check, your claim may fail.","Check නොකළා නම් ඔබේ claim එක අසාර්ථක වෙන්න පුළුවන්."]],
s:[["a","do","Tell the Engineer in writing.","Engineer ට ලිඛිතව කියන්න.",["4.7"]],
["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["19.1"]],
["a+84","do","Send the full claim: extra time, cost and profit.","සම්පූර්ණ claim එක යවන්න: අමතර කාලය, වියදම සහ profit.",["4.7","19.1"]]],
e:"ECP"},

{i:"F3",c:"site",r:"C",x:1,t:["We found old or valuable items (antiques, fossils, coins, ruins)","පැරණි හෝ වටිනා දේවල් (පුරාවස්තු, fossils, කාසි, නටබුන්) හම්බ වුණා"],
m:["Anything of historical or special value found on site belongs under the Employer's control. Stop, protect it, and follow the Engineer's instructions. You can get time and cost.","Site එකේ හම්බ වෙන ඓතිහාසික හෝ විශේෂ වටිනාකමක් ඇති ඕනෑම දෙයක් Employer ගේ පාලනයට යටත්. නවත්වලා, ආරක්ෂා කරලා, Engineer ගේ instructions පිළිපදින්න. කාලය සහ වියදම ලැබෙනවා."],
d:[["a","Date we found it","හම්බ වුණු දිනය"]],
s:[["a","do","Tell the Engineer straight away. Do not let anyone move or damage the items.","වහාම Engineer ට කියන්න. කිසිවෙකුට ඒවා ඉවත් කරන්න හෝ හානි කරන්න ඉඩ දෙන්න එපා.",["4.16"]],
[null,"do","Follow the Engineer's instructions on how to deal with it.","ඒක හසුරුවන්නේ කොහොමද කියන Engineer ගේ instructions පිළිපදින්න.",["4.16"]],
["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["4.16","19.1"]],
["a+84","do","Send the full claim: extra time and cost.","සම්පූර්ණ claim එක යවන්න: අමතර කාලය සහ වියදම.",["19.1"]]],
e:"EC"},

{i:"F4",c:"site",r:"B",t:["Who is responsible for site investigation data?","Site investigation data වලට වගකියන්නේ කවුද?"],
m:["The Employer must share all the ground data it has. But understanding that data, and pricing the risk, is the contractor's job.","Employer ළඟ තියෙන සියලු ground data බෙදාගත යුතුයි. හැබැයි ඒ data තේරුම් අරගෙන, අවදානම price කිරීම contractor ගේ වගකීම."],
s:[[null,"know","The Employer must give all ground and water data it had before the base date, and any data it gets later.","Base date එකට කලින් තිබූ සියලු ground සහ ජල data, පසුව ලැබෙන data ත්, Employer දිය යුතුයි.",["4.9"]],
[null,"warn","You are responsible for reading and understanding the data. You are treated as having inspected the site and being happy with your price.","Data කියවලා තේරුම් ගැනීම ඔබේ වගකීම. ඔබ site එක inspect කරලා, ඔබේ price එකට සෑහීමකට පත් වූ ලෙස සැලකෙනවා.",["4.9","4.10","ITB 8"]]]},

{i:"F5",c:"site",r:"C",t:["Access road problems, damaged bridges, or we need extra land","Access road ප්‍රශ්න, හානි වූ පාලම්, නැත්නම් අමතර ඉඩම් ඕනේ"],
m:["Getting to the site is mainly your risk. You were expected to check the access routes before pricing.","Site එකට යන එක ප්‍රධාන වශයෙන් ඔබේ අවදානමක්. Price කරන්න කලින් access routes check කරලා ඇති බව සැලකෙනවා."],
s:[[null,"warn","You are treated as happy with the access routes. Their upkeep, signs, permissions, and any cost if they are unsuitable, are yours.","Access routes ගැන ඔබ සෑහීමකට පත් වූ ලෙස සැලකෙනවා. ඒවායේ නඩත්තුව, signs, අවසර, සහ නොගැළපේ නම් වියදම ඔබේ.",["4.20"]],
[null,"know","Any special right of way or land outside the site that you need is at your own cost and risk.","ඔබට ඕනේ ඕනෑම විශේෂ right of way එකක් හෝ site එකෙන් පිටත ඉඩමක් ඔබේම වියදමට සහ අවදානමට.",["4.18"]]]},

{i:"F6",c:"site",r:"C",t:["Complaints from neighbours or the public (blocked road, noise, dust)","අසල්වැසියන් හෝ පොදු ජනතාවගෙන් පැමිණිලි (පාර අවහිර, ශබ්දය, දූවිලි)"],
m:["You must not disturb the public more than needed. If people claim against the Employer because of your work, you must cover it.","අවශ්‍ය ප්‍රමාණයට වඩා පොදු ජනතාවට බාධා කරන්න එපා. ඔබේ වැඩ නිසා අය Employer ට විරුද්ධව claim කළොත් ඔබ ඒක cover කරන්න ඕනේ."],
s:[[null,"do","Do not block or disturb the public or roads more than necessary. You must protect the Employer from claims caused by this.","අවශ්‍ය ප්‍රමාණයට වඩා ජනතාවට හෝ පාරවල් වලට බාධා කරන්න එපා. මේ නිසා එන claims වලින් Employer ආරක්ෂා කරන්න ඕනේ.",["4.19"]],
[null,"do","Keep noise, dust and pollution within the limits in the specification and the law.","ශබ්දය, දූවිලි සහ pollution specification එකේ සහ නීතියේ සීමාවන් ඇතුළත තියාගන්න.",["4.13"]],
[null,"do","Provide temporary works (footpaths, fences) to protect the public, and keep your work inside the site.","ජනතාව ආරක්ෂා කරන්න temporary works (පදික මාර්ග, වැටවල්) දෙන්න, ඔබේ වැඩ site එක ඇතුළේ තියාගන්න.",["4.8","4.15"]],
[null,"know","Damage to other people's property is covered by your indemnity and third-party insurance.","අනුන්ගේ දේපළ වලට හානි ඔබේ indemnity එකෙන් සහ third-party insurance එකෙන් cover වෙනවා.",["17.1","18.2"]]]},

{i:"F7",c:"site",r:"C",t:["We are asked to give space or facilities to the Employer's other contractors","Employer ගේ අනෙක් contractors ට site එකේ ඉඩ හෝ facilities දෙන්න කියනවා"],
m:["You must let the Employer's other contractors work on or near the site. If this costs you something you could not expect at tender time, it is treated as a Variation.","Employer ගේ අනෙක් contractors ට site එකේ හෝ ළඟ වැඩ කරන්න ඉඩ දෙන්න ඕනේ. Tender වෙලාවේ අපේක්ෂා කළ නොහැකි වියදමක් ඔබට ආවොත් එය Variation එකක් ලෙස සැලකෙනවා."],
s:[[null,"do","Give them the opportunities stated in the contract or instructed by the Engineer.","Contract එකේ කියලා තියෙන හෝ Engineer instruct කරන අවස්ථා ඔවුන්ට දෙන්න.",["4.6"]],
[null,"know","If this causes cost you could not expect at tender time, the instruction counts as a Variation.","Tender වෙලාවේ අපේක්ෂා කළ නොහැකි වියදමක් ආවොත් ඒ instruction එක Variation එකක් ලෙස ගණන් ගන්නවා.",["4.6","13.1"]],
[null,"if","If they delay you, you can claim extra time.","ඔවුන් ඔබව ප්‍රමාද කළොත් අමතර කාලය claim කරන්න පුළුවන්.",["2.3","8.4(e)"]]],
e:"EC"},

{i:"F8",c:"site",r:"C",t:["There was an accident on site","Site එකේ අනතුරක් සිදු වුණා"],
m:["Safety is the contractor's duty. After an accident you must report it quickly, keep records, and deal with insurance and the authorities.","ආරක්ෂාව contractor ගේ වගකීම. අනතුරකින් පසු ඉක්මනින් වාර්තා කරන්න, records තියාගන්න, insurance සහ අදාළ ආයතන සමඟ කටයුතු කරන්න ඕනේ."],
s:[[null,"do","Send details of the accident to the Engineer as soon as you can, and keep safety records.","හැකි ඉක්මනින් අනතුරේ විස්තර Engineer ට යවන්න, safety records තියාගන්න.",["6.6"]],
[null,"know","You must follow safety rules, provide fencing and lighting, and have a named safety officer.","ආරක්ෂක නීති පිළිපදින්න, වැටවල් සහ ආලෝකය දෙන්න, නම් කළ safety officer කෙනෙක් ඉන්න ඕනේ.",["4.8","6.6"]],
[null,"do","Inform the authorities as labour laws require. Provide proper supervision, and do not let workers live inside the permanent structures.","Labour laws අනුව අදාළ ආයතන දැනුවත් කරන්න. නිසි supervision දෙන්න, permanent structures ඇතුළේ workers ලාට ජීවත් වෙන්න ඉඩ දෙන්න එපා.",["6.3","6.7","6.5"]],
[null,"do","Claim under the workers' insurance. You must protect the Employer from claims.","Workers ගේ insurance එක යටතේ claim කරන්න. Claims වලින් Employer ආරක්ෂා කරන්න ඕනේ.",["18.3","17.1"]]],
k:["Accident report, witness statements, photos","Accident report, සාක්ෂිකරුවන්ගේ ප්‍රකාශ, photos"]},

{i:"F9",c:"site",r:"C",t:["We need to work at night, on Sundays or on holidays","රාත්‍රියේ, ඉරිදා හෝ නිවාඩු දිනවල වැඩ කරන්න ඕනේ"],
m:["Work outside normal hours needs the Engineer's consent, except in an emergency.","සාමාන්‍ය වේලාවෙන් පිටත වැඩ කරන්න Engineer ගේ අනුමැතිය ඕනේ, හදිසි අවස්ථාවක හැර."],
s:[[null,"do","Get the Engineer's consent first (unless the contract already allows it).","මුලින්ම Engineer ගේ අනුමැතිය ගන්න (contract එකේ දැනටමත් අවසර නැත්නම්).",["6.4"]],
[null,"if","If it is needed to save life, property or the works, do it and tell the Engineer immediately.","ජීවිත, දේපළ හෝ works ආරක්ෂා කරන්න අවශ්‍ය නම්, එය කරලා වහාම Engineer ට කියන්න.",["6.4"]]]},

{i:"F10",c:"site",r:"C",t:["Bringing plant to site, or removing equipment from site","Site එකට plant ගෙන්වීම, හෝ site එකෙන් equipment ඉවත් කිරීම"],
m:["The Engineer needs to know about big deliveries, and must agree before major equipment leaves the site.","ලොකු deliveries ගැන Engineer දැනගන්න ඕනේ, ප්‍රධාන equipment site එකෙන් යන්න කලින් Engineer එකඟ වෙන්න ඕනේ."],
s:[[null,"do","Tell the Engineer at least 7 days before plant or any major goods arrive on site.","Plant හෝ ප්‍රධාන goods site එකට එන්න අවම වශයෙන් දින 7කට කලින් Engineer ට කියන්න.",["4.21"]],
[null,"warn","You need the Engineer's consent to remove major equipment (not needed for vehicles carrying goods or people).","ප්‍රධාන equipment ඉවත් කරන්න Engineer ගේ අනුමැතිය ඕනේ (goods හෝ මිනිස්සු රැගෙන යන වාහන වලට අවශ්‍ය නැහැ).",["4.12"]]]},

{i:"F11",c:"site",r:"C",t:["Theft on site, or damage to the works before handover","Site එකේ සොරකමක්, නැත්නම් handover එකට කලින් works වලට හානියක්"],
m:["Until handover, the works are in your care. Most loss or damage is yours to fix at your own cost, unless it was caused by one of the Employer's risks.","Handover වෙනකම් works ඔබේ භාරයේ. බොහෝ පාඩු හෝ හානි ඔබේම වියදමින් හදන්න ඕනේ, Employer's risks එකකින් වුණා නම් හැර."],
s:[[null,"warn","From start until handover, you care for the works. Fix any loss or damage at your own cost, unless it came from an Employer's risk.","ආරම්භයේ සිට handover දක්වා works රැකබලාගන්නේ ඔබ. Employer's risk එකකින් නොවේ නම් ඕනෑම පාඩුවක් හෝ හානියක් ඔබේම වියදමින් හදන්න.",["17.2"]],
[null,"do","Keep unauthorised people out of the site.","අනවසර පුද්ගලයන් site එකෙන් එළියට තියාගන්න.",["4.22"]],
[null,"do","Claim under the Contractor's All Risks (Works) insurance.","Contractor's All Risks (Works) insurance එක යටතේ claim කරන්න.",["18.1"]],
[null,"if","If the cause is an Employer's risk (war, riot by others, Employer's design, etc.), see that situation.","හේතුව Employer's risk එකක් (යුද්ධය, අනුන්ගේ කලබල, Employer ගේ design, ආදිය) නම් ඒ අවස්ථාව බලන්න.",["17.3"]]]},

{i:"F12",c:"site",r:"C",t:["Unrest or a strike among our own workers","අපේම workers අතර කලබලයක් හෝ වර්ජනයක්"],
m:["Problems with your own workers are your responsibility. A strike by your own staff does not give you extra time.","ඔබේම workers ගේ ප්‍රශ්න ඔබේ වගකීම. ඔබේම staff ගේ වර්ජනයකට අමතර කාලය ලැබෙන්නේ නැහැ."],
s:[[null,"do","Take all reasonable steps to prevent disorder and keep people and property safe.","කලබල වළක්වන්නත්, මිනිස්සු සහ දේපළ ආරක්ෂා කරන්නත් සියලු සාධාරණ පියවර ගන්න.",["6.10"]],
[null,"warn","A strike by your own workers is not Force Majeure, so there is no extra time.","ඔබේම workers ගේ වර්ජනයක් Force Majeure නොවේ, ඒ නිසා අමතර කාලය නැහැ.",["20.1"]],
[null,"know","Wages and conditions must not be lower than the normal level for the trade.","Wages සහ conditions ඒ ක්ෂේත්‍රයේ සාමාන්‍ය මට්ටමට වඩා අඩු වෙන්න බැහැ.",["6.1","6.3"]]]}
);
EV.push(
{i:"Q1",c:"qual",r:"C",t:["Work is ready to be covered up (rebar, foundations, conduits)","වැඩක් වහන්න (cover up) ලෑස්තියි (rebar, foundations, conduits)"],
m:["Once work is covered, it cannot be checked. So you must give the Engineer a chance to inspect it first. If you do not, you may have to open it up again at your own cost.","වැඩක් වැහුවාට පස්සේ ඒක check කරන්න බැහැ. ඒ නිසා මුලින් inspect කරන්න Engineer ට අවස්ථාවක් දෙන්න ඕනේ. එසේ නොකළොත් ඔබේම වියදමින් නැවත විවෘත කරන්න වෙන්න පුළුවන්."],
s:[[null,"do","Tell the Engineer before covering the work. The Engineer must inspect without delay, or tell you an inspection is not needed.","වැඩ වහන්න කලින් Engineer ට කියන්න. Engineer ප්‍රමාදයකින් තොරව inspect කළ යුතුයි, නැත්නම් inspection එකක් අවශ්‍ය නැති බව කිව යුතුයි.",["7.2"]],
[null,"warn","If you did not give notice, you may be told to uncover it and put it back at your own cost.","Notice නොදුන්නා නම්, ඔබේම වියදමින් විවෘත කරලා නැවත හදන්න කියන්න පුළුවන්.",["7.2"]]],
k:["Inspection request forms, photos before covering","Inspection request forms, වහන්න කලින් photos"]},

{i:"Q2",c:"qual",r:"C",t:["Materials or work were rejected","Materials හෝ වැඩ reject කළා"],
m:["If materials or work do not meet the contract, the Engineer can reject them. You must fix them quickly, and pay any extra cost the Employer has because of it.","Materials හෝ වැඩ contract එකට අනුකූල නැත්නම් Engineer ට reject කරන්න පුළුවන්. ඔබ ඉක්මනින් ඒවා හදන්න ඕනේ, ඒ නිසා Employer ට ආපු අමතර වියදමත් ගෙවන්න ඕනේ."],
s:[[null,"know","The rejection must be by notice with reasons. Fix the problem quickly.","Rejection එක හේතු සහිත notice එකකින් විය යුතුයි. ප්‍රශ්නය ඉක්මනින් හදන්න.",["7.4"]],
[null,"warn","Retests are done on the same terms. If this costs the Employer extra, it can claim that cost from you.","නැවත tests කරන්නේ එකම කොන්දේසි යටතේ. මේ නිසා Employer ට අමතර වියදමක් ආවොත් ඒක ඔබෙන් claim කරන්න පුළුවන්.",["7.4","2.4"]]]},

{i:"Q3",c:"qual",r:"C",t:["We were told to remove and redo work (remedial work)","වැඩ ඉවත් කරලා නැවත කරන්න කිව්වා (remedial work)"],
m:["The Engineer can order bad work to be removed and redone, even after an earlier test was passed. If you do not do it, someone else will, at your cost, and it can lead to termination.","කලින් test එකක් pass වුණත්, නරක වැඩ ඉවත් කරලා නැවත කරන්න Engineer ට order කරන්න පුළුවන්. ඔබ නොකළොත් වෙන කෙනෙක් ඔබේ වියදමින් කරනවා, termination දක්වා යන්නත් පුළුවන්."],
d:[["a","Date we received the instruction","Instruction එක ලැබුණු දිනය"]],
s:[[null,"do","Do it within the time in the instruction, or immediately if it is urgent.","Instruction එකේ කාලය ඇතුළත කරන්න, හදිසි නම් වහාම කරන්න.",["7.5"]],
[null,"warn","If you do not, the Employer can pay someone else and recover the cost from you.","ඔබ නොකළොත් Employer ට වෙන කෙනෙකුට ගෙවලා ඒ වියදම ඔබෙන් අයකරගන්න පුළුවන්.",["7.5","2.4"]],
["a+28","warn","If still not done without a good reason, this becomes a reason the Employer can use to end the contract.","හොඳ හේතුවක් නැතිව තවමත් නොකළොත්, මෙය Employer ට contract එක අවසන් කරන්න භාවිත කළ හැකි හේතුවක් වෙනවා.",["15.2(c)"]]]},

{i:"Q4",c:"qual",r:"C",t:["The Engineer did not come to a test","Engineer test එකකට ආවේ නැහැ"],
m:["You should agree the test time and place with the Engineer. If the Engineer does not come, you can go ahead, and the results are accepted as if the Engineer was there.","Test කරන වෙලාව සහ තැන Engineer එක්ක එකඟ වෙන්න ඕනේ. Engineer නොආවොත් ඔබට ඉදිරියට යන්න පුළුවන්, Engineer හිටියා වගේම results පිළිගන්නවා."],
s:[[null,"do","Agree the time and place with the Engineer. The Engineer must give you at least 24 hours' notice of attending.","වෙලාව සහ තැන Engineer එක්ක එකඟ වෙන්න. එන බවට Engineer අවම පැය 24ක notice එකක් දිය යුතුයි.",["7.3"]],
[null,"know","If the Engineer does not come, carry out the test (unless told otherwise). It counts as done in the Engineer's presence, and the readings are accepted.","Engineer නොආවොත් (වෙනත් දෙයක් කියලා නැත්නම්) test එක කරන්න. එය Engineer ඉදිරියේ කළා ලෙස සැලකෙනවා, readings පිළිගන්නවා.",["7.3"]]]},

{i:"Q5",c:"qual",r:"C",t:["We were told to do extra or different tests","අමතර හෝ වෙනස් tests කරන්න කිව්වා"],
m:["Extra tests ordered by the Engineer are a Variation. If the test fails, you pay. If it passes and you lost time or money, you can claim.","Engineer order කරන අමතර tests Variation එකක්. Test එක fail වුණොත් ඔබ ගෙවනවා. Pass වෙලා ඔබට කාලය හෝ මුදල් නැති වුණා නම් claim කරන්න පුළුවන්."],
q:[["Did the test fail?","Test එක fail වුණාද?","If it failed, you pay the cost of the extra test.","Fail වුණා නම් අමතර test එකේ වියදම ඔබ ගෙවනවා.","",""]],
s:[[null,"know","Extra or changed tests are ordered as a Variation.","අමතර හෝ වෙනස් කළ tests Variation එකක් ලෙස order කරනවා.",["7.3","13.1"]],
[null,"if","If the test passed and you had delay or cost, tell the Engineer and claim time, cost and profit.","Test එක pass වෙලා ඔබට ප්‍රමාදයක් හෝ වියදමක් ආවා නම්, Engineer ට කියලා කාලය, වියදම සහ profit claim කරන්න.",["7.3","19.1"]]],
e:"ECP"},

{i:"Q6",c:"qual",r:"C",t:["Getting material samples approved","Material samples approve කරවාගැනීම"],
m:["Before using materials, you show samples to the Engineer for approval.","Materials භාවිත කරන්න කලින්, approve කරගන්න samples Engineer ට පෙන්වනවා."],
s:[[null,"do","Before use, give the Engineer the manufacturer's samples and the samples named in the contract, at your own cost. Label each with where it came from and where it will be used.","භාවිතයට කලින් manufacturer ගේ samples සහ contract එකේ සඳහන් samples, ඔබේම වියදමින් Engineer ට දෙන්න. හැම එකකම ආවේ කොහෙන්ද, භාවිත කරන්නේ කොහෙද කියලා label කරන්න.",["7.1"]],
[null,"know","Any extra samples the Engineer asks for are a Variation (paid).","Engineer ඉල්ලන අමතර samples Variation එකක් (ගෙවනවා).",["7.1"]]]},

{i:"Q7",c:"qual",r:"B",t:["Tests on Completion (final tests before handover)","Tests on Completion (handover එකට කලින් අවසාන tests)"],
m:["Before handover, the finished works are tested to show they work. There are fixed notice periods, and rules for failures and delays.","Handover එකට කලින්, ඉවර කළ works හරියට වැඩ කරනවා කියලා පෙන්වන්න test කරනවා. නියමිත notice කාල සහ fail වීම් හා ප්‍රමාද වීම් වලට නීති තියෙනවා."],
d:[["a","Date we will be ready for the tests","Tests වලට ලෑස්ති වෙන දිනය"]],
s:[["a-21","do","Last day to tell the Engineer when you will be ready (at least 21 days before).","ලෑස්ති වෙන දිනය Engineer ට කියන්න අවසාන දිනය (අවම දින 21කට කලින්).",["9.1"]],
["a+14","know","The tests should be done within 14 days after that date (unless agreed otherwise).","ඒ දිනයෙන් පස්සේ දින 14ක් ඇතුළත tests කළ යුතුයි (වෙනත් එකඟතාවක් නැත්නම්).",["9.1"]],
[null,"warn","If the contractor delays the tests, the Engineer can give 21 days to do them. After that, the Employer can do them at the contractor's cost and risk.","Contractor tests ප්‍රමාද කළොත්, ඒවා කරන්න Engineer ට දින 21ක් දෙන්න පුළුවන්. ඉන් පසු Employer ට contractor ගේ වියදමට සහ අවදානමට ඒවා කරන්න පුළුවන්.",["9.2"]],
[null,"if","If a test fails, it is repeated. If it fails again, the Engineer can order more tests, reject the works, or accept them at a lower price.","Test එකක් fail වුණොත් නැවත කරනවා. නැවතත් fail වුණොත් Engineer ට තවත් tests order කරන්න, works reject කරන්න, හෝ අඩු මිලකට පිළිගන්න පුළුවන්.",["9.3","9.4"]]]},

{i:"Q8",c:"qual",r:"C",t:["The Employer stops us doing the final tests for more than 14 days","Employer අපිට අවසාන tests කරන්න දින 14කට වඩා බාධා කරනවා"],
m:["If the Employer blocks the final tests for over 14 days, the works are treated as handed over, and you can claim time, cost and profit.","Employer අවසාන tests දින 14කට වඩා නතර කළොත්, works භාර දුන්නා ලෙස සැලකෙනවා, ඔබට කාලය, වියදම සහ profit claim කරන්න පුළුවන්."],
d:[["a","Date the blocking started","බාධාව පටන් ගත් දිනය"]],
s:[["a+14","know","If still blocked after this date, the works are treated as taken over on the date the tests would have finished. The Engineer must issue the Taking-Over Certificate.","මේ දිනයෙන් පසුත් බාධාව තියෙනවා නම්, tests ඉවර වෙන්න තිබුණු දිනයේ works භාර ගත්තා ලෙස සැලකෙනවා. Engineer Taking-Over Certificate එක නිකුත් කළ යුතුයි.",["10.3"]],
[null,"know","The tests are done later, within the defects period, after 14 days' notice.","Tests පසුව, defects period එක ඇතුළත, දින 14ක notice එකකින් පසු කරනවා.",["10.3"]],
[null,"do","If you had delay or cost, tell the Engineer and claim time, cost and profit.","ප්‍රමාදයක් හෝ වියදමක් ආවා නම්, Engineer ට කියලා කාලය, වියදම සහ profit claim කරන්න.",["10.3","19.1"]]],
e:"ECP"},

{i:"Q9",c:"qual",r:"B",t:["A defect was reported during the defects period","Defects period එකේදී defect එකක් වාර්තා කළා"],
m:["After handover there is a defects period. During it, the contractor must fix defects that are reported. Who pays depends on what caused the defect.","Handover එකෙන් පස්සේ defects period එකක් තියෙනවා. ඒ කාලයේ වාර්තා කරන defects contractor හදන්න ඕනේ. කවුද ගෙවන්නේ කියන එක defect එකට හේතුව මත රඳා පවතිනවා."],
d:[["a","Date we got the defect notice","Defect notice එක ලැබුණු දිනය"]],
q:[["Was the defect caused by the contractor's design, materials, workmanship or failure to do something?","Defect එකට හේතුව contractor ගේ design, materials, workmanship හෝ යමක් නොකිරීමද?","The contractor fixes it at its own cost.","Contractor තමන්ගේ වියදමින් හදනවා.","It is valued and paid as a Variation.","එය Variation එකක් ලෙස value කරලා ගෙවනවා."]],
s:[[null,"do","Fix the reported defects by the end of the defects period.","වාර්තා කළ defects, defects period එක ඉවර වෙද්දී හදන්න.",["11.1","11.2"]],
[null,"warn","If not fixed in reasonable time, the Employer sets a date. After that, it can get someone else to fix it at your cost, reduce the price, or (if serious) end the contract.","සාධාරණ කාලයක් ඇතුළත නොහැදුවොත් Employer දිනයක් නියම කරනවා. ඉන් පසු ඔබේ වියදමින් වෙන කෙනෙකු ලවා හදන්න, මිල අඩු කරන්න, හෝ (බරපතළ නම්) contract එක අවසන් කරන්න පුළුවන්.",["11.4"]],
[null,"know","After fixing, the Engineer can ask for tests to be repeated, by notice within 28 days.","හැදුවාට පස්සේ, දින 28ක් ඇතුළත notice එකකින් tests නැවත කරන්න Engineer ට ඉල්ලන්න පුළුවන්.",["11.6"]],
[null,"know","If asked, search for the cause. If it was not your fault, you get the cost of searching plus profit.","ඉල්ලුවොත් හේතුව හොයන්න. එය ඔබේ වරදක් නොවේ නම් හෙවීමේ වියදම සහ profit ලැබෙනවා.",["11.7"]]]},

{i:"Q10",c:"qual",r:"E",t:["A defect stops the works being used, so the Employer wants a longer defects period","Defect එකක් නිසා works භාවිත කරන්න බැහැ, ඒ නිසා Employer defects period එක දිගු කරන්න ඕනේ"],
m:["If the works cannot be used because of a defect, the defects period can be extended, but by no more than one year.","Defect එකක් නිසා works භාවිත කරන්න බැරි නම් defects period එක දිගු කරන්න පුළුවන්, හැබැයි අවුරුද්දකට වඩා නොවේ."],
s:[[null,"do","Give notice under the Employer's claims rule before the defects period ends. The maximum extension is one year.","Defects period එක ඉවර වෙන්න කලින් Employer's claims නීතිය යටතේ notice දෙන්න. උපරිම දිගුව අවුරුද්දයි.",["11.3","2.4"]],
[null,"know","Plant can be taken off site for repair only with the Employer's consent, which may require a bigger security.","Repair කරන්න plant site එකෙන් ගෙනියන්න පුළුවන් Employer ගේ අනුමැතියෙන් පමණයි, ඒකට වැඩි security එකක් ඉල්ලන්න පුළුවන්.",["11.5"]]]},

{i:"K1",c:"sub",r:"C",t:["We want to appoint a subcontractor","Subcontractor කෙනෙක් පත් කරන්න ඕනේ"],
m:["You can subcontract parts of the work, but not all of it. Most subcontractors need the Engineer's consent, and you stay responsible for their work.","වැඩ වල කොටස් subcontract කරන්න පුළුවන්, හැබැයි සම්පූර්ණයෙන්ම නොවේ. බොහෝ subcontractors ලාට Engineer ගේ අනුමැතිය ඕනේ, ඔවුන්ගේ වැඩ වලට ඔබ තවමත් වගකියනවා."],
s:[[null,"warn","You cannot subcontract the whole job. You need the Engineer's consent for subcontractors, except material suppliers and those already named in the contract.","සම්පූර්ණ job එකම subcontract කරන්න බැහැ. Material suppliers සහ contract එකේ දැනටමත් නම් කළ අය හැර, subcontractors ලාට Engineer ගේ අනුමැතිය ඕනේ.",["4.4"]],
[null,"do","Tell the Engineer at least 28 days before each subcontractor starts.","හැම subcontractor කෙනෙක්ම පටන් ගන්න අවම වශයෙන් දින 28කට කලින් Engineer ට කියන්න.",["4.4"]],
[null,"warn","Subcontracting without consent is a reason the Employer can use to end the contract.","අනුමැතියක් නැතිව subcontract කිරීම Employer ට contract එක අවසන් කරන්න භාවිත කළ හැකි හේතුවක්.",["15.2(d)"]],
[null,"know","You are responsible for your subcontractors' acts and mistakes as if they were your own.","ඔබේ subcontractors ගේ ක්‍රියා සහ වැරදි වලට ඔබ වගකියනවා, ඒවා ඔබේම වගේ.",["4.4"]]]},

{i:"K2",c:"sub",r:"C",t:["We object to a nominated subcontractor","Nominated subcontractor කෙනෙකුට විරුද්ධයි"],
m:["A nominated subcontractor is one chosen by the Employer or Engineer. You can object if you have good reasons, such as doubts about their ability or unfair subcontract terms.","Nominated subcontractor කියන්නේ Employer හෝ Engineer තෝරන subcontractor කෙනෙක්. ඔවුන්ගේ හැකියාව ගැන සැකයක් හෝ අසාධාරණ subcontract terms වගේ හොඳ හේතු තියෙනවා නම් ඔබට විරුද්ධ වෙන්න පුළුවන්."],
s:[[null,"know","A nominated subcontractor is one named in the contract, or one the Engineer tells you to use through a Variation or Provisional Sum.","Nominated subcontractor කියන්නේ contract එකේ නම් කළ, හෝ Variation එකක් හෝ Provisional Sum එකක් හරහා භාවිත කරන්න Engineer කියන subcontractor කෙනෙක්.",["5.1"]],
[null,"do","Object by notice to the Engineer as soon as possible, with your reasons.","හැකි ඉක්මනින් හේතු සහිතව Engineer ට notice එකකින් විරුද්ධ වෙන්න.",["5.2"]],
[null,"know","Good reasons include: not enough skill, resources or money; or the subcontract does not protect you (no indemnity, or they do not take on matching obligations). This does not apply if the Employer agrees to protect you.","හොඳ හේතු: ප්‍රමාණවත් දක්ෂතාවය, සම්පත් හෝ මුදල් නැති වීම; හෝ subcontract එක ඔබව ආරක්ෂා නොකිරීම (indemnity නැති වීම, හෝ ගැළපෙන obligations භාර නොගැනීම). Employer ඔබව ආරක්ෂා කරන්න එකඟ නම් මෙය අදාළ නැහැ.",["5.2"]]]},

{i:"K3",c:"sub",r:"B",t:["Payments to a nominated subcontractor are late","Nominated subcontractor ට ගෙවීම් ප්‍රමාදයි"],
m:["The contractor must pass on money certified for a nominated subcontractor. If it does not, the Employer can pay them directly and take the money back from the contractor.","Nominated subcontractor කෙනෙකුට certify කළ මුදල් contractor ඔවුන්ට දිය යුතුයි. එසේ නොකළොත්, Employer ට ඔවුන්ට කෙලින්ම ගෙවලා ඒ මුදල contractor ගෙන් ආපසු ගන්න පුළුවන්."],
s:[[null,"know","The contractor must pay the nominated subcontractor what the Engineer certifies. This is added to the contract price (with overhead and profit).","Engineer certify කරන මුදල contractor nominated subcontractor ට ගෙවිය යුතුයි. මෙය contract price එකට එකතු කරනවා (overhead සහ profit එක්ක).",["5.3","13.4"]],
[null,"warn","The Engineer can ask for proof of payment. Without proof or a good reason to withhold, the Employer can pay the subcontractor directly and recover it from the contractor.","ගෙවූ බවට සාක්ෂි Engineer ට ඉල්ලන්න පුළුවන්. සාක්ෂි හෝ රඳවාගැනීමට හොඳ හේතුවක් නැත්නම්, Employer ට subcontractor ට කෙලින්ම ගෙවලා contractor ගෙන් අයකරගන්න පුළුවන්.",["5.4"]]]},

{i:"K4",c:"sub",r:"B",t:["The Engineer wants a staff member removed, or we want to change our site head","Engineer staff කෙනෙක් ඉවත් කරන්න කියනවා, නැත්නම් අපේ site head වෙනස් කරන්න ඕනේ"],
m:["The Engineer can ask you to remove people who behave badly or cannot do their job. Changing your site head (Contractor's Representative) needs the Engineer's consent.","නරක ලෙස හැසිරෙන හෝ තමන්ගේ වැඩ කරන්න බැරි අය ඉවත් කරන්න Engineer ට ඉල්ලන්න පුළුවන්. ඔබේ site head (Contractor's Representative) වෙනස් කරන්න Engineer ගේ අනුමැතිය ඕනේ."],
s:[[null,"do","If the person keeps misbehaving, is careless, is not competent, does not follow the contract, or is unsafe, remove them and put a suitable person in their place.","පුද්ගලයා දිගටම නරක ලෙස හැසිරෙනවා නම්, නොසැලකිලිමත් නම්, දක්ෂ නැත්නම්, contract එක පිළිනොපදිනවා නම් හෝ අනාරක්ෂිත නම්, ඔහු ඉවත් කරලා සුදුසු කෙනෙක් පත් කරන්න.",["6.8"]],
[null,"warn","You need the Engineer's consent before changing the Contractor's Representative.","Contractor's Representative වෙනස් කරන්න කලින් Engineer ගේ අනුමැතිය ඕනේ.",["4.3"]],
[null,"do","Each month, give details of your staff and machines on site. Do not hire the Employer's staff.","හැම මාසෙම, site එකේ ඉන්න staff සහ machines විස්තර දෙන්න. Employer ගේ staff බඳවාගන්න එපා.",["6.9","6.2"]]]},

{i:"K5",c:"sub",r:"C",x:1,t:["A subcontractor has wider Force Majeure terms than our main contract","Subcontractor කෙනෙකුට අපේ main contract එකට වඩා පුළුල් Force Majeure terms තියෙනවා"],
m:["Your subcontract may excuse the subcontractor for more events than the main contract excuses you. Those extra events do not protect you with the Employer.","ඔබේ subcontract එක, main contract එක ඔබව නිදහස් කරනවාට වඩා සිදුවීම් ගණනකට subcontractor ව නිදහස් කරන්න පුළුවන්. ඒ අමතර සිදුවීම් Employer ඉදිරියේ ඔබව ආරක්ෂා කරන්නේ නැහැ."],
s:[[null,"warn","Wider Force Majeure events in a subcontract do not excuse you under the main contract.","Subcontract එකක ඇති පුළුල් Force Majeure සිදුවීම් main contract එක යටතේ ඔබව නිදහස් කරන්නේ නැහැ.",["20.5"]],
[null,"know","If a subcontractor's duties last beyond the defects period, the Engineer can ask you to pass that benefit to the Employer.","Subcontractor ගේ වගකීම් defects period එකෙන් එහාට යනවා නම්, ඒ ප්‍රතිලාභය Employer ට පවරන්න Engineer ට ඉල්ලන්න පුළුවන්.",["4.5"]]]},

{i:"U1",c:"susp",r:"C",t:["The Engineer suspended (stopped) the work","Engineer වැඩ suspend කළා (නතර කළා)"],
m:["The Engineer can stop all or part of the work. If it was not your fault, you can claim time and cost. If the stop lasts too long, you can treat that work as removed, or even end the contract.","Engineer ට වැඩ සම්පූර්ණයෙන් හෝ කොටසක් නතර කරන්න පුළුවන්. එය ඔබේ වරදක් නොවේ නම් කාලය සහ වියදම claim කරන්න පුළුවන්. නැවතීම ඕනෑවට වඩා දිගු නම්, ඒ වැඩ ඉවත් කළා ලෙස සලකන්න, නැත්නම් contract එකම අවසන් කරන්නත් පුළුවන්."],
d:[["a","Date the suspension started","Suspension එක පටන් ගත් දිනය"]],
q:[["Did the Engineer say the suspension was caused by you?","Suspension එකට හේතුව ඔබ කියලා Engineer කිව්වාද?","Then you get no time or money, and the long-suspension rules do not apply.","එසේ නම් කාලය හෝ මුදල් ලැබෙන්නේ නැහැ, දිගු suspension නීතිත් අදාළ නැහැ.","",""]],
s:[["a","do","Protect, store and secure the stopped work.","නතර කළ වැඩ ආරක්ෂා කරලා, ගබඩා කරලා, secure කරන්න.",["8.8"]],
["a+28","warn","Last day to send your claim notice: time and cost (no profit).","Claim notice එක යවන්න අවසාන දිනය: කාලය සහ වියදම (profit නැහැ).",["8.9","19.1"]],
["a+29","if","If deliveries of plant or materials are stopped for over 28 days, and you marked them as the Employer's property as instructed, you can be paid their value.","Plant හෝ materials deliveries දින 28කට වඩා නතර වෙලා, instruct කළ පරිදි ඒවා Employer ගේ දේපළ ලෙස mark කළා නම්, ඒවායේ වටිනාකම ගෙවන්න පුළුවන්.",["8.10"]],
["a+85","if","If the stop goes over 84 days, ask the Engineer in writing for permission to continue.","නැවතීම දින 84 ඉක්මවනවා නම්, දිගටම කරගෙන යන්න අවසර ඉල්ලලා Engineer ට ලිඛිතව ඉල්ලීමක් කරන්න.",["8.11"]],
["a+113","if","If there is no permission within 28 days of your request: treat the stopped part as removed (omitted); if the whole job is stopped, you can end the contract.","ඉල්ලීමෙන් දින 28ක් ඇතුළත අවසරයක් නැත්නම්: නතර කළ කොටස ඉවත් කළා (omitted) ලෙස සලකන්න; සම්පූර්ණ job එකම නතර නම් contract එක අවසන් කරන්න පුළුවන්.",["8.11","16.2(e)"]],
[null,"do","When work restarts, inspect the works together with the Engineer and repair any damage from the stop.","වැඩ නැවත පටන් ගද්දී, Engineer එක්ක එකට works පරීක්ෂා කරලා නැවතීම නිසා වූ හානි හදන්න.",["8.12"]]],
