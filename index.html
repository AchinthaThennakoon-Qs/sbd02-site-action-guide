{i:"F4",c:"site",r:"B",t:["Who is responsible for Site investigation data?","Site investigation data වලට වගකියන්නේ කවුද?"],
m:["The Employer must share its data on sub-surface and hydrological conditions (including environmental aspects). The Contractor interprets the data and, as far as was practicable, is treated as having inspected the Site and priced all risks.","Employer ළඟ තියෙන භූගත සහ ජල තත්ත්ව (පාරිසරික කරුණු ඇතුළුව) පිළිබඳ data බෙදාගත යුතුයි. Data අර්ථ නිරූපණය කරන්නේ Contractor; ප්‍රායෝගිකව හැකි ප්‍රමාණයට, Site එක inspect කරලා සියලු අවදානම් price කළා ලෙස Contractor ව සැලකෙනවා."],
s:[[null,"know","Before the Base Date the Employer must make available all relevant data it has on sub-surface and hydrological conditions, including environmental aspects, and later data as it gets it. You are responsible for interpreting it.","Base Date එකට කලින්, භූගත සහ ජල තත්ත්ව ගැන, පාරිසරික කරුණු ඇතුළුව, තමන් ළඟ ඇති සියලු අදාළ data Employer ලබා දිය යුතුයි, පසුව ලැබෙන data ත්. ඒවා අර්ථ නිරූපණය කිරීමට ඔබ වගකියනවා.",["4.9"]],
[null,"warn","To the extent practicable (considering cost and time), you are treated as having obtained all necessary information and inspected the Site, and as being satisfied before bidding about (a) the form and nature of the Site, including sub-surface conditions; (b) hydrological and climatic conditions; (c) what you need for access, accommodation, facilities, personnel, power, transport, water and other services.","ප්‍රායෝගිකව හැකි ප්‍රමාණයට (වියදම සහ කාලය සලකා), අවශ්‍ය සියලු තොරතුරු ලබාගෙන Site එක inspect කළා ලෙස සහ bid කරන්න කලින් මේවා ගැන සෑහීමකට පත් වුණා ලෙස ඔබව සැලකෙනවා: (a) භූගත තත්ත්ව ඇතුළු Site එකේ ආකාරය සහ ස්වභාවය; (b) ජල සහ කාලගුණ තත්ත්ව; (c) ප්‍රවේශය, නවාතැන්, පහසුකම්, personnel, විදුලිය, ප්‍රවාහනය, ජලය සහ අනෙක් සේවා සඳහා ඔබට අවශ්‍ය දේ.",["4.10"]],
[null,"know","You are treated as satisfied that your bid price is correct and sufficient. Unless the Contract says otherwise, it covers all your obligations (including provisional sums) and everything needed to complete the Works and remedy defects.","ඔබේ bid මිල නිවැරදි සහ ප්‍රමාණවත් බව ගැන සෑහීමකට පත් වුණා ලෙස ඔබව සැලකෙනවා. Contract එකේ වෙනත් දෙයක් නැත්නම්, එය ඔබේ සියලු වගකීම් (provisional sums ඇතුළුව) සහ Works ඉවර කරන්නත් defects හදන්නත් අවශ්‍ය සියල්ල ආවරණය කරනවා.",["4.10"]],
[null,"know","Bidders are advised to visit the Site before bidding, at their own cost.","Bid කරන්න කලින්, තමන්ගේම වියදමින් Site එකට ගිහින් බලන්න කියලා bidders ලාට උපදෙස් දෙනවා.",["ITB 8"]]]},

{i:"F5",c:"site",r:"C",t:["Access road problems, damaged roads or bridges, or we need extra land outside the Site","Access road ප්‍රශ්න, හානි වූ පාරවල් හෝ පාලම්, නැත්නම් Site එකෙන් පිටත අමතර ඉඩම් ඕනේ"],
m:["You are treated as satisfied with the suitability and availability of access routes. Their upkeep, signs, permissions and any extra cost if they are unsuitable are yours. Extra rights of way and facilities outside the Site are also at your cost.","Access routes වල සුදුසුකම සහ ලබාගැනීමේ හැකියාව ගැන ඔබ සෑහීමකට පත් වුණා ලෙස සැලකෙනවා. ඒවායේ නඩත්තුව, signs, අවසර, සහ නුසුදුසු නම් අමතර වියදම් ඔබේ. අමතර rights of way සහ Site එකෙන් පිටත පහසුකම් ද ඔබේ වියදමට."],
s:[[null,"do","Use reasonable efforts to prevent your traffic or personnel from damaging any road or bridge, including using suitable vehicles and routes.","ඔබේ වාහන හෝ personnel නිසා කිසිම පාරකට හෝ පාලමකට හානි වීම වළක්වන්න සාධාරණ උත්සාහයක් ගන්න, සුදුසු වාහන සහ මාර්ග භාවිත කිරීම ඇතුළුව.",["4.20"]],
[null,"warn","You are responsible for maintenance needed for your use of access routes, for signs and directions, and for permissions from authorities. The Employer does not guarantee any access route, is not responsible for claims from their use, and costs of unsuitable or unavailable routes are yours.","Access routes ඔබ භාවිත කිරීමට අවශ්‍ය නඩත්තුව, signs සහ directions, සහ ආයතන වලින් අවසර ගැනීම ඔබේ වගකීම. Employer කිසිම access route එකක් සහතික කරන්නේ නැහැ, ඒවා භාවිතයෙන් එන claims වලට වගකියන්නේ නැහැ, නුසුදුසු හෝ ලබාගත නොහැකි මාර්ගවල වියදම් ඔබේ.",["4.20"]],
[null,"know","Special or temporary rights of way you need, including for access to the Site, and extra facilities outside the Site, are at your own risk and cost.","ඔබට අවශ්‍ය විශේෂ හෝ තාවකාලික rights of way, Site එකට ප්‍රවේශය සඳහා ඇතුළුව, සහ Site එකෙන් පිටත අමතර පහසුකම් ඔබේම අවදානමට සහ වියදමට.",["4.18"]]]},

{i:"F6",c:"site",r:"C",t:["Complaints from neighbours or the public (blocked roads, noise, dust, pollution)","අසල්වැසියන් හෝ පොදු ජනතාවගෙන් පැමිණිලි (පාරවල් අවහිර, ශබ්දය, දූවිලි, pollution)"],
m:["You must not interfere unnecessarily or improperly with the public or with roads and footpaths, you must protect the environment, and you must protect the Employer from claims caused by your work.","පොදු ජනතාවට හෝ පාරවල් සහ පදික මාර්ග වලට අනවශ්‍ය හෝ අනිසි ලෙස බාධා කරන්න එපා, පරිසරය ආරක්ෂා කරන්න ඕනේ, ඔබේ වැඩ නිසා එන claims වලින් Employer ආරක්ෂා කරන්න ඕනේ."],
s:[[null,"warn","Do not interfere unnecessarily or improperly with the convenience of the public or with access to and use of roads and footpaths (public or private). You must indemnify the Employer against the results of such interference.","පොදු ජනතාවගේ පහසුවට හෝ පාරවල් සහ පදික මාර්ග (පොදු හෝ පෞද්ගලික) වෙත ප්‍රවේශයට සහ භාවිතයට අනවශ්‍ය හෝ අනිසි ලෙස බාධා කරන්න එපා. එවැනි බාධා වල ප්‍රතිඵල වලින් Employer ආරක්ෂා කළ යුතුයි (indemnify).",["4.19"]],
[null,"do","Take all reasonable steps to protect the environment on and off Site and to limit nuisance from pollution and noise. Emissions, surface discharges and effluent must not exceed the limits in the Specification or the Laws.","Site එකේ සහ පිටත පරිසරය ආරක්ෂා කරන්නත්, pollution සහ ශබ්දය නිසා වන කරදර සීමා කරන්නත් සියලු සාධාරණ පියවර ගන්න. Emissions, surface discharges සහ effluent, Specification එකේ හෝ නීතියේ සීමාවන් ඉක්මවන්න බැහැ.",["4.13"]],
[null,"do","Provide Temporary Works (roadways, footways, guards and fences) needed to protect the public and neighbours, keep your operations within the Site and agreed areas, and keep your people and equipment off adjacent land.","පොදු ජනතාව සහ අසල්වැසියන් ආරක්ෂා කරන්න අවශ්‍ය Temporary Works (මාර්ග, පදික මාර්ග, ආරක්ෂක සහ වැටවල්) දෙන්න, ඔබේ කටයුතු Site එක සහ එකඟ වූ ප්‍රදේශ ඇතුළේ තියාගන්න, ඔබේ පිරිස සහ equipment අසල ඉඩම් වලින් එළියට තියාගන්න.",["4.8","4.15"]],
[null,"know","You indemnify the Employer for injury or death caused by your work (unless caused by the Employer's negligence or breach), and for damage to property other than the Works to the extent caused by your negligence or breach. This is covered by third-party insurance in joint names.","ඔබේ වැඩ නිසා වන තුවාල හෝ මරණ (Employer ගේ නොසැලකිල්ල හෝ උල්ලංඝනය නිසා නම් හැර), සහ ඔබේ නොසැලකිල්ල හෝ උල්ලංඝනය නිසා Works හැර වෙනත් දේපළ වලට වන හානි වලින් ඔබ Employer ආරක්ෂා කරනවා. මෙය joint names වලින් third-party insurance එකෙන් ආවරණය වෙනවා.",["17.1","18.2"]]]},

{i:"F7",c:"site",r:"C",t:["We are told to let the Employer's other contractors or authorities work on or near the Site","Site එකේ හෝ ළඟ වැඩ කරන්න Employer ගේ අනෙක් contractors ට හෝ ආයතන වලට ඉඩ දෙන්න කියනවා"],
m:["You must allow appropriate opportunities to the Employer's Personnel, its other contractors and public authorities working on or near the Site. If an instruction to do so causes you cost that was Unforeseeable at the bid date, it is a Variation.","Site එකේ හෝ ළඟ වැඩ කරන Employer's Personnel ට, එහි අනෙක් contractors ට සහ රජයේ ආයතන වලට සුදුසු අවස්ථා දිය යුතුයි. එසේ කරන්න දෙන instruction එකක් bid දිනයේ අනපේක්ෂිත වූ වියදමක් ඇති කළොත්, එය Variation එකක්."],
s:[[null,"do","Allow the opportunities stated in the Contract or instructed by the Engineer. Services to them may include use of your equipment, Temporary Works or access arrangements. Coordinate your activities with other contractors to the extent the Contract specifies.","Contract එකේ සඳහන් හෝ Engineer instruct කරන අවස්ථා දෙන්න. ඔවුන්ට දෙන සේවා වලට ඔබේ equipment, Temporary Works හෝ ප්‍රවේශ සැලසුම් භාවිතය ඇතුළත් විය හැකියි. Contract එකේ කියන ප්‍රමාණයට අනෙක් contractors සමඟ ඔබේ කටයුතු සම්බන්ධීකරණය කරන්න.",["4.6"]],
[null,"know","An instruction under 4.6 is a Variation if, and to the extent that, it causes you cost that was Unforeseeable at the date of bid submission.","4.6 යටතේ instruction එකක් Variation එකක් වන්නේ, bid ඉදිරිපත් කළ දිනයේ අනපේක්ෂිත වූ වියදමක් එය ඔබට ඇති කළොත්, ඒ ප්‍රමාණයට පමණයි.",["4.6","13.1"]],
[null,"know","The Employer must ensure its personnel and other contractors on Site cooperate with you and follow safety and environmental duties similar to yours. If they delay you, see D5 (8.4(e)).","එහි personnel සහ Site එකේ අනෙක් contractors ඔබ සමඟ සහයෝගයෙන් වැඩ කරන බවත්, ඔබේ වගේම ආරක්ෂක සහ පාරිසරික වගකීම් පිළිපදින බවත් Employer සහතික කළ යුතුයි. ඔවුන් ඔබව ප්‍රමාද කළොත් D5 (8.4(e)) බලන්න.",["2.3","8.4(e)"]]],
en:{E:["C","If the instruction is a Variation or the others delay completion (8.4(a) or (e)).","Instruction එක Variation එකක් නම් හෝ අනෙක් අය completion ප්‍රමාද කළොත් (8.4(a) හෝ (e))."],C:["N"],P:["N"],x:[["If the instruction causes Unforeseeable cost, it is valued as a Variation under Clause 12","Instruction එක අනපේක්ෂිත වියදමක් ඇති කළොත්, එය Clause 12 යටතේ Variation එකක් ලෙස value කරනවා"]],v:1}},

{i:"F8",c:"site",r:"C",t:["There was an accident on Site","Site එකේ අනතුරක් සිදු වුණා"],
m:["Health and safety on Site are the Contractor's responsibility. After an accident you must report it to the Engineer as soon as practicable and keep the records the Engineer requires.","Site එකේ සෞඛ්‍යය සහ ආරක්ෂාව Contractor ගේ වගකීම. අනතුරකින් පසු සාධාරණව හැකි ඉක්මනින් එය Engineer ට වාර්තා කරලා, Engineer ඉල්ලන records තියාගන්න ඕනේ."],
s:[[null,"do","Send details of the accident to the Engineer as soon as practicable. Keep records and make reports on health, safety, welfare and damage to property as the Engineer reasonably requires.","සාධාරණව හැකි ඉක්මනින් අනතුරේ විස්තර Engineer ට යවන්න. Engineer සාධාරණව ඉල්ලන පරිදි සෞඛ්‍යය, ආරක්ෂාව, සුබසාධනය සහ දේපළ හානි ගැන records තියාගෙන reports දෙන්න.",["6.6"]],
[null,"know","You must follow safety regulations, keep the Site clear of unnecessary obstruction, provide fencing, lighting, guarding and watching until taking-over, have first aid available at all times, and name a separate person responsible for safety and accident prevention.","ආරක්ෂක නීති පිළිපදින්න, Site එක අනවශ්‍ය බාධා වලින් තොරව තියාගන්න, taking-over දක්වා වැටවල්, ආලෝකය, ආරක්ෂාව සහ මුරකාවල් දෙන්න, හැමවිටම ප්‍රථමාධාර තියාගන්න, ආරක්ෂාව සහ අනතුරු වැළැක්වීම සඳහා වෙනම පුද්ගලයෙක් නම් කරන්න.",["4.8","6.6"]],
[null,"do","Comply with labour laws, including those on health, safety and welfare, and provide enough competent superintendence. Do not let personnel live inside structures that form part of the Permanent Works.","සෞඛ්‍යය, ආරක්ෂාව සහ සුබසාධනය ඇතුළු කම්කරු නීති පිළිපදින්න, ප්‍රමාණවත් දක්ෂ අධීක්ෂණයක් දෙන්න. Permanent Works වල කොටසක් වන ඉදිකිරීම් ඇතුළේ personnel ට ජීවත් වෙන්න දෙන්න එපා.",["6.3","6.7","6.5"]],
[null,"know","You indemnify the Employer for injury or death arising from your work (unless caused by the Employer's negligence or breach). Your personnel's insurance must cover this.","ඔබේ වැඩ නිසා වන තුවාල හෝ මරණ වලින් (Employer ගේ නොසැලකිල්ල හෝ උල්ලංඝනය නිසා නම් හැර) ඔබ Employer ආරක්ෂා කරනවා. ඔබේ personnel insurance එකෙන් මෙය ආවරණය විය යුතුයි.",["17.1","18.3"]]],
k:["Accident report, witness statements, photos, first-aid and safety records","Accident report, සාක්ෂිකරුවන්ගේ ප්‍රකාශ, photos, ප්‍රථමාධාර සහ safety records"]},

{i:"F9",c:"site",r:"C",t:["We need to work at night, on rest days or on holidays","රාත්‍රියේ, විවේක දිනවල හෝ නිවාඩු දිනවල වැඩ කරන්න ඕනේ"],
m:["No work may be done on Site on locally recognized rest days, or outside normal working hours, unless one of three exceptions applies.","පහත ව්‍යතිරේක තුනෙන් එකක් අදාළ නොවන්නේ නම්, ප්‍රාදේශීයව පිළිගත් විවේක දිනවල හෝ සාමාන්‍ය වැඩ කරන වේලාවෙන් පිටත Site එකේ වැඩ කරන්න බැහැ."],
s:[[null,"know","Exceptions: (a) the Contract allows it; (b) the Engineer consents; or (c) the work is unavoidable, or needed to protect life or property or for the safety of the Works.","ව්‍යතිරේක: (a) Contract එක අවසර දෙනවා; (b) Engineer අනුමැතිය දෙනවා; හෝ (c) වැඩ වැළැක්විය නොහැකියි, නැත්නම් ජීවිත හෝ දේපළ ආරක්ෂා කරන්න හෝ Works වල ආරක්ෂාවට අවශ්‍යයි.",["6.4"]],
[null,"do","Otherwise ask the Engineer for consent first. For case (c), do the work and immediately advise the Engineer.","නැත්නම් මුලින්ම Engineer ගෙන් අනුමැතිය ඉල්ලන්න. (c) අවස්ථාවේදී, වැඩ කරලා වහාම Engineer ට දන්වන්න.",["6.4"]]]},

{i:"F10",c:"site",r:"C",t:["Bringing Plant or major Goods to Site, or removing equipment from Site","Site එකට Plant හෝ ප්‍රධාන Goods ගෙන්වීම, නැත්නම් Site එකෙන් equipment ඉවත් කිරීම"],
m:["The Engineer must be told in advance of major deliveries, and must consent before major equipment leaves the Site. Transport of Goods is your risk.","ප්‍රධාන deliveries ගැන Engineer ට කලින් දන්වන්න ඕනේ, ප්‍රධාන equipment Site එකෙන් යන්න කලින් Engineer අනුමැතිය දිය යුතුයි. Goods ප්‍රවාහනය ඔබේ අවදානමක්."],
s:[[null,"do","Give the Engineer not less than 7 days' notice of the date any Plant or major item of other Goods will be delivered to Site.","ඕනෑම Plant එකක් හෝ වෙනත් ප්‍රධාන Goods item එකක් Site එකට ගෙනෙන දිනය ගැන Engineer ට දින 7කට නොඅඩු notice එකක් දෙන්න.",["4.21"]],
[null,"know","You are responsible for packing, loading, transporting, receiving, unloading, storing and protecting all Goods, and you indemnify the Employer against claims arising from their transport.","සියලු Goods ඇසුරුම් කිරීම, පැටවීම, ප්‍රවාහනය, භාරගැනීම, බෑම, ගබඩා කිරීම සහ ආරක්ෂා කිරීම ඔබේ වගකීම; ඒවා ප්‍රවාහනයෙන් එන claims වලින් ඔබ Employer ආරක්ෂා කරනවා.",["4.21"]],
[null,"warn","Do not remove major items of equipment from Site without the Engineer's consent (not needed for vehicles carrying Goods or personnel). Equipment you own is treated as the Employer's property from arrival on Site until you are entitled to remove it or receive the Taking-Over Certificate; you keep the sole use of it.","Engineer ගේ අනුමැතිය නැතිව ප්‍රධාන equipment Site එකෙන් ඉවත් කරන්න එපා (Goods හෝ personnel ගෙනයන වාහන වලට අවශ්‍ය නැහැ). ඔබ අයිති equipment, Site එකට ආ දා සිට ඉවත් කිරීමට හිමිකම ලැබෙන තුරු හෝ Taking-Over Certificate එක ලැබෙන තුරු Employer ගේ දේපළ ලෙස සැලකෙනවා; එහි භාවිතය ඔබට පමණයි.",["4.12"]]]},

{i:"F11",c:"site",r:"C",t:["Theft on Site, or loss or damage to the Works before handover","Site එකේ සොරකමක්, නැත්නම් handover එකට කලින් Works වලට පාඩුවක් හෝ හානියක්"],
m:["From the Commencement Date until the Taking-Over Certificate, you are responsible for the care of the Works, Goods and your documents. Loss or damage from any cause that is not an Employer's risk must be put right at your own risk and cost.","Commencement Date එකේ සිට Taking-Over Certificate එක දක්වා Works, Goods සහ ඔබේ documents රැකබලාගැනීමට ඔබ වගකියනවා. Employer's risk එකක් නොවන ඕනෑම හේතුවකින් වන පාඩුවක් හෝ හානියක් ඔබේම අවදානමට සහ වියදමට හදන්න ඕනේ."],
s:[[null,"warn","Rectify loss or damage to the Works, Goods or Contractor's Documents, from any cause not listed in 17.3, at your own risk and cost, so they conform with the Contract.","17.3 හි ලැයිස්තුගත නොවන ඕනෑම හේතුවකින් Works, Goods හෝ Contractor's Documents වලට වූ පාඩුව හෝ හානිය, Contract එකට අනුකූල වන විදිහට ඔබේම අවදානමට සහ වියදමට නිවැරදි කරන්න.",["17.2"]],
[null,"do","Keep unauthorized persons off the Site. Authorized persons are your personnel, the Employer's Personnel, and other contractors' personnel the Employer or Engineer notifies to you.","අනවසර පුද්ගලයන් Site එකෙන් එළියට තියාගන්න. බලයලත් අය කියන්නේ ඔබේ personnel, Employer's Personnel, සහ Employer හෝ Engineer ඔබට දන්වන අනෙක් contractors ගේ personnel.",["4.22"]],
[null,"do","Claim under the Works insurance.","Works insurance එක යටතේ claim කරන්න.",["18.1"]],
[null,"know","After taking-over, you remain responsible for outstanding work until it is complete, and for loss or damage you cause afterwards or that arose from an earlier event you were liable for.","Taking-over එකෙන් පසුවත්, ඉතිරි වැඩ ඉවර වෙනකම් ඒවාට සහ පසුව ඔබ ඇති කරන පාඩු/හානි, හෝ ඔබ වගකිව යුතු පෙර සිදුවීමකින් ඇති වූ ඒවාට ඔබ වගකියනවා.",["17.2"]],
[null,"if","If the cause is an Employer's risk (war, riot by others, the Employer's use or design, Unforeseeable forces of nature, etc.), see R1.","හේතුව Employer's risk එකක් නම් (යුද්ධය, අනුන්ගේ කලබල, Employer ගේ භාවිතය හෝ design, අනපේක්ෂිත ස්වාභාවික බලවේග, ආදිය), R1 බලන්න.",["17.3","17.4"]]]},

{i:"F12",c:"site",r:"C",t:["Unrest or a strike among our own workers","අපේම workers අතර කලබලයක් හෝ වර්ජනයක්"],
m:["You must take all reasonable precautions to prevent disorderly conduct by your personnel. A strike or disorder by your own personnel or your subcontractors' employees is not Force Majeure and gives no extra time.","ඔබේ personnel අතර අක්‍රමවත් හැසිරීම් වළක්වන්න සියලු සාධාරණ පූර්වාරක්ෂාවන් ගත යුතුයි. ඔබේම personnel හෝ ඔබේ subcontractors ගේ සේවකයන්ගේ වර්ජනයක් හෝ කලබලයක් Force Majeure නොවේ, අමතර කාලය ලැබෙන්නේ නැහැ."],
s:[[null,"do","Take all reasonable precautions to prevent unlawful, riotous or disorderly conduct by your personnel, and to keep the peace and protect people and property on and near the Site.","ඔබේ personnel ගේ නීති විරෝධී, කැරලිකාරී හෝ අක්‍රමවත් හැසිරීම් වළක්වන්නත්, සාමය රැකීමටත්, Site එකේ සහ ළඟ ඇති පුද්ගලයන් සහ දේපළ ආරක්ෂා කිරීමටත් සියලු සාධාරණ පූර්වාරක්ෂාවන් ගන්න.",["6.10"]],
[null,"warn","A strike, riot or disorder by your own personnel or your subcontractors' employees is excluded from Force Majeure and from the Employer's risks.","ඔබේම personnel හෝ subcontractors ගේ සේවකයන්ගේ වර්ජනයක්, කැරැල්ලක් හෝ කලබලයක් Force Majeure වලින් සහ Employer's risks වලින් බැහැරයි.",["20.1","17.3"]],
[null,"know","Pay wages and observe conditions not lower than those established for the trade (or, if none, the local general level), and comply with labour laws.","ඒ ක්ෂේත්‍රයට පිහිටුවා ඇති (නැත්නම් ප්‍රාදේශීය සාමාන්‍ය) මට්ටමට වඩා අඩු නොවන wages ගෙවලා conditions පිළිපදින්න, කම්කරු නීති පිළිපදින්න.",["6.1","6.3"]]]},

{i:"Q1",c:"qual",r:"C",t:["Work is ready to be covered up (rebar, foundations, conduits)","වැඩක් වහන්න (cover up) ලෑස්තියි (rebar, foundations, conduits)"],
m:["Before work is covered up, put out of sight or packaged, the Engineer must get a chance to inspect it. If you do not give notice, you may have to uncover it at your own cost.","වැඩක් වහන්න, නොපෙනෙන්න සලස්වන්න හෝ ඇසුරුම් කරන්න කලින්, එය inspect කරන්න Engineer ට අවස්ථාවක් ලැබිය යුතුයි. Notice නොදුන්නොත් ඔබේම වියදමින් නැවත විවෘත කරන්න වෙන්න පුළුවන්."],
s:[[null,"do","Give notice to the Engineer whenever work is ready and before it is covered up, put out of sight, or packaged for storage or transport. The Engineer must then inspect, measure or test without unreasonable delay, or promptly tell you it is not required.","වැඩ ලෑස්ති වූ හැම විටම, එය වහන්න, නොපෙනෙන්න සලස්වන්න හෝ ගබඩා/ප්‍රවාහනය සඳහා ඇසුරුම් කරන්න කලින් Engineer ට notice දෙන්න. එවිට Engineer අසාධාරණ ප්‍රමාදයකින් තොරව inspect, measure හෝ test කළ යුතුයි, නැත්නම් අවශ්‍ය නැති බව ඉක්මනින් කිව යුතුයි.",["7.2"]],
[null,"warn","If you did not give notice, you must uncover the work when the Engineer requires, and reinstate and make it good, all at your cost.","ඔබ notice නොදුන්නා නම්, Engineer ඉල්ලන විට වැඩ විවෘත කරලා, නැවත සකස් කරලා, හදන්න ඕනේ, සියල්ල ඔබේ වියදමින්.",["7.2"]],
[null,"know","The Employer's Personnel may at all reasonable times access the Site and sources of natural materials and inspect and test materials and workmanship. This does not relieve you of any obligation.","Employer's Personnel ට සාධාරණ ඕනෑම වෙලාවක Site එකට සහ ස්වාභාවික materials ලබාගන්නා තැන් වලට ප්‍රවේශ වෙලා materials සහ workmanship inspect සහ test කරන්න පුළුවන්. මෙයින් ඔබේ කිසිම වගකීමක් නිදහස් වෙන්නේ නැහැ.",["7.2"]]],
k:["Inspection request forms, photos before covering","Inspection request forms, වහන්න කලින් photos"]},

{i:"Q2",c:"qual",r:"C",t:["Materials or work were rejected","Materials හෝ වැඩ reject කළා"],
m:["If inspection or testing shows Plant, Materials or workmanship are defective or do not meet the Contract, the Engineer may reject them by notice with reasons. You must promptly make good the defect.","Inspection හෝ testing වලින් Plant, Materials හෝ workmanship දෝෂ සහිත හෝ Contract එකට අනුකූල නොවන බව පෙනුණොත්, හේතු සහිත notice එකකින් Engineer ට ඒවා reject කරන්න පුළුවන්. ඔබ ඉක්මනින් දෝෂය හදන්න ඕනේ."],
s:[[null,"know","A rejection must be by notice with reasons. Promptly make good the defect so the item complies with the Contract.","Rejection එක හේතු සහිත notice එකකින් විය යුතුයි. Item එක Contract එකට අනුකූල වන විදිහට ඉක්මනින් දෝෂය හදන්න.",["7.4"]],
[null,"warn","If the Engineer requires a retest, it is done under the same terms. If the rejection and retesting cause the Employer extra costs, you pay them (through 2.4).","Engineer නැවත test කරන්න ඉල්ලුවොත් එය එකම කොන්දේසි යටතේ කරනවා. Rejection සහ නැවත testing නිසා Employer ට අමතර වියදම් ආවොත් ඔබ ඒවා ගෙවනවා (2.4 හරහා).",["7.4","2.4"]]]},

{i:"Q3",c:"qual",r:"C",t:["We were told to remove and redo work, or do urgent safety work (remedial work)","වැඩ ඉවත් කරලා නැවත කරන්න, නැත්නම් හදිසි ආරක්ෂක වැඩ කරන්න කිව්වා (remedial work)"],
m:["Even after earlier tests or certificates, the Engineer may instruct you to replace non-compliant Plant or Materials, re-do non-compliant work, or do urgent work for the safety of the Works. If you do not comply, others may do it at your cost, and ignoring it for 28 days is a ground for termination.","කලින් tests හෝ certificates තිබුණත්, අනුකූල නොවන Plant හෝ Materials මාරු කරන්න, අනුකූල නොවන වැඩ නැවත කරන්න, හෝ Works වල ආරක්ෂාවට හදිසි වැඩ කරන්න Engineer ට instruct කරන්න පුළුවන්. ඔබ නොකළොත් වෙන අය ලවා ඔබේ වියදමින් කරවන්න පුළුවන්, දින 28ක් නොසලකා හැරීම termination වලට හේතුවක්."],
d:[["a","Date we received the instruction","Instruction එක ලැබුණු දිනය"]],
s:[["a:O","do","Comply within the time stated in the instruction (a reasonable time), or immediately if it is for urgent safety work.","Instruction එකේ සඳහන් කාලය (සාධාරණ කාලයක්) ඇතුළත, හදිසි ආරක්ෂක වැඩක් නම් වහාම, පිළිපදින්න.",["7.5"]],
[null,"warn","If you do not comply, the Employer may employ and pay others to do it. Except to the extent you would have been paid for the work, you pay all costs arising from the failure (through 2.4).","ඔබ නොපිළිපැද්දොත්, එය කරන්න Employer ට වෙන අය යොදවා ගෙවන්න පුළුවන්. ඒ වැඩට ඔබට ගෙවීම් ලැබෙන්න තිබුණු ප්‍රමාණය හැර, අසමත් වීමෙන් ඇති වන සියලු වියදම් ඔබ ගෙවනවා (2.4 හරහා).",["7.5","2.4"]],
["a+29:F","warn","If, without reasonable excuse, you have still not complied 28 days after receiving the notice, from this date the Employer has a ground to terminate (with 14 days' notice).","සාධාරණ හේතුවක් නැතිව notice එක ලැබී දින 28කට පසුත් පිළිපදින්නේ නැත්නම්, මේ දිනයේ සිට terminate කරන්න Employer ට හේතුවක් තියෙනවා (දින 14ක notice එකකින්).",["15.2(c)","15.2"]]]},

{i:"Q4",c:"qual",r:"C",t:["Testing, and the Engineer did not come to a test","Testing, සහ Engineer test එකකට ආවේ නැහැ"],
m:["You provide everything needed for the specified tests and agree the time and place with the Engineer. If the Engineer does not attend as agreed, you may go ahead, and the tests are treated as made in the Engineer's presence.","Specified tests වලට අවශ්‍ය සියල්ල ඔබ සපයනවා, කාලය සහ ස්ථානය Engineer සමඟ එකඟ වෙනවා. එකඟ වූ පරිදි Engineer නොපැමිණියොත් ඔබට ඉදිරියට යන්න පුළුවන්, tests Engineer ඉදිරියේ කළා ලෙස සැලකෙනවා."],
s:[[null,"do","Provide all apparatus, assistance, documents, power, equipment, fuel, consumables, instruments, labour, materials and qualified staff needed for the specified tests. Agree the time and place with the Engineer.","Specified tests වලට අවශ්‍ය සියලු උපකරණ, සහාය, documents, විදුලිය, equipment, ඉන්ධන, consumables, instruments, labour, materials සහ සුදුසුකම් ඇති staff සපයන්න. කාලය සහ ස්ථානය Engineer සමඟ එකඟ වෙන්න.",["7.3"]],
[null,"know","The Engineer must give at least 24 hours' notice of intending to attend. If the Engineer does not attend at the agreed time and place, you may proceed (unless told otherwise); the tests are treated as made in the Engineer's presence and the readings accepted as accurate.","සහභාගී වීමේ අදහස ගැන Engineer අවම පැය 24ක notice එකක් දිය යුතුයි. එකඟ වූ කාලයට සහ ස්ථානයට Engineer නොපැමිණියොත්, (වෙනත් දෙයක් නොකියන්නේ නම්) ඔබට ඉදිරියට යන්න පුළුවන්; tests Engineer ඉදිරියේ කළා ලෙස සැලකෙනවා, readings නිවැරදි ලෙස පිළිගන්නවා.",["7.3"]],
[null,"do","Promptly send the Engineer duly certified test reports. When tests are passed, the Engineer endorses your test certificate or issues one.","නිසි ලෙස සහතික කළ test reports ඉක්මනින් Engineer ට යවන්න. Tests සමත් වුණාම Engineer ඔබේ test certificate එක අනුමත කරනවා, නැත්නම් එකක් නිකුත් කරනවා.",["7.3"]]]},

{i:"Q5",c:"qual",r:"C",t:["We were told to do extra or different tests","අමතර හෝ වෙනස් tests කරන්න කිව්වා"],
m:["The Engineer may, as a Variation, change the location or details of specified tests or order additional tests. If they show the work does not meet the Contract, you bear the cost. If you suffer delay or Cost from these instructions, or from a delay the Employer is responsible for, you can claim time, Cost and profit.","Variation එකක් ලෙස specified tests වල ස්ථානය හෝ විස්තර වෙනස් කරන්න, හෝ අමතර tests order කරන්න Engineer ට පුළුවන්. ඒවායින් වැඩ Contract එකට අනුකූල නොවන බව පෙනුණොත් වියදම ඔබ දරනවා. මේ instructions නිසා, හෝ Employer වගකියන ප්‍රමාදයක් නිසා, ඔබට ප්‍රමාදයක් හෝ Cost එකක් ආවොත් කාලය, Cost සහ profit claim කරන්න පුළුවන්."],
d:[["a","Date we became aware of the delay or Cost","ප්‍රමාදය හෝ Cost එක ගැන දැනගත් දිනය"]],
q:[["Did the varied or additional test show the work does not meet the Contract?","වෙනස් කළ හෝ අමතර test එකෙන් වැඩ Contract එකට අනුකූල නොවන බව පෙනුණාද?","Then you bear the cost of that Variation.","එසේ නම් ඒ Variation එකේ වියදම ඔබ දරනවා.","",""]],
s:[[null,"know","Varied or additional tests are instructed as a Variation under Clause 13.","වෙනස් කළ හෝ අමතර tests Clause 13 යටතේ Variation එකක් ලෙස instruct කරනවා.",["7.3","13.1"]],
["a:O","do","If you suffer delay or Cost from these instructions, or from a delay the Employer is responsible for, give notice to the Engineer.","මේ instructions නිසා, හෝ Employer වගකියන ප්‍රමාදයක් නිසා ප්‍රමාදයක් හෝ Cost එකක් ආවොත්, Engineer ට notice දෙන්න.",["7.3"]],
["a+28:L","warn",N19[0],N19[1],["19.1"]],
["a+84:L","do",N19D[0],N19D[1],["19.1"]]],
en:{E:["C",EOTC[0]+" Not if the test shows the work does not meet the Contract.",EOTC[1]+" Test එකෙන් වැඩ අනුකූල නොවන බව පෙනුණොත් නොවේ."],C:["C","Not if the varied or additional test shows the work does not meet the Contract.","වෙනස් කළ හෝ අමතර test එකෙන් වැඩ Contract එකට අනුකූල නොවන බව පෙනුණොත් නොවේ."],P:["C","Same condition as Cost.","Cost එකට ඇති කොන්දේසියම."],v:1}},

{i:"Q6",c:"qual",r:"C",t:["Getting material samples approved","Material samples අනුමත කරවාගැනීම"],
m:["Before using Materials, submit samples and information to the Engineer for consent.","Materials භාවිත කරන්න කලින්, samples සහ තොරතුරු Engineer ගේ අනුමැතියට ඉදිරිපත් කරන්න."],
s:[[null,"do","Before use, submit to the Engineer for consent: manufacturer's standard samples and the samples specified in the Contract (at your cost), with relevant information. Label each sample with its origin and intended use.","භාවිතයට කලින් Engineer ගේ අනුමැතියට ඉදිරිපත් කරන්න: manufacturer ගේ සම්මත samples සහ Contract එකේ සඳහන් samples (ඔබේ වියදමින්), අදාළ තොරතුරු සමඟ. හැම sample එකකම එහි මූලාශ්‍රය සහ භාවිත කරන තැන label කරන්න.",["7.1"]],
[null,"know","Additional samples the Engineer asks for are instructed as a Variation.","Engineer ඉල්ලන අමතර samples Variation එකක් ලෙස instruct කරනවා.",["7.1","13.1"]]]},

{i:"Q7",c:"qual",r:"B",t:["Tests on Completion","Tests on Completion"],
m:["Before taking-over, the Works must pass the Tests on Completion. There are fixed notice periods, and rules if the Contractor delays the tests or the Works fail them.","Taking-over එකට කලින් Works, Tests on Completion සමත් විය යුතුයි. නියමිත notice කාල සහ Contractor tests ප්‍රමාද කළොත් හෝ Works අසමත් වුණොත් අදාළ නීති තියෙනවා."],
d:[["a","Date we will be ready for the Tests on Completion","Tests on Completion සඳහා ලෑස්ති වෙන දිනය"]],
s:[["a-21:L","do","Give the Engineer not less than 21 days' notice of the date after which you will be ready (after providing the documents required under 4.1(d), if you designed part of the Works).","ලෑස්ති වෙන දිනය ගැන Engineer ට දින 21කට නොඅඩු notice එකක් දෙන්න (Works කොටසක් ඔබ design කළා නම්, 4.1(d) යටතේ අවශ්‍ය documents දීලා).",["9.1","4.1"]],
["a+14:L","know","Unless otherwise agreed, the tests are carried out within 14 days after that date, on the days the Engineer instructs. The Engineer makes allowance for any use of the Works by the Employer.","වෙනත් එකඟතාවක් නැත්නම්, ඒ දිනයෙන් පසු දින 14ක් ඇතුළත, Engineer instruct කරන දිනවල tests කරනවා. Employer Works භාවිත කිරීමේ බලපෑමට Engineer ඉඩ දෙනවා.",["9.1"]],
[null,"do","As soon as the Works pass, submit a certified report of the results to the Engineer.","Works සමත් වූ ගමන්, ප්‍රතිඵල වල සහතික කළ report එකක් Engineer ට දෙන්න.",["9.1"]],
[null,"warn","If you unduly delay the tests, the Engineer may by notice require them within 21 days. If you fail, the Employer's Personnel may carry them out at your risk and cost, and the results are accepted as accurate. If the Employer delays them, see Q5 (7.3) and Q8 (10.3).","ඔබ tests අනවශ්‍ය ලෙස ප්‍රමාද කළොත්, දින 21ක් ඇතුළත ඒවා කරන්න Engineer ට notice එකකින් ඉල්ලන්න පුළුවන්. ඔබ අසමත් වුණොත්, Employer's Personnel ට ඔබේ අවදානමට සහ වියදමට ඒවා කරන්න පුළුවන්, ප්‍රතිඵල නිවැරදි ලෙස පිළිගන්නවා. Employer ඒවා ප්‍රමාද කළොත් Q5 (7.3) සහ Q8 (10.3) බලන්න.",["9.2","9.1"]],
[null,"if","If the Works fail, 7.4 applies and the tests are repeated. If they fail again, the Engineer may order more repeats; reject the Works if the failure deprives the Employer of substantially the whole benefit (with the remedies in 11.4(c)); or, at the Employer's request, issue a Taking-Over Certificate with a reduction in the Contract Price for the reduced value.","Works අසමත් වුණොත් 7.4 අදාළ වෙනවා, tests නැවත කරනවා. නැවතත් අසමත් වුණොත් Engineer ට තවත් නැවත tests order කරන්න; අසමත්කම නිසා Employer ට සම්පූර්ණ ප්‍රයෝජනයම වාගේ අහිමි වෙනවා නම් Works reject කරන්න (11.4(c) හි පිළියම් සමඟ); හෝ Employer ඉල්ලුවොත් අඩු වූ වටිනාකමට Contract Price එක අඩු කරලා Taking-Over Certificate එකක් නිකුත් කරන්න පුළුවන්.",["9.3","9.4","7.4"]]]},

{i:"Q8",c:"qual",r:"C",t:["The Employer prevents the Tests on Completion for more than 14 days","Employer Tests on Completion දින 14කට වඩා වළක්වනවා"],
m:["If a cause the Employer is responsible for prevents you from carrying out the Tests on Completion for more than 14 days, the Employer is treated as having taken over the Works, and you can claim time, Cost and profit.","Employer වගකියන හේතුවක් නිසා Tests on Completion කිරීම දින 14කට වඩා වැළකුණොත්, Employer Works භාර ගත්තා ලෙස සැලකෙනවා, ඔබට කාලය, Cost සහ profit claim කරන්න පුළුවන්."],
d:[["a","First day we were prevented from testing","Testing වැළකුණු පළමු දිනය"],["b","Date we became aware of the delay or Cost","ප්‍රමාදය හෝ Cost එක ගැන දැනගත් දිනය"]],
s:[["a+14:F","if","If you are still prevented, the 'more than 14 days' condition is met from this date. The Employer is treated as having taken over the Works on the date the tests would otherwise have been completed, and the Engineer must issue a Taking-Over Certificate.","තවමත් වැළකෙනවා නම්, 'දින 14කට වඩා' කොන්දේසිය මේ දිනයේ සිට සපිරෙනවා. Tests ඉවර වෙන්න තිබුණු දිනයේ Employer Works භාර ගත්තා ලෙස සැලකෙනවා, Engineer Taking-Over Certificate එකක් නිකුත් කළ යුතුයි.",["10.3"]],
[null,"know","You then carry out the tests as soon as practicable, before the Defects Notification Period expires, when the Engineer gives 14 days' notice.","ඉන් පසු, Engineer දින 14ක notice එකක් දුන් විට, Defects Notification Period එක ඉවර වෙන්න කලින්, සාධාරණව හැකි ඉක්මනින් tests කරන්න.",["10.3"]],
["b:O","do","If you suffer delay or Cost from this delay in testing, give notice to the Engineer.","Testing වල මේ ප්‍රමාදය නිසා ප්‍රමාදයක් හෝ Cost එකක් ආවොත්, Engineer ට notice දෙන්න.",["10.3"]],
["b+28:L","warn",N19[0],N19[1],["19.1"]],
["b+84:L","do",N19D[0],N19D[1],["19.1"]]],
en:{E:["C",EOTC[0],EOTC[1]],C:["Y"],P:["Y"],v:1}},

{i:"Q9",c:"qual",r:"B",t:["A defect was notified during the Defects Notification Period","Defects Notification Period එකේදී defect එකක් දැනුම් දුන්නා"],
m:["By the end of the Defects Notification Period you must finish outstanding work and remedy defects or damage notified by or for the Employer. Whether it is at your cost depends on the cause.","Defects Notification Period එක ඉවර වෙද්දී ඉතිරි වැඩ ඉවර කරලා, Employer විසින් හෝ වෙනුවෙන් දැනුම් දුන් defects හෝ හානි හදන්න ඕනේ. එය ඔබේ වියදමින්ද කියන එක හේතුව මත රඳා පවතිනවා."],
d:[["a","Date we were notified of the defect","Defect එක ගැන දැනුම් දුන් දිනය"]],
q:[["Is the defect due to your design, Plant, Materials or workmanship not meeting the Contract, or your failure to meet another obligation?","Defect එකට හේතුව ඔබේ design, Contract එකට අනුකූල නොවන Plant, Materials හෝ workmanship, හෝ වෙනත් වගකීමක් ඉටු නොකිරීමද?","Then you remedy it at your own risk and cost.","එසේ නම් ඔබේම අවදානමට සහ වියදමට එය හදනවා.","Then you must be notified promptly and it is dealt with as a Variation (13.3).","එසේ නම් ඔබට ඉක්මනින් දැනුම් දිය යුතුයි, එය Variation එකක් (13.3) ලෙස හසුරුවනවා."]],
s:[[null,"do","Complete outstanding work within the reasonable time the Engineer instructs, and remedy notified defects or damage by the end of the Defects Notification Period (or as soon as practicable after).","Engineer instruct කරන සාධාරණ කාලය ඇතුළත ඉතිරි වැඩ ඉවර කරන්න, දැනුම් දුන් defects හෝ හානි Defects Notification Period එක ඉවර වෙද්දී (හෝ ඉන් පසු සාධාරණව හැකි ඉක්මනින්) හදන්න.",["11.1","11.2"]],
[null,"warn","If you do not remedy it within a reasonable time, a date may be fixed with reasonable notice. If you miss it and the work was at your cost, the Employer may: (a) do it itself or through others at your cost (through 2.4); (b) have the Engineer determine a reasonable reduction in the Contract Price; or (c) if it deprives the Employer of substantially the whole benefit of the Works or a major part, terminate for that part and recover sums paid plus costs.","සාධාරණ කාලයක් ඇතුළත නොහැදුවොත්, සාධාරණ notice එකකින් දිනයක් නියම කරන්න පුළුවන්. ඔබ එය මඟ හැරලා, වැඩ ඔබේ වියදමින් කළ යුතු එකක් නම්, Employer ට: (a) තමන්ම හෝ අනුන් ලවා ඔබේ වියදමින් කරවන්න (2.4 හරහා); (b) Contract Price එකේ සාධාරණ අඩු කිරීමක් Engineer ලවා තීරණය කරවන්න; හෝ (c) Works වල හෝ ප්‍රධාන කොටසක සම්පූර්ණ ප්‍රයෝජනයම වාගේ අහිමි කරනවා නම්, ඒ කොටසට terminate කරලා ගෙවූ මුදල් සහ වියදම් ආපසු ගන්න පුළුවන්.",["11.4","2.4"]],
[null,"know","If the remedy may affect performance, the Engineer may require tests to be repeated by notice within 28 days after it is remedied, at the risk and cost of the Party liable for the remedial work.","හැදීම කාර්ය සාධනයට බලපාන්න පුළුවන් නම්, හැදුවාට පස්සේ දින 28ක් ඇතුළත notice එකකින් tests නැවත කරන්න Engineer ට ඉල්ලන්න පුළුවන්, හැදීමේ වැඩට වගකිව යුතු Party ගේ අවදානමට සහ වියදමට.",["11.6"]],
[null,"know","If the Engineer requires, search for the cause of a defect. If the defect is not yours to remedy at your cost, you are paid the Cost of the search plus reasonable profit.","Engineer ඉල්ලුවොත් defect එකේ හේතුව හොයන්න. Defect එක ඔබේ වියදමින් හදන්න ඕනේ එකක් නොවේ නම්, හෙවීමේ Cost එක + සාධාරණ profit ඔබට ගෙවනවා.",["11.7","3.4"]]]},

{i:"Q10",c:"qual",r:"E",t:["A defect stops the Works being used, so the Employer wants a longer defects period","Defect එකක් නිසා Works භාවිත කරන්න බැහැ, ඒ නිසා Employer defects period එක දිගු කරන්න ඕනේ"],
m:["If, after taking-over, the Works, a Section or a major item of Plant cannot be used for its intended purpose because of a defect or damage, the Employer may claim an extension of the Defects Notification Period, but not by more than one year.","Taking-over එකෙන් පසු, defect එකක් හෝ හානියක් නිසා Works, Section එකක් හෝ ප්‍රධාන Plant item එකක් එහි අරමුණට භාවිත කරන්න බැරි නම්, Employer ට Defects Notification Period එක දිගු කිරීමට claim කරන්න පුළුවන්, හැබැයි අවුරුද්දකට වඩා නොවේ."],
s:[[null,"do","Claim the extension under 2.4, giving notice before the Defects Notification Period expires. The extension cannot exceed one year.","Defects Notification Period එක ඉවර වෙන්න කලින් notice දීලා 2.4 යටතේ extension එක claim කරන්න. Extension එක අවුරුද්දක් ඉක්මවන්න බැහැ.",["11.3","2.4"]],
[null,"know","If Plant or Materials were suspended under 8.8 or 16.1, the Contractor's defect obligations do not cover defects or damage occurring more than two years after their Defects Notification Period would otherwise have expired.","Plant හෝ Materials 8.8 හෝ 16.1 යටතේ suspend කළා නම්, ඒවායේ Defects Notification Period එක සාමාන්‍යයෙන් ඉවර වෙන්න තිබුණු දිනයෙන් අවුරුදු දෙකකට පසු වන defects හෝ හානි Contractor ගේ defect වගකීම් යටතට වැටෙන්නේ නැහැ.",["11.3"]],
[null,"if","If a defect cannot be remedied quickly on Site, the Employer may consent to the Contractor removing defective Plant for repair, and may require the Performance Security to be increased by the full replacement cost or other security.","Defect එකක් Site එකේදී ඉක්මනින් හදන්න බැරි නම්, repair කරන්න දෝෂ සහිත Plant ඉවත් කිරීමට Employer ට අනුමැතිය දෙන්න පුළුවන්, Performance Security එක සම්පූර්ණ replacement cost එකෙන් වැඩි කරන්න හෝ වෙනත් security එකක් ඉල්ලන්නත් පුළුවන්.",["11.5"]]]}
];

const CMD13=[
{i:"K1",c:"sub",r:"C",t:["We want to appoint a subcontractor","Subcontractor කෙනෙක් පත් කරන්න ඕනේ"],
m:["You may subcontract parts of the Works, but never the whole. Unless the Contract Data says otherwise, most subcontractors need the Engineer's prior consent, and you remain fully responsible for their acts and defaults.","Works වල කොටස් subcontract කරන්න පුළුවන්, හැබැයි කවදාවත් සම්පූර්ණයෙන්ම නොවේ. Contract Data එකේ වෙනත් දෙයක් නැත්නම්, බොහෝ subcontractors ලාට Engineer ගේ පූර්ව අනුමැතිය ඕනේ, ඔවුන්ගේ ක්‍රියා සහ වැරදි වලට ඔබ සම්පූර්ණයෙන්ම වගකියනවා."],
s:[[null,"warn","You must not subcontract the whole of the Works.","සම්පූර්ණ Works ම subcontract කරන්න බැහැ.",["4.4"]],
[null,"know","Unless the Contract Data says otherwise: no consent is needed for suppliers of Materials or for a subcontractor named in the Contract; the Engineer's prior consent is needed for other proposed subcontractors.","Contract Data එකේ වෙනත් දෙයක් නැත්නම්: Materials සපයන්නන්ට හෝ Contract එකේ නම් කළ subcontractor කෙනෙකුට අනුමැතියක් අවශ්‍ය නැහැ; අනෙක් යෝජිත subcontractors ලාට Engineer ගේ පූර්ව අනුමැතිය අවශ්‍යයි.",["4.4"]],
[null,"do","Give the Engineer at least 28 days' notice of the intended start date of each subcontractor's work, and of the start of their work on Site.","හැම subcontractor කෙනෙකුගේම වැඩ පටන් ගැනීමට අදහස් කරන දිනය සහ Site එකේ ඔවුන්ගේ වැඩ පටන් ගැනීම ගැන Engineer ට අවම දින 28ක notice එකක් දෙන්න.",["4.4"]],
[null,"warn","Subcontracting the whole of the Works, or part of it without the Engineer's prior consent, is a ground for termination by the Employer.","සම්පූර්ණ Works, හෝ Engineer ගේ පූර්ව අනුමැතිය නැතිව කොටසක්, subcontract කිරීම Employer ට terminate කිරීමට හේතුවක්.",["15.2(d)"]],
[null,"know","You are responsible for the acts and defaults of subcontractors, their agents and employees as if they were your own, including insurance for their employees under 18.3.","Subcontractors, ඔවුන්ගේ නියෝජිතයින් සහ සේවකයන්ගේ ක්‍රියා සහ වැරදි වලට ඔබේම වගේ ඔබ වගකියනවා, 18.3 යටතේ ඔවුන්ගේ සේවකයන්ගේ insurance ඇතුළුව.",["4.4","18.3"]]]},

{i:"K2",c:"sub",r:"C",t:["We object to a nominated subcontractor","Nominated subcontractor කෙනෙකුට විරුද්ධයි"],
m:["A nominated subcontractor is one named in the Contract or one the Engineer instructs you to employ under Clause 13. You are not obliged to employ one against whom you raise a reasonable objection, by notice with supporting particulars, as soon as practicable.","Nominated subcontractor කියන්නේ Contract එකේ නම් කළ, හෝ Clause 13 යටතේ යොදාගන්න Engineer ඔබට instruct කරන subcontractor කෙනෙක්. සාධාරණව හැකි ඉක්මනින්, සහාය විස්තර සහිත notice එකකින් සාධාරණ විරෝධතාවක් පළ කරන කෙනෙකු යොදාගන්න ඔබ බැඳී නැහැ."],
s:[[null,"do","Give notice of your objection to the Engineer as soon as practicable, with supporting particulars.","සාධාරණව හැකි ඉක්මනින්, සහාය විස්තර සමඟ ඔබේ විරෝධතාව ගැන Engineer ට notice දෙන්න.",["5.2","5.1"]],
[null,"know","An objection is treated as reasonable if (among other things): (a) there is reason to believe the subcontractor lacks competence, resources or financial strength; (b) the subcontract does not make the subcontractor indemnify you against its negligence or misuse of Goods; or (c) the subcontract does not make the subcontractor take on obligations that let you meet yours, and indemnify you against its failures. This does not apply if the Employer agrees to indemnify you against the consequences.","සාධාරණ විරෝධතාවක් ලෙස සැලකෙන අවස්ථා (වෙනත් දේ අතර): (a) subcontractor ට දක්ෂතාවය, සම්පත් හෝ මූල්‍ය ශක්තිය මදි බවට හේතු තියෙනවා; (b) subcontractor ගේ නොසැලකිල්ලෙන් හෝ Goods අනිසි භාවිතයෙන් ඔබව ආරක්ෂා කරන්න (indemnify) subcontract එකේ නියම නැහැ; හෝ (c) ඔබේ වගකීම් ඉටු කරන්න ඉඩ දෙන වගකීම් භාර ගැනීමට සහ එහි අසමත්කම් වලින් ඔබව ආරක්ෂා කිරීමට subcontract එකේ නියම නැහැ. ප්‍රතිවිපාක වලින් ඔබව ආරක්ෂා කරන්න Employer එකඟ වුණොත් මෙය අදාළ නැහැ.",["5.2"]]]},

{i:"K3",c:"sub",r:"B",t:["Payments to a nominated subcontractor are late","Nominated subcontractor ට ගෙවීම් ප්‍රමාදයි"],
m:["The Contractor must pay the nominated subcontractor the amounts the Engineer certifies. If it cannot show it has paid, and has no valid reason to withhold, the Employer may pay the subcontractor directly and recover the money from the Contractor.","Engineer certify කරන මුදල් Contractor nominated subcontractor ට ගෙවිය යුතුයි. ගෙවූ බව පෙන්වන්න බැරි නම්, සහ රඳවාගැනීමට වලංගු හේතුවක් නැත්නම්, Employer ට subcontractor ට කෙලින්ම ගෙවලා ඒ මුදල Contractor ගෙන් ආපසු ගන්න පුළුවන්."],
s:[[null,"know","The Contractor pays the nominated subcontractor the amounts the Engineer certifies as due under the subcontract. These amounts plus other charges are included in the Contract Price under 13.4(b).","Subcontract එක යටතේ ගෙවිය යුතු බව Engineer certify කරන මුදල් Contractor nominated subcontractor ට ගෙවනවා. මේ මුදල් සහ අනෙක් ගාස්තු 13.4(b) යටතේ Contract Price එකට ඇතුළත් කරනවා.",["5.3","13.4"]],
[null,"warn","Before certifying a payment that includes an amount for a nominated subcontractor, the Engineer may ask for reasonable evidence that it received all amounts due under earlier certificates (less retention and other deductions).","Nominated subcontractor කෙනෙකුට මුදලක් ඇතුළත් payment එකක් certify කරන්න කලින්, පෙර certificates යටතේ ගෙවිය යුතු සියලු මුදල් (retention සහ අනෙක් අඩු කිරීම් හැර) ඔහුට ලැබුණු බවට සාධාරණ සාක්ෂි Engineer ට ඉල්ලන්න පුළුවන්.",["5.4"]],
[null,"warn","Unless the Contractor gives that evidence, or satisfies the Engineer in writing that it is reasonably entitled to withhold and shows the subcontractor was told, the Employer may pay the subcontractor directly, and the Contractor must repay the Employer.","Contractor ඒ සාක්ෂි නොදුන්නොත්, හෝ රඳවාගැනීමට සාධාරණ අයිතියක් ඇති බව Engineer ට ලිඛිතව ඒත්තු ගන්වලා subcontractor ට දැනුම් දුන් බව පෙන්වන්නේ නැත්නම්, Employer ට subcontractor ට කෙලින්ම ගෙවන්න පුළුවන්, Contractor ඒ මුදල Employer ට ආපසු ගෙවිය යුතුයි.",["5.4"]]]},

{i:"K4",c:"sub",r:"B",t:["The Engineer wants a staff member removed, or we want to change our Contractor's Representative","Engineer staff කෙනෙක් ඉවත් කරන්න කියනවා, නැත්නම් අපේ Contractor's Representative වෙනස් කරන්න ඕනේ"],
m:["Your personnel must be qualified, skilled and experienced. The Engineer may require you to remove anyone, including your Representative, for any of four reasons. Changing your Representative needs the Engineer's prior consent.","ඔබේ personnel සුදුසුකම් ඇති, දක්ෂ සහ පළපුරුදු විය යුතුයි. හේතු හතරෙන් ඕනෑම එකකට, ඔබේ Representative ඇතුළු ඕනෑම කෙනෙකු ඉවත් කරන්න Engineer ට ඉල්ලන්න පුළුවන්. ඔබේ Representative වෙනස් කරන්න Engineer ගේ පූර්ව අනුමැතිය ඕනේ."],
s:[[null,"know","The Engineer may require removal of any person on the Site or Works who: (a) persists in misconduct or lack of care; (b) works incompetently or negligently; (c) fails to follow the Contract; or (d) persists in conduct harmful to safety, health or the environment.","Site එකේ හෝ Works වල සිටින, මේ කරුණු ඇති ඕනෑම කෙනෙකු ඉවත් කරන්න Engineer ට ඉල්ලන්න පුළුවන්: (a) දිගටම වැරදි හැසිරීම හෝ නොසැලකිල්ල; (b) අදක්ෂ ලෙස හෝ නොසැලකිලිමත්ව වැඩ කිරීම; (c) Contract එක පිළිනොපැදීම; හෝ (d) ආරක්ෂාව, සෞඛ්‍යය හෝ පරිසරයට හානිකර හැසිරීම දිගටම කිරීම.",["6.8"]],
[null,"do","Remove the person and, if appropriate, appoint a suitable replacement.","එම පුද්ගලයා ඉවත් කරලා, සුදුසු නම් සුදුසු ආදේශකයෙක් පත් කරන්න.",["6.8"]],
[null,"warn","You may not revoke the appointment of your Contractor's Representative, or appoint a replacement, without the Engineer's prior consent. The Representative receives the Engineer's instructions for you.","Engineer ගේ පූර්ව අනුමැතිය නැතිව ඔබේ Contractor's Representative ගේ පත්වීම අවලංගු කරන්න හෝ ආදේශකයෙක් පත් කරන්න බැහැ. Engineer ගේ instructions ඔබ වෙනුවෙන් ලබාගන්නේ Representative.",["4.3"]],
[null,"do","Each calendar month, submit details of the number of each class of personnel and each type of equipment on Site, in a form the Engineer approves, until all outstanding work is complete. Do not recruit staff from the Employer's Personnel.","හැම calendar මාසෙම, Engineer අනුමත කරන form එකෙන්, Site එකේ හැම personnel පන්තියකම සහ හැම equipment වර්ගයකම ගණන ගැන විස්තර, ඉතිරි සියලු වැඩ ඉවර වෙනකම් දෙන්න. Employer's Personnel අතරින් staff බඳවාගන්න එපා.",["6.9","6.2"]]]},

{i:"K5",c:"sub",r:"C",x:1,t:["A subcontractor has wider force majeure terms than our main contract, or its obligations continue after the defects period","Subcontractor කෙනෙකුට අපේ main contract එකට වඩා පුළුල් force majeure terms තියෙනවා, නැත්නම් එහි වගකීම් defects period එකෙන් පසුවත් පවතිනවා"],
m:["Wider force majeure relief in a subcontract does not excuse you under the main contract. Separately, if a subcontractor's obligations run beyond the Defects Notification Period, the Engineer may ask you to assign their benefit to the Employer.","Subcontract එකක ඇති පුළුල් force majeure සහන main contract එක යටතේ ඔබව නිදහස් කරන්නේ නැහැ. වෙනම, subcontractor ගේ වගකීම් Defects Notification Period එකෙන් එහාට යනවා නම්, ඒවායේ ප්‍රතිලාභය Employer ට පවරන්න Engineer ට ඉල්ලන්න පුළුවන්."],
s:[[null,"warn","Force majeure events in a subcontract that are additional to or broader than Clause 20 do not excuse your non-performance or entitle you to relief.","Clause 20 ට වඩා අමතර හෝ පුළුල් subcontract එකක force majeure සිදුවීම් ඔබේ අකාර්යක්ෂමතාව නිදහස් කරන්නේ හෝ ඔබට සහන දෙන්නේ නැහැ.",["20.5"]],
[null,"know","If a subcontractor's obligations extend beyond the expiry of the Defects Notification Period and the Engineer, before that date, instructs you to assign their benefit to the Employer, you must do so. Unless the assignment says otherwise, you are then not liable for that subcontractor's work.","Subcontractor ගේ වගකීම් Defects Notification Period එක ඉවර වීමෙන් එහාට යනවා නම් සහ ඒ දිනයට කලින් ඒවායේ ප්‍රතිලාභය Employer ට පවරන්න Engineer instruct කළොත්, ඔබ එසේ කළ යුතුයි. පැවරීමේ වෙනත් දෙයක් නැත්නම්, ඉන් පසු ඒ subcontractor ගේ වැඩ වලට ඔබ වගකියන්නේ නැහැ.",["4.5"]]]},

{i:"R1",c:"risk",r:"C",t:["The Works were damaged by an Employer's risk (war, terrorism, riot by others, the Employer's use or design, unforeseeable forces of nature)","Employer's risk එකක් (යුද්ධය, ත්‍රස්තවාදය, අනුන්ගේ කලබල, Employer ගේ භාවිතය හෝ design, අනපේක්ෂිත ස්වාභාවික බලවේග) නිසා Works වලට හානි වුණා"],
m:["Some risks belong to the Employer. If one of them damages the Works, Goods or Contractor's Documents, you notify the Engineer promptly and repair as far as the Engineer requires; you can then claim time and Cost, plus profit for the Employer's use or design. The Works insurance under 18.1 does not cover Employer's risks.","සමහර අවදානම් Employer ට අයිති. ඒවායින් එකක් Works, Goods හෝ Contractor's Documents වලට හානි කළොත්, ඉක්මනින් Engineer ට දන්වලා Engineer ඉල්ලන ප්‍රමාණයට හදනවා; ඉන් පසු කාලය සහ Cost, Employer ගේ භාවිතය හෝ design නම් profit ත් claim කරන්න පුළුවන්. 18.1 යටතේ Works insurance එක Employer's risks ආවරණය කරන්නේ නැහැ."],
d:[["a","Date we became aware of the loss or damage","පාඩුව හෝ හානිය ගැන දැනගත් දිනය"],["b","Date we became aware of delay or Cost from repairing it","එය හැදීම නිසා ප්‍රමාදයක් හෝ Cost එකක් ගැන දැනගත් දිනය"]],
q:[["Was the cause the Employer's use or occupation of the Permanent Works (17.3(f)) or design by the Employer's Personnel or others it is responsible for (17.3(g))?","හේතුව Employer Permanent Works භාවිත කිරීම (17.3(f)), හෝ Employer's Personnel හෝ එය වගකියන අනෙක් අයගේ design එක (17.3(g))ද?","You also get reasonable profit on the Cost.","Cost එකට අමතරව සාධාරණ profit ත් ලැබෙනවා.","",""]],
s:[[null,"know","Employer's risks: (a) war, hostilities, invasion; (b) rebellion, terrorism, revolution, military or usurped power, civil war, within Sri Lanka; (c) riot or disorder in Sri Lanka by persons other than your and your subcontractors' personnel; (d) munitions, explosives, radiation or radioactive contamination in Sri Lanka (unless caused by your use); (e) pressure waves from aircraft at sonic speeds; (f) the Employer's use or occupation of the Permanent Works (unless specified); (g) design by the Employer's Personnel or others it is responsible for; (h) forces of nature that are Unforeseeable or against which an experienced contractor could not reasonably have taken adequate precautions.","Employer's risks: (a) යුද්ධය, සතුරු ක්‍රියා, ආක්‍රමණ; (b) ලංකාව තුළ කැරලි, ත්‍රස්තවාදය, විප්ලවය, හමුදා හෝ අයුතු බලය, සිවිල් යුද්ධය; (c) ඔබේ සහ subcontractors ගේ personnel නොවන අය ලංකාව තුළ කරන කැරලි හෝ කලබල; (d) ලංකාව තුළ යුද උපකරණ, පුපුරණ ද්‍රව්‍ය, radiation හෝ radioactive දූෂණය (ඔබේ භාවිතයෙන් නම් හැර); (e) sonic වේගයෙන් යන ගුවන් යානා නිසා pressure waves; (f) Employer Permanent Works භාවිත කිරීම (සඳහන් කළ අවස්ථා හැර); (g) Employer's Personnel හෝ එය වගකියන අනෙක් අයගේ design; (h) අනපේක්ෂිත, හෝ පළපුරුදු contractor කෙනෙකුට ප්‍රමාණවත් පූර්වාරක්ෂාවන් ගැනීමට සාධාරණ ලෙස බැරි වූ ස්වාභාවික බලවේග.",["17.3"]],
["a:O","do","Promptly give notice to the Engineer, and rectify the loss or damage to the extent the Engineer requires.","ඉක්මනින් Engineer ට notice දීලා, Engineer ඉල්ලන ප්‍රමාණයට පාඩුව හෝ හානිය නිවැරදි කරන්න.",["17.4"]],
["b:O","do","If rectifying it causes you delay or Cost, give a further notice to the Engineer.","එය නිවැරදි කිරීම නිසා ප්‍රමාදයක් හෝ Cost එකක් ආවොත්, Engineer ට further notice එකක් දෙන්න.",["17.4"]],
["b+28:L","warn",N19[0],N19[1],["19.1"]],
["b+84:L","do",N19D[0],N19D[1],["19.1"]],
[null,"know","The Works insurance required by 18.1 covers loss or damage from causes other than the Employer's risks, so this loss is dealt with under 17.4, not under that policy.","18.1 යටතේ අවශ්‍ය Works insurance එක ආවරණය කරන්නේ Employer's risks නොවන හේතු වලින් වන පාඩු හෝ හානි, ඒ නිසා මේ පාඩුව හසුරුවන්නේ 17.4 යටතේ මිසක් ඒ policy එක යටතේ නොවේ.",["18.1","17.4"]]],
en:{E:["C",EOTC[0],EOTC[1]],C:["Y"],P:["C","Only for the Employer's use or occupation (17.3(f)) or the Employer's design (17.3(g)).","Employer ගේ භාවිතය (17.3(f)) හෝ Employer ගේ design (17.3(g)) සඳහා පමණයි."],v:1},
k:["Photos, police or official reports, damage assessments, records of repair costs","Photos, police හෝ නිල වාර්තා, හානි තක්සේරු, හැදීමේ වියදම් records"],
n:{f:"C",to:"EN",cl:["17.3","17.4"],sub:"Notice under Sub-Clause 17.4 – loss or damage from an Employer's risk",b:["On __ the Works/Goods at __ suffered loss or damage caused by __, which is an Employer's risk under Sub-Clause 17.3(__).","We will rectify it to the extent you require. Please give your instructions."]}},

{i:"R2",c:"risk",r:"B",t:["A Force Majeure event has happened","Force Majeure සිදුවීමක් වුණා"],
m:["Force Majeure is an exceptional event that meets all four conditions in 20.1. After notice, the affected Party is excused from the obligations it prevents, for as long as it prevents them. Payment obligations are never excused.","Force Majeure කියන්නේ 20.1 හි කොන්දේසි හතරම සපුරන සුවිශේෂී සිදුවීමක්. Notice දුන් පසු, බලපෑමට ලක් වූ Party එක, සිදුවීම වළක්වන කාලය තුළ, එය වළක්වන වගකීම් වලින් නිදහස් වෙනවා. ගෙවීමේ වගකීම් කවදාවත් නිදහස් වෙන්නේ නැහැ."],
d:[["a","Date we became aware (or should have become aware) of the event","සිදුවීම ගැන දැනගත් (හෝ දැනගත යුතුව තිබූ) දිනය"]],
q:[["Is it (a) beyond the Party's control, (b) something it could not reasonably have provided against before the contract, (c) something it could not reasonably have avoided or overcome, and (d) not substantially caused by the other Party?","එය (a) Party එකේ පාලනයෙන් පිටත, (b) contract එකට කලින් සාධාරණ ලෙස සැලසුම් කළ නොහැකි, (c) සාධාරණ ලෙස වළක්වන්න හෝ ජයගන්න බැරි, සහ (d) අනෙක් Party එක නිසා සැලකිය යුතු ලෙස ඇති නොවූ දෙයක්ද?","","","All four must be true; otherwise it is not Force Majeure.","හතරම සත්‍ය විය යුතුයි; නැත්නම් එය Force Majeure නොවේ."],["Is it a natural catastrophe (earthquake, hurricane, typhoon, volcanic activity)?","එය ස්වාභාවික ව්‍යසනයක්ද (භූමිකම්පා, hurricane, typhoon, ගිනිකඳු ක්‍රියාකාරිත්වය)?","You can get extra time, but not Cost.","අමතර කාලය ලැබිය හැකියි, හැබැයි Cost නොවේ.","",""]],
s:[[null,"know","Examples (if the four conditions are met): (i) war, hostilities, invasion; (ii) rebellion, terrorism, revolution, military or usurped power, civil war; (iii) riot, disorder, strike or lockout by persons other than your or your subcontractors' personnel; (iv) munitions, explosives, radiation or radioactive contamination (unless caused by your use); (v) natural catastrophes such as earthquake, hurricane, typhoon or volcanic activity.","උදාහරණ (කොන්දේසි හතර සපිරේ නම්): (i) යුද්ධය, සතුරු ක්‍රියා, ආක්‍රමණ; (ii) කැරලි, ත්‍රස්තවාදය, විප්ලවය, හමුදා හෝ අයුතු බලය, සිවිල් යුද්ධය; (iii) ඔබේ හෝ subcontractors ගේ personnel නොවන අයගේ කැරලි, කලබල, වර්ජන හෝ lockout; (iv) යුද උපකරණ, පුපුරණ ද්‍රව්‍ය, radiation හෝ radioactive දූෂණය (ඔබේ භාවිතයෙන් නම් හැර); (v) භූමිකම්පා, hurricane, typhoon හෝ ගිනිකඳු ක්‍රියාකාරිත්වය වැනි ස්වාභාවික ව්‍යසන.",["20.1"]],
["a+14:L","warn","Last day to give notice to the other Party of the event, specifying the obligations that are or will be prevented. Send a copy to the Engineer.","සිදුවීම ගැන, වැළකෙන හෝ වැළකෙන්නට යන වගකීම් සඳහන් කරමින් අනෙක් Party ට notice දෙන්න අවසාන දිනය. Engineer ට copy එකක් යවන්න.",["20.2","1.3"]],
[null,"do","Use all reasonable endeavours to minimise delay, and give notice when you stop being affected. Force Majeure never excuses payment obligations.","ප්‍රමාදය අවම කරන්න සියලු සාධාරණ උත්සාහයන් දරන්න, බලපෑම නැවතුණාම notice දෙන්න. Force Majeure කවදාවත් ගෙවීමේ වගකීම් නිදහස් කරන්නේ නැහැ.",["20.3","20.2"]],
["a+28:L","warn",N19[0],N19[1],["20.4","19.1"]],
["a+84:L","do",N19D[0],N19D[1],["19.1"]],
[null,"know","If you are prevented and gave the 20.2 notice, you get extra time if completion is delayed. Cost is paid only for events of kinds (i) to (iv), and for (ii) to (iv) only if they occur in Sri Lanka. No Cost for natural catastrophes (v).","ඔබ වැළකී 20.2 notice එක දුන්නා නම්, completion ප්‍රමාද වුණොත් අමතර කාලය ලැබෙනවා. Cost ගෙවන්නේ (i) සිට (iv) දක්වා වර්ග වලට පමණයි, (ii) සිට (iv) දක්වා ඒවා ලංකාව තුළ සිදු වුණොත් පමණයි. ස්වාභාවික ව්‍යසන (v) වලට Cost නැහැ.",["20.4","3.4"]]],
en:{E:["C","Only if you gave the 20.2 notice and completion is delayed.","20.2 notice එක දීලා completion ප්‍රමාද වුණොත් පමණයි."],C:["C","Only for events (i) to (iv) of 20.1; for (ii) to (iv), only if they occur in Sri Lanka. Not for natural catastrophes.","20.1 හි (i) සිට (iv) දක්වා සිදුවීම් වලට පමණයි; (ii) සිට (iv) දක්වා ඒවා ලංකාව තුළ සිදු වුණොත් පමණයි. ස්වාභාවික ව්‍යසන වලට නොවේ."],P:["N"],v:1},
n:{f:"C",to:"E",cl:["20.1","20.2"],sub:"Notice of Force Majeure under Sub-Clause 20.2",b:["We give notice that the following event or circumstance constitutes Force Majeure under Sub-Clause 20.1: __, of which we became aware on __.","It prevents (or will prevent) the performance of the following obligations: __.","We are using all reasonable endeavours to minimise delay and will notify you when we cease to be affected."],by:"a+14"}},

{i:"R3",c:"risk",r:"B",x:1,t:["Force Majeure has stopped substantially all the Works for a long time","Force Majeure නිසා Works සියල්ලම වාගේ දිගු කාලයක් නතර වෙලා"],
m:["If Force Majeure (notified under 20.2) prevents substantially all the Works in progress for 84 continuous days, or for several periods totalling more than 140 days from the same event, either Party may end the contract. The Contractor is then paid for work done and listed costs.","20.2 යටතේ දැනුම් දුන් Force Majeure නිසා කරගෙන යන Works සියල්ලම වාගේ අඛණ්ඩව දින 84ක්, හෝ එකම සිදුවීම නිසා මුළු දින 140කට වඩා වූ කාල කිහිපයක් වැළකුණොත්, ඕනෑම Party එකකට contract එක අවසන් කරන්න පුළුවන්. ඉන් පසු කළ වැඩ සහ ලැයිස්තුගත වියදම් Contractor ට ගෙවනවා."],
d:[["a","First day substantially all the Works were prevented","Works සියල්ලම වාගේ වැළකුණු පළමු දිනය"]],
s:[["a+84:F","if","If substantially all the Works are still prevented, the continuous 84-day period is complete and either Party may give notice of termination. (Or: several periods from the same event totalling more than 140 days.)","Works සියල්ලම වාගේ තවමත් වැළකී ඇත්නම්, අඛණ්ඩ දින 84 කාලය සම්පූර්ණයි, ඕනෑම Party එකකට termination notice එකක් දෙන්න පුළුවන්. (නැත්නම්: එකම සිදුවීමෙන් මුළු දින 140කට වඩා වූ කාල කිහිපයක්.)",["20.6"]],
[null,"know","Termination takes effect 7 days after the notice. The Contractor then stops work and removes its equipment under 16.3.","Termination එක notice එකෙන් දින 7කට පසු බලපැවැත්වෙනවා. ඉන් පසු Contractor වැඩ නවත්වලා 16.3 යටතේ එහි equipment ඉවත් කරනවා.",["20.6","16.3"]],
[null,"know","The Engineer certifies: (a) work done that has a contract price; (b) Plant and Materials ordered and delivered (or that must be accepted), which become the Employer's when paid; (c) other Cost reasonably incurred expecting to complete; (d) removing Temporary Works and equipment; (e) repatriating staff and labour.","Engineer certify කරනවා: (a) contract මිලක් ඇති කළ වැඩ; (b) order කරලා ලැබුණු (හෝ භාර ගත යුතු) Plant සහ Materials, ගෙවූ පසු Employer ට අයිති වෙනවා; (c) ඉවර කරන බලාපොරොත්තුවෙන් සාධාරණව ඇති වූ අනෙක් Cost; (d) Temporary Works සහ equipment ඉවත් කිරීම; (e) staff සහ labour ආපසු යැවීම.",["20.6"]]]},

{i:"R4",c:"risk",r:"B",x:1,t:["An event makes the contract impossible or unlawful to perform","සිදුවීමක් නිසා contract එක ඉටු කරන්නම බැහැ, නැත්නම් නීති විරෝධී වෙලා"],
m:["If an event outside both Parties' control (including Force Majeure) makes performance impossible or unlawful, or the governing law releases the Parties, either Party may give notice and both are released from further performance.","පාර්ශව දෙකේම පාලනයෙන් පිටත සිදුවීමක් (Force Majeure ඇතුළුව) ඉටු කිරීම කළ නොහැකි හෝ නීති විරෝධී කළොත්, හෝ පාලන නීතිය පාර්ශව නිදහස් කළොත්, ඕනෑම Party එකකට notice දෙන්න පුළුවන්, දෙපාර්ශවයම තවදුරටත් ඉටු කිරීමෙන් නිදහස් වෙනවා."],
s:[[null,"do","Give notice to the other Party of the event or circumstance.","සිදුවීම හෝ තත්ත්වය ගැන අනෙක් Party ට notice දෙන්න.",["20.7"]],
[null,"know","Both Parties are then discharged from further performance, without affecting either Party's rights for any earlier breach. The Employer pays the same amount as for a termination under 20.6.","ඉන් පසු දෙපාර්ශවයම තවදුරටත් ඉටු කිරීමෙන් නිදහස් වෙනවා, කලින් වූ උල්ලංඝනයක් ගැන කිසිම Party එකක අයිතිවාසිකම් වලට බලපෑමක් නැතිව. 20.6 යටතේ termination එකකට ගෙවන මුදලම Employer ගෙවනවා.",["20.7","20.6"]]]},

{i:"R5",c:"risk",r:"E",t:["The Contractor has not taken out, or has let lapse, the required insurances","Contractor අවශ්‍ය insurances ගත්තේ නැහැ, නැත්නම් lapse වෙන්න ඇරියා"],
m:["If the Contractor fails to take out or keep in force the insurances in 18.1 to 18.3 (or any other required), the Employer may do it and recover the premiums plus a 5% service charge.","18.1 සිට 18.3 දක්වා (හෝ වෙනත් අවශ්‍ය) insurances Contractor ගන්නේ නැත්නම් හෝ බලාත්මකව තියාගන්නේ නැත්නම්, Employer ට ඒවා අරගෙන premiums සහ 5% service charge එකක් අයකරගන්න පුළුවන්."],
s:[[null,"know","Required (within 14 days from the LOA): Works for at least 115% of the Initial Contract Price and Contractor's Equipment for replacement value, in joint names (18.1); third-party liability for each Party, until the Performance Certificate, at least the Contract Data limit per occurrence with no limit on occurrences, in joint names and extended to the Employer's property (18.2); and personnel insurance under which the Employer and Engineer are also indemnified (18.3).","අවශ්‍ය (LOA එකේ සිට දින 14ක් ඇතුළත): Initial Contract Price එකෙන් අවම 115%කට Works සහ replacement value එකට Contractor's Equipment, joint names වලින් (18.1); Performance Certificate එක දක්වා හැම Party එකකම third-party වගකීම, occurrence එකකට අවම Contract Data සීමාව, occurrences ගණනට සීමාවක් නැතිව, joint names වලින්, Employer ගේ දේපළ වලටත් දිගු කරලා (18.2); සහ Employer සහ Engineer ටත් indemnity ලැබෙන personnel insurance (18.3).",["18.1","18.2","18.3","CD 18.2"]],
[null,"do","If the Contractor fails, the Employer may take out and keep the insurance and pay the premiums, then deduct the amount plus a 5% service charge from money due to the Contractor, or recover it as a debt.","Contractor අසමත් වුණොත්, Employer ට insurance අරගෙන බලාත්මකව තියාගෙන premiums ගෙවලා, ඒ මුදල සහ 5% service charge එකක් Contractor ට ගෙවිය යුතු මුදලින් අඩු කරන්න, හෝ ණයක් ලෙස අයකරගන්න පුළුවන්.",["18.4"]]]},

{i:"R6",c:"risk",r:"C",t:["Damage to someone else's property, or someone was injured","වෙන කෙනෙකුගේ දේපළ වලට හානියක්, නැත්නම් කෙනෙක් තුවාල වුණා"],
m:["You indemnify the Employer against claims for injury or death arising from your work (unless the Employer caused it), and for damage to property other than the Works caused by your negligence or breach. Third-party insurance in joint names should respond.","ඔබේ වැඩ නිසා වන තුවාල හෝ මරණ ගැන claims (Employer නිසා නම් හැර), සහ ඔබේ නොසැලකිල්ල හෝ උල්ලංඝනය නිසා Works හැර වෙනත් දේපළ වලට වන හානි ගැන claims වලින් ඔබ Employer ආරක්ෂා කරනවා. Joint names third-party insurance එක ප්‍රතිචාර දැක්විය යුතුයි."],
s:[[null,"know","(a) Injury, sickness, disease or death of anyone, arising from your design, execution or remedying of defects: you indemnify the Employer unless caused by the negligence, wilful act or breach of the Employer or its personnel. (b) Damage to property other than the Works: you indemnify to the extent it arises from your work and is caused by the negligence, wilful act or breach of you, your personnel or anyone you employ.","(a) ඔබේ design, වැඩ කිරීම හෝ defects හැදීම නිසා ඕනෑම කෙනෙකුගේ තුවාල, අසනීප, රෝග හෝ මරණ: Employer හෝ එහි personnel ගේ නොසැලකිල්ල, හිතාමතා ක්‍රියාව හෝ උල්ලංඝනය නිසා නම් හැර ඔබ Employer ආරක්ෂා කරනවා. (b) Works හැර වෙනත් දේපළ වලට හානි: ඔබේ වැඩ නිසා ඇති වී, ඔබේ, ඔබේ personnel ගේ හෝ ඔබ යොදවන ඕනෑම කෙනෙකුගේ නොසැලකිල්ල, හිතාමතා ක්‍රියාව හෝ උල්ලංඝනය නිසා නම්, ඒ ප්‍රමාණයට ඔබ ආරක්ෂා කරනවා.",["17.1"]],
[null,"do","Notify your third-party insurer. The policy is in joint names, covers each Party's liability until the Performance Certificate, and extends to the Employer's property (except things insured under 18.1).","ඔබේ third-party insurer ට දන්වන්න. Policy එක joint names වලින්, Performance Certificate එක දක්වා හැම Party එකකම වගකීම ආවරණය කරනවා, Employer ගේ දේපළ වලටත් දිගු වෙනවා (18.1 යටතේ insure කළ දේ හැර).",["18.2"]],
[null,"if","If the injured person is one of your or your subcontractors' personnel, see the personnel insurance under 18.3 and F8.","තුවාල වූ කෙනා ඔබේ හෝ subcontractors ගේ personnel කෙනෙක් නම්, 18.3 යටතේ personnel insurance සහ F8 බලන්න.",["18.3"]]],
k:["Incident report, photos, witness statements, insurer correspondence","Incident report, photos, සාක්ෂිකරුවන්ගේ ප්‍රකාශ, insurer සමඟ ලිපි"]},

{i:"R7",c:"risk",r:"C",x:1,t:["Floods, landslides or a cyclone damaged the Works","ගංවතුර, නායයෑම් හෝ සුළි සුළඟක් Works වලට හානි කළා"],
m:["Damage from natural events can fall under different rules. Which one applies depends on whether the event was Unforeseeable or could not reasonably have been guarded against, whether it was a natural catastrophe that prevented performance, or whether it was a risk you carry.","ස්වාභාවික සිදුවීම් නිසා වන හානි විවිධ නීති යටතට වැටෙන්න පුළුවන්. අදාළ වන්නේ කුමක්ද කියන එක, සිදුවීම අනපේක්ෂිතද හෝ සාධාරණ ලෙස ආරක්ෂා විය නොහැකිද, එය ඉටු කිරීම වැළැක්වූ ස්වාභාවික ව්‍යසනයක්ද, නැත්නම් ඔබ දරන අවදානමක්ද යන්න මත රඳා පවතිනවා."],
s:[[null,"if","If the force of nature was Unforeseeable, or an experienced contractor could not reasonably have taken adequate precautions against it, it is an Employer's risk (17.3(h)): see R1 (time and Cost, no profit).","ස්වාභාවික බලවේගය අනපේක්ෂිත නම්, හෝ පළපුරුදු contractor කෙනෙකුට එයට එරෙහිව ප්‍රමාණවත් පූර්වාරක්ෂාවන් ගැනීමට සාධාරණ ලෙස බැරි නම්, එය Employer's risk එකක් (17.3(h)): R1 බලන්න (කාලය සහ Cost, profit නැහැ).",["17.3","17.4"]],
[null,"if","If it is a natural catastrophe that meets the four Force Majeure conditions and prevents performance, see R2 (time only, no Cost).","එය Force Majeure කොන්දේසි හතර සපුරන, ඉටු කිරීම වළක්වන ස්වාභාවික ව්‍යසනයක් නම්, R2 බලන්න (කාලය පමණයි, Cost නැහැ).",["20.1","20.4"]],
[null,"warn","Otherwise the loss is your risk while the Works are in your care: rectify it at your cost (17.2) and claim under the Works insurance, which covers causes other than the Employer's risks (18.1).","නැත්නම්, Works ඔබේ භාරයේ තිබෙන විට පාඩුව ඔබේ අවදානමක්: ඔබේ වියදමින් එය නිවැරදි කරලා (17.2), Employer's risks නොවන හේතු ආවරණය කරන Works insurance එක යටතේ claim කරන්න (18.1).",["17.2","18.1"]],
[null,"if","If there is only delay (no damage) from exceptionally adverse weather, see D2 (8.4(c)).","අසාමාන්‍ය තරම් දරුණු කාලගුණයෙන් හානියක් නැතිව ප්‍රමාදයක් පමණක් නම්, D2 (8.4(c)) බලන්න.",["8.4(c)"]]]}
];
