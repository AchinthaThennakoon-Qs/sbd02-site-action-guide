{i:"H1",c:"comp",r:"C",t:["We want to apply for the Taking-Over Certificate (handover)","Taking-Over Certificate (handover) එකට apply කරන්න ඕනේ"],
m:["The Taking-Over Certificate (TOC) states the date the Works (or a Section) were completed. It ends liquidated damages, passes care of the Works to the Employer, starts the Defects Notification Period and releases half the retention. Minor outstanding work and defects that do not substantially affect use do not prevent it.","Taking-Over Certificate (TOC) එකෙන් Works (හෝ Section එකක්) ඉවර කළ දිනය සඳහන් කරනවා. එය liquidated damages අවසන් කරනවා, Works රැකබලාගැනීම Employer ට පවරනවා, Defects Notification Period එක පටන් ගන්නවා, retention එකෙන් භාගයක් නිදහස් කරනවා. භාවිතයට සැලකිය යුතු ලෙස බලපාන්නේ නැති සුළු ඉතිරි වැඩ සහ defects එයට බාධාවක් නොවේ."],
d:[["a","Date we expect the Works (or Section) to be complete","Works (හෝ Section එක) ඉවර වෙයි කියලා අපේක්ෂා කරන දිනය"],["b","Date the Engineer received our application","අපේ application එක Engineer ට ලැබුණු දිනය"]],
s:[["a-14:F","do","From this date you may apply to the Engineer, by notice, for a Taking-Over Certificate (not earlier than 14 days before the Works will, in your opinion, be complete and ready). You may apply for each Section in the same way.","මේ දිනයේ සිට, Taking-Over Certificate එක සඳහා notice එකකින් Engineer ට apply කරන්න පුළුවන් (ඔබේ මතය අනුව Works ඉවර වෙලා ලෑස්ති වෙන්න දින 14කට වඩා කලින් නොවේ). හැම Section එකකටම එසේම apply කරන්න පුළුවන්.",["10.1"]],
[null,"warn","If you designed part of the Permanent Works, that part is not complete for taking-over until you have submitted the as-built documents and operation and maintenance manuals. The Works must also have passed the Tests on Completion.","Permanent Works කොටසක් ඔබ design කළා නම්, as-built documents සහ operation සහ maintenance manuals ඉදිරිපත් කරනකම් ඒ කොටස taking-over සඳහා ඉවර වී නැහැ. Works, Tests on Completion සමත් වෙලා තිබිය යුතුයි.",["4.1","8.2","9.1"]],
["b+28:L","know","Within 28 days the Engineer must either issue the TOC, stating the completion date (minor outstanding work and defects that do not substantially affect use may remain), or reject the application with reasons and the work still needed. You then finish that work before applying again.","දින 28ක් ඇතුළත Engineer, completion දිනය සඳහන් කරමින් TOC එක නිකුත් කළ යුතුයි (භාවිතයට සැලකිය යුතු ලෙස බලපාන්නේ නැති සුළු ඉතිරි වැඩ සහ defects තිබිය හැකියි), නැත්නම් හේතු සහ තවමත් අවශ්‍ය වැඩ සඳහන් කරමින් application එක reject කළ යුතුයි. ඉන් පසු නැවත apply කරන්න කලින් ඒ වැඩ ඉවර කරන්න.",["10.1"]],
["b+28:O","if","If the Engineer does neither within 28 days and the Works are substantially complete, the TOC is treated as issued on this day.","දින 28ක් ඇතුළත Engineer දෙකම නොකළොත් සහ Works බොහෝ දුරට ඉවර නම්, මේ දවසේ TOC එක නිකුත් කළා ලෙස සැලකෙනවා.",["10.1"]],
[null,"know","After the TOC: liquidated damages stop at the date in the TOC; care of the Works passes to the Employer (you keep care of outstanding work); clear the Site of equipment, surplus material and rubbish, leaving it clean and safe (you may keep what you need for the defects period); half the retention is due; send the Statement at Completion within 84 days.","TOC එකෙන් පසු: TOC එකේ දිනයේදී liquidated damages නවතිනවා; Works රැකබලාගැනීම Employer ට යනවා (ඉතිරි වැඩ ඔබේ රැකවරණයේ); Site එකෙන් equipment, අමතර materials සහ කුණු ඉවත් කරලා පිරිසිදු සහ ආරක්ෂිත ලෙස තියන්න (defects period එකට අවශ්‍ය දේ තියාගන්න පුළුවන්); retention එකෙන් භාගය ගෙවිය යුතුයි; දින 84ක් ඇතුළත Statement at Completion එක යවන්න.",["8.7","CD 8.7","17.2","4.15","14.8","CD 14.3","14.9"]],
[null,"know","The Time for Completion is stated in the Contract Data and counted from the Commencement Date, plus any extensions.","Time for Completion එක Contract Data එකේ සඳහන් වෙනවා, Commencement Date එකේ සිට, දුන් extensions එක්ක ගණන් කරනවා.",["CD 1.1.3.3","8.2"]]],
k:["Completion records, test results, as-built drawings, manuals, list of outstanding work","Completion records, test ප්‍රතිඵල, as-built drawings, manuals, ඉතිරි වැඩ ලැයිස්තුව"],
n:{f:"C",to:"EN",cl:["10.1"],sub:"Application for Taking-Over Certificate",b:["In our opinion the Works (or Section __) will be complete in accordance with the Contract and ready for taking over on __.","We apply under Sub-Clause 10.1 for a Taking-Over Certificate. The following minor outstanding work and defects, which will not substantially affect use, will be completed during the Defects Notification Period: __."],from:"a-14"}},

{i:"H2",c:"comp",r:"C",t:["The Employer is using part of the Works before handover","Handover එකට කලින් Employer Works කොටසක් භාවිත කරනවා"],
m:["The Employer should not use any part of the Works before its TOC, except as a temporary measure specified in the Contract or agreed. If it does, that part is treated as taken over from the date of use, and you can claim Cost plus profit if the use was not specified or agreed.","Contract එකේ සඳහන් හෝ එකඟ වූ තාවකාලික ක්‍රමයක් හැර, TOC එකට කලින් Employer Works වල කිසිම කොටසක් භාවිත නොකළ යුතුයි. එසේ කළොත්, භාවිත කළ දිනයේ සිට ඒ කොටස භාර ගත්තා ලෙස සැලකෙනවා, භාවිතය සඳහන් කර හෝ එකඟ වී නැත්නම් Cost + profit claim කරන්න පුළුවන්."],
d:[["a","Date the Employer started using the part","Employer කොටස භාවිත කරන්න පටන් ගත් දිනය"]],
s:[["a:O","know","The part used is treated as taken over from this date, and care of it passes to the Employer. Ask the Engineer to issue a TOC for that part.","භාවිත කළ කොටස මේ දිනයේ සිට භාර ගත්තා ලෙස සැලකෙනවා, එහි රැකවරණය Employer ට යනවා. ඒ කොටසට TOC එකක් නිකුත් කරන්න Engineer ගෙන් ඉල්ලන්න.",["10.2","17.2"]],
["a+28:L","warn",N19[0]+" (Only if you incur Cost from the use.)",N19[1]+" (භාවිතය නිසා Cost එකක් ආවොත් පමණයි.)",["10.2","19.1"]],
[null,"know","You must be given the earliest opportunity to carry out any outstanding Tests on Completion for that part, before its Defects Notification Period expires.","ඒ කොටසේ Defects Notification Period එක ඉවර වෙන්න කලින්, ඉතිරි Tests on Completion කරන්න ඔබට මුල්ම අවස්ථාව ලැබිය යුතුයි.",["10.2"]],
[null,"know","After a TOC for a part (other than a Section), the daily liquidated damages for the rest are reduced in proportion to that part's value. The maximum amount is not reduced. The Employer's use of the Permanent Works is also an Employer's risk.","කොටසකට (Section එකක් නොවන) TOC එකකින් පසු, ඉතිරිය සඳහා දවසක liquidated damages ඒ කොටසේ වටිනාකමට අනුපාතිකව අඩු වෙනවා. උපරිම මුදල අඩු වෙන්නේ නැහැ. Employer Permanent Works භාවිත කිරීම Employer's risk එකක් ද වෙනවා.",["10.2","17.3"]]],
en:{E:["N"],C:["C","Only if the use was not specified in the Contract or agreed by you.","භාවිතය Contract එකේ සඳහන් කර හෝ ඔබ එකඟ වී නැත්නම් පමණයි."],P:["C","Same condition as Cost.","Cost එකට ඇති කොන්දේසියම."],v:1},
n:{f:"C",to:"EN",cl:["10.2","19.1"],sub:"Notice under Sub-Clauses 10.2 and 19.1 – Employer's use of part of the Works",b:["Since __ the Employer has been using __, which is part of the Works for which no Taking-Over Certificate has been issued. This use was not specified in the Contract or agreed by us.","Please issue a Taking-Over Certificate for this part. We are incurring Cost as a result and give notice of our claim for this Cost plus reasonable profit."],by:"a+28"}},

{i:"H3",c:"comp",r:"C",t:["Performance Certificate and the last steps","Performance Certificate සහ අවසාන පියවර"],
m:["Only the Performance Certificate counts as acceptance of the Works. After it, the Performance Security is returned, the Site is cleared, and the final account is settled. Obligations still unperformed remain.","Works පිළිගැනීමක් ලෙස සැලකෙන්නේ Performance Certificate එක පමණයි. ඊට පසු Performance Security එක ආපසු දෙනවා, Site එක clear කරනවා, final account එක settle කරනවා. තවම ඉටු නොකළ වගකීම් පවතිනවා."],
d:[["a","Date the (last) Defects Notification Period ends","(අවසාන) Defects Notification Period එක අවසන් වන දිනය"],["b","Date the Performance Certificate was issued (the Employer receives a copy)","Performance Certificate එක නිකුත් කළ දිනය (Employer ට copy එකක් ලැබෙනවා)"]],
s:[["a+28:L","know","The Engineer must issue the Performance Certificate within 28 days after the latest Defects Notification Period expires (or as soon after as you have supplied all Contractor's Documents and completed and tested all the Works, including remedying defects). A copy goes to the Employer.","අවසාන Defects Notification Period එක ඉවර වී දින 28ක් ඇතුළත (හෝ සියලු Contractor's Documents දීලා, defects හැදීම ඇතුළුව සියලු Works ඉවර කරලා test කළ ගමන්) Engineer Performance Certificate එක නිකුත් කළ යුතුයි. Employer ට copy එකක් යනවා.",["11.8","CD 1.1.3.7"]],
[null,"do","After receiving it, remove any remaining equipment, surplus material, rubbish and Temporary Works from the Site.","එය ලැබුණාට පසු ඉතිරි equipment, අමතර materials, කුණු සහ Temporary Works Site එකෙන් ඉවත් කරන්න.",["11.10"]],
["b+21:L","know","The Employer must return the Performance Security within 21 days after receiving its copy of the Performance Certificate.","Performance Certificate එකේ copy එක ලැබී දින 21ක් ඇතුළත Employer Performance Security එක ආපසු දිය යුතුයි.",["4.2","CD 4.2"]],
["b+28:L","warn","If your items are not removed within 28 days after the Employer receives its copy, the Employer may sell or dispose of them.","Employer ට copy එක ලැබී දින 28ක් ඇතුළත ඔබේ දේවල් ඉවත් නොකළොත්, Employer ට ඒවා විකුණන්න හෝ බැහැර කරන්න පුළුවන්.",["11.10"]],
["b+56:L","do","Send the draft final statement within 56 days after receiving the Performance Certificate (see P9). The second half of the retention is also due now that the defects are certified as corrected (see P6).","Performance Certificate එක ලැබී දින 56ක් ඇතුළත draft final statement එක යවන්න (P9 බලන්න). Defects නිවැරදි කළ බව certify කළ නිසා retention එකේ දෙවන භාගයත් දැන් ගෙවිය යුතුයි (P6 බලන්න).",["14.10","14.8"]],
[null,"know","After the Performance Certificate, each Party remains liable for any obligation still unperformed, and the Contract is treated as still in force for that purpose.","Performance Certificate එකෙන් පසුවත්, තවම ඉටු නොකළ ඕනෑම වගකීමකට හැම Party එකක්ම වගකියනවා; ඒ සඳහා Contract එක තවමත් බලාත්මක ලෙස සැලකෙනවා.",["11.9"]]]},

{i:"L1",c:"term",r:"B",t:["A Notice to Correct was received (or needs to be given)","Notice to Correct එකක් ලැබුණා (හෝ දෙන්න ඕනේ)"],
m:["If the Contractor fails to carry out any obligation, the Engineer may by notice require it to make good the failure within a specified reasonable time. Failing to comply is a ground for termination.","Contractor කිසියම් වගකීමක් ඉටු නොකළොත්, නියමිත සාධාරණ කාලයක් ඇතුළත එය නිවැරදි කරන්න Engineer ට notice එකකින් ඉල්ලන්න පුළුවන්. එය පිළිනොපැදීම termination වලට හේතුවක්."],
s:[[null,"do","Make good and remedy the failure within the reasonable time specified in the notice.","Notice එකේ සඳහන් සාධාරණ කාලය ඇතුළත අසමත්කම නිවැරදි කරන්න.",["15.1"]],
[null,"warn","Failing to comply with a Notice to Correct is a ground for the Employer to terminate with 14 days' notice.","Notice to Correct එකක් පිළිනොපැදීම දින 14ක notice එකකින් Employer ට terminate කිරීමට හේතුවක්.",["15.2(a)","15.2"]]]},

{i:"L2",c:"term",r:"E",t:["The Employer wants to end the contract because of the Contractor's default","Contractor ගේ පැහැර හැරීම නිසා Employer contract එක අවසන් කරන්න ඕනේ"],
m:["The Employer may terminate only on the grounds in 15.2, usually by 14 days' notice. Afterwards, the work is valued, and the Employer may complete the Works and recover its extra costs.","Employer ට terminate කරන්න පුළුවන් 15.2 හි හේතු මත පමණයි, සාමාන්‍යයෙන් දින 14ක notice එකකින්. ඉන් පසු වැඩ value කරනවා, Employer ට Works ඉවර කරලා තම අමතර වියදම් අයකරගන්න පුළුවන්."],
d:[["a","Date the termination notice was given","Termination notice එක දුන් දිනය"]],
s:[[null,"know","Grounds: (a) failure to comply with 4.2 (Performance Security) or a Notice to Correct; (b) abandoning the Works or plainly showing an intention not to continue; (c) without reasonable excuse failing to proceed in accordance with Clause 8, or to comply with a 7.4 or 7.5 notice within 28 days; (d) subcontracting the whole or part of the Works without the Engineer's consent, or assigning without agreement; (e) bankruptcy or insolvency; (f) giving or offering a bribe (directly or through personnel, agents or subcontractors); (g) corrupt or fraudulent practices, including collusion, in competing for or executing the Contract.","හේතු: (a) 4.2 (Performance Security) හෝ Notice to Correct එකක් පිළිනොපැදීම; (b) Works අත්හැරීම හෝ දිගටම කරගෙන යාමට අදහසක් නැති බව පැහැදිලිව පෙන්වීම; (c) සාධාරණ හේතුවක් නැතිව Clause 8 අනුව ඉදිරියට නොයාම, හෝ 7.4 හෝ 7.5 notice එකක් දින 28ක් ඇතුළත පිළිනොපැදීම; (d) Engineer ගේ අනුමැතිය නැතිව Works සම්පූර්ණයෙන් හෝ කොටසක් subcontract කිරීම, හෝ එකඟතාව නැතිව assign කිරීම; (e) බංකොලොත්භාවය හෝ ණය ගෙවීමේ නොහැකියාව; (f) අල්ලසක් දීම හෝ දීමට යෝජනා කිරීම (කෙලින්ම හෝ personnel, නියෝජිතයින් හෝ subcontractors හරහා); (g) Contract එක ලබාගැනීමට තරග කිරීමේදී හෝ ක්‍රියාත්මක කිරීමේදී දූෂිත හෝ වංචනික ක්‍රියා, collusion ඇතුළුව.",["15.2"]],
["a+14:O","know","Termination takes effect 14 days after the notice. For (e) bankruptcy or (f) bribery, the Employer may terminate immediately by notice.","Notice එකෙන් දින 14කට පසු termination බලපැවැත්වෙනවා. (e) බංකොලොත්භාවය හෝ (f) අල්ලස් සඳහා Employer ට notice එකකින් වහාම terminate කරන්න පුළුවන්.",["15.2"]],
[null,"know","The Contractor must leave the Site, deliver required Goods and all Contractor's Documents and design documents, and use best efforts to follow reasonable instructions in the notice to assign subcontracts and protect life, property and the Works. The Employer may complete the Works and use those documents. Equipment and Temporary Works are released to the Contractor, but may be sold to recover any payment it owes.","Contractor Site එකෙන් ඉවත් වෙලා, අවශ්‍ය Goods සහ සියලු Contractor's Documents සහ design documents භාර දිය යුතුයි; notice එකේ subcontracts පැවරීම සහ ජීවිත, දේපළ සහ Works ආරක්ෂා කිරීම ගැන සාධාරණ instructions පිළිපදින්න උපරිම උත්සාහයක් ගත යුතුයි. Employer ට Works ඉවර කරලා ඒ documents භාවිත කරන්න පුළුවන්. Equipment සහ Temporary Works Contractor ට නිදහස් කරනවා, හැබැයි එය ගෙවිය යුතු මුදලක් අයකරගන්න ඒවා විකුණන්න පුළුවන්.",["15.2"]],
[null,"know","The Engineer values the Works, Goods and Contractor's Documents under 3.4. The Employer may then claim under 2.4, withhold payments until its costs (including completion, defects and delay damages) are established, recover its losses and extra completion costs, and pay any balance to the Contractor.","Engineer 3.4 යටතේ Works, Goods සහ Contractor's Documents value කරනවා. ඉන් පසු Employer ට 2.4 යටතේ claim කරන්න, තම වියදම් (ඉවර කිරීම, defects සහ delay damages ඇතුළුව) තහවුරු වෙනකම් ගෙවීම් රඳවාගන්න, තම පාඩු සහ අමතර ඉවර කිරීමේ වියදම් අයකරගන්න, ඉතිරියක් තියෙනවා නම් Contractor ට ගෙවන්න පුළුවන්.",["15.3","15.4","2.4"]]]},

{i:"L3",c:"term",r:"B",t:["The Employer ends the contract for its own convenience","Employer තමන්ගේ පහසුවට contract එක අවසන් කරනවා"],
m:["The Employer may terminate at any time for convenience, but not in order to do the Works itself or give them to another contractor (for one year, and only after paying the Contractor). The Contractor is paid as for a Force Majeure termination.","Employer ට පහසුව සඳහා ඕනෑම වෙලාවක terminate කරන්න පුළුවන්, හැබැයි Works තමන්ම කරන්න හෝ වෙනත් contractor කෙනෙකුට දෙන්න නොවේ (අවුරුද්දක් යනකම්, Contractor ට ගෙවීම් කළාට පසු පමණයි). Force Majeure termination එකක් වගේ Contractor ට ගෙවනවා."],
d:[["a","Later of: date we received the notice, or date the Employer returned the Performance Security","පසුව එන දිනය: notice එක ලැබුණු දිනය, හෝ Employer Performance Security එක ආපසු දුන් දිනය"]],
s:[["a+28:O","know","Termination takes effect on this date.","Termination එක මේ දිනයේ බලපැවැත්වෙනවා.",["15.5"]],
[null,"warn","The Employer must not use this to execute the Works itself or through another contractor. It may do so only after one year from the termination and after meeting its payment obligations to the Contractor.","Works තමන්ම හෝ වෙනත් contractor කෙනෙකු හරහා කරවන්න Employer මෙය භාවිත නොකළ යුතුයි. Termination එකෙන් අවුරුද්දකට පසු, Contractor ට ගෙවීමේ වගකීම් ඉටු කළාට පසු පමණයි එසේ කරන්න පුළුවන්.",["15.5"]],
[null,"do","Stop work (except work instructed for protection of life, property or the Works), hand over paid-for documents, Plant, Materials and work, remove other Goods and leave the Site. You are paid under 20.6.","වැඩ නවත්වන්න (ජීවිත, දේපළ හෝ Works ආරක්ෂාව සඳහා instruct කළ වැඩ හැර), ගෙවීම් ලැබූ documents, Plant, Materials සහ වැඩ භාර දෙන්න, අනෙක් Goods ඉවත් කරලා Site එකෙන් ඉවත් වෙන්න. 20.6 යටතේ ඔබට ගෙවනවා.",["16.3","20.6"]]]},

{i:"L4",c:"term",r:"C",t:["The Contractor wants to end the contract","Contractor contract එක අවසන් කරන්න ඕනේ"],
m:["The Contractor may terminate only on the grounds in 16.2, usually by 14 days' notice. It then gets back the Performance Security and is paid under 20.6 plus loss of profit or other loss.","Contractor ට terminate කරන්න පුළුවන් 16.2 හි හේතු මත පමණයි, සාමාන්‍යයෙන් දින 14ක notice එකකින්. ඉන් පසු Performance Security එක ආපසු ලැබෙනවා, 20.6 යටතේ ගෙවීම් සහ ලාභ අහිමි වීම හෝ වෙනත් පාඩු ලැබෙනවා."],
d:[["a","Date we gave the termination notice","Termination notice එක දුන් දිනය"]],
s:[[null,"know","Grounds: (a) the Engineer fails to issue the Payment Certificate within 56 days after receiving a Statement; (b) you do not receive an IPC amount within 56 days after the 14.6 payment period ends (except 2.4 deductions); (c) the Employer substantially fails to perform its obligations; (d) the Employer fails to comply with 1.6 (Contract Agreement) or 1.7 (Assignment); (e) a prolonged suspension affects the whole Works (8.11); (f) the Employer becomes bankrupt or insolvent.","හේතු: (a) Statement එකක් ලැබී දින 56ක් ඇතුළත Engineer Payment Certificate එක නිකුත් නොකිරීම; (b) 14.6 ගෙවීමේ කාලය ඉවර වී දින 56ක් ඇතුළත IPC මුදලක් නොලැබීම (2.4 අඩු කිරීම් හැර); (c) Employer තම වගකීම් සැලකිය යුතු ලෙස ඉටු නොකිරීම; (d) Employer 1.6 (Contract Agreement) හෝ 1.7 (Assignment) පිළිනොපැදීම; (e) දිගු suspension එකක් සම්පූර්ණ Works වලට බලපෑම (8.11); (f) Employer බංකොලොත් වීම හෝ ණය ගෙවීමට නොහැකි වීම.",["16.2"]],
["a+14:O","know","Termination takes effect 14 days after the notice. For (e) or (f), you may terminate immediately by notice. Terminating does not affect your other rights.","Notice එකෙන් දින 14කට පසු termination බලපැවැත්වෙනවා. (e) හෝ (f) සඳහා notice එකකින් වහාම terminate කරන්න පුළුවන්. Terminate කිරීම ඔබේ අනෙක් අයිතිවාසිකම් වලට බලපාන්නේ නැහැ.",["16.2"]],
[null,"do","Then promptly: stop work (except work instructed for safety), hand over the Contractor's Documents, Plant, Materials and other work you have been paid for, remove other Goods and leave the Site.","ඉන් පසු ඉක්මනින්: වැඩ නවත්වන්න (ආරක්ෂාව සඳහා instruct කළ වැඩ හැර), ගෙවීම් ලැබූ Contractor's Documents, Plant, Materials සහ අනෙක් වැඩ භාර දෙන්න, අනෙක් Goods ඉවත් කරලා Site එකෙන් ඉවත් වෙන්න.",["16.3"]],
[null,"know","The Employer must promptly return the Performance Security, pay you under 20.6, and pay any loss of profit or other loss or damage caused by the termination.","Employer ඉක්මනින් Performance Security එක ආපසු දිය යුතුයි, 20.6 යටතේ ඔබට ගෙවිය යුතුයි, termination නිසා ඇති වූ ලාභ අහිමි වීම හෝ වෙනත් පාඩු ගෙවිය යුතුයි.",["16.4","20.6"]]],
n:{f:"C",to:"E",cl:["16.2"],sub:"Notice of termination under Sub-Clause 16.2",b:["We give notice under Sub-Clause 16.2(__) that we terminate the Contract, because __.","The termination will take effect 14 days after the date of this notice (or immediately, in the case of Sub-Clause 16.2(e) or (f)). We will proceed under Sub-Clause 16.3 and request payment under Sub-Clause 16.4."]}},

{i:"L5",c:"term",r:"B",x:1,t:["Bribery, corruption, fraud or collusion was discovered","අල්ලස්, දූෂණ, වංචා හෝ collusion හෙළි වුණා"],
m:["Bribery by the Contractor (or its personnel, agents or subcontractors) allows immediate termination. Corrupt or fraudulent practices, including collusion among bidders, are also a ground, with 14 days' notice. At bid stage, such a bidder is rejected.","Contractor (හෝ එහි personnel, නියෝජිතයින් හෝ subcontractors) අල්ලස් දීම වහාම terminate කිරීමට ඉඩ දෙනවා. Bidders අතර collusion ඇතුළු දූෂිත හෝ වංචනික ක්‍රියාත් හේතුවක්, දින 14ක notice එකකින්. Bid අදියරේදී එවැනි bidder reject කරනවා."],
s:[[null,"warn","Giving or offering a bribe or other inducement in relation to the Contract (directly or through personnel, agents or subcontractors) is ground 15.2(f): the Employer may terminate immediately by notice. Lawful inducements and rewards to your own personnel do not count.","Contract එකට අදාළව අල්ලසක් හෝ වෙනත් පෙළඹවීමක් දීම හෝ දීමට යෝජනා කිරීම (කෙලින්ම හෝ personnel, නියෝජිතයින් හෝ subcontractors හරහා) 15.2(f) හේතුවයි: Employer ට notice එකකින් වහාම terminate කරන්න පුළුවන්. ඔබේම personnel ට දෙන නීත්‍යානුකූල පෙළඹවීම් සහ ත්‍යාග ගණන් ගන්නේ නැහැ.",["15.2"]],
[null,"warn","Corrupt practice (offering or taking anything of value to influence a public official) or fraudulent practice (misrepresentation, including collusion to fix bid prices) in competing for or executing the Contract is ground 15.2(g): termination with 14 days' notice.","Contract එක ලබාගැනීමට තරග කිරීමේදී හෝ ක්‍රියාත්මක කිරීමේදී දූෂිත ක්‍රියා (රජයේ නිලධාරියෙකුට බලපෑම් කිරීමට වටිනා දෙයක් දීම හෝ ගැනීම) හෝ වංචනික ක්‍රියා (bid මිල නියම කිරීමට collusion ඇතුළු වැරදි ලෙස ඉදිරිපත් කිරීම) 15.2(g) හේතුවයි: දින 14ක notice එකකින් termination.",["15.2"]],
[null,"know","At bid stage, the Employer rejects a bid if the bidder engaged in corrupt or fraudulent practices, and may declare the firm ineligible.","Bid අදියරේදී, bidder දූෂිත හෝ වංචනික ක්‍රියා වල යෙදුණා නම් Employer bid එක reject කරනවා, firm එක නුසුදුසු බව ප්‍රකාශ කරන්නත් පුළුවන්.",["ITB 3","ITB 32"]]]},

{i:"L6",c:"term",r:"C",x:1,t:["The Employer went bankrupt or into liquidation","Employer බංකොලොත් වුණා හෝ liquidation වලට ගියා"],
m:["If the Employer becomes bankrupt or insolvent (or a similar event occurs under the law), the Contractor may terminate immediately by notice.","Employer බංකොලොත් වුණොත් හෝ ණය ගෙවීමට නොහැකි වුණොත් (හෝ නීතිය යටතේ සමාන සිදුවීමක්), Contractor ට notice එකකින් වහාම terminate කරන්න පුළුවන්."],
s:[[null,"do","You may terminate immediately by notice to the Employer.","Employer ට notice එකකින් වහාම terminate කරන්න පුළුවන්.",["16.2(f)","16.2"]],
[null,"know","Then stop work and leave the Site under 16.3. You are entitled to the return of the Performance Security, payment under 20.6 and loss of profit or other loss.","ඉන් පසු 16.3 යටතේ වැඩ නවත්වලා Site එකෙන් ඉවත් වෙන්න. Performance Security එක ආපසු ගැනීමට, 20.6 යටතේ ගෙවීමට සහ ලාභ අහිමි වීම හෝ වෙනත් පාඩු ලබාගැනීමට ඔබට අයිතියක් තියෙනවා.",["16.3","16.4"]]]},

{i:"G1",c:"gen",r:"B",t:["How do we send a notice the right way?","Notice එකක් නිවැරදි විදිහට යවන්නේ කොහොමද?"],
m:["Many rights depend on notices. Under 1.3, notices, approvals, certificates, consents, determinations and requests must be in writing, delivered by hand, mail or courier against receipt, to the address in the Contract Data.","ගොඩක් අයිතිවාසිකම් notices මත රඳා පවතිනවා. 1.3 යටතේ notices, approvals, certificates, consents, determinations සහ requests ලිඛිතව, receipt එකක් එක්ක අතින්, තැපෑලෙන් හෝ courier මගින්, Contract Data එකේ address එකට යැවිය යුතුයි."],
s:[[null,"do","Make it in writing and deliver it by hand, mail or courier, against a receipt.","ලිඛිතව සකස් කරලා, receipt එකක් අරගෙන අතින්, තැපෑලෙන් හෝ courier මගින් භාර දෙන්න.",["1.3"]],
[null,"do","Send it to the recipient's address for communications in the Contract Data (or a new address they have notified). A request for approval may be answered to the address it came from.","Contract Data එකේ ලබන්නාගේ communications address එකට (හෝ ඔවුන් දන්වපු අලුත් address එකට) යවන්න. අනුමැතිය ඉල්ලන request එකකට, එය ආපු address එකට පිළිතුරු යවන්න පුළුවන්.",["1.3","CD 1.3"]],
[null,"know","'Written' includes electronically made documents that leave a permanent record, but the delivery methods listed in 1.3 are hand, mail or courier against receipt. Use email only as an extra copy.","'Written' කියන එකට ස්ථිර record එකක් ඉතිරි කරන electronic documents ඇතුළත්, හැබැයි 1.3 හි ලැයිස්තුගත delivery ක්‍රම receipt සහිතව අතින්, තැපෑලෙන් හෝ courier. Email අමතර copy එකක් ලෙස පමණක් භාවිත කරන්න.",["1.2","1.3"]],
[null,"do","When a notice goes to a Party, send a copy to the Engineer (or to the other Party, if it comes from the Engineer). Certificates issued to one Party are copied to the other. Approvals, certificates, consents and determinations must not be unreasonably withheld or delayed.","Notice එකක් Party එකකට යවද්දී Engineer ට copy එකක් යවන්න (Engineer ගෙන් නම්, අනෙක් Party ට). එක Party එකකට නිකුත් කරන certificates අනෙක් Party ටත් copy කරනවා. Approvals, certificates, consents සහ determinations අසාධාරණ ලෙස රඳවාගැනීම හෝ ප්‍රමාද කිරීම කරන්න බැහැ.",["1.3"]],
[null,"know","'Day' means a calendar day and 'Year' means 365 days. The Contract is governed by the laws of Sri Lanka, and its language is English.","'Day' කියන්නේ calendar day එකක්, 'Year' කියන්නේ දින 365. Contract එක ශ්‍රී ලංකා නීතිය යටතේ පාලනය වෙනවා, එහි භාෂාව English.",["1.1","1.4"]]]},

{i:"G2",c:"gen",r:"B",t:["We need a management meeting","Management meeting එකක් ඕනේ"],
m:["Either the Engineer or the Contractor's Representative may require the other to attend a management meeting to review arrangements for future work.","ඉදිරි වැඩ සඳහා සැලසුම් සමාලෝචනය කිරීමට management meeting එකකට පැමිණෙන්න කියලා Engineer ට හෝ Contractor's Representative ට අනෙකාගෙන් ඉල්ලන්න පුළුවන්."],
s:[[null,"know","The Engineer or the Contractor's Representative may require the other to attend a management meeting to review arrangements for future work.","ඉදිරි වැඩ සඳහා සැලසුම් සමාලෝචනය කරන්න management meeting එකකට පැමිණෙන්න කියලා Engineer ට හෝ Contractor's Representative ට අනෙකාගෙන් ඉල්ලන්න පුළුවන්.",["8.13"]],
[null,"know","The Engineer records the business of the meeting and gives copies to those attending and to the Employer.","Engineer meeting එකේ කටයුතු record කරලා පැමිණි අයට සහ Employer ට copies දෙනවා.",["8.13"]]]},

{i:"G3",c:"gen",r:"C",t:["Quality assurance system, methods and information for the Engineer","Quality assurance system, ක්‍රම සහ Engineer ට තොරතුරු"],
m:["You must run a quality assurance system that shows compliance with the Contract, explain your methods when asked, and give the Engineer information needed to verify compliance. None of this reduces your obligations.","Contract එකට අනුකූල බව පෙන්වන quality assurance system එකක් පවත්වන්න, ඉල්ලුවාම ඔබේ ක්‍රම පැහැදිලි කරන්න, අනුකූල බව තහවුරු කරන්න අවශ්‍ය තොරතුරු Engineer ට දෙන්න ඕනේ. මේ කිසිවක් ඔබේ වගකීම් අඩු කරන්නේ නැහැ."],
s:[[null,"do","Set up a quality assurance system as detailed in the Contract. The Engineer may audit any part of it. Before each design and execution stage, send the Engineer the procedures and compliance documents for information. Technical documents you issue must show your own prior approval.","Contract එකේ විස්තර කර ඇති පරිදි quality assurance system එකක් පිහිටුවන්න. එහි ඕනෑම කොටසක් audit කරන්න Engineer ට පුළුවන්. හැම design සහ execution අදියරකටම කලින්, procedures සහ compliance documents තොරතුරු සඳහා Engineer ට යවන්න. ඔබ නිකුත් කරන technical documents වල ඔබේම පූර්ව අනුමැතිය පෙනිය යුතුයි.",["4.17"]],
[null,"do","When the Engineer asks, submit details of your proposed arrangements and methods. Do not make significant changes to them without first notifying the Engineer. You are responsible for the adequacy, stability and safety of all Site operations and methods.","Engineer ඉල්ලුවාම ඔබේ යෝජිත සැලසුම් සහ ක්‍රම ගැන විස්තර දෙන්න. මුලින් Engineer ට දන්වන්නේ නැතිව ඒවායේ සැලකිය යුතු වෙනස්කම් කරන්න එපා. සියලු Site කටයුතු සහ ක්‍රම වල ප්‍රමාණවත්භාවය, ස්ථාවරත්වය සහ ආරක්ෂාව ඔබේ වගකීම.",["4.1"]],
[null,"do","Disclose confidential and other information the Engineer reasonably requires to verify your compliance with the Contract.","Contract එකට ඔබ අනුකූල බව තහවුරු කරන්න Engineer සාධාරණව ඉල්ලන රහසිගත සහ අනෙක් තොරතුරු දෙන්න.",["1.12"]]]},

{i:"G4",c:"gen",r:"C",t:["Royalties for materials from outside the Site, and disposing of excavated or surplus material","Site එකෙන් පිටත materials සඳහා royalties, සහ කපපු හෝ අමතර materials බැහැර කිරීම"],
m:["Unless the Specification says otherwise, you pay royalties, rents and other payments for natural materials from outside the Site and for disposing of demolition, excavation and surplus material.","Specification එකේ වෙනත් දෙයක් නැත්නම්, Site එකෙන් පිටත ස්වාභාවික materials සහ කඩා දැමීම්, කැණීම් සහ අමතර materials බැහැර කිරීම සඳහා royalties, කුලී සහ අනෙක් ගෙවීම් ඔබ ගෙවනවා."],
s:[[null,"know","You pay all royalties, rents and other payments for (a) natural Materials obtained from outside the Site, and (b) disposal of material from demolitions and excavations and other surplus material, except where disposal areas within the Site are specified in the Contract.","ඔබ සියලු royalties, කුලී සහ අනෙක් ගෙවීම් ගෙවනවා: (a) Site එකෙන් පිටතින් ලබාගන්නා ස්වාභාවික Materials, සහ (b) කඩා දැමීම් සහ කැණීම් වලින් එන materials සහ අනෙක් අමතර materials බැහැර කිරීම, Contract එකේ Site එක තුළ බැහැර කිරීමේ ප්‍රදේශ සඳහන් කර ඇති තැන් හැර.",["7.7"]]]},

{i:"G5",c:"gen",r:"C",t:["Getting permits and approvals","Permits සහ approvals ගැනීම"],
m:["You must comply with the Laws, give legal notices, pay taxes, duties and fees, and obtain the permits and approvals needed for the Works. The Employer should help where it can.","නීති පිළිපදින්න, නීතිමය notices දෙන්න, taxes, duties සහ fees ගෙවන්න, Works සඳහා අවශ්‍ය permits සහ approvals ලබාගන්න ඕනේ. හැකි තැන්වල Employer උදව් කළ යුතුයි."],
s:[[null,"do","Give all notices, pay all taxes, duties and fees, and obtain all permits, licences and approvals the Laws require for executing and completing the Works and remedying defects. You indemnify the Employer against the consequences of any failure.","Works කරලා ඉවර කිරීමට සහ defects හැදීමට නීතියෙන් අවශ්‍ය සියලු notices දෙන්න, සියලු taxes, duties සහ fees ගෙවන්න, සියලු permits, licences සහ approvals ලබාගන්න. ඕනෑම අසමත්කමක ප්‍රතිවිපාක වලින් ඔබ Employer ආරක්ෂා කරනවා.",["1.13"]],
[null,"do","Ask the Employer for reasonable assistance with permits, licences or approvals.","Permits, licences හෝ approvals සඳහා Employer ගෙන් සාධාරණ සහාය ඉල්ලන්න.",["2.2"]],
[null,"if","If a public authority delays you despite your diligent efforts, see D4 (8.5).","ඔබේ උනන්දු උත්සාහය තිබියදීත් රජයේ ආයතනයක් ඔබව ප්‍රමාද කළොත්, D4 (8.5) බලන්න.",["8.5"]]]},

{i:"G6",c:"gen",r:"B",x:1,t:["A Party wants to assign the contract, or a JV partner changes","Party එකකට contract එක assign කරන්න ඕනේ, නැත්නම් JV partner කෙනෙක් වෙනස් වෙනවා"],
m:["Neither Party may assign the Contract (or any benefit in it) without the other's prior agreement, except assigning money due to a bank as security. A JV may not change its composition or legal status without the Employer's prior consent.","අනෙක් Party ගේ පූර්ව එකඟතාවක් නැතිව කිසිම Party එකකට Contract එක (හෝ එහි ඕනෑම ප්‍රතිලාභයක්) assign කරන්න බැහැ, ලැබිය යුතු මුදල් bank එකකට ඇපයක් ලෙස assign කිරීම හැර. Employer ගේ පූර්ව අනුමැතිය නැතිව JV එකකට එහි සංයුතිය හෝ නීතිමය තත්ත්වය වෙනස් කරන්න බැහැ."],
s:[[null,"warn","Neither Party may assign the whole or any part of the Contract, or any benefit or interest in it, except (a) with the other Party's prior agreement, at that Party's sole discretion, or (b) as security to a bank or financial institution for money due or to become due.","කිසිම Party එකකට Contract එක සම්පූර්ණයෙන් හෝ කොටසක්, හෝ එහි ප්‍රතිලාභයක් හෝ අයිතියක් assign කරන්න බැහැ; හැර: (a) අනෙක් Party ගේ පූර්ව එකඟතාවෙන්, ඒ Party ගේ අභිමතය පරිදි, හෝ (b) ලැබිය යුතු හෝ ලැබෙන්න යන මුදල් සඳහා bank එකකට හෝ මූල්‍ය ආයතනයකට ඇපයක් ලෙස.",["1.7"]],
[null,"if","If the Employer breaches 1.7, the Contractor may terminate with 14 days' notice. If the Contractor assigns without agreement, the Employer may terminate.","Employer 1.7 උල්ලංඝනය කළොත්, Contractor ට දින 14ක notice එකකින් terminate කරන්න පුළුවන්. Contractor එකඟතාව නැතිව assign කළොත්, Employer ට terminate කරන්න පුළුවන්.",["16.2(d)","15.2(d)"]],
[null,"warn","A JV or consortium: its members are jointly and severally liable, must notify the Employer of their leader (who can bind all members), and may not change composition or legal status without the Employer's prior consent.","JV එකක් හෝ consortium එකක්: එහි සාමාජිකයන් එකට සහ තනි තනිව වගකියනවා, සියල්ලන් බැඳිය හැකි නායකයා Employer ට දැනුම් දිය යුතුයි, Employer ගේ පූර්ව අනුමැතිය නැතිව සංයුතිය හෝ නීතිමය තත්ත්වය වෙනස් කරන්න බැහැ.",["1.14"]]]},

{i:"G7",c:"gen",r:"B",x:1,t:["The Employer wants to use our drawings or design documents for another purpose","Employer අපේ drawings හෝ design documents වෙනත් අරමුණකට භාවිත කරන්න ඕනේ"],
m:["The Contractor keeps the copyright in its documents. The Employer gets a licence to use them only for completing, operating, maintaining, altering, repairing and demolishing these Works.","Contractor ගේ documents වල copyright Contractor ට අයිති. Employer ට ඒවා භාවිත කරන්න license එකක් ලැබෙන්නේ මේ Works ඉවර කිරීම, ක්‍රියාත්මක කිරීම, නඩත්තු කිරීම, වෙනස් කිරීම, අලුත්වැඩියා කිරීම සහ කඩා දැමීම සඳහා පමණයි."],
s:[[null,"know","As between the Parties, the Contractor keeps the copyright and other intellectual property in the Contractor's Documents and its design documents.","පාර්ශව අතර, Contractor's Documents සහ එහි design documents වල copyright සහ අනෙක් බුද්ධිමය දේපළ Contractor ට අයිති.",["1.10"]],
[null,"know","By signing, the Contractor gives the Employer a non-terminable, transferable, non-exclusive, royalty-free licence to copy, use and communicate them (including modifications) for completing, operating, maintaining, altering, adjusting, repairing and demolishing the Works, for their working life.","Sign කිරීමෙන්, Works ඉවර කිරීම, ක්‍රියාත්මක කිරීම, නඩත්තු කිරීම, වෙනස් කිරීම, සීරුමාරු කිරීම, අලුත්වැඩියා කිරීම සහ කඩා දැමීම සඳහා, ඒවායේ ආයු කාලය පුරා, ඒවා (වෙනස්කම් ඇතුළුව) copy, use සහ communicate කරන්න Contractor, Employer ට අවලංගු කළ නොහැකි, පැවරිය හැකි, non-exclusive, royalty-free license එකක් දෙනවා.",["1.10"]],
[null,"warn","The Employer may not use, copy or give them to a third party for other purposes without the Contractor's consent. In the same way, the Contractor may use the Employer's documents only for the Contract.","Contractor ගේ අනුමැතිය නැතිව වෙනත් අරමුණු සඳහා Employer ට ඒවා භාවිත කරන්න, copy කරන්න හෝ තෙවන පාර්ශවයකට දෙන්න බැහැ. එලෙසම, Employer ගේ documents Contractor ට භාවිත කරන්න පුළුවන් Contract එක සඳහා පමණයි.",["1.10","1.11"]]]},

{i:"G8",c:"gen",r:"C",t:["Documents to keep on Site, and parts the Contractor designs","Site එකේ තියාගන්න ඕනේ documents, සහ Contractor design කරන කොටස්"],
m:["Keep a full set of contract papers on Site for the Employer's Personnel to see. If the Contract makes you design part of the Permanent Works, that part must be fit for its specified purpose and fully documented.","Employer's Personnel ට බලන්න පුළුවන් වෙන්න Contract documents වල සම්පූර්ණ set එකක් Site එකේ තියාගන්න. Permanent Works කොටසක් design කරන්න Contract එක ඔබට පවරනවා නම්, ඒ කොටස එහි සඳහන් අරමුණට ගැළපෙන සහ සම්පූර්ණයෙන් documented විය යුතුයි."],
s:[[null,"do","Keep on Site a copy of the Contract, the publications named in the Specification, the Contractor's Documents, the Drawings, Variations and other communications. The Employer's Personnel may see them at all reasonable times. Unless stated otherwise, give the Engineer six copies of each Contractor's Document.","Site එකේ Contract එකේ copy එකක්, Specification එකේ නම් කළ ප්‍රකාශන, Contractor's Documents, Drawings, Variations සහ අනෙක් communications තියාගන්න. Employer's Personnel ට සාධාරණ ඕනෑම වෙලාවක ඒවා බලන්න පුළුවන්. වෙනත් දෙයක් නැත්නම්, හැම Contractor's Document එකකම copies හයක් Engineer ට දෙන්න.",["1.8"]],
[null,"warn","If you design part of the Permanent Works: submit the Contractor's Documents as the Contract requires, in English and consistent with the Specification and Drawings; that part must be fit for its specified purpose; and before the Tests on Completion, submit as-built documents and operation and maintenance manuals. Until then, that part is not complete for taking-over.","ඔබ Permanent Works කොටසක් design කරනවා නම්: Contract එකේ අවශ්‍ය පරිදි, English වලින්, Specification සහ Drawings වලට අනුකූලව Contractor's Documents ඉදිරිපත් කරන්න; ඒ කොටස එහි සඳහන් අරමුණට ගැළපිය යුතුයි; Tests on Completion වලට කලින් as-built documents සහ operation සහ maintenance manuals ඉදිරිපත් කරන්න. එතෙක් ඒ කොටස taking-over සඳහා ඉවර වී නැහැ.",["4.1"]]]},

{i:"Z0",c:"gen",r:"B",t:["My problem is not on the list","මගේ ගැටලුව list එකේ නැහැ"],
m:["No list can cover every case. These basic steps under SBD/02 protect your position in almost any situation.","කිසිම ලැයිස්තුවකට හැම අවස්ථාවක්ම ආවරණය කරන්න බැහැ. SBD/02 යටතේ මේ මූලික පියවර ඕනෑම අවස්ථාවක වාගේ ඔබේ ස්ථාවරය ආරක්ෂා කරනවා."],
s:[[null,"do","1) If the Engineer tells you to do something, get it in writing. If it changes the Works, it is a Variation.","1) Engineer යමක් කරන්න කිව්වොත් ලිඛිතව ගන්න. එය Works වෙනස් කරනවා නම් Variation එකක්.",["3.3","13.1"]],
[null,"do","2) If you see a likely future event that may affect the work, the price or completion, warn the Engineer promptly.","2) වැඩට, මිලට හෝ completion එකට බලපාන්න පුළුවන් අනාගත සිදුවීමක් පෙනුණොත්, ඉක්මනින් Engineer ට අනතුරු අඟවන්න.",["8.3"]],
[null,"warn","3) If you want more time or money: send a claim notice within 28 days after becoming aware and a detailed claim within 84 days (19.1), and keep contemporary records.","3) වැඩි කාලයක් හෝ මුදල් ඕනේ නම්: දැනගත් පසු දින 28ක් ඇතුළත claim notice එකක්, දින 84ක් ඇතුළත සවිස්තර claim එකක් (19.1) යවන්න, ඒ කාලයේම records තියාගන්න.",["19.1"]],
[null,"know","4) If documents disagree, use the priority order in 1.5 and ask the Engineer for a clarification.","4) Documents එකිනෙකට නොගැළපේ නම්, 1.5 හි ප්‍රමුඛතා අනුපිළිවෙල භාවිත කරලා Engineer ගෙන් clarification එකක් ඉල්ලන්න.",["1.5"]],
[null,"if","5) If you cannot agree: Engineer's determination (3.4), then adjudication (or DAB), then arbitration.","5) එකඟ වෙන්න බැරි නම්: Engineer ගේ determination (3.4), පසුව adjudication (හෝ DAB), පසුව arbitration.",["3.4","19.2"]],
[null,"do","6) Send notices correctly (G1), check your Contract Data and any special conditions, and get advice from a senior QS or lawyer.","6) Notices නිවැරදිව යවන්න (G1), ඔබේ Contract Data සහ විශේෂ කොන්දේසි බලන්න, senior QS කෙනෙකුගෙන් හෝ lawyer කෙනෙකුගෙන් උපදෙස් ගන්න.",["1.3"]]]}
];

k3:["Last day to sign the Contract Agreement (unless otherwise agreed)","Contract Agreement එක sign කරන්න අවසාන දිනය (වෙනත් එකඟතාවක් නැත්නම්)"],

k4b:["Last day to submit your proposed Contractor's Representative for consent (if not named in the Contract)","යෝජිත Contractor's Representative අනුමැතියට ඉදිරිපත් කරන්න අවසාන දිනය (Contract එකේ නම් කර නැත්නම්)"],
k4c:["Last day to submit the detailed programme (14 days after receiving the commencement notice)","සවිස්තර programme එක දෙන්න අවසාන දිනය (commencement notice එක ලැබී දින 14)"],
k5:["Last day to submit the lump-sum breakdown","Lump-sum breakdown එක දෙන්න අවසාන දිනය"],
k6a:["Last day to agree the Adjudicator (after this, either Party may ask ICTAD)","Adjudicator ගැන එකඟ වෙන්න අවසාන දිනය (ඉන් පසු ඕනෑම Party එකකට ICTAD ගෙන් ඉල්ලන්න පුළුවන්)"],
k6b:["Last day to appoint the DAB members and agree the chairman","DAB members පත් කරලා chairman ගැන එකඟ වෙන්න අවසාන දිනය"],
k6c:["First monthly progress report due (our reading: covering to the end of the first full calendar month after the Commencement Date, submitted within 7 days)","පළමු මාසික progress report එක (අපේ අර්ථ නිරූපණය: Commencement Date එකෙන් පසු පළමු සම්පූර්ණ calendar මාසය අවසානය දක්වා, දින 7ක් ඇතුළත)"],
k7:["Time for Completion ends, before any extension of time (counted from the Commencement Date)","Time for Completion අවසානය, extension of time එකකට කලින් (Commencement Date එකේ සිට ගණන් කරලා)"],
k8:["Earliest day to apply for the Taking-Over Certificate, if you finish on the last day of the Time for Completion","Time for Completion අවසාන දිනයේ ඉවර කරනවා නම්, Taking-Over Certificate එකට apply කළ හැකි මුල්ම දිනය"],
k9:["Defects Notification Period ends, if the completion date in the TOC is the last day of the Time for Completion","TOC එකේ completion දිනය Time for Completion අවසාන දිනය නම්, Defects Notification Period අවසානය"],
k10:["Performance Certificate due (28 days after the Defects Notification Period ends)","Performance Certificate එක ලැබිය යුතුයි (Defects Notification Period අවසානයෙන් දින 28)"],
dS:["Key contract dates worked out from the Project tab, using SBD/02 General Conditions periods. The Contract Data of your contract may change them. Extensions of time move the completion and later dates.","SBD/02 General Conditions කාල සීමා භාවිත කරලා Project tab එකෙන් ගණනය කළ ප්‍රධාන contract දිනයන්. ඔබේ contract එකේ Contract Data එකෙන් මේවා වෙනස් විය හැකියි. Extensions of time මගින් completion සහ පසු දිනයන් වෙනස් වෙනවා."],
dM:["Every month: after the month ends, send 3 copies of the Statement (14.3); the progress report in 2 copies within 7 days after the month ends (4.14); and personnel and equipment records (6.9). The Engineer need not issue an IPC below the minimum amount in the Contract Data (14.5).","හැම මාසෙම: මාසය ඉවර වුණාම Statement copies 3ක් (14.3); මාසය ඉවර වී දින 7ක් ඇතුළත progress report copies 2ක් (4.14); සහ personnel සහ equipment records (6.9) යවන්න. Contract Data එකේ minimum amount එකට අඩු IPC එකක් නිකුත් කරන්න Engineer ට අවශ්‍ය නැහැ (14.5)."],
pNotice:["Date we received the Engineer's notice of the Commencement Date (optional, for the programme deadline)","Engineer ගේ Commencement Date notice එක ලැබුණු දිනය (අත්‍යවශ්‍ය නැහැ, programme deadline එකට)"],
pWarn1:["The Commencement Date is before the LOA date. Please check the dates.","Commencement Date එක LOA දිනයට කලින්. දිනයන් check කරන්න."],
pWarn2:["Time for Completion and Defects Notification Period must be whole numbers of days above zero.","Time for Completion සහ Defects Notification Period බිංදුවට වැඩි පූර්ණ දින ගණන් විය යුතුයි."],
pBigN:["Check your Contract Data: a DAB applies only if it contains the DAB provisions (1.1.2.9, 19.2 to 19.7). The SBD footnotes describe these contracts as 'more than' and also 'equal or exceeding' LKR 500 million.","ඔබේ Contract Data එක check කරන්න: DAB එකක් අදාළ වන්නේ එහි DAB නියමයන් (1.1.2.9, 19.2 සිට 19.7) ඇතුළත් නම් පමණයි. SBD footnotes වල මේ contracts ගැන LKR මිලියන 500 'more than' සහ 'equal or exceeding' ලෙස දෙයාකාරයට කියනවා."],
disc:["This is a guide based on the General Conditions of ICTAD/SBD/02 (Second Edition, January 2007). It is not legal advice. The Contract Data (Section 4) and any special amendments in your contract come first, so check their periods and percentages. Check the original document, and ask a senior QS or lawyer before important decisions.","මෙය ICTAD/SBD/02 (Second Edition, January 2007) General Conditions මත පදනම් වූ මාර්ගෝපදේශයක් පමණයි; නීති උපදෙසක් නොවේ. ඔබේ contract එකේ Contract Data (Section 4) සහ විශේෂ සංශෝධන මුලින්ම අදාළයි, ඒ නිසා ඒවායේ කාල සීමා සහ ප්‍රතිශත check කරන්න. වැදගත් තීරණ වලට පෙර මුල් document එක පරීක්ෂා කර senior QS කෙනෙකුගෙන් හෝ lawyer කෙනෙකුගෙන් අහන්න."],

function dayDiff(d){return Math.round((d.getTime()-today())/864e5)}

function badge(d,kind){const x=dayDiff(d);
 if(kind==="L"){if(x>0)return{c:"f",s:L==="en"?dayWord(x)+" left":dayWord(x)+"ක් ඉතිරියි"};if(x===0)return{c:"p",s:L==="en"?"Last day is today":"අවසාන දිනය අදයි"};return{c:"p",s:L==="en"?"Missed "+dayWord(-x)+" ago":dayWord(-x)+"කට පෙර ඉකුත් විය"}}

 if(e.q){h+=`<p class="sec">${t("chk")}</p><div class="card">`+e.q.map((q,k)=>{const a=S.ans[e.i+k]||"";const note=a==="y"?tx([q[2],q[3]]):a==="n"?tx([q[4],q[5]]):"";const cls=note?"bad":"good";return`<div style="margin-bottom:12px"><p style="margin:0 0 6px">${esc(tx([q[0],q[1]]))}</p><div class="seg" style="max-width:220px"><button class="${a==="y"?"on":""}" data-a="ans" data-k="${k}" data-v="y">${t("yes")}</button><button class="${a==="n"?"on":""}" data-a="ans" data-k="${k}" data-v="n">${t("no")}</button></div>${a?`<div class="warn ${cls}">${esc(note||t("okx"))}</div>`:""}</div>`}).join("")+`</div>`}

/* Calculators (CMD 5). State is kept per event (S.calc[eventId]) so values do not leak between situations. */
function addMonths(a,m){const y=a.getUTCFullYear(),mo=a.getUTCMonth()+m;const last=new Date(Date.UTC(y,mo+1,0)).getUTCDate();return new Date(Date.UTC(y,mo,Math.min(a.getUTCDate(),last)))}
function monthsBetween(a,b){let m=(b.getUTCFullYear()-a.getUTCFullYear())*12+(b.getUTCMonth()-a.getUTCMonth());let x=addMonths(a,m);if(x>b){m--;x=addMonths(a,m)}return{m,rest:Math.round((b-x)/864e5)}}
function finCharge(A,cbRate,due,paid){const i=(cbRate+1)/100;const mb=monthsBetween(due,paid);const tot=A*Math.pow(1+i/12,mb.m)*(1+i*mb.rest/365);return{v:tot-A,m:mb.m,rest:mb.rest,days:Math.round((paid-due)/864e5),rate:i*100}}
function ldCalc(icp,rate,maxp,days){let v=icp*rate/100*days;const mx=maxp>0?icp*maxp/100:Infinity;return{v:Math.min(v,mx),cap:v>mx}}
function q25Calc(bq,mq,rt,icp){const ch=Math.abs(mq-bq)/bq*100;const p=Math.abs(mq-bq)*rt/icp*100;return{ch,p,ok:ch>25&&p>1}}
function pfCalc(V,Vna,rows){let sp=0,sum=0,bad=false;rows.forEach(w=>{if(w.p!==""&&w.o!==""&&w.n!==""){if(+w.o<=0)bad=true;else{sp+=+w.p;sum+=+w.p*(w.n-w.o)/w.o}}});return{F:0.966*(V-Vna)/100*sum,sp,bad}}
const money=v=>"Rs. "+Math.round(v).toLocaleString("en-US");
function calcUI(k){const c=S.calc[S.ev]||(S.calc[S.ev]={});
 const f=(key,l,ty)=>`<div class="inp" style="margin-bottom:8px"><label for="c_${key}">${t(l)}</label><input id="c_${key}" type="${ty||"number"}" ${ty?"":'step="any" min="0"'} data-a="cv" data-k="${key}" value="${esc(c[key]??"")}"></div>`;
 const num=x=>x!==undefined&&x!==""&&!isNaN(+x);let out="",r="";
 if(k==="fin"){out=f("amt","c_amt")+f("rate","c_rate")+f("due","c_due","date")+f("paid","c_paid","date");
  if(num(c.amt)&&num(c.rate)&&c.due&&c.paid){const d1=new Date(c.due+"T00:00:00Z"),d2=new Date(c.paid+"T00:00:00Z");
   if(d2<=d1)r=`<div class="warn">${t("c_noLate")}</div>`;else{const x=finCharge(+c.amt,+c.rate,d1,d2);r=`${t("c_fin")} <b style="font-weight:600">${money(x.v)}</b><p class="note" style="margin:4px 0 0">${x.days} ${t("c_dl")} = ${x.m} ${t("c_mo")} + ${x.rest} ${t("c_dy")} · ${x.rate.toFixed(2)}% ${t("c_pa")}</p>`}}
  out+=`<p class="note" style="margin:0 0 6px">${t("c_finH")}</p>`}
 if(k==="ld"){out=f("icp","c_icp")+f("ldr","c_ldr")+f("ldm","c_ldm");const a=S.dates[S.ev+"a"],b=S.dates[S.ev+"b"];
  if(num(c.icp)&&num(c.ldr)&&a&&b){const n=Math.round((new Date(b)-new Date(a))/864e5);
   if(n<=0)r=`<div class="warn good">${t("c_noLD")}</div>`;else{const x=ldCalc(+c.icp,+c.ldr,num(c.ldm)?+c.ldm:0,n);r=`${n} ${t("c_late")} → LD = <b style="font-weight:600">${money(x.v)}</b> ${x.cap?t("c_cap"):""}`}}else r=`<span class="note">${t("c_ldn")}</span>`;
  out+=`<p class="note" style="margin:0 0 6px">${t("c_ldH")}</p>`}
 if(k==="q25"){out=f("bq","c_bq")+f("mq","c_mq")+f("rt","c_rt")+f("icp","c_icp");
  if(num(c.bq)&&num(c.mq)&&num(c.rt)&&num(c.icp)){if(+c.bq<=0||+c.icp<=0)r=`<div class="warn">${t("c_pos")}</div>`;else{const x=q25Calc(+c.bq,+c.mq,+c.rt,+c.icp);r=`${t("c_ch")}: ${x.ch.toFixed(2)}% ${x.ch>25?"✓":"✗"} (&gt; 25%)<br>${t("c_val")}: ${x.p.toFixed(3)}% ${x.p>1?"✓":"✗"} (&gt; 1%)<div class="warn ${x.ok?"good":"bad"}">${x.ok?t("c_ok"):t("c_nok")}</div>`}}
  out+=`<p class="note" style="margin:0 0 6px">${t("c_q25H")}</p>`}
 if(k==="pf"){out=f("V","c_V")+f("Vn","c_Vn");const rows=c.rows||(c.rows=[{p:"",o:"",n:""}]);
  out+=`<div class="scroll"><table><tr><th>${t("c_Px")}</th><th>${t("c_Io")}</th><th>${t("c_Ic")}</th></tr>`+rows.map((w,i)=>`<tr>${["p","o","n"].map(x=>`<td><input id="pr_${i}_${x}" aria-label="${x==="p"?"Px":x==="o"?"Base index":"Current index"}" type="number" step="any" data-a="pr" data-k="${i}" data-f="${x}" value="${esc(w[x])}" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card)"></td>`).join("")}</tr>`).join("")+`</table></div><button class="btn" data-a="addrow" style="margin:8px 0">+ ${t("c_add")}</button>`;
  if(num(c.V)){const x=pfCalc(+c.V,num(c.Vn)?+c.Vn:0,rows);
   if(x.bad)r=`<div class="warn bad">${t("c_idx0")}</div>`;else if(x.sp>0){r=`F = <b style="font-weight:600">${money(x.F)}</b> ${x.F<0?t("c_ded"):t("c_addF")}`+(Math.abs(x.sp-90)>0.001?`<div class="warn bad">${t("c_sum")} ${x.sp.toFixed(2)} – ${t("c_90")}</div>`:`<p class="note" style="margin:4px 0 0">${t("c_sum")} 90 ✓</p>`)}}
  out+=`<p class="note" style="margin:0 0 6px">${t("c_pfH")}</p>`}
 return out+`<div id="calcres" style="margin-top:6px">${r}</div>`}
function updCalc(){const e=EVI[S.ev];const box=$("#calcres");if(!e||!e.calc||!box)return;const tmp=document.createElement("div");tmp.innerHTML=calcUI(e.calc);const r=tmp.querySelector("#calcres");if(r)box.innerHTML=r.innerHTML}

/* Deadlines (CMD 15). Each item: [date, text, chips, kind]. Kinds as in ENG-1: L last day, F from, O on. */
function pInt(v){return /^\d+$/.test(String(v||"").trim())&&+v>0}
function projDates(){const X=[];const a=P.loa,c=P.comm,nt=P.notice;const add=(iso,n,k,cl,kind)=>{if(iso)X.push([addD(iso,n),t(k),cl,kind])};
 add(a,14,"k1",["4.2","CD 4.2","ITB 35"],"L");add(a,14,"k1b",["18.1","18.2","18.3","CD 18.2"],"L");add(a,14,"k2",["2.1","CD 2.1"],"O");add(a,14,"k3b",["8.1"],"O");add(a,28,"k3",["1.6"],"L");
 add(c,0,"k4",["8.1"],"O");add(c,-1,"k4b",["4.3"],"L");add(nt,14,"k4c",["8.3"],"L");add(c,28,"k5",["14.1(d)"],"L");
 add(c,28,P.big==="yes"?"k6b":"k6a",P.big==="yes"?["CD 19.2","CD 1.1.2.9"]:["ITB 37","19.3"],"L");
 if(c){const d=new Date(c+"T00:00:00Z");const end=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+2,0));X.push([addD(end.toISOString().slice(0,10),7),t("k6c"),["4.14"],"L"])}
 if(c&&pInt(P.tfc)){const n=+P.tfc;add(c,n,"k7",["8.2","CD 1.1.3.3","8.7","CD 8.7"],"L");add(c,n-14,"k8",["10.1"],"F");
  if(pInt(P.dnp)){add(c,n+(+P.dnp),"k9",["11.1","CD 1.1.3.7"],"O");add(c,n+(+P.dnp)+28,"k10",["11.8"],"L")}}
 return X.sort((x,y)=>x[0]-y[0])}
function projWarn(){const w=[];if(P.loa&&P.comm&&P.comm<P.loa)w.push(t("pWarn1"));if((P.tfc&&!pInt(P.tfc))||(P.dnp&&!pInt(P.dnp)))w.push(t("pWarn2"));return w}
function vDates(){const X=projDates();let h=`<div style="margin:18px 0 10px"><h1>${t("dT")}</h1><p class="note" style="margin:6px 0 0">${t("dS")}</p></div>`+projWarn().map(x=>`<div class="warn bad" style="margin-bottom:8px">${esc(x)}</div>`).join("");
 if(!X.length)return h+`<div class="card"><p style="margin:0 0 10px">${t("dE")}</p><button class="btn pri" data-a="go" data-v="proj">${t("dBtn")}</button></div>`;
 return h+`<div class="card" style="padding-left:18px">`+X.map((x,n)=>`<div class="st ${markCls(x[0],x[3])}"><span class="num">${n+1}</span><div class="head">${dateHTML(x[0],x[3])}</div><p style="margin:4px 0 6px">${esc(x[1])}</p>${chips(x[2])}<div class="cx"></div></div>`).join("")+`<p class="note" style="margin:4px 0 0">${t("calNote")}</p></div><p class="foot">${t("dM")}</p>`}
function vProj(){const f=(k,l,ty)=>`<div class="inp" style="margin-bottom:10px"><label for="p_${k}">${t(l)}</label><input id="p_${k}" type="${ty}" ${ty==="number"?'min="1" step="1"':''} data-a="pv" data-k="${k}" value="${esc(P[k]||"")}"></div>`;
 return`<div style="margin:18px 0 10px"><h1>${t("pT")}</h1><p class="note" style="margin:6px 0 0">${t("pS")}</p></div><div id="pwarn">`+projWarn().map(x=>`<div class="warn bad" style="margin-bottom:8px">${esc(x)}</div>`).join("")+`</div><div class="card">${f("loa","pLoa","date")}${f("comm","pCom","date")}${f("notice","pNotice","date")}${f("tfc","pTfc","number")}${f("dnp","pDnp","number")}
 <div class="inp"><label for="p_big">${t("pBig")}</label><select id="p_big" data-a="pv" data-k="big"><option value="no"${P.big!=="yes"?" selected":""}>${t("pNo")}</option><option value="yes"${P.big==="yes"?" selected":""}>${t("pYes")}</option></select><p class="note" style="margin:6px 0 0">${t("pBigN")}</p></div></div>
 <button class="btn pri" data-a="go" data-v="dates" style="margin-top:12px">${t("pBtn")}</button>
 <div class="card about"><p class="note" style="margin:0">SBD/02 Site Action Guide</p><h2>${t("aboutT")}</h2><p>${t("aboutD")}</p><a class="abadge" href="${AUTHOR_URL}" target="_blank" rel="noopener noreferrer"><span class="dot" aria-hidden="true">in</span>${t("aboutBtn")}</a></div>`}

 document.documentElement.lang=L;

/* Letter engine (CMD 4). New format: e.n = {f:"C"|"E"|"EN", to:"C"|"E"|"EN", cl:["16.1"], sub:"...", b:["paragraph",...], from:"a+15" (earliest send), by:"a+28" (last day)}
   Legacy format [to, subject, body] is converted without adding any clause or entitlement text that is not in the body. */
const PN={C:"Contractor",E:"Employer",EN:"Engineer"};
function letterOf(e){const n=e.n;if(!n)return null;if(!Array.isArray(n))return Object.assign({f:"C",cl:[],b:[]},n);
 const to=n[0]==="Engineer"?"EN":n[0]==="Employer"?"E":"C";const cl=[...new Set(((n[1]+" "+n[2]).match(/Sub-Clause \d+\.\d+/g)||[]).map(x=>x.replace("Sub-Clause ","")))];
 return{f:"C",to,cl,sub:n[1],b:[n[2]]}}
function copyOf(l){if(l.f==="C"&&l.to==="E")return["Engineer","lCopyR"];if((l.f==="EN"||l.f==="E")&&l.to==="C")return[l.f==="EN"?"Employer":"Engineer","lCopyE"];if(l.f==="C"&&l.to==="EN")return["Employer","lCopyO"];return[null,null]}
function letterText(l,d){const cp=copyOf(l);const sign={C:"Contractor's Representative",E:"For and on behalf of the Employer",EN:"The Engineer"}[l.f];
 return`[${PN[l.f]}'s letterhead]\nRef: ______        Date: ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}\n\nTo: The ${PN[l.to]}\n[address for communications in the Contract Data]\n\nContract: ______________________ (Contract No. ______)\n\nSubject: ${l.sub}\nSub-Clause(s): ${l.cl.length?l.cl.join(", "):"__"}\n\nDear Sir/Madam,\n\n${l.b.join("\n\n")}\n\nThis notice is given without limiting our other rights under the Contract.\n\nYours faithfully,\n\n______________________\n${sign}${cp[0]?`\n\nCopy: The ${cp[0]}`:""}`}
function sendWindow(l){const r={};if(l.from){const p=parseSpec(l.from);const v=p&&S.dates[S.ev+p.k];r.from=v?addD(v,p.n):"need"}if(l.by){const p=parseSpec(l.by);const v=p&&S.dates[S.ev+p.k];r.by=v?addD(v,p.n):"need"}return r}
function tpl(){const e=EVI[S.ev];const l=letterOf(e);if(!l)return;const now=new Date();const w=sendWindow(l);const td=today();let warn="";
 if(w.from==="need"||w.by==="need")warn=`<div class="warn">${t("lNeed")}</div>`;
 else{if(w.from&&w.from.getTime()>td)warn+=`<div class="warn bad">${t("lEarly")} <b>${fmt(w.from)}</b></div>`;
  if(w.by&&w.by.getTime()<td)warn+=`<div class="warn bad">${t("lLate")} <b>${fmt(w.by)}</b>. ${t("lLate2")}</div>`;
  if((w.from||w.by)&&!warn)warn=`<div class="warn good">${t("lWin")} ${w.from?fmt(w.from):"…"} → ${w.by?fmt(w.by):"…"}</div>`}
 const cp=copyOf(l);
 $("#tpl").innerHTML=`${warn}<p class="note" style="margin:10px 0 6px">${t("tplN")}${l.cl.length?"":" "+t("lCl")}</p><textarea id="tt" aria-label="Letter">${esc(letterText(l,now))}</textarea><button class="btn" data-a="copy" style="margin-top:8px">${t("copy")}</button><p class="note" style="margin:10px 0 0">${t("lDel")}</p>${cp[1]?`<p class="note" style="margin:6px 0 0">${t(cp[1])}</p>`:""}`}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="go"){S.v=b.dataset.v;R();scrollTo(0,0)}
 else if(a==="cat"){S.cat=b.dataset.c;S.v="cat";R();scrollTo(0,0)}
 else if(a==="ev"){S.ev=b.dataset.i;S.cat=EVI[S.ev].c;S.v="ev";R();scrollTo(0,0)}
 else if(a==="back"){S.v="cat";R();scrollTo(0,0)}
 else if(a==="role"){S.role=b.dataset.r;R()}
 else if(a==="lang"){L=b.dataset.l;try{localStorage.setItem("sbd02-lang",L)}catch(e){}R()}
 else if(a==="ans"){S.ans[S.ev+b.dataset.k]=b.dataset.v;R()}
 else if(a==="clause"){const c=b.dataset.c;const box=b.parentElement.querySelector(".cx");const u=(USE[c]||[]).filter(i=>i!==S.ev);
  const html=`<div class="warn" style="background:var(--off)"><b style="font-weight:600">${c}</b> · ${esc(TXT[c]||"")}${u.length?`<br><span class="note">${t("alsoIn")}</span> `+u.slice(0,8).map(i=>`<button class="chip" style="background:transparent;border:1px solid var(--line);color:var(--ink);font-family:var(--f);font-weight:400;font-size:12px" data-a="ev" data-i="${i}">${i}</button>`).join(""):""}</div>`;
