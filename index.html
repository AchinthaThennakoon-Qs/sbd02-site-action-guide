{i:"U2",c:"susp",r:"C",t:["We want to stop work because we are not being paid","ගෙවීම් නැති නිසා අපිට වැඩ නතර කරන්න ඕනේ"],
m:["You may stop or slow down work for non-payment, but only after a 56-day notice. The full steps are in the payment situations.","ගෙවීම් නැති නිසා වැඩ නතර කරන්න හෝ අඩු කරන්න පුළුවන්, හැබැයි දින 56ක notice එකකින් පසු පමණයි. සම්පූර්ණ පියවර payment අවස්ථා වල තියෙනවා."],
s:[[null,"do","See P1 (IPC not paid) or P2 (IPC not issued) in the Payments section for all the steps and dates.","සියලු පියවර සහ දිනයන් සඳහා Payments කොටසේ P1 (IPC නොගෙවීම) හෝ P2 (IPC නිකුත් නොකිරීම) බලන්න.",["16.1","14.5","14.6"]]],
e:"ECP"},

{i:"R1",c:"risk",r:"C",t:["The works were damaged by an Employer's risk (war, riot, Employer's design error, etc.)","Employer's risk එකක් (යුද්ධය, කලබල, Employer ගේ design වැරැද්ද, ආදිය) නිසා works වලට හානි වුණා"],
m:["Some risks belong to the Employer, not you. If one of them damages the works, you repair it as the Engineer asks, and you get time and cost (and profit in some cases).","සමහර අවදානම් ඔබට නොව Employer ට අයිති. ඒවායින් එකක් works වලට හානි කළොත්, Engineer ඉල්ලන විදිහට ඔබ හදනවා, කාලය සහ වියදම (සමහර අවස්ථාවල profit ත්) ලැබෙනවා."],
d:[["a","Date we knew about the damage","හානිය ගැන දැනගත් දිනය"]],
q:[["Was it caused by the Employer using part of the works, or by a design the Employer is responsible for?","ඒකට හේතුව Employer works කොටසක් භාවිත කිරීමද, නැත්නම් Employer වගකියන design එකක්ද?","You also get profit on the cost.","වියදමට අමතරව profit ත් ලැබෙනවා.","",""]],
s:[[null,"know","Employer's risks are: war, terrorism, rebellion, riots by others, radiation or explosives, pressure waves from aircraft, the Employer's use of the works, the Employer's design, and forces of nature that could not be expected.","Employer's risks: යුද්ධය, ත්‍රස්තවාදය, කැරලි, අනුන්ගේ කලබල, radiation හෝ explosives, ගුවන් යානා නිසා ඇති වන pressure waves, Employer works භාවිත කිරීම, Employer ගේ design, සහ අපේක්ෂා කළ නොහැකි ස්වාභාවික බලවේග.",["17.3"]],
["a","do","Tell the Engineer straight away, and repair the damage as far as the Engineer requires.","වහාම Engineer ට කියලා, Engineer ඉල්ලන ප්‍රමාණයට හානිය හදන්න.",["17.4"]],
["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["17.4","19.1"]],
["a+84","do","Send the full claim: extra time and cost (plus profit for the Employer's use or design).","සම්පූර්ණ claim එක යවන්න: අමතර කාලය සහ වියදම (Employer ගේ භාවිතය හෝ design නම් profit ත්).",["17.4","19.1"]]],

{i:"R2",c:"risk",r:"B",t:["A Force Majeure event happened (war, terrorism, riot, disaster)","Force Majeure සිදුවීමක් වුණා (යුද්ධය, ත්‍රස්තවාදය, කලබල, ව්‍යසනය)"],
m:["Force Majeure is a very unusual event that nobody controls or could prevent. It excuses the affected side from its duties for as long as it lasts. It never excuses payments.","Force Majeure කියන්නේ කාටවත් පාලනය කරන්න හෝ වළක්වන්න බැරි ඉතා අසාමාන්‍ය සිදුවීමක්. එය පවතින කාලය තුළ බලපෑමට ලක් වූ පාර්ශවය තම වගකීම් වලින් නිදහස් කරනවා. ගෙවීම් වලින් කවදාවත් නිදහස් කරන්නේ නැහැ."],
d:[["a","Date we knew about the event","සිදුවීම ගැන දැනගත් දිනය"]],
q:[["Is it beyond anyone's control, could not be planned for before the contract, could not be avoided, and was not caused by the other side?","එය කාගේවත් පාලනයෙන් පිටත, contract එකට කලින් සැලසුම් කළ නොහැකි, වළක්වා ගත නොහැකි, සහ අනෙක් පාර්ශවය නිසා නොවූ දෙයක්ද?","","","All four must be true. If not, it is not Force Majeure.","හතරම සත්‍ය විය යුතුයි. නැත්නම් එය Force Majeure නොවේ."],["Is it a natural disaster (earthquake, cyclone, volcano)?","එය ස්වාභාවික ව්‍යසනයක්ද (භූමිකම්පා, සුළි සුළං, ගිනිකඳු)?","You get extra time only, not money.","ලැබෙන්නේ අමතර කාලය පමණයි, මුදල් නොවේ.","",""]],
s:[["a+14","warn","Last day to tell the other side what happened and which duties you cannot perform.","සිදු වූ දේ සහ ඉටු කරන්න බැරි වගකීම් මොනවද කියලා අනෙක් පාර්ශවයට කියන්න අවසාන දිනය.",["20.2"]],
[null,"do","Do everything reasonable to reduce the delay. Tell the other side when the event is over. Payments are never excused.","ප්‍රමාදය අඩු කරන්න සාධාරණ සියල්ල කරන්න. සිදුවීම ඉවර වුණාම අනෙක් පාර්ශවයට කියන්න. ගෙවීම් කවදාවත් නිදහස් වෙන්නේ නැහැ.",["20.3","20.2"]],
["a+28","warn","Last day to send your claim notice.","Claim notice එක යවන්න අවසාන දිනය.",["19.1"]],
["a+84","do","Send the full claim: extra time. Cost is also paid for war, terrorism, riots, and explosions/radiation (the last three only if in Sri Lanka).","සම්පූර්ණ claim එක යවන්න: අමතර කාලය. යුද්ධය, ත්‍රස්තවාදය, කලබල, සහ explosions/radiation සඳහා වියදමත් ගෙවනවා (අවසාන තුන ලංකාව තුළ නම් පමණයි).",["20.4","19.1"]]],
e:"EC",n:["Employer","Notice of Force Majeure","We give notice that the following event constitutes Force Majeure under Sub-Clause 20.1: __. It prevents the performance of the following obligations: __."]},

{i:"R3",c:"risk",r:"B",x:1,t:["Force Majeure has stopped work for a long time (about 3 months or more)","Force Majeure නිසා දිගු කාලයක් (මාස 3ක් පමණ හෝ වැඩි) වැඩ නතර වෙලා"],
m:["If Force Majeure stops almost all work for too long, either side can end the contract, and the contractor is paid for work done and its costs.","Force Majeure නිසා ඕනෑවට වඩා දිගු කාලයක් වැඩ සියල්ලම වගේ නතර වුණොත්, ඕනෑම පාර්ශවයකට contract එක අවසන් කරන්න පුළුවන්, contractor ට කළ වැඩ සහ එහි වියදම් ගෙවනවා."],
d:[["a","Date work stopped because of Force Majeure","Force Majeure නිසා වැඩ නතර වූ දිනය"]],
s:[["a+84","if","After 84 days in a row (or more than 140 days in total from the same event), either side can give notice to end the contract.","අඛණ්ඩව දින 84කට පසු (හෝ එකම සිදුවීම නිසා මුළු දින 140කට වඩා), ඕනෑම පාර්ශවයකට contract එක අවසන් කරන්න notice දෙන්න පුළුවන්.",["20.6"]],
[null,"know","The termination takes effect 7 days after the notice. Stop work and remove your equipment.","Termination එක notice එකෙන් දින 7කට පසු බලපැවැත්වෙනවා. වැඩ නවත්වලා ඔබේ equipment ඉවත් කරන්න.",["20.6","16.3"]],
[null,"know","You are paid for: work done, materials ordered, other reasonable costs, removing your equipment, and sending staff home.","ඔබට ගෙවනවා: කළ වැඩ, order කළ materials, අනෙක් සාධාරණ වියදම්, equipment ඉවත් කිරීම, සහ staff ආපසු යැවීම.",["20.6"]]]},

{i:"R4",c:"risk",r:"B",x:1,t:["A law now makes the contract impossible or illegal to carry out","නීතියක් නිසා දැන් contract එක කරන්නම බැහැ, නැත්නම් නීති විරෝධී වෙලා"],
m:["If something outside both sides' control makes the contract impossible or illegal, both sides are released from further work, and payment is made as for a Force Majeure termination.","පාර්ශව දෙකේම පාලනයෙන් පිටත දෙයක් නිසා contract එක කරන්න බැරි හෝ නීති විරෝධී වුණොත්, දෙපාර්ශවයම තවදුරටත් වැඩ කිරීමෙන් නිදහස් වෙනවා, Force Majeure termination එකක් වගේ ගෙවීම් කරනවා."],
s:[[null,"do","Give notice to the other side. Both sides are then released from further performance.","අනෙක් පාර්ශවයට notice දෙන්න. එවිට දෙපාර්ශවයම තවදුරටත් කාර්ය සාධනයෙන් නිදහස් වෙනවා.",["20.7"]],
[null,"know","Payment is the same as for a Force Majeure termination.","ගෙවීම Force Majeure termination එකක් වගේමයි.",["20.7","20.6"]]]},

{i:"R5",c:"risk",r:"E",t:["The contractor did not take out, or let lapse, the required insurance","Contractor අවශ්‍ය insurance ගත්තේ නැහැ, නැත්නම් lapse වෙන්න ඇරියා"],
m:["If the contractor does not keep the insurances, the Employer can buy them and take the cost, plus a 5% charge, from the contractor's payments.","Contractor insurances තියාගන්නේ නැත්නම්, Employer ට ඒවා අරගෙන, ඒ වියදම සහ 5% ගාස්තුවක් contractor ගේ ගෙවීම් වලින් අඩු කරන්න පුළුවන්."],
s:[[null,"know","The Employer can take out the insurance and deduct the premium plus a 5% service charge from money due to the contractor.","Employer ට insurance එක අරගෙන premium එක සහ 5% service charge එකක් contractor ට ගෙවිය යුතු මුදලින් අඩු කරන්න පුළුවන්.",["18.4"]],
[null,"know","Required cover: the Works (at least 115% of the contract price), equipment, third-party liability (limit in the Contract Data), and workers.","අවශ්‍ය cover: Works (contract price එකෙන් අවම 115%), equipment, third-party liability (Contract Data සීමාව), සහ workers.",["18.1","18.2","18.3"]]]},

{i:"R6",c:"risk",r:"C",t:["Damage to someone else's property, or someone was injured","වෙන කෙනෙකුගේ දේපළ වලට හානියක්, නැත්නම් කෙනෙක් තුවාල වුණා"],
m:["If your work harms other people or their property, you must protect the Employer from the claims. Your third-party insurance should cover this.","ඔබේ වැඩ නිසා අනුන්ට හෝ ඔවුන්ගේ දේපළ වලට හානියක් වුණොත්, ඒ claims වලින් Employer ආරක්ෂා කරන්න ඕනේ. ඔබේ third-party insurance එකෙන් මෙය cover විය යුතුයි."],
s:[[null,"know","You must protect the Employer from claims caused by your work (unless the Employer was negligent).","ඔබේ වැඩ නිසා එන claims වලින් Employer ආරක්ෂා කරන්න ඕනේ (Employer නොසැලකිලිමත් වුණා නම් හැර).",["17.1"]],
[null,"do","Claim under the third-party insurance (in joint names).","Third-party insurance එක යටතේ (joint names) claim කරන්න.",["18.2"]]]},

{i:"R7",c:"risk",r:"C",x:1,t:["Floods, landslides or a cyclone damaged the works","ගංවතුර, නායයෑම් හෝ සුළි සුළඟක් works වලට හානි කළා"],
m:["Natural disasters can fall under different rules, depending on how unusual they were and what they did. Check which one fits your case.","ස්වාභාවික ව්‍යසන, ඒවා කොච්චර අසාමාන්‍යද, මොනවද කළේ කියන එක අනුව වෙනස් නීති යටතට වැටෙන්න පුළුවන්. ඔබේ අවස්ථාවට ගැළපෙන්නේ කුමක්ද බලන්න."],
s:[[null,"if","If it was a force of nature an experienced contractor could not expect or guard against, it is an Employer's risk. See R1.","පළපුරුදු contractor කෙනෙකුට අපේක්ෂා කරන්න හෝ ආරක්ෂා වෙන්න බැරි ස්වාභාවික බලවේගයක් නම්, එය Employer's risk එකක්. R1 බලන්න.",["17.3","17.4"]],
[null,"if","If the disaster makes it impossible to work, it may be Force Majeure. See R2 (natural disasters give time only).","ව්‍යසනය නිසා වැඩ කරන්නම බැරි නම්, එය Force Majeure විය හැකියි. R2 බලන්න (ස්වාභාවික ව්‍යසන වලට කාලය පමණයි).",["20.1","20.4"]],
[null,"if","If it only caused delay, see extremely bad weather (D2).","ප්‍රමාදයක් පමණක් නම්, ඉතා දරුණු කාලගුණය (D2) බලන්න.",["8.4(c)"]],
[null,"do","Also claim under the Works insurance.","Works insurance එක යටතේත් claim කරන්න.",["18.1"]]],
e:"EC"},

{i:"H1",c:"comp",r:"C",t:["We want to apply for the Taking-Over Certificate (handover)","Taking-Over Certificate (handover) එකට apply කරන්න ඕනේ"],
m:["The Taking-Over Certificate (TOC) confirms the works are complete and handed over. It stops delay damages, starts the defects period, and releases half the retention.","Taking-Over Certificate (TOC) එකෙන් works ඉවර වෙලා භාර දුන් බව තහවුරු කරනවා. එය delay damages නවත්වනවා, defects period එක පටන් ගන්නවා, retention එකෙන් භාගයක් නිදහස් කරනවා."],
d:[["a","Date we expect to finish","ඉවර වෙයි කියලා අපේක්ෂා කරන දිනය"],["b","Date we applied for the TOC","TOC එකට apply කළ දිනය"]],
s:[["a-14","know","The earliest day you can apply.","Apply කරන්න පුළුවන් මුල්ම දිනය.",["10.1"]],
["b+28","know","The Engineer must issue the TOC or reject it with reasons by this date. If the Engineer does neither, and the works are mostly complete, the TOC is treated as issued on this day.","Engineer මේ දිනය වෙද්දී TOC එක නිකුත් කරන්න හෝ හේතු සහිතව reject කරන්න ඕනේ. දෙකම නොකළොත්, works බොහෝ දුරට ඉවර නම්, මේ දවසේ TOC එක නිකුත් කළා ලෙස සැලකෙනවා.",["10.1"]],
[null,"warn","For parts you designed, first give the as-built drawings and operation and maintenance manuals.","ඔබ design කළ කොටස් වලට, මුලින්ම as-built drawings සහ operation සහ maintenance manuals දෙන්න.",["4.1"]],
[null,"know","After the TOC: the Employer cares for the works, you clear the site, half the retention is paid, and you send the Statement at Completion within 84 days.","TOC එකෙන් පසු: works රැකබලාගන්නේ Employer, ඔබ site එක clear කරනවා, retention එකෙන් භාගයක් ගෙවනවා, දින 84ක් ඇතුළත Statement at Completion එක යවනවා.",["17.2","4.15","14.8","14.9"]]]},

{i:"H2",c:"comp",r:"C",t:["The Employer is using part of the works before handover","Handover එකට කලින් Employer works කොටසක් භාවිත කරනවා"],
m:["If the Employer starts using part of the works early, that part is treated as handed over from that day. You can claim cost and profit, and delay damages go down.","Employer works කොටසක් කලින් භාවිත කරන්න පටන් ගත්තොත්, ඒ දවසේ ඉඳන් ඒ කොටස භාර දුන්නා ලෙස සැලකෙනවා. ඔබට වියදම සහ profit claim කරන්න පුළුවන්, delay damages අඩු වෙනවා."],
d:[["a","Date the Employer started using it","Employer භාවිත කරන්න පටන් ගත් දිනය"]],
s:[["a","know","That part is treated as taken over from this date, and its care passes to the Employer. Ask for a TOC for it.","මේ දිනයේ සිට ඒ කොටස භාර ගත්තා ලෙස සැලකෙනවා, එහි රැකවරණය Employer ට යනවා. ඒ කොටසට TOC එකක් ඉල්ලන්න.",["10.2"]],
["a+28","warn","If this caused you cost, last day to send your claim notice: cost and profit.","මේ නිසා ඔබට වියදමක් ආවා නම්, claim notice එක යවන්න අවසාන දිනය: වියදම සහ profit.",["10.2","19.1"]],
[null,"know","The daily delay damages for the rest of the works go down in proportion.","ඉතිරි works සඳහා දවසක delay damages අනුපාතිකව අඩු වෙනවා.",["10.2"]],
[null,"know","The Employer's use of the works is also one of the Employer's risks.","Employer works භාවිත කිරීම Employer's risks වලින් එකක්.",["17.3"]]],
e:"CP"},

{i:"H3",c:"comp",r:"C",t:["Performance Certificate and the last steps","Performance Certificate සහ අවසාන පියවර"],
m:["The Performance Certificate is the final confirmation that the contractor has done everything. After it, securities are returned, the site is cleared, and the final account is settled.","Performance Certificate එක කියන්නේ contractor සියල්ල කළ බවට අවසාන තහවුරු කිරීම. ඊට පස්සේ securities ආපසු දෙනවා, site එක clear කරනවා, final account එක settle කරනවා."],
d:[["a","Date the defects period ends","Defects period එක අවසන් වන දිනය"],["b","Date we received the Performance Certificate","Performance Certificate එක ලැබුණු දිනය"]],
s:[["a+28","know","The Engineer should issue the Performance Certificate by this date (if all defects are fixed).","Engineer මේ දිනය වෙද්දී Performance Certificate එක නිකුත් කළ යුතුයි (සියලු defects හදලා නම්).",["11.8"]],
["b+21","know","The Employer must return the Performance Security within 21 days of receiving a copy of this certificate.","මේ certificate එකේ copy එකක් ලැබී දින 21ක් ඇතුළත Employer Performance Security එක ආපසු දිය යුතුයි.",["4.2"]],
["b+28","do","Remove all remaining equipment and materials from the site. If you do not, the Employer can sell them.","ඉතිරි සියලු equipment සහ materials site එකෙන් ඉවත් කරන්න. එසේ නොකළොත් Employer ට ඒවා විකුණන්න පුළුවන්.",["11.10"]],
["b+56","do","Send the draft final statement.","Draft final statement එක යවන්න.",["14.10"]],
[null,"know","Both sides are still responsible for anything not yet done.","තවම නොකළ ඕනෑම දෙයකට දෙපාර්ශවයම තවමත් වගකියනවා.",["11.9"]]]}
);
EV.push(
{i:"L1",c:"term",r:"B",t:["A Notice to Correct was received (or needs to be sent)","Notice to Correct එකක් ලැබුණා (හෝ යවන්න ඕනේ)"],
m:["A Notice to Correct is a formal warning that the contractor is not doing something the contract requires. It is often the first step before termination, so take it seriously.","Notice to Correct එකක් කියන්නේ contract එක අනුව කළ යුතු දෙයක් contractor නොකරන බවට දෙන formal අනතුරු ඇඟවීමක්. එය බොහෝ විට termination එකට පළමු පියවර, ඒ නිසා බරපතළ ලෙස සලකන්න."],
s:[[null,"do","Fix the problem within the reasonable time stated by the Engineer.","Engineer කියපු සාධාරණ කාලය ඇතුළත ප්‍රශ්නය හදන්න.",["15.1"]],
[null,"warn","If you do not, the Employer can end the contract with 14 days' notice.","නොහැදුවොත් Employer ට දින 14ක notice එකකින් contract එක අවසන් කරන්න පුළුවන්.",["15.2(a)"]]]},

{i:"L2",c:"term",r:"E",t:["The Employer wants to end the contract because of the contractor's failures","Contractor ගේ අසාර්ථකත්වය නිසා Employer contract එක අවසන් කරන්න ඕනේ"],
m:["The Employer can end the contract only for specific serious reasons, and must usually give 14 days' notice. After that, the works are valued and the Employer can recover its extra costs.","Employer ට contract එක අවසන් කරන්න පුළුවන් නිශ්චිත බරපතළ හේතු වලට පමණයි, සාමාන්‍යයෙන් දින 14ක notice එකක් දිය යුතුයි. ඉන් පසු works value කරනවා, Employer ට තම අමතර වියදම් අයකරගන්න පුළුවන්."],
d:[["a","Date the termination notice was given","Termination notice එක දුන් දිනය"]],
s:[[null,"know","Reasons: no Performance Security or ignoring a Notice to Correct, abandoning the works, no progress without a good reason, ignoring a rejection or remedial notice for 28 days, subcontracting or assigning without consent, bankruptcy, or bribery or corruption.","හේතු: Performance Security නොදීම හෝ Notice to Correct එක නොසලකා හැරීම, works අත්හැරීම, හොඳ හේතුවක් නැතිව progress නැති වීම, rejection හෝ remedial notice එකක් දින 28ක් නොසලකා හැරීම, අනුමැතිය නැතිව subcontract හෝ assign කිරීම, බංකොලොත් වීම, හෝ අල්ලස් හෝ දූෂණ.",["15.2"]],
["a+14","know","The termination takes effect on this date. For bankruptcy or bribery it can be immediate.","Termination එක මේ දිනයේ බලපැවැත්වෙනවා. බංකොලොත්භාවය හෝ අල්ලස් නම් වහාම විය හැකියි.",["15.2"]],
[null,"know","The Engineer values the work done. The Employer can hold payments until its costs are known, and recover its extra costs of finishing.","කළ වැඩ Engineer value කරනවා. තම වියදම් දැනගන්නකම් Employer ට ගෙවීම් රඳවාගෙන, ඉතිරි වැඩ ඉවර කරන අමතර වියදම් අයකරගන්න පුළුවන්.",["15.3","15.4"]]]},

{i:"L3",c:"term",r:"B",t:["The Employer ends the contract for its own convenience","Employer තමන්ගේ පහසුවට contract එක අවසන් කරනවා"],
m:["The Employer can end the contract even if the contractor did nothing wrong, but it cannot do this just to give the work to someone else. The contractor is paid for work done and its costs.","Contractor කිසිම වරදක් නොකළත් Employer ට contract එක අවසන් කරන්න පුළුවන්, හැබැයි වැඩ වෙන කෙනෙකුට දෙන්න විතරක් එසේ කරන්න බැහැ. Contractor ට කළ වැඩ සහ එහි වියදම් ගෙවනවා."],
d:[["a","Later of: date notice received, or date Performance Security returned","පසුව එන දිනය: notice ලැබුණු දිනය හෝ Performance Security ආපසු දුන් දිනය"]],
s:[["a+28","know","The termination takes effect on this date.","Termination එක මේ දිනයේ බලපැවැත්වෙනවා.",["15.5"]],
[null,"warn","The Employer cannot use this to do the works itself or give them to another contractor (for one year).","වැඩ තමන්ම කරන්න හෝ වෙනත් contractor කෙනෙකුට දෙන්න Employer ට මෙය භාවිත කරන්න බැහැ (අවුරුද්දක් යනකම්).",["15.5"]],
[null,"do","Stop work and leave the site. You are paid as for a Force Majeure termination.","වැඩ නවත්වලා site එකෙන් ඉවත් වෙන්න. Force Majeure termination එකක් වගේ ගෙවනවා.",["16.3","20.6"]]]},

{i:"L4",c:"term",r:"C",t:["The contractor wants to end the contract","Contractor contract එක අවසන් කරන්න ඕනේ"],
m:["The contractor can end the contract only for specific serious reasons, mostly about non-payment. It gives 14 days' notice, and is paid for work done plus lost profit.","Contractor ට contract එක අවසන් කරන්න පුළුවන් නිශ්චිත බරපතළ හේතු වලට පමණයි, බොහෝ විට ගෙවීම් නැති වීම ගැන. දින 14ක notice එකක් දෙනවා, කළ වැඩ සහ අහිමි වූ profit ගෙවනවා."],
d:[["a","Date we gave the termination notice","Termination notice එක දුන් දිනය"]],
s:[[null,"know","Reasons: no IPC within 56 days after your Statement, IPC money not paid within 56 days after it was due, the Employer seriously failing its duties, not signing the Agreement or assigning the contract, a very long suspension, or the Employer going bankrupt.","හේතු: Statement එකෙන් දින 56ක් ඇතුළත IPC එකක් නැති වීම, ගෙවිය යුතු දිනයෙන් දින 56ක් ඇතුළත IPC මුදල නොගෙවීම, Employer තම වගකීම් බරපතළ ලෙස පැහැර හැරීම, Agreement එක sign නොකිරීම හෝ contract එක assign කිරීම, ඉතා දිගු suspension එකක්, හෝ Employer බංකොලොත් වීම.",["16.2"]],
["a+14","know","The termination takes effect on this date (immediately for a very long suspension or bankruptcy).","Termination එක මේ දිනයේ බලපැවැත්වෙනවා (ඉතා දිගු suspension එකක් හෝ බංකොලොත්භාවය නම් වහාම).",["16.2"]],
[null,"know","You get back the Performance Security, payment as for Force Majeure termination, and your lost profit or other losses.","ඔබට Performance Security එක ආපසු, Force Majeure termination එකක් වගේ ගෙවීම්, සහ අහිමි වූ profit හෝ අනෙක් පාඩු ලැබෙනවා.",["16.3","16.4"]]]},

{i:"L5",c:"term",r:"B",x:1,t:["Bribery, corruption or price-fixing was discovered","අල්ලස්, දූෂණ හෝ මිල එකඟතා (collusion) හෙළි වුණා"],
m:["Bribery and corruption are the most serious breaches. The Employer can end the contract immediately.","අල්ලස් සහ දූෂණ බරපතළම උල්ලංඝනයන්. Employer ට contract එක වහාම අවසන් කරන්න පුළුවන්."],
s:[[null,"warn","If the contractor, its staff or subcontractors offered a bribe, the Employer can end the contract immediately by notice.","Contractor, එහි staff හෝ subcontractors අල්ලසක් දුන්නොත්, Employer ට notice එකකින් වහාම contract එක අවසන් කරන්න පුළුවන්.",["15.2"]],
[null,"warn","At tender stage, the bidder can be disqualified.","Tender අදියරේදී නම් bidder disqualify කරන්න පුළුවන්.",["ITB 3","ITB 32.2"]]]},

{i:"L6",c:"term",r:"C",x:1,t:["The Employer went bankrupt or into liquidation","Employer බංකොලොත් වුණා හෝ liquidation වලට ගියා"],
m:["If the Employer cannot pay its debts, the contractor does not have to keep working at risk. It can end the contract immediately.","Employer ට ණය ගෙවන්න බැරි නම්, contractor අවදානමේ වැඩ කරගෙන යන්න ඕනේ නැහැ. වහාම contract එක අවසන් කරන්න පුළුවන්."],
s:[[null,"do","You can end the contract immediately by notice.","Notice එකකින් වහාම contract එක අවසන් කරන්න පුළුවන්.",["16.2(f)"]],
[null,"know","Payment is made under the termination payment rules.","ගෙවීම් termination payment නීති අනුව කරනවා.",["16.4"]]]},

{i:"M1",c:"disp",r:"B",t:["We disagree with the Engineer's decision (Adjudicator route)","Engineer ගේ තීරණයට අපි එකඟ නැහැ (Adjudicator මාර්ගය)"],
m:["If you disagree with a decision, first follow it for now, then take the dispute to the Adjudicator. The Adjudicator decides quickly. If either side is still unhappy, it can go to arbitration.","තීරණයකට එකඟ නැත්නම්, මුලින් දැනට එය අනුගමනය කරලා, dispute එක Adjudicator ට යොමු කරන්න. Adjudicator ඉක්මනින් තීරණය කරනවා. එක් පාර්ශවයක් තවමත් සෑහීමකට පත් නැත්නම් arbitration වෙත යන්න පුළුවන්."],
d:[["a","Date we gave the adjudication notice","Adjudication notice එක දුන් දිනය"],["b","Date we received the Adjudicator's decision","Adjudicator ගේ තීරණය ලැබුණු දිනය"]],
s:[[null,"warn","Follow the Engineer's decision until it is changed, and keep working.","Engineer ගේ තීරණය වෙනස් වෙනකම් එය අනුගමනය කරන්න, වැඩ දිගටම කරන්න.",["3.4","19.5"]],
["a+7","know","After 7 days' notice to the other side, the adjudication starts.","අනෙක් පාර්ශවයට දින 7ක notice එකකට පසු adjudication එක පටන් ගන්නවා.",["19.3"]],
["a+14","if","If you cannot agree on an Adjudicator by this date, either side can ask ICTAD (now CIDA) to appoint one.","මේ දිනය වෙද්දී Adjudicator කෙනෙක් ගැන එකඟ වෙන්න බැරි නම්, ඕනෑම පාර්ශවයකට ICTAD (දැන් CIDA) ගෙන් පත් කරන්න ඉල්ලන්න පුළුවන්.",["19.3"]],
[null,"know","The Adjudicator must decide in writing within 28 days. Fees are shared equally. If the Adjudicator leaves, a new one is appointed within 14 days.","Adjudicator දින 28ක් ඇතුළත ලිඛිතව තීරණය කළ යුතුයි. ගාස්තු සමානව බෙදාගන්නවා. Adjudicator ඉවත් වුණොත් දින 14ක් ඇතුළත අලුත් කෙනෙක් පත් කරනවා.",["19.3","19.4"]],
["b+28","warn","Last day to refer the dispute to arbitration. If no one does, the Adjudicator's decision becomes final and binding.","Dispute එක arbitration වෙත යොමු කරන්න අවසාන දිනය. කවුරුත් නොකළොත් Adjudicator ගේ තීරණය අවසාන සහ බැඳෙන එකක් වෙනවා.",["19.3"]]],
n:["Employer","Notice of reference of dispute to Adjudication","We hereby give 7 days' notice under Sub-Clause 19.3 that we refer the following dispute to adjudication: __."]},

{i:"M2",c:"disp",r:"B",t:["A dispute goes to the DAB (contracts of LKR 500 million or more)","Dispute එකක් DAB එකට යනවා (LKR මිලියන 500 හෝ වැඩි contracts)"],
m:["For big contracts, a 3-member Dispute Adjudication Board (DAB) decides disputes. If you are unhappy with its decision, you must say so within 28 days, or the decision becomes final.","විශාල contracts වල disputes තීරණය කරන්නේ සාමාජිකයන් 3ක Dispute Adjudication Board (DAB) එකක්. එහි තීරණයට සෑහීමකට පත් නැත්නම් දින 28ක් ඇතුළත එය කියන්න ඕනේ, නැත්නම් තීරණය අවසාන වෙනවා."],
d:[["a","Date we referred the dispute to the DAB","Dispute එක DAB එකට යොමු කළ දිනය"],["b","Date we received the DAB decision","DAB තීරණය ලැබුණු දිනය"]],
s:[[null,"do","Refer the dispute to the DAB in writing, with copies to the other side and the Engineer.","Dispute එක ලිඛිතව DAB එකට යොමු කරන්න, copies අනෙක් පාර්ශවයට සහ Engineer ට.",["CD 19.4"]],
["a+84","know","The DAB should decide by this date. If it does not, you have 28 days after this date to give a notice of dissatisfaction.","DAB මේ දිනය වෙද්දී තීරණය කළ යුතුයි. එසේ නොකළොත්, මේ දිනයෙන් දින 28ක් ඇතුළත notice of dissatisfaction එකක් දෙන්න පුළුවන්.",["CD 19.4"]],
["b+28","warn","Last day to give a notice of dissatisfaction. If none is given, the decision becomes final and binding.","Notice of dissatisfaction එක දෙන්න අවසාන දිනය. කිසිවක් නොදුන්නොත් තීරණය අවසාන සහ බැඳෙන එකක් වෙනවා.",["CD 19.4"]],
[null,"know","If a side ignores a final decision, or there is no DAB in place, the dispute can go straight to arbitration.","පාර්ශවයක් අවසාන තීරණයක් නොසලකා හැරියොත්, හෝ DAB එකක් නැත්නම්, dispute එක කෙලින්ම arbitration වෙත යන්න පුළුවන්.",["CD 19.5","CD 19.6"]]]},

{i:"M3",c:"disp",r:"B",t:["Arbitration","Arbitration"],
m:["Arbitration is the final way to settle a dispute, like a private court. It follows the Arbitration Act No. 11 of 1995, with one arbitrator.","Arbitration කියන්නේ dispute එකක් විසඳන අවසාන ක්‍රමය, පෞද්ගලික උසාවියක් වගේ. එය Arbitration Act No. 11 of 1995 අනුව, එක් arbitrator කෙනෙකු සමඟ සිදු වෙනවා."],
d:[["a","Date we received the 3 arbitrator names","Arbitrators 3 දෙනාගේ නම් ලැබුණු දිනය"]],
s:[[null,"know","One arbitrator, under the Arbitration Act No. 11 of 1995.","Arbitration Act No. 11 of 1995 යටතේ, එක් arbitrator කෙනෙක්.",["19.5","CD 19.7"]],
["a+21","do","Choose one of the 3 names. If you do not, the arbitrator is appointed under the Act.","නම් 3න් එකක් තෝරන්න. එසේ නොකළොත් Act එක අනුව arbitrator පත් කරනවා.",["19.5"]],
[null,"warn","Held in Sri Lanka, in English. Both sides must keep doing their contract duties during arbitration.","ලංකාවේ, English භාෂාවෙන් පැවැත්වෙනවා. Arbitration අතරතුර දෙපාර්ශවයම contract වගකීම් දිගටම ඉටු කළ යුතුයි.",["19.5"]]]},

{i:"M4",c:"disp",r:"C",t:["How do we make any claim? (general guide)","ඕනෑම claim එකක් කරන්නේ කොහොමද? (පොදු මාර්ගෝපදේශය)"],
m:["A claim is a formal request for more time or money. The most important rule is the 28-day notice from when you knew about the event. Good records win claims.","Claim එකක් කියන්නේ වැඩි කාලයක් හෝ මුදල් ඉල්ලන formal ඉල්ලීමක්. වැදගත්ම නීතිය තමයි සිදුවීම ගැන දැනගත් දින සිට දින 28ක notice එක. හොඳ records වලින් claims දිනනවා."],
d:[["a","Date we knew (or should have known) about the event","සිදුවීම ගැන දැනගත් (හෝ දැනගත යුතුව තිබූ) දිනය"]],
s:[["a+28","warn","Send a notice to the Engineer describing the event.","සිදුවීම විස්තර කරමින් Engineer ට notice එකක් යවන්න.",["19.1"]],
[null,"do","Keep records made at the time (site diary, photos, cost sheets). Let the Engineer inspect them.","ඒ වෙලාවේම හදන records (site diary, photos, cost sheets) තියාගන්න. Engineer ට ඒවා inspect කරන්න දෙන්න.",["19.1"]],
["a+84","do","Send the full claim with details. If the effect continues, send updates every month, and a final claim within 28 days after the effect ends.","විස්තර සහිතව සම්පූර්ණ claim එක යවන්න. බලපෑම දිගටම යනවා නම් හැම මාසෙම updates, බලපෑම ඉවර වී දින 28ක් ඇතුළත final claim එක යවන්න.",["19.1"]],
[null,"know","The Engineer answers within 42 days. Proven parts are paid in the monthly certificates. A late notice can reduce what you get if it made checking the claim harder.","Engineer දින 42ක් ඇතුළත පිළිතුරු දෙනවා. ඔප්පු කළ කොටස් මාසික certificates වල ගෙවනවා. ප්‍රමාද notice එකක් claim එක check කිරීම අමාරු කළා නම් ඔබට ලැබෙන දේ අඩු වෙන්න පුළුවන්.",["19.1","3.4"]],
[null,"warn","Do not forget to include every claim in the Statement at Completion and the Final Statement.","හැම claim එකක්ම Statement at Completion එකේ සහ Final Statement එකේ ඇතුළත් කරන්න අමතක කරන්න එපා.",["14.13"]]],
k:["Site diary, photos, letters, cost records","Site diary, photos, letters, cost records"],
n:["Engineer","Notice of Claim under Sub-Clause 19.1","We give notice that we consider ourselves entitled to an extension of the Time for Completion and/or additional payment arising from the following event or circumstance: __, of which we became aware on __."]},

{i:"M5",c:"disp",r:"C",t:["The Engineer is not replying to our claim","Engineer අපේ claim එකට පිළිතුරු දෙන්නේ නැහැ"],
m:["The Engineer has a time limit to reply. If it passes, follow up in writing and then move to the dispute process.","පිළිතුරු දෙන්න Engineer ට කාල සීමාවක් තියෙනවා. ඒක ඉක්මවුණොත් ලිඛිතව follow up කරලා dispute ක්‍රියාවලියට යන්න."],
d:[["a","Date we sent the claim","Claim එක යැවූ දිනය"]],
s:[["a+42","know","Last day for the Engineer to approve, or reject with detailed comments.","Engineer approve කරන්න, හෝ සවිස්තර comments සහිතව reject කරන්න අවසාන දිනය.",["19.1"]],
[null,"do","Send a reminder and ask for a formal decision. If there is still no answer, treat it as a dispute.","Reminder එකක් යවලා formal තීරණයක් ඉල්ලන්න. තවමත් පිළිතුරක් නැත්නම් එය dispute එකක් ලෙස සලකන්න.",["3.4","19.2"]]]},

{i:"M6",c:"disp",r:"C",t:["The Engineer seems unfair, or we disagree with an assistant's decision","Engineer අසාධාරණ බව පේනවා, නැත්නම් assistant කෙනෙකුගේ තීරණයකට විරුද්ධයි"],
m:["The Engineer must act fairly. Decisions by the Engineer's assistants can be taken to the Engineer, and any decision can later be reviewed in the dispute process.","Engineer සාධාරණව ක්‍රියා කළ යුතුයි. Engineer ගේ assistants ගේ තීරණ Engineer ට යොමු කරන්න පුළුවන්, ඕනෑම තීරණයක් පසුව dispute ක්‍රියාවලියේදී නැවත සලකා බැලිය හැකියි."],
s:[[null,"know","The Engineer must use judgement fairly, considering all the facts. These decisions can be reviewed later.","Engineer සියලු කරුණු සලකා සාධාරණව තීරණ ගත යුතුයි. මේ තීරණ පසුව නැවත සලකා බැලිය හැකියි.",["3.5"]],
[null,"do","If you disagree with an assistant's instruction or decision, refer it to the Engineer, who must confirm, reverse or change it.","Assistant කෙනෙකුගේ instruction එකකට හෝ තීරණයකට එකඟ නැත්නම් Engineer ට යොමු කරන්න, Engineer එය confirm, reverse හෝ වෙනස් කළ යුතුයි.",["3.2"]],
[null,"know","Before deciding, the Engineer must consult both sides.","තීරණය කරන්න කලින් Engineer දෙපාර්ශවයම සමඟ සාකච්ඡා කළ යුතුයි.",["3.4","19.2"]]]},

{i:"G1",c:"gen",r:"B",t:["How do we send a notice the right way?","Notice එකක් නිවැරදි විදිහට යවන්නේ කොහොමද?"],
m:["Many rights depend on sending notices correctly. A notice that is not in writing, or not sent to the right address, may not count.","ගොඩක් අයිතිවාසිකම් රඳා පවතින්නේ notices නිවැරදිව යැවීම මත. ලිඛිත නොවන, හෝ නිවැරදි address එකට නොයවන notice එකක් ගණන් නොගන්න පුළුවන්."],
s:[[null,"do","Send it in writing, by hand, post or courier (with a receipt), to the address in the Contract Data.","ලිඛිතව, අතින්, තැපෑලෙන් හෝ courier මගින් (receipt සමඟ), Contract Data එකේ address එකට යවන්න.",["1.3"]],
[null,"know","'In writing' includes electronic messages that leave a permanent record.","'ලිඛිත' කියන එකට ස්ථිර record එකක් ඉතිරි වන electronic messages ඇතුළත්.",["1.2"]],
[null,"do","When you send a notice to one side, send a copy to the Engineer (or the other side).","එක් පාර්ශවයකට notice එකක් යවද්දී, copy එකක් Engineer ට (හෝ අනෙක් පාර්ශවයට) යවන්න.",["1.3"]],
[null,"know","A 'Day' means a calendar day (weekends and holidays count). The contract language is English and Sri Lankan law applies.","'Day' කියන්නේ calendar day එකක් (සති අන්ත සහ නිවාඩු දින ගණන් වෙනවා). Contract භාෂාව English, ලංකාවේ නීතිය අදාළයි.",["1.1","1.4"]]]},

{i:"G2",c:"gen",r:"B",t:["We need a management meeting","Management meeting එකක් ඕනේ"],
m:["Either the Engineer or the contractor's site head can call a meeting to plan future work. The Engineer keeps the minutes.","ඉදිරි වැඩ සැලසුම් කරන්න Engineer ට හෝ contractor ගේ site head ට meeting එකක් කැඳවන්න පුළුවන්. Minutes තියාගන්නේ Engineer."],
s:[[null,"know","The Engineer or the Contractor's Representative can call the other to a meeting. The Engineer records it and sends copies to those present and the Employer.","Engineer ට හෝ Contractor's Representative ට අනෙකා meeting එකකට කැඳවන්න පුළුවන්. Engineer එය record කරලා, පැමිණි අයට සහ Employer ට copies යවනවා.",["8.13"]]]},

{i:"G3",c:"gen",r:"C",t:["Quality assurance system and method statements","Quality assurance system සහ method statements"],
m:["You must run a quality system to show your work meets the contract, and explain your methods when the Engineer asks.","ඔබේ වැඩ contract එකට අනුකූල බව පෙන්වන්න quality system එකක් පවත්වන්න ඕනේ, Engineer ඉල්ලුවාම ඔබේ ක්‍රම පැහැදිලි කරන්න ඕනේ."],
s:[[null,"do","Run a quality assurance system as the contract requires. The Engineer can audit it.","Contract එකේ අවශ්‍ය පරිදි quality assurance system එකක් පවත්වන්න. Engineer ට එය audit කරන්න පුළුවන්.",["4.17"]],
[null,"do","When asked, explain your working methods, and tell the Engineer before any big change. Give the information the Engineer needs to check you follow the contract.","ඉල්ලුවාම ඔබේ වැඩ ක්‍රම පැහැදිලි කරන්න, ලොකු වෙනසකට කලින් Engineer ට කියන්න. ඔබ contract එක පිළිපදින බව check කරන්න Engineer ට ඕනේ තොරතුරු දෙන්න.",["4.1","1.12"]]]},

{i:"G4",c:"gen",r:"C",t:["Royalties for quarry materials, and getting rid of excavated soil","Quarry materials සඳහා royalties, සහ කපපු පස් ඉවත් කිරීම"],
m:["Unless the specification says otherwise, the contractor pays for natural materials from outside the site and for disposing of waste material.","Specification එකේ වෙනත් දෙයක් නැත්නම්, site එකෙන් පිටත ස්වාභාවික materials සහ අපද්‍රව්‍ය ඉවත් කිරීම සඳහා ගෙවන්නේ contractor."],
s:[[null,"know","You pay royalties for natural materials from outside the site, and the cost of disposing of excavated or surplus material (unless disposal areas on site are given).","Site එකෙන් පිටත ස්වාභාවික materials වලට royalties, සහ කපපු හෝ අමතර materials ඉවත් කිරීමේ වියදම ඔබ ගෙවනවා (site එකේ disposal areas දීලා නැත්නම්).",["7.7"]]]},

{i:"G5",c:"gen",r:"C",t:["Getting permits and approvals","Permits සහ approvals ගැනීම"],
m:["The contractor must get the permits and pay the fees the law requires for the work. The Employer should help where it can.","වැඩ සඳහා නීතියෙන් අවශ්‍ය permits අරගෙන fees ගෙවන්න ඕනේ contractor. පුළුවන් තැන්වල Employer උදව් කළ යුතුයි."],
s:[[null,"do","Get the permits and pay the taxes and fees the law requires for the works.","Works සඳහා නීතියෙන් අවශ්‍ය permits අරගෙන taxes සහ fees ගෙවන්න.",["1.13"]],
[null,"do","Ask the Employer for reasonable help.","Employer ගෙන් සාධාරණ උදව් ඉල්ලන්න.",["2.2"]],
[null,"if","If an authority delays you, see D4.","ආයතනයක් ඔබව ප්‍රමාද කළොත් D4 බලන්න.",["8.5"]]]},

{i:"G6",c:"gen",r:"B",x:1,t:["The Employer passes the contract to someone else, or a JV partner changes","Employer contract එක වෙන කෙනෙකුට පවරනවා, නැත්නම් JV partner කෙනෙක් වෙනස් වෙනවා"],
m:["Neither side can hand over the contract to someone else without the other's agreement. A JV cannot change its partners without the Employer's consent.","අනෙකාගේ එකඟතාවක් නැතිව කිසිම පාර්ශවයකට contract එක වෙන කෙනෙකුට භාර දෙන්න බැහැ. Employer ගේ අනුමැතිය නැතිව JV එකකට partners වෙනස් කරන්න බැහැ."],
s:[[null,"warn","The contract cannot be assigned without the other side's prior agreement (except assigning money due to a bank).","අනෙක් පාර්ශවයේ පූර්ව එකඟතාවක් නැතිව contract එක assign කරන්න බැහැ (ලැබිය යුතු මුදල් bank එකකට assign කිරීම හැර).",["1.7"]],
[null,"if","If the Employer breaks this rule, the contractor can end the contract.","Employer මේ නීතිය කැඩුවොත් contractor ට contract එක අවසන් කරන්න පුළුවන්.",["16.2(d)"]],
[null,"warn","A JV cannot change its members or legal status without the Employer's consent.","Employer ගේ අනුමැතිය නැතිව JV එකකට සාමාජිකයන් හෝ නීතිමය තත්ත්වය වෙනස් කරන්න බැහැ.",["1.14"]]]},

{i:"G7",c:"gen",r:"B",x:1,t:["The Employer is using our drawings or design on another project","Employer අපේ drawings හෝ design වෙනත් project එකකට භාවිත කරනවා"],
m:["The contractor owns the copyright of its own documents. The Employer may use them only for this project.","Contractor ගේ documents වල copyright contractor ට අයිති. Employer ට ඒවා භාවිත කරන්න පුළුවන් මේ project එකට පමණයි."],
s:[[null,"know","The contractor keeps the copyright. The Employer has a licence to use the documents only for these works.","Copyright contractor ට අයිති. Employer ට documents භාවිත කරන්න license එක තියෙන්නේ මේ works සඳහා පමණයි.",["1.10"]],
[null,"know","In the same way, the contractor may use the Employer's documents only for this contract.","ඒ වගේම contractor ට Employer ගේ documents භාවිත කරන්න පුළුවන් මේ contract එකට පමණයි.",["1.11"]]]},

{i:"G8",c:"gen",r:"C",t:["Documents to keep on site, and parts the contractor designs","Site එකේ තියාගන්න ඕනේ documents, සහ contractor design කරන කොටස්"],
m:["Keep a full set of contract papers on site. If you design any part, it must be fit for its purpose.","Contract documents වල සම්පූර්ණ set එකක් site එකේ තියාගන්න. ඔබ කොටසක් design කරනවා නම් එය එහි අරමුණට ගැළපෙන්න ඕනේ."],
s:[[null,"do","Keep on site: a copy of the contract, the standards named in the specification, the drawings, variations and all letters.","Site එකේ තියාගන්න: contract එකේ copy එකක්, specification එකේ සඳහන් standards, drawings, variations සහ සියලු letters.",["1.8"]],
[null,"warn","Parts you design must be fit for their purpose. Give as-built drawings and manuals before the final tests.","ඔබ design කරන කොටස් ඒවායේ අරමුණට ගැළපෙන්න ඕනේ. අවසාන tests වලට කලින් as-built drawings සහ manuals දෙන්න.",["4.1"]]]},

{i:"Z0",c:"gen",r:"B",t:["My problem is not on the list","මගේ ගැටලුව list එකේ නැහැ"],
m:["No list can cover every case. These basic steps protect you in almost any situation under this contract.","කිසිම list එකකට හැම අවස්ථාවක්ම ආවරණය කරන්න බැහැ. මේ මූලික පියවර මේ contract එක යටතේ ඕනෑම අවස්ථාවක ඔබව ආරක්ෂා කරනවා."],
s:[[null,"do","1) If the Engineer tells you to do something, get it in writing. If it changes the work, it is a Variation.","1) Engineer යමක් කරන්න කිව්වොත් ලිඛිතව ගන්න. එය වැඩ වෙනස් කරනවා නම් Variation එකක්.",["3.3","13.1"]],
[null,"do","2) If you see a problem coming, warn the Engineer straight away.","2) ප්‍රශ්නයක් එන බව පේනවා නම් වහාම Engineer ට අනතුරු අඟවන්න.",["8.3"]],
[null,"warn","3) If you want more time or money: send a notice within 28 days of knowing, and a full claim within 84 days.","3) වැඩි කාලයක් හෝ මුදල් ඕනේ නම්: දැනගෙන දින 28ක් ඇතුළත notice එකක්, දින 84ක් ඇතුළත සම්පූර්ණ claim එකක් යවන්න.",["19.1"]],
[null,"know","4) If documents disagree, use the priority order.","4) Documents එකිනෙකට නොගැළපේ නම් ප්‍රමුඛතා අනුපිළිවෙල භාවිත කරන්න.",["1.5"]],
[null,"if","5) If you cannot agree: Engineer's decision, then Adjudicator or DAB, then arbitration.","5) එකඟ වෙන්න බැරි නම්: Engineer ගේ තීරණය, පසුව Adjudicator හෝ DAB, පසුව arbitration.",["3.4","19.2"]],
[null,"do","6) Keep good records, and get advice from a senior QS or lawyer.","6) හොඳ records තියාගෙන, senior QS කෙනෙකුගෙන් හෝ lawyer කෙනෙකුගෙන් උපදෙස් ගන්න.",["19.1"]]]}
);

const GL=[
["Employer","The client named in the Contract Data, who owns the project and pays for it (1.1.2.2).","Contract Data එකේ නම් කර ඇති, project එක අයිති, ඒකට ගෙවන client (1.1.2.2)."],
["Contractor","The person or company named as contractor in the bid accepted by the Employer, which builds the Works (1.1.2.3).","Employer පිළිගත් bid එකේ contractor ලෙස නම් කර ඇති, Works build කරන පුද්ගලයා හෝ company එක (1.1.2.3)."],
["Engineer","The person named in the Contract Data (or another competent person the Employer appoints and notifies) who administers and supervises the work, and certifies payments. It may be an engineer, architect or other technical person. If none is appointed, the Employer acts as Engineer (1.1.2.4, 3.1).","Contract Data එකේ නම් කළ (හෝ Employer පත් කරලා දන්වන වෙනත් දක්ෂ) පුද්ගලයා; වැඩ පරිපාලනය සහ අධීක්ෂණය කරනවා, ගෙවීම් certify කරනවා. Engineer, architect හෝ වෙනත් technical කෙනෙක් විය හැකියි. කවුරුත් පත් කර නැත්නම් Employer ම Engineer ලෙස ක්‍රියා කරනවා (1.1.2.4, 3.1)."],
["Contractor's Representative","The person the Contractor appoints and notifies to the Engineer to act for the Contractor, usually the site head (1.1.2.5, 4.3).","Contractor වෙනුවෙන් ක්‍රියා කරන්න Contractor පත් කරලා Engineer ට දන්වන පුද්ගලයා, සාමාන්‍යයෙන් site head (1.1.2.5, 4.3)."],
["Letter of Acceptance","The Employer's formal letter accepting the bid. The notice of award forms the contract (ITB 34).","Bid එක පිළිගන්නා Employer ගේ නිල ලිපිය. Award notice එකෙන් contract එක ඇති වෙනවා (ITB 34)."],
["LOA","Short for Letter of Acceptance.","Letter of Acceptance එකේ කෙටි නම."],
["Commencement Date","The start date notified by the Engineer under 8.1. Contract time is counted from it (1.1.3.2).","8.1 යටතේ Engineer දන්වන ආරම්භක දිනය. Contract කාලය ගණන් කරන්නේ එතැන් සිට (1.1.3.2)."],
["Time for Completion","The time to finish the Works stated in the Contract Data, counted from the Commencement Date, plus any extension under 8.4 (1.1.3.3).","Contract Data එකේ සඳහන්, Commencement Date එකේ සිට ගණන් කරන, Works ඉවර කරන්න දෙන කාලය, 8.4 යටතේ දුන් extensions එක්ක (1.1.3.3)."],
["EOT","Extension of Time: extra time added to the Time for Completion under 8.4, so no delay damages are due for that delay.","Extension of Time: 8.4 යටතේ Time for Completion එකට එකතු කරන අමතර කාලය. ඒ ප්‍රමාදයට delay damages ගෙවන්න ඕනේ නැහැ."],
["Cost","All money reasonably spent (or to be spent) by the Contractor, on or off the Site, including overheads, but not profit (1.1.4.3).","Contractor සාධාරණ ලෙස වියදම් කළ (හෝ කරන) සියලු මුදල්, site එකේ හෝ පිටත, overheads එක්ක, හැබැයි profit නැතිව (1.1.4.3)."],
["Profit","A reasonable profit added on top of Cost, only where the clause says so. The SBD does not fix a percentage.","Cost එකට උඩින් එකතු කරන සාධාරණ ලාභයක්, clause එකේ කියන තැන්වල පමණයි. SBD එකේ ප්‍රතිශතයක් නියම කරලා නැහැ."],
["Contract Price","The amount in the Letter of Acceptance, adjusted as the contract allows (1.1.4.2).","Letter of Acceptance එකේ මුදල, contract එක අවසර දෙන විදිහට adjust කළ අගය (1.1.4.2)."],
["Initial Contract Price","The amount in the Letter of Acceptance for doing and completing the Works and fixing defects, before adjustments (1.1.4.1).","Works කරලා ඉවර කරන්නත් defects හදන්නත් Letter of Acceptance එකේ සඳහන් මුදල, adjustments වලට කලින් (1.1.4.1)."],
["IPC","Interim Payment Certificate: a payment certificate issued under Clause 14, other than the Final Payment Certificate (1.1.4.6).","Interim Payment Certificate: Final Payment Certificate හැර, Clause 14 යටතේ නිකුත් කරන payment certificate එකක් (1.1.4.6)."],
["Final Payment Certificate","The last payment certificate, issued under 14.12 (1.1.4.4).","14.12 යටතේ නිකුත් කරන අවසාන payment certificate එක (1.1.4.4)."],
["Statement","The Contractor's application for a payment certificate, for example the monthly bill (1.1.4.10).","Payment certificate එකක් සඳහා Contractor ගේ ඉල්ලීම, උදා: මාසික bill එක (1.1.4.10)."],
["Retention","Money kept back from each interim payment (Retention Money). Half is paid back at handover and the rest after the defects period, once notified defects are fixed (1.1.4.9, 14.8).","හැම interim ගෙවීමකින්ම රඳවාගන්නා මුදල (Retention Money). භාගයක් handover එකේදී, ඉතිරිය defects period එකෙන් පසු, දන්වපු defects හැදුවාම ආපසු ගෙවනවා (1.1.4.9, 14.8)."],
["Advance payment","An interest-free loan for mobilization, paid by the Employer early in the contract against an advance payment guarantee. It excludes provisional sums and contingencies, and is repaid through percentage deductions from interim payments (14.2).","Mobilization සඳහා, advance payment guarantee එකකට එරෙහිව contract එකේ මුලදී Employer දෙන පොලී රහිත ණයක්. එයට provisional sums සහ contingencies ඇතුළත් නැහැ; interim ගෙවීම් වලින් ප්‍රතිශත අඩු කිරීම් හරහා ආපසු ගෙවනවා (14.2)."],
["Performance Security","A guarantee from the Contractor that protects the Employer if the Contractor fails (1.1.6.5, 4.2).","Contractor අසාර්ථක වුණොත් Employer ආරක්ෂා කරන, Contractor දෙන guarantee එකක් (1.1.6.5, 4.2)."],
["Bid security","A guarantee given with the bid. It can be lost if the bidder breaks the tender rules (ITB 17).","Bid එක එක්ක දෙන guarantee එකක්. Bidder tender නීති කැඩුවොත් අහිමි විය හැකියි (ITB 17)."],
["Variation","Any change to the Works that is instructed or approved as a variation under Clause 13 (1.1.6.6).","Clause 13 යටතේ variation එකක් ලෙස instruct හෝ approve කරන Works වලට කරන ඕනෑම වෙනස්කමක් (1.1.6.6)."],
["Provisional Sum","A sum named in the Contract as a provisional sum, for work, plant, materials or services used only as the Engineer instructs (1.1.4.8, 13.4).","Contract එකේ provisional sum ලෙස නම් කළ මුදලක්; Engineer instruct කරන විදිහට පමණක් වැඩ, plant, materials හෝ services සඳහා භාවිත වෙනවා (1.1.4.8, 13.4)."],
["Dayworks","Paying for small or incidental work by the actual labour, equipment and materials used, at the rates in the Dayworks Schedule (13.5).","කුඩා හෝ අමතර වැඩ වලට භාවිත කළ සැබෑ labour, equipment සහ materials අනුව, Dayworks Schedule එකේ rates වලින් ගෙවීම (13.5)."],
["BOQ","Bill of Quantities: the priced list of work items and quantities. Its quantities are estimates (14.1(c)).","Bill of Quantities: වැඩ items සහ quantities වල මිල සහිත ලැයිස්තුව. එහි quantities ඇස්තමේන්තු පමණයි (14.1(c))."],
["Liquidated Damages","The amount per day, stated in the Contract Data, that the Contractor pays for finishing late, up to a maximum (8.7).","ප්‍රමාද වී ඉවර කරන හැම දවසකටම, Contract Data එකේ සඳහන්, උපරිමයක් දක්වා Contractor ගෙවන මුදල (8.7)."],
["LD","Short for Liquidated Damages.","Liquidated Damages එකේ කෙටි නම."],
["Taking-Over Certificate","The certificate issued under Clause 10 when the Works (or a Section) are complete and taken over (1.1.3.5).","Works (හෝ Section එකක්) ඉවර වෙලා භාර ගත් විට Clause 10 යටතේ නිකුත් කරන certificate එක (1.1.3.5)."],
["TOC","Short for Taking-Over Certificate.","Taking-Over Certificate එකේ කෙටි නම."],
["Defects Notification Period","The period in the Contract Data for notifying defects, counted from the completion date in the Taking-Over Certificate, plus any extension (1.1.3.7).","Defects දැනුම් දීම සඳහා Contract Data එකේ සඳහන් කාලය, Taking-Over Certificate එකේ completion දිනයේ සිට ගණන් කරලා, දුන් extension එක්ක (1.1.3.7)."],
["defects period","Short for Defects Notification Period.","Defects Notification Period එකේ කෙටි නම."],
["Performance Certificate","The certificate issued under 11.8 when the Contractor has completed its obligations, including fixing defects (1.1.3.8).","Defects හැදීම ඇතුළුව Contractor තම වගකීම් ඉවර කළ විට 11.8 යටතේ නිකුත් කරන certificate එක (1.1.3.8)."],
["Final Statement","The agreed final account defined in 14.10 (1.1.4.5).","14.10 හි අර්ථ දක්වා ඇති, එකඟ වූ අවසාන account එක (1.1.4.5)."],
["Statement at Completion","The statement sent within 84 days after receiving the Taking-Over Certificate, listing the money the Contractor considers due (14.9).","Taking-Over Certificate එක ලැබී දින 84ක් ඇතුළත යවන, Contractor ට ලැබිය යුතු යැයි සලකන මුදල් ලැයිස්තුගත කළ statement එක (14.9)."],
["claim","A formal request for more time and/or money under the contract (19.1).","Contract එක යටතේ වැඩි කාලයක් සහ/හෝ මුදල් ඉල්ලන formal ඉල්ලීමක් (19.1)."],
["notice","A formal written communication required by the contract, sent as described in 1.3.","Contract එකෙන් අවශ්‍ය, 1.3 හි කියන විදිහට යවන formal ලිඛිත පණිවිඩයක්."],
["Day","A calendar day. A 'Year' means 365 days (1.1.3.9).","Calendar day එකක්. 'Year' කියන්නේ දින 365 (1.1.3.9)."],
["Adjudicator","The person appointed jointly by the Employer and Contractor, or by ICTAD, to decide disputes in the first instance (1.1.2.9, 19.3).","Disputes මුලින්ම තීරණය කරන්න Employer සහ Contractor එකට, හෝ ICTAD, පත් කරන පුද්ගලයා (1.1.2.9, 19.3)."],

const N19=["Send your claim notice to the Engineer by this date. Sub-Clause 19.1 requires it within 28 days after you became aware (or should have become aware). SBD/02 does not say a late notice loses the claim, but a late notice can reduce what you get to the extent it made the claim harder to check.","ඔබේ claim notice එක මේ දිනය වෙද්දී Engineer ට යවන්න. දැනගත් (හෝ දැනගත යුතුව තිබූ) දින සිට දින 28ක් ඇතුළත යැවීම Sub-Clause 19.1 අනුව අවශ්‍යයි. ප්‍රමාද notice එකකින් claim එක අහිමි වෙනවා කියලා SBD/02 කියන්නේ නැහැ, හැබැයි claim එක check කිරීම අමාරු වුණු ප්‍රමාණයට ඔබට ලැබෙන දේ අඩු වෙන්න පුළුවන්."];
